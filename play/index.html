const FAST_H = { t: 'You know this siege by heart. Walk through it.', hint: 'quicker, but you gain less on the way', if: () => knowsAct('harfleur'), out: [`You come ashore as a man comes home to a house he dislikes. You know where everything is kept.`, { fast: 'harfleur' }] };
const FAST_M = { t: 'You know this road by heart. Walk it.', hint: 'quicker, but you gain less on the way', if: () => knowsAct('march'), out: [`You shoulder what you always shoulder and fall in where you always fall in. The road has nothing new to show you before the river.`, { fast: 'march' }] };

scene('sail_b', 'soton', 'Fire in the fleet', `The fleet is still at anchor when a ship takes fire. Nobody knows how: a cook's brazier, or a lantern in the hold. She burns to the waterline in the time it takes to say a Mass, and the two ships moored beside her catch from her. Yours is the next but one. The shipmaster is shouting to cut the cable, the tide is setting you down on to the fire, and the horses below have smelt it.`, [
  { t: 'Take an axe to the anchor cable', test: ['arm', 7, 'labour'],
    win: [`It is as thick as your thigh and tarred like a road. You go through it in eleven strokes, with a shipman counting. The ship swings clear with the heat on the side of your face. The shipmaster looks at the cut end, and at you, and asks whether you would care for a trade that pays better than soldiering.`, { st: 1, grit: 1 }],
    lose: [`The axe turns on the tar and the cable takes an age to part. By the time she swings clear, the rail where you are standing is too hot to touch, and you have been leaning on it.`, { b: -1 }] },
  { t: 'Join the bucket chain along the rail', test: ['grit', 7],
    win: [`You wet the sails and the side of her for an hour, in smoke, with burning stuff coming down like snow. She does not catch. When it is over you find you were at the hot end of the chain the whole time, and that nobody had to tell you to stay there.`, { arm: 1 }],
    lose: [`A spar comes down across the rail, alight. It is only your arm, and the sea is right there to put it in.`, { b: -1 }] },
  { t: 'Get the arrow chests up on deck, in case she has to be left',
    out: [`Forty chests, up a ladder, with a horse screaming under you the whole time. She does not have to be left. In the muddle of getting the chests below again, one sheaf finds its way into your own bag, and you let it stay there.`, { ar: 1 }] }
], { place: 'The Solent, 11 August' });
scene('sail_c', 'soton', 'Waiting on the King', `The King's ship lies at anchor off the town with her sail yard hoisted half up the mast, which is the signal to the fleet to make ready. Then for two days nothing happens. Fifteen hundred ships ride at anchor with the army packed into them like herring, in August, with the tide slapping at the hulls. Men are fishing over the side with bowstrings. On a ship close by a priest is preaching to a congregation that cannot get off.`, [
  { t: 'Fish', test: ['eye', 7],
    win: [`A bent pin, a bowstring, and a piece of the salt beef nobody will eat. You pull out a mackerel as long as your forearm, and then another. The twenty fries them on a shield. Cutler eats his standing, and remarks that the cobbler has his uses.`, { heal: 1, st: 1 }],
    lose: [`You catch a crab the size of a groat, and a cold.`, {}] },
  { t: 'Dice below decks', test: ['wits', 7],
    win: [`Men who are bored and frightened bet badly. You are frightened too, but you have been bored at an apprentice's bench for three years and it holds no terrors for you. You come up on deck six pence heavier.`, { c: 6 }],
    lose: [`There is a Lancashire man below who does this for a living.`, { c: -3 }] },
  { t: 'Learn the ship from the men who sail her', test: ['grit', 7],
    win: [`They put you to coiling rope, and laugh at you, and tell you things. By the time the King's yard goes all the way up you can keep your feet on a deck and your dinner in your belly, and neither will be true of most of the army.`, { wits: 1 }],
    lose: [`A ship at anchor in a swell is worse than a ship at sea. You learn that, and for two days you have no room in you to learn anything else.`, {}] }
], { place: 'The Solent, 11 August' });

scene('landing_b', 'harfleur', 'The first night ashore', `The King camps the army on the hill above the landing place and has his ordinances read: nobody is to leave the camp, or touch a church, a priest or a woman, on pain of death. The scouts have gone forward towards the town. It is the first night any of you has slept on French ground, and half the twenty is lying awake listening to it. Down the slope a cow is lowing. Three hundred hungry archers are all thinking the same thing.`, [
  { t: 'Go and fetch the cow', test: ['wits', 7, 'sneak'],
    win: [`She comes quietly, for a French cow. You leave four pence on the gatepost, since the King's ordinance says to pay and the King hangs men. The twenty eats beef that has never seen a barrel. Cutler asks where it came from, and you tell him it was bought and paid for. He chews. 'First honest beef I've had in thirty years of soldiering,' he says.`, { heal: 1, st: 1, c: -4 }],
    lose: [`You are halfway up the slope with her when the provost's men come round the hedge with a lantern. The cow goes back. You get four strokes, and the provost tells you how lucky you are that he caught you on your way to pay for her.`, { st: -1, b: -1 }] },
  { t: 'Take the first watch', test: ['grit', 6],
    win: [`You stand it out on the edge of the camp with your bow strung, looking at a darkness that has France in it. Nothing comes. By the time you are relieved, the knot that has sat in your stomach since Southampton has loosened somewhat.`, { st: 1 }],
    lose: [`You challenge a bush, twice. The second time you wake the whole twenty to help you with it.`, {}] },
  { t: 'Sleep. It is only ground.',
    out: [`It is chalk, with short grass on it, much like the downs above Winchester. You tell yourself that and sleep. In the morning you find that somebody else has stolen the cow.`, { heal: 1 }] },
  FAST_H
], { place: 'Chef-de-Caux, 14 August 1415' });

scene('m_open_b', 'march', 'Who stays', `The King is leaving twelve hundred men in Harfleur under his uncle the Earl of Dorset, to hold what five weeks and two thousand lives have bought. Every vintenar has been asked for names. Two of the twenty will stay behind walls, with bread and a roof, while the rest walk a hundred and fifty miles through France on eight days' food. Cutler has not said who. The whole twenty is being very useful this morning.`, [
  { t: 'Ask to stay', test: ['wits', 7, 'talk'],
    win: [`You tell him the garrison will want a cobbler, and it is true. He weighs you a while and then gives your name. You watch the army march out through the Montivilliers gate, and Cutler looks back once. The winter is long, and dull, and nobody dies of it. Christmas comes and goes. One night in January you go to sleep in a dry bed behind a stone wall.\n\nTar. Gulls. The quay under your boots, and Cutler saying the same words in the same order.`, { end: 'stay' }],
    lose: [`'A cobbler,' Cutler says. 'Aye. They'll want one. So will I, on the road.' He gives two other names. He has not thought the better of you for asking.`, { st: -1 }] },
  { t: 'Tell Cutler which two could not stand the march',
    out: [`Old Hodge's chest is bad, and the lad from Alton has not been right since the flux. You say so, privately. Cutler had settled on those two already. He nods. 'I wanted to see whether you'd name them or yourself,' he says.`, { st: 1 }] },
  { t: 'Leave him to it, and see to your own pack',
    out: [`While the twenty hangs about Cutler, you walk down to the Tower's carts, where the clerks are giving out sheaves for the march and nobody is in the queue. Every man is owed a sheaf and will get it in his turn. You get yours now, and then go round the cart and draw a second for a man you invent on the spot.`, { ar: 2 }] },
  FAST_M
], { place: 'Harfleur, 8 October 1415' });

scene('somme_b', 'march', 'The ford at Béthencourt', `The foot are crossing at Voyennes. The horses and the baggage are to cross a mile off, at Béthencourt, where the causeway is broken in the middle and has been mended with bundled brushwood and the doors of the village. The horses do not care for it. A third of the way over, a sumpter goes through the brushwood to its belly, and the whole column stops behind it on a road one horse wide. There is marsh on either hand. On the far bank French horsemen have begun to gather.`, [
  { t: 'Wade on past it, and stand with the pickets on the far bank', test: ['grit', 9, 'march'],
    win: [`You go in to the armpits with your bow held over your head and come out on the French side among forty other wet men. The horsemen ride up to within a bowshot and look at you. You nock, and look at them. After a while they find that they are wanted elsewhere. The King, when he comes over, asks whose archers held the bank.`, { st: 2 }],
    lose: [`The bottom is soft, and the current has more pull than it showed from the causeway. You come ashore well downstream, without your sheaf, coughing up Somme.`, { b: -1, ar: -1 }] },
  { t: 'Get the sumpter up', test: ['arm', 8, 'labour'],
    win: [`You and a carter get a pole under its belly and a door under its feet. It comes up bellowing, with its load still on. The column moves again. The carter, who has a professional's contempt for archers, allows that you are stronger than you look.`, { st: 1 }],
    lose: [`It comes up all at once, and it kicks.`, { b: -1 }] },
  { t: 'Wait your turn on the causeway', test: ['grit', 5, 'march'],
    win: [`You wait for most of the day on a strip of bundled brushwood, with eight thousand men in front of you and behind. You cross dry-shod before dark. It was not much of a crossing, but you are across.`, {}],
    lose: [`The brushwood has had an army over it. It gives under you an arm's length from the far bank, and you finish the crossing by swimming.`, { b: -1 }] }
], { place: 'The Somme, 19 October 1415' });

scene('night_b', 'eve', 'Picket', `It begins to rain as the light goes, and it rains all night. Cutler's twenty has the picket: a hedge two hundred paces in front of the army, with orders to watch the French fires and to make no sound whatever. There is no shelter. Hemp drinks water like a wick, and a wet string is a dead bow. Every man on the picket is working out which part of him is driest.`, [
  { t: 'Your waxed spare is in your cap. Let the old one drown on the bow.', if: () => has('string'),
    out: [`You leave the bow strung and ready, as a picket should, and let the rain have that string. The other is coiled against your scalp. When the picket is called in, you change them over in the time it takes to say an Ave. The men who unstrung to save their only string had no bow ready all night, and Cutler knows which they were.`, { flag: 'dry', st: 1, learn: 'k_rain' }] },
  { t: 'You knew it would rain. Yours was waxed and capped days ago.', know: 'k_rain', if: () => !has('string'),
    out: [`You made a spare at Péronne, out of cobbler's thread, while the sky was still blue. It comes out of your cap as dry as a sermon. Ieuan looks at it, and then at you. 'There is a word,' he says, very low, 'for a man who knows when it will rain. They burned the last one in Carmarthen.'`, { flag: 'dry' }] },
  { t: 'Unstring, and keep the coil in your armpit until you are called in', if: () => !has('string'), test: ['grit', 8],
    win: [`You crouch under the hedge with the coil clamped under your arm and do not move for six hours. Everything else you own is wet through. When the picket is called in the string is dry, and you are so stiff with cold that Hodge has to string the bow for you.`, { flag: 'dry', learn: 'k_rain' }],
    lose: [`In the dead of the night you have to shift, and the coil slides down inside your jack to where the water has pooled. You can feel it swelling.`, { flag: 'wet', learn: 'k_rain', say: 'Your string is wet. Shooting will be harder.' }] },
  { t: 'Wrap it in your hood, and hope', if: () => !has('string'),
    out: [`The hood is wool, and so it is wet. By the time the picket is called in the string is as soft as a boiled leek. Still, you have had your head out in the rain all night, and you are wide awake.`, { flag: 'wet', heal: 1, learn: 'k_rain', say: 'Your string is wet. Shooting will be harder.' }] }
], { place: 'Maisoncelle, the night of 24 October' });

scene('b_horse_b', 'battle', 'The gap', `Erpingham's baton goes up, and the first flight goes over with a noise like a great cloth tearing. The French horse come off the wings, fewer than there should be, floundering in the plough. They reach the stakes all the same. To your left a destrier takes a stake full in the chest and goes on over it, and brings down the two stakes beyond in its fall. There is a gap in the hedge three men wide, and the riders behind are swinging towards it.`, [
  { t: 'Shoot the riders who are making for the gap', arrows: 1, test: ['arm', 9, 'shoot cav'],
    win: [`You put two shafts into the first horse and one into the second. They go down in the gap itself and stop it up better than any stake. The rest sheer off along the front of the hedge, taking arrows in the flank from every bow they pass.`, { st: 1, learn: 'k_cav' }],
    lose: [`You hit the first horse and it keeps coming. It is through the gap, and into the file behind you, and you are under it for a moment.`, { b: -1, learn: 'k_cav' }] },
  { t: 'Step into the gap with your own stake', test: ['grit', 9, 'cav'],
    win: [`You pull your stake, run six paces, and ground it in the middle of the gap with your foot on the butt. A horse will not run on to a point that it can see, whatever the man on its back intends. It swerves so hard that the rider goes on without it.`, { st: 1, learn: 'k_cav' }],
    lose: [`You are still setting the butt when the horse arrives. The stake goes one way and you go the other.`, { b: -2, learn: 'k_cav' }] },
  { t: 'You know which horse makes the gap. Put it down before it reaches the stakes.', know: 'k_cav', arrows: 1,
    out: [`It is the grey with the split chanfron. You have a shaft into it at forty paces, behind the elbow, and it goes down well short of the hedge. The stake it would have broken is still standing. Nobody in the twenty will ever know there might have been a gap there.`, { st: 1 }] }
]);
scene('b_advance_b', 'battle', 'Crossbows', `Now the first French battle comes on foot, in plate, through the mud their own horses have churned. Their crossbowmen ought to be out in front of them. They are at the back, since no French gentleman would give up his place in the van to a hired Genoese. A few have worked their way round to the flank all the same. You can see them over there, bending to span.`, [
  { t: 'Shoot the crossbowmen before they can loose', arrows: 1, test: ['eye', 10, 'shoot'],
    win: [`A man spanning a crossbow has his foot in the stirrup and his head down. You take two of them like that. The rest decide that the gentlemen can win their own battle, and go back behind the line. Erpingham's serjeant has seen where those shafts came from.`, { st: 2 }],
    lose: [`You are a breath too slow. They loose together, and one of the bolts comes looking for whoever was shooting at them.`, { b: -1 }] },
  { t: 'Keep to the mass. That is the order.', arrows: 1, test: ['arm', 9, 'shoot'],
    win: [`You shoot at the front of the column until your arm burns. It is like shooting into a hedge. But a hedge that has been shot at six times a minute walks slower, and it is drawing in towards its own centre, away from the arrows, and jamming.`, { st: 1 }],
    lose: [`Your draw is short and your shafts skate off the plate. You could not say that you have stopped one man.`, {}] },
  { t: 'Get down behind your stake until they have shot', test: ['grit', 9],
    win: [`You fold yourself up behind six feet of ash and hear the bolts go over. A crossbow takes as long to span as a man takes to say a paternoster. In that time you are up, and you have gathered a fistful of shafts that had fallen short.`, { ar: 1 }],
    lose: [`A stake is not very wide.`, { b: -1 }] }
]);
scene('b_close_b', 'battle', 'Out from the stakes', `They reach the English men-at-arms, and the line bends under them and holds. The archers on the wings have nearly stopped shooting, for want of arrows and of room. Then somebody, and nobody ever learns who, steps out from behind his stake, walks round the end of the French line and looses into the side of it at fifteen paces. In a moment hundreds of men are doing the same.`, [
  { t: 'Go round with them', arrows: 1, test: ['arm', 10, 'shoot close'],
    win: [`At fifteen paces a bodkin goes through a breastplate with a sound like a nail going into an oak door. The men you are shooting cannot turn to face you. You shoot until your bag is light, and nobody so much as lifts a hand against you.`, { st: 1 }],
    lose: [`One of them can turn. He is a big man with a poleaxe, and he has been waiting all morning for something he could reach.`, { b: -1 }] },
  { t: 'Stay by your stake, and shoot the ones who turn to face the archers', arrows: 1, test: ['eye', 10, 'shoot close'],
    win: [`A few men-at-arms have got themselves round to meet the archers, and they are the dangerous ones. You take them as they come clear of the press, one at a time, from behind your stake. The archers out in the open never learn why nobody reached them.`, { st: 2 }],
    lose: [`It is all a churn of steel and mud and you cannot tell one man from another. You hold your shot too long, and then it is too late to matter.`, {}] },
  { t: 'Leave the bow, and take the mallet',
    out: [`You lay the bow behind your stake and pick up the mallet you drove it in with: five pounds of lead on an ash handle. You go round the end of the line with the others. It is carpenter's work that you find there.`, () => (has('maul') ? { flag: 'early' } : { flag: 'early', item: 'maul' })] }
]);
scene('b_melee_b', 'battle', 'The heap', () => `The French in front have gone down, and those behind have fallen over them, and those behind again have been pushed on by the press. There is a wall of armoured men lying in front of the English line, as high as a man's chest, and a good many of those in it are still alive. Archers are climbing on to it with mallets and hatchets. They wear no harness, and they do not sink in the mud.${perkinHere() ? ' Perkin is on it already, off to your right, further forward than he should be.' : ''}`, [
  { t: 'Climb the heap, and strike down from it', test: ['arm', 10, 'melee'],
    win: [`You stand on dead men and hit living ones on the head as they come up. It is dreadful, and your arms know how to do it. When it slackens you find that you are holding a French squire by the gorget, and that he is offering you forty crowns in very fair English.`, { c: 12, st: 1, flag: 'prisoner' }],
    lose: [`The heap shifts under your feet. A hand comes up out of it with a dagger in it, and finds the inside of your leg.`, { b: -2 }] },
  { t: 'Get to Perkin', if: perkinHere, test: ['grit', 9, 'melee'],
    win: [`You go along the top of the heap at a run, which nobody should do. He has slipped down the far side of it among the French. You get him by the back of his jack and haul him up like a sack of his father's flour, and the two of you fall off it together on the English side. He sits up. 'I dropped my billhook,' he says.`, { flag: 'perkin_lived' }],
    lose: [`You see him slip down the far side. You get to the place. You are just too late to do him any good, and you had a clear view of it all the way.`, { b: -1, perkin: 'dead' }] },
  { t: "Go along the heap towards the King's banner", if: () => !S.flags.centre, test: ['grit', 11, 'melee'],
    win: [`The heap runs the whole length of the line, and the top of it is the only clear road on the field. You go along it bent double, over things you do not look at. The King's banner comes nearer. Then you are down off the heap and under it, in the thickest of the fight.`, { flag: 'centre' }],
    lose: [`Twenty paces along, something in the heap gets hold of your foot. By the time you have fought loose from it you have lost the banner, and a good deal of blood.`, { b: -2 }] },
  { t: 'Pull a man of the twenty out from under it', test: ['grit', 9, 'melee'],
    win: [`Hodge is under two Frenchmen with only his arm showing. You know the arm by its bracer, having stitched it. You shift the Frenchmen with your mallet haft and drag him out by the wrist. He is the colour of tallow, and he is swearing, and he will live. Cutler saw you do it.`, { st: 1 }],
    lose: [`You shift one Frenchman. The other was only waiting for somebody to give him room.`, { b: -1 }] }
], { after: i => SC.b_melee.after(i) });

scene('b_horse_c', 'battle', 'One knight', `Erpingham's baton goes up and the first flight goes over, and the French horse come off the wings in answer. There are not enough of them, and the plough takes the heart out of the charge before it is half way. Most pull up short of the stakes and wheel along the front of them, taking arrows. One does not. A knight on a big bay has got ahead of all the rest with two or three of his own men behind him, and he is riding straight at the hedge of points with his lance down, as if it were not there. He is coming in a little to your left.`, [
  { t: 'Shoot the bay', arrows: 1, test: ['arm', 9, 'shoot cav'],
    win: [`You put the shaft in under the peytral, where the chest armour stops, and the bay runs on for six strides with it and then folds at the knees. The knight goes over its head and into the stakes on his own. The men behind him see it and haul their horses round. The twenty is on him before he has found his feet.`, { st: 1, learn: 'k_cav' }],
    lose: [`You hit the armour and the shaft breaks. The bay takes a stake in the chest and falls through the hedge with the stake still in it, and a good part of the horse lands on you.`, { b: -1, learn: 'k_cav' }] },
  { t: 'Keep your place, and trust the stake', test: ['grit', 9, 'cav'],
    win: [`You stand, with your hands open, and watch him come. The bay sees the points at the last stride and props, all four feet together, and its rider keeps going. He lands on his back among the stakes in his harness, and lies there like a beetle. Somebody finishes it with a mallet. It is not you, and you find you are glad of that.`, { learn: 'k_cav' }],
    lose: [`The bay does not prop. It comes through, dying, with a stake in it, and takes yours out of the ground with its shoulder on the way past. You are thrown clear, which is the kindest way to put it.`, { b: -2, learn: 'k_cav' }] },
  { t: 'You know this knight, and where his horse falls. Be standing there.', know: 'k_cav', arrows: 1,
    out: [`He comes in a little to your left, as he always has. You walk four paces along the hedge and wait, and shoot the bay behind the elbow at a distance nobody could miss from. It goes down across two stakes and he goes over it. You are near enough to hear the breath go out of him. Cutler, who has seen you move before there was anything to move for, says nothing at all.`, { st: 1 }] }
]);
scene('b_advance_c', 'battle', 'Three columns', `Now the French first battle comes on, on foot, in plate, through the plough their own horses have cut to pieces. They do not come in a line. They are making for the three English banners, where the lords are and the ransoms, and so they draw together into three great columns as they walk, with their heads down against the arrows. They take no account of the archers. A gentleman does not fight a man who earns sixpence a day. The nearest column will pass you within long bowshot, side on, and it will be a long time passing.`, [
  { t: 'Shoot into the side of the column for as long as it takes to pass', arrows: 1, test: ['arm', 9, 'shoot'],
    win: [`You draw and loose until you cannot feel your fingers. The files nearest you begin to lean away from the arrows, into their own fellows, and the column that was twenty men across is fifteen across and twice as deep. They are treading on each other before they have met an Englishman.`, { st: 1 }],
    lose: [`The draw will not come past your jaw. Your shafts reach them with the strength gone out of them and drop off the plate. You might as well be throwing them.`, {}] },
  { t: 'Shoot the men at the head of it, who are setting the pace', arrows: 1, test: ['eye', 10, 'shoot'],
    win: [`The front rank is the best harness in France, and you do not try to go through it. You wait for a raised arm or a turned head. A man goes down at the head of the column, and the man behind steps on him and goes down too, and for the space of a breath the whole column stops. Erpingham's serjeant looks along the line to see who did that.`, { st: 2 }],
    lose: [`They keep their heads down and their arms in, as they have been taught, and you can find nothing to shoot at but steel. You spend your shafts on it anyway.`, {}] },
  { t: 'Go forward for spent arrows while they are still looking at the banners', test: ['grit', 9],
    win: [`Nobody in that column is looking at you. You go out thirty paces into the plough and pull shafts as you would lift turnips, and come back with both hands full. Half of them want new heads. The other half will do very well.`, { ar: 1 }],
    lose: [`Nobody in the column is looking at you. A mounted man who has lost his company is, and he has nothing else to do.`, { b: -1 }] }
]);
scene('b_close_c', 'battle', 'Too near to miss', `The columns strike the English men-at-arms and the line gives a spear's length, and holds. Then the weight of the men behind begins to tell on the French themselves. The column nearest you spreads at the edges like dough under a hand, and its outer files are pushed sideways until they are in among the stakes, ten paces off, five. They are not attacking you. They have been shoved there, and most of them cannot lift an arm.`, [
  { t: 'Shoot the nearest, and then the next', arrows: 1, test: ['arm', 10, 'shoot close'],
    win: [`At five paces there is no armour made that keeps a bodkin out, if the bow is drawn to the ear. You shoot one man, and nock, and shoot the man who was behind him. It is over in less time than it takes to tell. The files beyond see what is waiting at the stakes and press back the other way, into the crush.`, { st: 1 }],
    lose: [`Your string is tired, or you are. The shaft stands in his breastplate a finger deep and no more, and he looks down at it, and then up at you. He has one arm free after all.`, { b: -1 }] },
  { t: 'Look for the ones with an arm free', arrows: 1, test: ['eye', 10, 'shoot close'],
    win: [`Most of them are helpless. One in ten is not: a man at a corner of the press with room to swing, clearing a space about himself among the stakes. You shoot those, and only those. The archers on either side of you never find out why nothing reached them.`, { st: 2 }],
    lose: [`In that welter of mud and steel every man looks alike. You wait for a clear mark, and are still waiting when the press closes over the place.`, {}] },
  { t: 'There is no room for a bow. Take the mallet.',
    out: [`You hang the bow on your stake and pick up the mallet from the foot of it. The man in front of you is held upright by his neighbours and has his visor shut. You have driven a great many nails in your time. You begin.`, () => (has('maul') ? { flag: 'early' } : { flag: 'early', item: 'maul' })] }
]);
scene('b_melee_c', 'battle', 'Ransoms', () => `The first French battle is broken, and the field in front of the stakes has turned into a market. Archers are hauling men-at-arms out of the heap by the heels and sitting on them until they give a name. A glove held up means a man yields. There are gloves up all along the line. In among them, there are still Frenchmen on their feet with poleaxes who have not yielded to anybody, and every archer with his eyes on a gilt spur has his back to one of those.${perkinHere() ? ' Perkin is off to your right, tugging at a man twice his size, and has not looked behind him once.' : ''}`, [
  { t: 'Take a prisoner worth the having', test: ['arm', 10, 'melee'],
    win: [`You pick a man by his spurs and his sword-belt, and knock down the squire who is standing over him, and kneel on his chest until the glove comes up. He gives a name with three parts to it. He is good for forty crowns, he says, and seems hurt that you have not heard of him.`, { c: 12, st: 1, flag: 'prisoner' }],
    lose: [`You have your man by the foot and your eyes on his spurs. The poleaxe comes from behind you, from one of those who had not yielded.`, { b: -2 }] },
  { t: 'Get to Perkin', if: perkinHere, test: ['grit', 9, 'melee'],
    win: [`There is a Frenchman coming up behind him at a walk, quite steadily, with an axe held low. You get there first by the length of your own arm. Afterwards Perkin looks at the dead man, and at the live one he has been pulling at, and asks whether this means he has two.`, { flag: 'perkin_lived' }],
    lose: [`You shout, and he does not hear it over the noise. You run, and the plough holds your feet. The man with the axe is walking, and he still gets there before you do.`, { b: -1, perkin: 'dead' }] },
  { t: "Leave the ransoms and make for the King's banner", if: () => !S.flags.centre, test: ['grit', 11, 'melee'],
    win: [`You go left behind the line, past men counting their prisoners, and nobody understands why you are running. The noise grows as you go. Under the King's banner nobody is holding up a glove. You are in it before you have chosen to be.`, { flag: 'centre' }],
    lose: [`A man-at-arms you took for a prisoner sitting quietly is neither. You get away from him in the end, a good deal lighter of blood, and with the banner no nearer.`, { b: -2 }] },
  { t: 'Stand by the stakes and watch the backs of the twenty', test: ['grit', 9, 'melee'],
    win: [`Somebody has to. You stand with a mallet and no prisoner while the rest make their fortunes, and you put down two Frenchmen who had not yielded as they come up behind men of the twenty. Cutler sees the second of them fall. He has no prisoner either, and for the same reason.`, { st: 1 }],
    lose: [`You are watching their backs so closely that you have forgotten your own.`, { b: -1 }] }
], { after: i => SC.b_melee.after(i) });

scene('fire_s_c', 'soton', 'Aboard', () => `The twenty went aboard at noon, and the ship has not moved since. She lies at anchor among fifteen hundred others, waiting for tomorrow's tide, with forty horses in the hold and the army's breath hanging over the water like smoke. There is no fire, since the shipmaster will not have one, but there is a lantern at the foot of the mast and the men have gathered to it out of habit.${perkinHere() ? ' Perkin is at the rail, looking at England as if somebody were about to take it away.' : ''} Ieuan has found the one dry coil of rope on the deck and is sitting on it. Cutler is standing by the hatch, counting heads as they pass. It is the last evening on which you will be able to see home from where you sit.`, [
  { t: 'Stand with Perkin', if: () => perkinHere() && !S.flags.cold,
    out: [() => `He points out Portchester, and the hill behind it, and gets them both wrong. He says he has never been on anything bigger than the ferry at Itchen. After a while he says, 'They'll have lit the oven by now, at home,' and then nothing for some time. 'You'll stop near me, ${N()}? Over there. Only you're the one I know.' You say that he knows nineteen men by now. 'Not from home, I don't,' he says.`, { flag: 'bond', pull: ['perkin', 2], say: 'Perkin will keep close to you.' }] },
  { t: 'Sit with Ieuan',
    out: [`He shifts along the rope. He is whipping the nocks of his shafts with waxed thread, and he gives you a hank and a dozen of your own to do. 'Salt air,' he says. 'It lifts the horn, and then the string splits the shaft, and the man beside you wears it in his face.' You whip nocks until the lantern is put out. Yours are lumpy. He undoes two and passes the rest, and adds a few of his own to your bag to make up the sheaf.`, { ar: 1, pull: ['ieuan', 2] }] },
  { t: 'Stand near Cutler',
    out: [() => S.standing >= 1 ? `He finishes his count before he looks at you. 'Twenty,' he says. 'It's always twenty, going.' He watches the water for a while. 'This is my fourth time over. Three times I've taken twenty, and I've not once brought twenty home. I don't say it to them. There's no sense in a man counting who's to be short.' He spits over the side. 'So now you can not say it either.'` : `He counts you, as he has counted the others, and his eyes go on to the next man. You stand there a little longer. 'You're counted,' he says. It is not friendly, but then he has not said so much to anybody else at the hatch.`, () => (S.standing >= 1 ? { st: 1, pull: ['cutler', 2], learn: 'k_tok1' } : { pull: ['cutler', 1] })] },
  { t: 'Sit alone, with what you brought from home',
    out: [() => ALONE_S[M.want] || ALONE_S.debt, { grit: 1 }] }
]);
scene('fire_h_c', 'harfleur', 'The bulwark', () => `Yesterday the King's men took the great timber bulwark before the Leure gate, after the gunners had set it alight, and tonight the twenty has been put into what is left of it. The baulks are still warm underfoot, and some of them are still smoking, so that for once nobody needs to light a fire. The twenty is fourteen. Nobody says the number. From here you could throw a stone on to the town wall, and nobody on the wall is throwing anything back. The talk is that Harfleur has asked for terms, and has until Sunday.${perkinHere() ? ' Perkin has found a beam to sit on and is drying his hose on another.' : ''}${S.flags.reeve_enemy ? ' Reeve has his shirt off and his back to the warm timber, and his eyes on you.' : ''}`, [
  { t: 'Sit with Perkin', if: () => perkinHere() && !S.flags.cold,
    out: [`He has been counting too, it turns out, though not the dead. 'Seven weeks,' he says. 'I've been a soldier seven weeks. My father was 'prenticed seven years.' He wants to know how long before a man is a proper one. You say you think it is when he stops asking. He thinks about that. 'Then Cutler was never anything else,' he says, and laughs for the first time in a week, and you find you have laughed too.`, { flag: 'bond', pull: ['perkin', 2], say: 'Perkin will keep close to you.' }] },
  { t: 'Sit with Ieuan',
    out: [`He is looking at the town wall, a stone's throw off, with one eye shut. 'How high?' he says. You guess. He has you hold an arrow upright at arm's length and measure the wall against it, and then a man on the wall, and reckon one from the other. You are four feet out. He makes you do it with the church tower, and a gun, and a dead horse. By the end you are within a foot, and he has lost interest and gone to sleep.`, { eye: 1, pull: ['ieuan', 2] }] },
  { t: 'Sit near Cutler',
    out: [() => S.standing >= 2 ? `He has a hazel stick across his knee and is cutting it with the point of his knife, slowly, as a thing is done that has been done before. Six notches. 'Simkin,' he says, touching the first. 'John, and John. Wat. Hobbe.' His thumb stops on the last. 'A lad out of Alton. He was with us four days and I never had his name off him.' He looks at the stick. 'A clerk would put them in a roll. This is my roll.' He puts it away inside his jack, on the left side.` : `He has a stick and a knife out, and he turns his shoulder to you as you come up. 'Find another beam, cobbler,' he says. There is no anger in it. He waits until you have gone before he begins to cut.`, () => (S.standing >= 2 ? { st: 1, pull: ['cutler', 2], learn: 'k_tok2' } : {})] },
  { t: 'Sit alone',
    out: [() => (ALONE_H[M.want] || ALONE_H.debt)(), { heal: 1 }] }
]);
scene('fire_m_c', 'march', 'A dry barn', () => `For once the twenty has a roof. The village is empty, its people gone into the woods with whatever they could drive or carry, and Cutler has claimed a barn for his men before a knight's harbinger could chalk the door. There is old straw in it, and a fire on the threshing floor. The scouts came in at dusk. The French are across the Calais road ahead, more of them than anybody could count, and the army will come up with them tomorrow. Nobody in the barn is talking about it. They are talking about the straw.${S.flags.reeve_owes ? ' Reeve has made his bed next to yours, and has not said why.' : ''} You will not have a roof again on this side of it.`, [
  { t: 'Sit with Perkin', if: () => perkinHere() && !S.flags.cold,
    out: [() => `He has made himself a nest in the straw like a dog, and he pats the place beside it. 'If we get to Calais,' he says, 'there's ships, and then it's Southampton, and then it's twelve miles.' He has worked out the whole road home, and what he will say at the door. He tells it to you twice. Then he says, '${N()}. Stand by me tomorrow. I'll shoot better if you're there,' and he is asleep before you have answered, so you answer anyway.`, { flag: 'bond', pull: ['perkin', 2], say: 'Perkin will keep close to you.' }] },
  { t: 'Sit with Ieuan',
    out: [`There is a plough horse in the end stall, too old to have been worth driving off. Ieuan takes you to look at it. He walks towards it with a hayfork held out, and it backs away. He walks at it from the side, and it only turns its head. 'You see,' he says. 'He will not come on to a point, not for any man. But he must see the point. Tomorrow, set your stake where a horse can see it, and stand where the horse can see you behind it. The rider is nothing. It is the horse who decides.'`, () => (S.flags.horsecraft ? { eye: 1, pull: ['ieuan', 2] } : { flag: 'horsecraft', pull: ['ieuan', 2], say: 'You know what a charging horse will and will not do. Standing against one will go better.' })] },
  { t: 'Sit near Cutler',
    out: [() => S.standing >= 3 ? `He is at the door, where he can see the road. 'Sir Thomas Erpingham has been asking the vintenars for men,' he says, without turning. 'For the middle. To stand in the gaps beside the King's own battle, where there's no wood and no hedge, and every lord in France will be making for the same place.' He picks at the doorpost with his thumbnail. 'Steady men, he said. I've named two. He asked for three, and I told him he'd have the third in the morning.' He still has not turned round.` : `He is at the door, watching the road. 'You'll stand where you're put,' he says. 'You'll shoot when I give the word, and you'll go on until I say stop. If I'm not there to say it, Hodge will.' You have heard him say it to four men already tonight. He says it to you no differently, and you find that you would not want him to.`, () => (S.standing >= 3 ? { st: 1, pull: ['cutler', 2] } : { eye: 1 })] },
  { t: 'Sit alone',
    out: [() => SC.fire_m.choices[3].out[0](), { grit: 1, heal: 1 }] }
]);
scene('flux_c', 'harfleur', 'The count', () => `Cutler counts the twenty every morning now, and every morning the count is a different number. It is in the water, or the air off the marsh, or the fruit, or the will of God: the physicians hold all four opinions and die at the same rate as everybody else. The Bishop of Norwich has gone, who was the King's friend, and the Earl of Suffolk. They are carrying the Duke of Clarence aboard a ship. The burial parties have stopped digging graves and begun on a trench.${S.flags.shell ? ' You think about the mussels.' : ''}${S.flags.fruit ? ' You think about the apples.' : ''}${S.flags.drank ? ' You think about the ditch water.' : ''}

Harfleur gives up its keys on the twenty-second of September. That morning Cutler's count stops at you, and stays there a moment, and you understand that he has seen it in your face before you have felt it in your belly.`, [
  { t: 'Answer to your name, and go on answering', test: ['grit', () => fluxDc(), 'flux'],
    win: [`You stand to the count each morning with your knees locked and your jaw shut. Cutler says nothing, and does not send you to the lines. On the fifth morning you answer and find that it has cost you nothing to do so. You are as thin as a lath. You are still on the count.`, () => fluxFx(true)],
    lose: [`On the third morning you answer to your name from the ground. Two of the twenty carry you down to the lines by the ships, and Cutler counts one fewer. It does not kill you. It only uses up everything you had, and when the army marches you are put back on the count because there is nobody else.`, () => fluxFx(false)] },
  { t: 'Chew the tormentil root', if: () => has('root'),
    out: [`You had half forgotten it was in your purse. It is as hard as a horn button and as bitter as a debt. You chew, and swallow, and chew. Within a day the cramps have gone from a fist to a hand, and within three you are standing straight at the count. Cutler asks what you have been eating. You tell him. He asks whether there is any more.`, () => Object.assign({ drop: 'root' }, fluxFx(true))] },
  { t: 'Pay a laundress to nurse you, with clean linen and boiled water', cost: 6, test: ['grit', () => fluxDc() - 3, 'flux'],
    win: [`She is from Portsmouth, and she has kept more men alive this month than all the King's physicians together, by boiling everything she can get into a pot. She puts you under a cart on clean sacking and feeds you water that has been on the fire, a spoonful at a time. It takes sixpence and four days.`, () => fluxFx(true)],
    lose: [`She does all that can be done, and tells you so. It goes through you just the same. You are on your feet when the army marches, more or less, and she will take only fourpence, since it did not answer.`, () => fluxFx(false)] }
], { place: 'Harfleur, September' });
scene('bc_horse_b', 'battle', 'Banners advance', `The word comes down from the King: 'Banners advance.' The whole army goes forward at a walk, stakes on shoulders, to within long bowshot of the French, and plants itself again. You drive your stake with the rest. Then Erpingham's baton goes up, and the first flight goes over.

From the wedge beside the King's battle you see what it does. The French horse come off both wings in answer, and they are not coming at you. They are making for the archers on the flanks, across the front of the whole army, and for a few breaths the nearer wing of them is side on to the centre and thinking about something else.`, [
  { t: 'Shoot the leading horses of the wing', arrows: 1, test: ['eye', 8, 'shoot cav'],
    win: [`You shoot at the horses in front, so that those behind must ride over them. Two go down, and a third pecks and throws its man. The rest check, and bunch, and reach the stakes on the right at a trot, in ones and twos. A charge that comes in at a trot is only some men on horses.`, { st: 1 }],
    lose: [`You judge the pace wrong, and your shafts fall where the horses were. One of the riders has seen where they came from. He pulls his horse's head round and comes along the front of the wedge, alone, to make some archer pay for it.`, { b: -1 }] },
  { t: 'Keep your shafts in the bag, and see to your stake',
    out: [`The ground here is softer than where you first stood, and your stake went in too easily. While the others shoot, you work it deeper, and tread the plough hard about its foot. When the men on foot come, yours is one of the few stakes in the wedge that does not lean. You have a full bag, too.`, { ar: 1 }] },
  { t: 'Look along the line, and see how it lies', test: ['wits', 6],
    win: [`From the centre you can see the whole of it for the first time. Three small battles of men-at-arms, with wedges of archers between, and the two great wings of bowmen bent a little forward, like the horns of an ox. The French must come in between the horns. You see where the King's banner stands, and his brother's, and how many paces lie between you and each.`, { eye: 1 }],
    lose: [`You look, and see a great many men standing in a field. If there is a pattern in it, nobody has told you what it is.`, {}] }
]);
scene('bc_press_b', 'battle', 'The join', `The French first battle comes in on the King's banner like water going down a drain. They strike the English men-at-arms with a noise you feel in your teeth, and the English line goes back a spear's length.

The wedge of archers stands where two of the English battles join, and the join is the weak place. A French knight has seen it. He is working his way crabwise along the front of the press towards the gap, with a dozen men at his back, and there is nothing in that gap but men in padded jacks.`, [
  { t: 'Shoot the knight who is leading them', arrows: 1, test: ['arm', 8, 'shoot close'],
    win: [`He is twelve paces off, and coming on with his shield up. A shield is limewood and leather. You draw to the ear, and the bodkin goes through it and through the arm behind it and pins the two together. He stops. The men behind him run into his back, and the wedge shoots them one by one as they stand there.`, { st: 1, grit: 1 }],
    lose: [`The shaft takes him on the helm and glances off. He hardly feels it. He comes into the gap with his men behind him, and for a while the wedge is all mallets and shouting, and you are in the worst of it.`, { b: -1 }] },
  { t: 'Stand in the gap, with the mallet', test: ['grit', 9, 'melee'],
    win: [`You and five others close the gap with your bodies, which is all that anybody has to close it with. The knight arrives. A man in harness who has walked three hundred paces through plough is slower than he supposes, and there are six of you. When the household men-at-arms come across to fill the place, there is nothing left there for them to do. One of them asks your name.`, { st: 2 }],
    lose: [`He is slow and he is tired, and he is still a knight in full harness with a poleaxe, and you are a cobbler. He is put down in the end. It takes all six of you, and you are not standing up when it is finished.`, { b: -2 }] },
  { t: 'Drag the wounded back out of the way of the line',
    out: [`Men are down in the join, and those still fighting are tripping over them. You take them by the collar or the heel, whichever comes first, and pull them back through the wedge. The fourth is a boy in a herald's tabard that is much too large for him. He has been knocked silly. When he comes round, he empties his purse into your hand without counting it, and tells you something useful about which of the French lords have already yielded.`, { c: 6, wits: 1 }] }
]);
scene('bm_water', 'battle', 'A drink', `A squire in the King's colours comes stumbling back through the archers with his helm off and his face the colour of a brick. He is not wounded. He has stood for three hours in sixty pounds of steel and then fought in it, and he is dying of thirst in the rain. He sees the leather bottle at your belt, and stops.`, [
  { t: 'Give him the bottle',
    out: [`He drinks it all, with his head back, and it runs down inside his gorget. He gives you the bottle again, empty, and studies you as if he were learning your face. Then he puts his helm on and goes back to the line. Cutler, who misses nothing, says, 'That'll be remembered, if he lives. They don't forget who gave them water.'`, { st: 1 }] },
  { t: 'Give him half, and keep half', test: ['wits', 7, 'talk'],
    win: [`You hold on to the bottle while he drinks, and take it back at the half. He is too much of a gentleman to pull. 'There are men-at-arms down behind the second rank who cannot get up for the heat,' he says, wiping his mouth. 'If you want to be thanked by somebody who can afford it, take the rest to them.' You do, when there is a moment. One of them can afford it.`, { c: 4 }],
    lose: [`You keep hold of the bottle, and so does he. It goes into the mud between the two of you, and what was in it goes into France.`, {}] },
  { t: 'Drink it yourself, where he can see',
    out: [`You have carried it since Harfleur. You pull the stopper and drink, looking at him over it. He watches you do it. Then he laughs, a dry bark, and goes on towards the baggage to find water of his own. You feel a good deal better, in your body.`, { heal: 1 }] }
], { bm: 1 });
scene('bm_heralds', 'battle', 'The heralds', `There is a lull, as there is in any work. Away to the side of the field, on a little rise, you see a knot of men on horseback in bright coats, doing nothing at all. They are the heralds, English and French together. They are sitting side by side, as they have all morning, watching to see who wins, so that they can agree on it afterwards and write it down.`, [
  { t: 'Look where they are looking', test: ['eye', 7],
    win: [`Heralds know a battle as a drover knows cattle. All their heads are turned the one way, to the centre, towards the King's banner. Nothing is happening there that you can see. Something is going to. You shift your feet so that you are facing it.`, { wits: 1 }],
    lose: [`They are too far off to tell which way their heads are turned. One of them appears to be eating.`, {}] },
  { t: 'Get your breath, and count your shafts',
    out: [`While the lull lasts, you do the two things an archer can always do. You breathe, down to the belt, as Ieuan showed you. You count. There are more in the bag than you had feared, and two stuck in the ground at your feet that you had forgotten putting there.`, { ar: 1 }] },
  { t: 'Point them out to the man beside you',
    out: [`'Them?' he says. 'They'll be all right. Nobody kills a herald.' He considers the bright coats for a while. 'That's the trade to be in. Turn up, watch, and go home and tell them how it was.' He spits. 'Ask one of them what he's paid, and then ask him who that was I killed just now. He'll know the one and not the other.'`, { grit: 1 }] }
], { bm: 1 });
scene('bm_glove', 'battle', 'A glove', `A French man-at-arms comes out of the press on his hands and knees, quite close to your stake. He has lost his helm and his sword. He is hardly twenty, with a first beard full of mud, and his harness is better than he is. He sees you, and kneels up, and pulls off his right gauntlet, and holds it out to you. He is saying one word over and over. You do not know the word. You know what the glove means.`, [
  { t: 'Take the glove, and sit him down behind your stake', test: ['wits', 8, 'talk ransom'],
    win: [`You take it. You point to the ground behind your stake, and he goes and sits there in the mud, with his hands on his knees, as if he were waiting outside a shop. He is yours, by every law that armies keep. Hodge says that harness like that has a father behind it who is good for forty crowns. You go back to your bow.`, { c: 6, flag: 'prisoner' }],
    lose: [`You take the glove, and turn to show him where to sit. He was not as beaten as he looked. He has a dagger out of his boot and into your side before you have turned round again, and he is gone on all fours into the press.`, { b: -1 }] },
  { t: 'Shake your head, and point him to the rear',
    out: [`You have no time for a prisoner and no hand to spare for one. You jerk your thumb towards the baggage. You might have refused money in the street, by his face, and you have. He gets up and walks to the rear with his glove still held out before him, and somebody back there will be glad of him.`, { st: 1 }] },
  { t: 'Leave him. They are still coming.',
    out: [`You look past him. The second rank of the French is thirty paces off, and no part of it is holding up a glove. You nock and draw. When you look down again he has gone, forward or back, you do not know which. You did not hurt him, and you find that this is the thing you remember.`, { grit: 1 }] }
], { bm: 1, when: () => !S.flags.prisoner && !S.flags.centre });

scene('bg_carts_b', 'battle', 'The churchyard', `They have put the baggage in and about Maisoncelle: some hundreds of carts drawn up wheel to wheel round the church, and behind them every horse in the army, since today even the earls are fighting on foot. To guard all of it there are the pages, the chaplains, the men too sick to stand in a line, and one archer who asked to come.

The King's priests are in the churchyard, on their knees in the wet, praying aloud and without a pause, as they have been ordered to do until it is over. From the wall beside them you can see the English army a mile away, very small, and beyond it a darkness that is the French. A trumpet sounds over there, thin as a gnat. The small line moves.

The King's chests are here under seal, and his crown for wearing in state. The twenty's sack is here too, under a cart, with every man's purse in it.`, [
  { t: 'Get up on the church roof, where you can see', test: ['eye', 6],
    win: [`The thatch is rotten and the view is very good. You watch a battle as a hawk would: the horse going in at the two ends and coming out again in pieces, and then the whole weight of France crowding in between the woods towards one place in the middle. Everything is going to that place. If a man wished to matter today, that is where he would need to be standing, and it is not here.`, { learn: 'k_centre', wits: 1 }],
    lose: [`You get up there, and the rain comes on harder. There is a field, and a noise, and a great many men. You could not say who was winning to save your neck.`, {}] },
  { t: 'Go round the carts and count the ways in',
    out: [`There are four. Three of them come from the field, and anybody using those will be English. The fourth is a sunk lane from the north, through a wood, and there is not so much as a page looking up it. You drag a hurdle across, and a cart pole, and tell a boy to shout if anything comes. He asks what he should shout. You tell him that it will not matter.`, { eye: 1 }] },
  { t: 'Kneel down with the priests',
    out: [`You get down on your knees at the end of the row. Nobody objects. They are saying the psalms straight through, and when they reach the end they begin again. You have not the Latin, but you have the tune by the third time round. It is dry under the yew, and for the first morning in a month nobody is asking you to carry anything.`, { heal: 1 }] }
]);
scene('bg_raid_b', 'battle', 'Out of the trees', `The boy at the north lane shouts. Then he comes running, and behind him the lane fills up with people: country men in hoods, with flails and scythes and cudgels, hundreds of them, and three riders in harness at the front who are plainly gentlemen. A sick man beside you says that he knows the middle one. It is Isembart, the lord of Agincourt, whose village this is.

They have not come for a fight. They have watched from the wood until the English army had its back turned, and they have come for the carts. The chaplains get up off their knees and run for the church. The pages scatter like hens.`, [
  { t: "Get on to the cart with the King's chests, and shoot", arrows: 1, test: ['eye', 9, 'shoot'],
    win: [`You are up on the tailboard with a shaft on the string before they are in among the carts. The first man to put his hand on the sealed chest takes it away again with an arrow through it. Nobody else cares to try. They flow round you to the other carts, and you see the crown go, in its leather case, and a sword in a jewelled scabbard, and you can do nothing for those. What you are standing on is still there at the end. A clerk of the household comes out of the church and asks who you are.`, { st: 2, c: 6, learn: 'k_baggage' }],
    lose: [`There are too many of them, and they are too near, and a scythe is longer than a bow. You are pulled off the cart by the ankle. You see the King's crown go up the lane in its case, on the back of a man in a sacking hood, from where you are lying.`, { b: -1, learn: 'k_baggage' }] },
  { t: "Drag the twenty's sack into the church, and the boys after it", test: ['wits', 7],
    win: [`You know which cart, since you watched where Cutler put it. You have the sack out and across your back, and you herd half a dozen pages ahead of you with your free hand, like geese. The priests have the door half shut. You get a foot in it. When it is barred behind you, every man in the twenty still has what he came to France with, and you are leaning on it.`, { st: 2, flag: 'bag_sack', learn: 'k_baggage' }],
    lose: [`You get the boys through the door. You go back for the sack, and a big man in a leather apron is already walking off with it. He glances at you, and at your empty hands, and does not even hurry.`, { st: 1, learn: 'k_baggage' }] },
  { t: 'Cut a horse loose, and ride to tell the King', test: ['grit', 8],
    win: [`It is a knight's palfrey and it has been standing idle all morning. It goes down the track to the field like a thing let out of a trap, with you lying along its neck. You reach the rear of the King's battle and shout it to the first man in a tabard you see: the French are in the baggage. He stares at you. Then he turns and shouts it forward, and you hear it go from mouth to mouth towards the banner.`, { flag: 'bag_ran', learn: 'k_baggage' }],
    lose: [`The palfrey has its own opinion of the matter, and leaves you in a ditch a few furlongs out. You finish it on foot, at a run, through plough. When you come up behind the line you cannot speak for want of breath, and a page on a pony has got there before you.`, { b: -1, flag: 'bag_ran', learn: 'k_baggage' }] }
]);
scene('bm_gam', 'battle', 'The man from Brecon', `Next to the wedge, in the front of the King's battle, stands a squire in old harness with a red beard going grey and one eye. He has been talking the whole time in Welsh, to nobody. Ieuan knows him. 'Dafydd ap Llywelyn, out of Brecon,' he says. 'Davy Gam. He counted the French for the King last night, and came back and said there were enough to kill, enough to take, and enough to run away.' The squire turns his one eye on the archers, and it stops on you.`, [
  { t: 'Meet his eye, and nod',
    out: [`He nods back, as one tradesman to another, and says something that makes Ieuan laugh. You ask what it was. 'He says you have the look of a man who has been here before,' Ieuan says. 'He says that he has it too, and that it is no great comfort.' The squire has already turned to the front again.`, { grit: 1 }] },
  { t: 'Ask Ieuan where such a man will stand, when it comes', test: ['wits', 7, 'talk'],
    win: [`'Where the King is,' Ieuan says. 'He is of the household. If the King goes forward, Davy goes a pace before him. If one of the King's brothers is down, Davy stands over him. That is what he is kept for.' You look at where the squire is, and where the banner is, and you mark the ground between.`, { eye: 1 }],
    lose: [`'How should I know where he will stand?' Ieuan says. 'He is from Brecon. They do as they like.'`, {}] },
  { t: 'Mind your own bow',
    out: [`You have your own work, and he has his. You check your string and your bracer and the lie of the shafts in your belt. When you look up, he is laughing at something, alone, with his visor still open.`, { ar: 1 }] }
], { bm: 1, when: () => !!S.flags.centre && !S.played.bm_ieuan });
scene('bm_eighteen', 'battle', 'Eighteen', `There is a knot of men in the French press who are not like the rest. They wear the same badge on their shoulders, and they are not fighting whoever is in front of them. They are cutting a road, all eighteen of them together, straight towards the King's banner, and they do not stop for their own wounded. Somebody in the wedge says they have sworn an oath to strike the crown from the King's head or die.`, [
  { t: 'Shoot the first of them', arrows: 1, test: ['eye', 9, 'shoot close'],
    win: [`A wedge of men is only as good as its point. You take the man at the point of it through the eye slit at twenty paces, which you will never do again as long as you live, and the two behind fall over him. The household knights close on what is left. You count afterwards, and there are eighteen of them on the ground, and one has your arrow.`, { st: 2 }],
    lose: [`They are in among the English men-at-arms before you can get a clear shot, and then it is all one colour. You lower the bow. They do not reach the King. It was no doing of yours.`, {}] },
  { t: 'Shout it to the men-at-arms',
    out: [`You bawl it over the din: the badge, the number, where they are making for. A household esquire hears you and looks, and sees it, and takes six men across. They meet the eighteen two spear-lengths from the banner. Not one of the eighteen takes a step back, and not one of them gets any nearer.`, { st: 1 }] },
  { t: 'Go in at the side of them, with the mallet', test: ['grit', 9, 'melee'],
    win: [`Men who have sworn to look only at the crown do not look to the side. You hit the last of them behind the knee, and the one in front of him, and by then other archers have seen what you are doing. It is butcher's work. A knight with the King's arms on his coat watches you come out of it.`, { st: 2 }],
    lose: [`The last man of the eighteen turns out to have been set there to watch for exactly this.`, { b: -1 }] }
], { bm: 1, when: () => !!S.flags.centre && !!(S.played.bc_press || S.played.bc_press_b) });
scene('bm_breath', 'battle', 'Sixty pounds', `There is a moment when the French in front of the King's battle simply stop. They have not been beaten back. They have walked three hundred paces in plate through a ploughed field, in a crush, with their visors shut, and they cannot get their breath. You can hear it from the wedge: a sound like a forge bellows, from a thousand helmets at once. Their arms are hanging. They are ten paces off.`, [
  { t: 'Shoot, now, while they are standing', arrows: 1, test: ['arm', 8, 'shoot close'],
    win: [`They do not even put up their shields. You shoot four shafts, as fast as you have ever shot, into men who are too spent to turn aside. All along the wedge the others are doing the same. When the French get their wind again there are a good many fewer of them to use it.`, { st: 1 }],
    lose: [`Your own arms are not much better than theirs. You get two shafts off, both low, and then they are moving again.`, {}] },
  { t: 'Get your own breath',
    out: [`If they must, then so must you, and you do not have sixty pounds of iron to carry while you do it. You lean on your stake and breathe to the bottom of your belly, and shake out your hands. When it begins again you are a new man, or at any rate a less used one.`, { heal: 1 }] },
  { t: 'Look for the man who is not winded', test: ['eye', 8],
    win: [`There is always one. He is a tall man in the third rank who has kept his visor up and his head moving, and he is looking for the weak place in the English line. You point him out to the archer beside you, and the two of you see to him between you.`, { wits: 1 }],
    lose: [`Under a shut visor every man looks alike. If one of them has his wits about him still, he has the wit not to show it.`, {}] }
], { bm: 1, when: () => !!S.flags.centre && !!(S.played.bc_press || S.played.bc_press_b) });
scene('e_parole', 'eve', 'Men let go', `The army took prisoners on the march, a few dozen: men-at-arms picked up at the fords and in the skirmish at Corbie. This evening the King has ordered them all turned loose. They are to give their word to come back and yield themselves if he wins tomorrow. If he loses, they are quit. Cutler's twenty has been minding one of them since the Somme, a Picard squire of about your own age, and it falls to you to walk him to the edge of the camp.`, [
  { t: 'Walk him out, and say nothing',
    out: [`You take him as far as the last picket and cut the cord on his wrists. He rubs them. Then he says, in careful English, that he will come back the day after tomorrow and look for you, since he has given his word. He does not say it as a thing he expects to have to do. He goes off across the plough towards about ten thousand fires.`, { grit: 1 }] },
  { t: 'Ask him what he has seen of their army', test: ['wits', 8, 'talk'],
    win: [`He has no reason to tell you, and he tells you, because he is young and you have shared your bread with him for five days. Every lord of France is over there, he says, and every one of them wishes to be in the first rank. There has been shouting about it since noon. Nobody will stand behind anybody. You take that back to Cutler, who carries it higher.`, { st: 1, wits: 1 }],
    lose: [`He smiles and says that he has seen a great many Frenchmen. Then he asks what you have seen of yours, and you find you have told him how hungry you are before you have thought.`, {}] },
  { t: 'Give him your last crust for the road',
    out: [`It is a poor enough crust. He takes it, and looks at it, and at you, and breaks it in two and gives you the half. You eat on the edge of the camp, the pair of you, without a word. Then he goes. You are no less hungry than you were, and you feel a good deal better.`, { heal: 1 }] }
], { pool: 1 });
scene('e_horses', 'eve', 'No horse neighs', `Somebody remarks on it first as a joke, and then nobody is laughing. Across the field the French have twenty thousand horses, picketed in the rain, and for an hour past not one of them has made a sound. The English horses are quiet too, but there are few of those, and they are half starved. Men are sitting up in the furrows to listen. By morning it will be all through the army that the French horses did not neigh on the eve of Crispin's Day, and what that means.`, [
  { t: 'Tell the twenty what it means', test: ['wits', 7, 'talk'],
    win: [`You say that a horse knows before its rider does. That they can smell what is coming to them tomorrow, and it has shut their mouths. You do not believe a word of it. The twenty does, since it wishes to, and the man next to you repeats it to the next company as a thing well known. Cutler gives you a look. He does not contradict you.`, { st: 1 }],
    lose: [`You say that it is a good omen. Hodge asks who for. You find that you had not thought as far as that.`, {}] },
  { t: 'Listen for what else is not there', test: ['eye', 7],
    win: [`No horses. But also, over on their left, no voices, and hardly a fire. The noise and the light are all in the middle, where the lords are. The wings of that army are thin, or late, or have not been told where to stand. You tell Ieuan, and he listens for a while with his head on one side. 'So they are,' he says.`, { wits: 1 }],
    lose: [`Rain. A dog, a long way off. Your own belly. If the silence has anything to tell you, it is keeping it.`, {}] },
  { t: 'They are wet and tired. Go to sleep.',
    out: [`A horse that has stood all day in the rain with its saddle on has nothing to say to anybody. You say so, and are told that you have no soul. You pull your hood down and sleep. You have noticed that the men with souls are still sitting up.`, { heal: 1 }] }
], { pool: 1 });
scene('s_thirds', 'soton', 'Thirds', `The knight in whose pay the twenty stands has come down to the quay at last, to see what he has bought. He is a tired man on a good horse, and he has his clerk read out the terms, as the indenture requires, to men who mostly cannot follow them. Sixpence a day. A share in the shipping home. And of anything a man wins in France, in ransom or in plunder, one third to his captain, who in turn pays a third of that third to the King.`, [
  { t: 'Work it out', test: ['wits', 7],
    win: [`A prisoner worth thirty crowns is twenty to you and ten to the knight, and of the knight's ten the King has three and a bit. So everybody above you wishes you to take prisoners, and to bring them in alive. You had thought of a ransom as a piece of luck. It is a trade like any other, with a master's cut, and you understand trades.`, { wits: 1 }],
    lose: [`You lose the thread at the third of a third. A man behind you says that it means the gentry take the lot, and you cannot prove him wrong.`, {}] },
  { t: 'Ask the clerk what happens to the pay of a man who dies', test: ['wits', 7, 'talk'],
    win: [`The clerk is not used to questions from the ranks, and he answers before he has thought. It is paid to the day of death, he says, to whoever the captain names. The knight looks down from his horse to see who asked. 'A man who thinks about his wages,' he says to Cutler. 'Keep him alive. They are less common than archers.'`, { st: 1 }],
    lose: [`'Ask your vintenar,' the clerk says, and goes on reading. Cutler tells you afterwards, at some length, what he thinks of men who put questions to clerks.`, {}] },
  { t: 'Never mind the terms. Look at the knight.',
    out: [`His harness is old and well kept. His horse is better than he can afford. He has a cough. He has mortgaged something to be here, you would say, and he needs this to pay. A man in that case will not waste his archers, and he will not be generous with them either. It is as well to know whom you are working for.`, { eye: 1 }] }
], { pool: 1 });
scene('h_ditch', 'harfleur', 'Filling the ditch', `The town ditch before the Leure gate is forty feet across, with water in the bottom of it, and nobody is going to storm a wall on the far side of that. So the ditch is to be filled. Every company sends men to cut brushwood in the marsh and tie it in bundles as long as a man, and by night the bundles are run forward and thrown in. The garrison knows exactly what is being done. They shoot at the sound.`, [
  { t: 'Carry bundles to the ditch', test: ['grit', 8],
    win: [`A bundle on each shoulder, bent double, forty paces in the open and forty back. You do it eleven times. On the last run you can walk a little way out on what you have made. A quarrel goes into the bundle on your left shoulder and stops there, and you bring it home with you as a keepsake.`, { st: 1, arm: 1 }],
    lose: [`On the fourth run they throw down a fire pot to see by. For the space of a breath the whole ditch is as bright as a church, and every crossbow on the wall has found something to shoot at.`, { b: -1 }] },
  { t: 'Cut and tie in the marsh, where it is only wet', test: ['arm', 7, 'labour'],
    win: [`It is hedger's work: a billhook, a withy, and a knee on the bundle while you draw the knot. You tie sixty before midnight. The serjeant in charge counts them and pays the company in arrows, since arrows are what he has.`, { ar: 1 }],
    lose: [`You stand to your thighs in a marsh in the dark, cutting wet alder with a blunt hook. You have made nine bundles by midnight, and three of them come apart when they are lifted.`, {}] },
  { t: 'Shoot at the wall, so that they keep their heads down',
    out: [`You cannot see them, and they cannot see you. You shoot at the place where the wall meets the sky, a shaft for every bundle that goes forward, and now and again there is a cry from up there. It may be that you hit somebody. The carriers believe that you did, at any rate, and it is for them that you are doing it.`, { eye: 1 }] }
], { pool: 1 });
scene('m_soles', 'march', 'Forty feet', `By the second week the road has done to the army's boots what the flux did to its bowels. Half the twenty is walking on rags. Tonight Cutler comes to you with a set of harness cut off a dead cart horse, good thick leather, and drops it at your feet. 'You said you were a cobbler,' he says. 'You've till it's light. I don't much mind how it looks.' You have your awl and your thread, and one evening, and there are forty feet in the twenty.`, [
  { t: 'Sole the worst of them first, whoever they belong to', test: ['wits', 8, 'labour'],
    win: [`You go round them like a farrier, looking at feet. The worst are Hodge's, and after his a Suffolk man's whose name you have never learned. You cut soles by eye and stitch by the light of the fire, and you finish the seventh pair as the sky turns grey. They are ugly. They will see Calais. Seven men walk past you in the morning, and every one of them finds something to say.`, { st: 2 }],
    lose: [`The leather is harder than anything Master Geoffrey ever gave you, and you break your awl on the third pair. Three men are better shod than they were. The rest are no worse, and one of them tells you so.`, { st: 1 }] },
  { t: "Do Cutler's first",
    out: [`He has not asked. His soles are through at the ball of the foot, and he has been walking on the welts for a week and saying nothing. You do his, and do them properly, with a double row. He puts them on in the morning and takes six paces, and comes back. 'I'll want those again when this is over,' he says. From Cutler that is a statement that he expects you both to be alive.`, { st: 1, pull: ['cutler', 1] }] },
  { t: 'Do your own, and do them well',
    out: [() => `A cobbler's own boots are always the worst in the street. Not tonight. You cut yourself the best of the leather and take your time over it${perkinHere() ? ', and when you have done you find there is enough left for Perkin, who has been watching you with his feet tucked under him' : ''}. Tomorrow you will be walking on a dead horse, and glad to.`, () => (perkinHere() ? { heal: 1, pull: ['perkin', 1] } : { heal: 1 })] }
], { pool: 1 });
