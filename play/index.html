    out: [`You say it to yourself until it stops catching. A pewterer, with a shop. Good. Then there is nothing to be careful for. That evening at the halt you shoot as you have never shot, flat and hard and quick, and Ieuan watches you with his head on one side and does not praise it.`, { arm: 1 }] },
  { t: 'Ask Ieuan what he would do',
    out: [`'In her place?' Ieuan says. 'Marry the pewterer. He's alive and he's in Winchester.' He chews a grass stem. 'But she's not in my place, is she, she's in hers. And she gave you a candle to take with you. Nobody gives a candle to a man they've finished with. They ask for the ribbon back.' You had not thought of that. It keeps you warm for thirty miles.`, { wits: 1 }] }
]);
scene('home_m_brother', 'march', () => S.flags.dickon_dead ? "Dickon's bow" : S.flags.dickon_home ? 'Word from the ships' : "Suffolk's fire", () => S.flags.dickon_dead
  ? `You have carried Dickon's bow from Harfleur without stringing it. Tonight you take it out of its bag. It is a better bow than yours and a heavier one, and the grip is worn to the shape of a hand that is not your hand. Ieuan, passing, stops and looks at it, and at you, and goes on without a word.`
  : S.flags.dickon_home
    ? `One of Suffolk's archers finds you at a halt. He carried a message for you from the quay at Harfleur and has only now worked out which cobbler was meant. 'Your brother said to tell you, when they put him on the ship,' he says, frowning with the effort of getting it right. 'He said: tell the cobbler he owes me a carrying. And to keep his head down.'`
    : `The old Earl of Suffolk is dead at Harfleur and his son leads the retinue now, a young man of twenty-one. Dickon finds you at a halt, thinner, with a beard coming. He sits down on your pack as if he owned it. 'They say it'll be a battle,' he says. 'A real one. I've never been in a real one, for all I told you.' It is the first time in your life he has admitted to not knowing something.`, [
  { t: 'String it, and shoot it until it knows you', if: () => S.flags.dickon_dead, test: ['arm', 6, 'labour'],
    win: [`It fights you for an hour. Then somewhere in the second sheaf it stops being his and becomes a bow, and by dark it has started to be yours. You find that you are crying, and that it does not spoil your aim.`, { arm: 1 }],
    lose: [`It is too heavy. It was always too heavy; he was always stronger. You get it to your chin and something goes in your shoulder, and you sit down with his bow across your knees and hate him for a while. He would have understood that.`, { b: -1 }] },
  { t: 'Carry it unstrung. It is his.', if: () => S.flags.dickon_dead,
    out: [`You put it back in the bag. You will carry it to Calais, and over the water, and up the hill to your mother's house, and no Frenchman will ever have cause to know it existed. A bow is a small thing to keep out of a war, and you have nothing else of his to keep out of it.`, { arm: 1 }] },
  { t: 'Send word back that you are well, and lying about it', if: () => S.flags.dickon_home,
    out: [`The archer undertakes to carry it, if he lives, and does not think the condition worth remarking on. You sit a while afterwards. Somewhere over the water Dickon is eating your mother's bread and complaining of the cold. You find that this is enough to march on.`, { wits: 1, heal: 1 }] },
  { t: 'Ask what it was like, carrying a man to the ships', if: () => S.flags.dickon_home,
    out: [`'It wasn't me carried him,' the archer says. 'It was you. He told everyone on the quay. Little brother, he said, the cobbler, carried me a mile.' He considers you with some curiosity. 'He said you never used to be able to carry anything.'`, { st: 1 }] },
  { t: 'Tell him what a real one is like', if: () => S.flags.dickon_lives,
    out: [`You tell him. Where to look, when to breathe, how the noise comes before the men. You say it like someone who has stood there, and halfway through he stops interrupting. 'Where did you learn that?' he asks. Here and there, you say. He takes his time over you. 'You've got old,' he says. 'When did you get old?'`, { wits: 1, flag: 'dickon_told', say: 'If Dickon goes down on the day, you will know where to look.' }] },
  { t: 'Ask him for a spare string', if: () => S.flags.dickon_lives && !has('string'),
    out: [`He has three, Flemish hemp, waxed, in a tin. He gives you the best one and pretends it is the worst. 'Keep it dry,' he says. 'Under your cap. Father used to say it.' Your father never said anything of the kind, and you both know it.`, { item: 'string' }] },
  { t: 'Sit with him and say nothing much', if: () => S.flags.dickon_lives,
    out: [`You share what there is, which is walnuts. He tells you a long lie about a girl in Southampton. You tell him he has not changed. For a while there is no army, only the two of you on a pack in a field.`, { heal: 1 }] }
]);

scene('fire_m', 'march', 'The last fire', () => `There is one fire to a hundred men now, and the wood is wet. The scouts came back at dusk with their faces set. The French are across the Calais road in three great battles, and the army will be up with them tomorrow. Even the priests have stopped pretending otherwise. Around your fire the talk has shrunk to small things: a boot, a blister, whose turn it is with the cup.${S.flags.reeve_owes ? ' Reeve is sitting nearer to you than he needs to.' : ''} There are perhaps three fires left between you and the day, and this is the only one with any heat in it.`, [
  { t: 'Sit with Perkin', if: () => perkinHere() && !S.flags.cold,
    out: [() => `He has been working something out. 'If I don't,' he says, 'you'll tell my mother it was quick.' You say he can tell her himself. 'But if I don't.' Then yes. He nods. 'And you'll say I wasn't sick.' He was sick this afternoon, behind a hedge. You say you never saw it. '${N()},' he says, 'you're a terrible liar,' and he leans against your shoulder like a tired horse.`, { flag: 'bond', pull: ['perkin', 2], say: 'Perkin will keep close to you.' }] },
  { t: 'Sit with Ieuan',
    out: [`He is restringing his bow by feel and talking about the price of cheese in Abergavenny, which has gone up. After a while he stops. 'Tomorrow,' he says, 'you will want to shoot at the men, since the men are what frighten you. Don't. The horse first. Then the men behind the front men. Never the one who is looking at you. He is already dealt with, by being looked at.'`, () => (S.flags.horsecraft ? { eye: 1, pull: ['ieuan', 2] } : { flag: 'horsecraft', pull: ['ieuan', 2], say: 'You know what a charging horse will and will not do. Standing against one will go better.' })] },
  { t: 'Sit near Cutler',
    out: [() => S.standing >= 3 ? `He makes room. 'Erpingham's been round the vintenars,' he says, to the fire. 'He wants steady men for the centre, by the King's own battle. No wood to run to there. It's where the horse come first, and where they'll go for the King.' He turns his tally stick over. 'I've given him two names. I've not decided on the third.'` : `He does not make room, but he does not send you off. After a while he says, 'Stand where I put you tomorrow. Shoot when I say. If I go down, listen for Hodge.' He tells every man the same, and he has told you with the rest.`, () => (S.standing >= 3 ? { st: 1, pull: ['cutler', 2] } : { eye: 1 })] },
  { t: 'Sit alone',
    out: [() => ALONE_M[M.want] ? ALONE_M[M.want]() : M.want === 'girl' ? `You light what is left of the candle. It burns for the length of a paternoster and goes out, and you sit on in the dark with the smell of it, which is the smell of her father's shop.` : M.want === 'brother' ? (S.flags.dickon_lives ? `You can see Suffolk's fires from here. One of the shapes round them is Dickon. You do not go over. You have never needed to watch him sleep before, and you find you want to.` : `You sit with the bracer, or the place where the bracer was, and think about the orchard behind your mother's house, where the two of you shot at a sack.`) : `You go over the sum for the last time. Then you see that you have stopped believing in it some while ago, and that you are here for the twenty now, and for the days, and for whatever it is that keeps sending you back.`, { grit: 1, heal: 1 }] }
]);

/* ---- the eve: threads ---- */
scene('e_ieuan', 'eve', "Ieuan's arrows", `Ieuan is laying out his arrows on a cloak by somebody's lantern, in three heaps. 'Flight, for when they are far. Bodkin, for when they are close. And these.' The third heap is six shafts, heavier than the rest and fletched with peacock. 'My father's pattern. I have carried them since Harlech and never loosed one, for want of a day that deserved it.' He looks up at you. 'Three are yours. Don't waste them on a horse.'`, [
  { t: 'Take the three',
    out: [`They are beautiful. The heads are long and four-square and somebody has spent a winter on each. You put them point-down in the earth by your stake where you will not reach for them by mistake. Ieuan nods. 'When you can see the rivets,' he says. 'Not before.'`, { item: 'peacock' }] },
  { t: 'Tell him to keep all six, since he will shoot them better',
    out: [`He considers this as a point of fact, and agrees. 'True,' he says. 'But I've nobody to leave the others to.' He wraps three in a rag and puts them in your quiver himself, at the back. 'For after,' he says, and does not say after what.`, { item: 'peacock', grit: 1 }] },
  { t: 'Ask him what happened at Harlech',
    out: [`'We lost,' he says. 'Four years in that castle, and the last of it we ate the horses and then the harness. When the English came in I was nineteen and weighed what a dog weighs.' He squares the heap of arrows. 'It taught me the one thing worth knowing. You can be on the losing side and still be alive on Thursday.'`, { wits: 1, item: 'peacock' }] }
], { thread: 'ieuan', when: () => has('ieuan') });

scene('e_reeve_owes', 'eve', 'What Reeve brings', () => `Reeve sits down beside you in the dark and puts something heavy in your lap. It is a lead maul, a carpenter's, the head bound to the haft with wire. 'Had it off a shipwright at Harfleur who'd no more use for it,' he says. 'A bow's a fine thing till they're close. Then you want something that doesn't care about armour.' He does not look at you. 'That's us straight.'`, [
  { t: 'Take it', if: () => !has('maul'),
    out: [`It weighs five pounds and sits in the hand like an argument. 'It's not much of a debt,' you tell him, 'a skin of water for this.' Reeve gets up. 'You don't know what the water was worth,' he says. 'You weren't the one drinking it.'`, { item: 'maul' }] },
  { t: 'Ask him to stand by Perkin tomorrow instead', if: perkinHere,
    out: [`He is silent a moment. 'The baker's boy.' Yes. 'He'll get himself killed.' Yes. Reeve breathes out through his nose. 'That's a bigger thing than a skin of water,' he says. 'But I've never been asked for anything by a man who could have just taken the maul.' He takes it back and weighs it in his own hand. 'All right, cobbler.'`, { flag: 'reeve_guard', say: 'Reeve will stand by Perkin.' }] },
  { t: 'Tell him there was never a debt',
    out: [`'There's always a debt,' says Reeve. 'It's the only thing I've ever been sure of.' He leaves the maul on the ground between you and goes. In the grey before the line forms it is still there, and you pick it up.`, () => (has('maul') ? { wits: 1 } : { item: 'maul' })] }
], { thread: 'reeve', when: () => S.flags.reeve_owes });
scene('e_reeve_enemy', 'eve', 'Things happen in a press', `Reeve finds you in the dark, as you knew he would. He squats on his heels just out of reach. 'Tomorrow,' he says, pleasantly, 'there'll be a press. Mud, mallets, nobody looking. Men get hit from behind in a press and nobody ever knows whose hand it was.' He lets that sit. 'I'm only saying. A long way from Southampton, and nobody's flogged me since.'`, [
  { t: 'Tell him you have died worse than anything he can do', test: ['grit', 6],
    win: [`You tell him how the flux takes a man, and the mud, and a horse. You say it in the tone of a man reading a bill of fare. He listens. Somewhere in it his face changes. 'You're cracked,' he says at last. 'God's truth. They've sent me to war with a cracked cobbler.' He goes away, and you think that tomorrow he will keep clear of you, as he would keep clear of a house with plague in it.`, { wits: 1, flag: 'reeve_settled' }],
    lose: [`It comes out as bluster, and he hears that it does. 'We'll see,' Reeve says comfortably, and goes back to his place, and you sit for a long time feeling the skin between your shoulders.`, {}] },
  { t: 'Give him your purse', if: () => S.coin > 0,
    out: [`He counts it by feel. 'Aye,' he says. 'That'll buy you my back and not my knife.' He spits on his palm and holds it out, and you shake it, and wipe your hand afterwards on the wet grass.`, () => ({ c: -S.coin, flag: 'reeve_settled' })] },
  { t: 'Go to Cutler, now, tonight',
    out: [`Cutler listens in the rain. Then he goes and fetches Reeve by the collar and walks him forty paces along the line to a Lancashire vintenar who owes him money. 'Yours,' he says. 'Tomorrow only. Watch your purse.' He comes back and stands over you. 'That's twice,' he says. 'I'd sooner you could deal with it yourself.' You sleep with nobody behind you all the same.`, { st: -1, flag: 'reeve_settled' }] }
], { thread: 'reeve', when: () => S.flags.reeve_enemy && !S.flags.reeve_settled });

scene('e_french', 'eve', 'The French fires', `Across the field the French have a fire for every dozen men, and by the sound of it a cask as well. You can hear them plainly: laughing, shouting for servants, and under it all the rattle of dice. A herald who came over at dusk told somebody, who has told everybody, that they are dicing for the King and his lords, and that they have sworn to take three fingers from the right hand of every archer they catch, so that he never draws a bow again.`, [
  { t: 'Hold three fingers up to the dark, where they can come and fetch them',
    out: [`You do it without thinking. Then the man beside you does it, grinning, and the man beside him, and it goes down the line in the firelight, hundreds of right hands raised at France. Nobody says a word, the King having forbidden it. You had not known the army could laugh without making a sound.`, { grit: 1 }] },
  { t: 'Count their fires', test: ['eye', 6],
    win: [`You count along the dark until you lose the row and start again. It is a great many. But the fires are bunched, not spread: all the gentlemen are at the front, where the glory will be, and there is hardly a fire where the crossbows ought to be. You tell Cutler. He grunts. 'Too many lords,' he says. 'They'll get in each other's way.'`, { wits: 1, st: 1 }],
    lose: [`You stop at three hundred and feel sick. There are at least that many again that you have not counted.`, {}] },
  { t: 'Sleep with your right hand inside your jack',
    out: [`You tuck it under your arm like a hen with one egg and turn your back on France. It is the most sensible thing anybody does that night, and you get an hour of sleep for it.`, { heal: 1 }] }
], { pool: 1 });

/* ---- the battle: before, and moments in it ---- */
scene('b_wait', 'battle', 'Before the light', () => `Cutler kicks the twenty awake before there is light to see by, though nobody has slept. Men are stringing their bows by feel${S.flags.wet ? ', and you can tell from the sound of yours that it is slack' : ''}. There is no food. A priest is going along the furrows with the Host, and men take it standing, in their turn, with their bows in their hands. The line will form soon. There is time to find one person first.`, [
  { t: 'Find Perkin', if: perkinHere,
    out: [() => `He is being sick behind a wagon, neatly, like a cat. You hold his bow. When he has finished he wipes his mouth and looks at you. '${S.flags.perkin_knows ? 'Is this the one?' : 'Stay by me?'}' he says. ${S.flags.perkin_knows ? `You tell him you do not know. It is the first time you have been able to say so, and it comforts both of you more than a promise would have.` : `You tell him to stay by you, which is not the same thing, and he hears the difference and takes it.`}`, { flag: 'bond', say: 'Perkin will keep close to you.' }] },
  { t: 'Find Ieuan',
    out: [() => has('ieuan') ? `He is dividing his arrows into those he will loose and those he will keep. Without looking up he pushes a dozen flight shafts across to you. 'You'll run short before I do,' he says. 'You hurry. I've told you about hurrying.' Then he does look up. 'Whatever you've been waiting for, boy, I hope it's today. You've the look of a man who has waited a long time.'` : `He is dividing his arrows, and nods to you kindly, as to a neighbour's child. 'Keep your elbow up,' he says, 'and God keep you.' You wish, too late, that you had spent more evenings at his fire.`, () => (has('ieuan') ? { ar: 1 } : { eye: 1 })] },
  { t: "Find Dickon among Suffolk's men", if: () => S.flags.dickon_lives && !kn('k_suffolk'),
    out: [`The young Earl's company is forming on the right, by the Tramecourt wood. Dickon is in the second rank, pale under his beard. He grips your arm. 'If it goes bad,' he says, 'I'm on the right, under the Earl's banner. Come and find me.' He means, come and find my body. Neither of you says it.`, { eye: 1, flag: 'dickon_near' }] },
  { t: "Find Dickon, and make him swear to stand well left of the Earl's banner", know: 'k_suffolk', if: () => S.flags.dickon_lives,
    out: [`'Left,' Dickon says. 'Why left?' You tell him the banner will draw them. You tell him the young Earl means to be a hero and will be dead before the day is half done, and that every man within ten paces of him will go down with him. He stares at you. 'You're guessing.' You look at him. He stops arguing. 'Left,' he says. 'God's teeth. All right. Left.'`, { flag: 'dickon_safe', say: 'Dickon will stand clear of the banner.' }] },
  { t: 'Go to the rear, with the baggage guard', if: () => !S.flags.cutler_knows,
    out: [`Cutler has been told to send a man back to Maisoncelle, to stand guard over the carts with the pages and the sick. He has not yet chosen. You go to him before he has to. He eyes you the way a gambler eyes a coin that has come down tails. 'Go on, then,' he says. 'Somebody has to.' The twenty watches you walk away from the line, and you can feel it on your back the whole way to the village.`, { flag: 'baggage', say: 'You are posted to the baggage, a mile behind the line.' }] },
  { t: 'Take the Host, and keep to yourself',
    out: [`The wafer is damp and tastes of nothing. You have taken it on this morning before, and died on some of them, and you do not know what that makes it. You kneel in the furrow a moment longer than the others do. Then you get up and string your bow.`, { grit: 1, heal: 1 }] }
]);

scene('bm_boy', 'battle', 'The boy with the sheaves', `A boy of ten or eleven comes running along the back of the line with sheaves from the wagons under both arms, and men are snatching at him as he passes. He has four left. He is crying without seeming to notice it, and he does not stop running.`, [
  { t: 'Take one sheaf',
    out: [`You pull one from under his arm and he hardly breaks stride. Twenty-four shafts, Tower make, the fletchings still stiff with glue. You hold them like bread.`, { ar: 1 }] },
  { t: 'Take two, before the Cheshire men do', test: ['wits', 3],
    win: [`You have both before he knows it. A Cheshire archer with an empty bag gives you a look that will keep. You find that you can live with it.`, { ar: 2, st: -1 }],
    lose: [`You get one. The second is torn out of your hand by a Cheshire man, who leaves you with a fistful of feathers and his opinion of you.`, { ar: 1 }] },
  { t: 'Send him on to Ieuan, who will not waste them', if: () => !S.played.bm_ieuan,
    out: [`You point, and the boy goes. Ieuan takes two sheaves and sets them point-down in the earth without a glance. Then he looks along the line at you and touches his cap, slowly, as he would to an equal.`, { st: 1, wits: 1 }] }
], { bm: 1 });
scene('bm_knight', 'battle', 'A man in the mud', `A French man-at-arms has fallen out of the front of the press and lies ten paces from your stake, on his back, held down by his own harness in mud like glue. He has got his visor up. He is holding out his right gauntlet towards you, which is how a gentleman yields, and he is shouting a name and a sum of money.`, [
  { t: 'Take the gauntlet. He is worth more than you will earn in your life.', test: ['grit', 3, 'ransom'],
    win: [`You go out past the stakes, take the glove, and drag him in by the heels like a carcase. He weighs what a pig weighs. He thanks you in French all the way and gives his name three times, in case you should forget who is to be asked for the money.`, { flag: 'prisoner', st: 1 }],
    lose: [`You have him by one heel when his friends notice. A lance-butt takes you in the side. You keep hold of the heel, and you could not say why. Cutler tells you later that you are a fool, and that you are now a fool who owns a prisoner.`, { b: -1, flag: 'prisoner' }] },
  { t: 'Leave him. Shoot.', 
    out: [`You have work to do and he is not it. He goes on holding out the glove for some time. Later, when you look again, somebody else has taken it, or else he has stopped holding it out.`, { st: 1 }] },
  { t: "Go out for his dagger and his purse, and leave the rest of him",
    out: [`He does not understand, and then he does, and tries to roll. You are quick about it. The dagger is a good one with a silver pommel. He calls something after you as you go back to your stake, and you are glad you have no French.`, () => (has('dagger') ? { c: 10 } : { item: 'dagger', c: 6 })] }
], { bm: 1 });
scene('bm_string', 'battle', 'The string', () => `On the draw you feel it go: not the snap, but the give that comes before it, one strand parting under the serving. ${S.flags.wet ? 'The string has been slack since the rain, and now it is dying.' : 'Even a dry string has only so many shots in it, and you have asked a great many of this one.'} The French are still coming on. To change a string takes a calm man as long as a paternoster, and you are not calm.`, [
  { t: 'Your spare is under your cap. Restring.', if: () => has('string'),
    out: [`Cap off, coil out, step through, bend, loop. Your hands know it, since a cobbler's hands know thread. You are shooting again before the man beside you has noticed you stopped. You have done few things better.`, { drop: 'string', flag: 'dry', unflag: 'wet' }] },
  { t: 'Beg a string along the line, and restring under their noses', if: () => !has('string'), test: ['wits', 3],
    win: [`Hodge has two. He throws you one without looking. Step through, bend, loop, and it sings when you try it, a clean high note. You had forgotten what a dry string sounded like.`, { flag: 'dry', unflag: 'wet' }],
    lose: [`Nobody has one to spare, or nobody will say so. You knot the frayed strand with your teeth and pray, and a crossbowman who has seen a bow go still picks you out.`, { b: -1, flag: 'wet' }] },
  { t: 'Shoot it until it breaks',
    out: [`You ease your draw to three-quarters and nurse it. The arrows go, though not as arrows should. Each time you loose, you wait for the crack.`, { flag: 'wet', say: 'Your string is failing. Shooting will be harder.' }] }
], { bm: 1 });
scene('bm_ieuan', 'battle', 'Ieuan sits down', `Ieuan sits down suddenly behind his stake, as if he had remembered something. There is a crossbow quarrel through his thigh, low, and a great deal of blood. He looks at it with professional interest. 'Well,' he says. 'That's the cheese finished.' Then he holds his bow out to you across both palms. It is the tall one, the one the Cheshire men said you could not draw.`, [
  { t: 'Get a cord round his leg and drag him back to the wagons', test: ['grit', 3],
    win: [`Bowstring, above the wound, twisted tight with an arrow shaft. He curses you fluently in two languages the whole way to the wagons, which you take as a good sign. When you get back to your stake his bow is leaning against it. He must have thrown it after you.`, { st: 1, flag: 'ieuan_saved', item: 'ibow' }],
    lose: [`You get the cord on and get him back, but it takes too long, and you are a long way from your stake when a spent quarrel finds your shoulder. Ieuan, from the wagon, tells you that you are a fool and that he has known it since Southampton. He is smiling as he says it.`, { b: -1, flag: 'ieuan_saved' }] },
  { t: 'Take the bow',
    out: [`You take it. He nods and shuts his eyes. It is like drawing a church door, and the arrow leaves it as if it had been thrown by God. You do not look round at him again. When the day is over you will go and see what is left to look at.`, { item: 'ibow' }] }
], { bm: 1, when: () => has('ieuan') });
scene('bm_dickon', 'battle', "Suffolk's banner", () => `On the right, by the Tramecourt wood, a banner goes down that you know: the Earl of Suffolk's, the young Earl, four weeks in his father's title. The press closes over the place where it stood. Dickon is under that banner. It is two hundred paces off, along the back of the line.${S.flags.centre ? ' You are in the centre, by the King, where you have died a dozen times trying to be.' : ''}`, [
  { t: 'Go to him', test: ['grit', 4, 'melee dickon'],
    win: [`You run. You go through the back of the fight like a dog through a hedge, and you find him under two dead men and a live one, and the live one is a Frenchman trying to get a dagger through his aventail. You do not remember what you did. Dickon does, and tells it for the rest of his life, and never gets it right.`, { flag: 'dickon_saved', arm: 1, unflag: 'centre', learn: 'k_suffolk', say: 'You have left your place in the line.' }],
    lose: [`You run. A man-at-arms on his knees swings at you as you pass and takes the feet from under you. By the time you reach the place, a Suffolk archer has dragged Dickon clear by his collar, alive and swearing. You are the one who has to be carried.`, { b: -2, flag: 'dickon_saved', unflag: 'centre', learn: 'k_suffolk', say: 'You have left your place in the line.' }] },
  { t: 'Hold your place',
    out: [`You hold your place. You tell yourself there is a reason, and there is. You go on shooting. You do not look to the right again, and it is the hardest thing you have done in any of your lives. When it is over they find him near the Earl, as you knew they would.`, { flag: 'dickon_dead', unflag: 'dickon_lives', learn: 'k_suffolk' }] }
], { bm: 1, must: 1, when: () => S.flags.dickon_lives && !S.flags.dickon_safe });
scene('bm_king', 'battle', "The King's voice", () => `The King comes along the front of his battle on foot, with his helm under his arm so that men can see his face. There is a scar by his nose the size of a thumbnail. He is saying something to each knot of men as he passes. To the archers he says that he would sooner die on this field than be ransomed at England's cost, and that the French have promised to take three fingers from every bowman's right hand. Then he looks along the wedge, and for a moment he looks at you.`, [
  { t: 'Meet his eye',
    out: [`It lasts no longer than a blink. He has grey eyes and he is very tired, and he is twenty-eight years old. He nods once, to you or to the wedge, and goes on. You find that your hands are steady.`, { eye: 1 }] },
  { t: 'Look at the scar', if: () => S.played.h_ieuan,
    out: [`Six inches in, Ieuan said. Somebody loosed it. You look along the line to where the old Welshman is standing with his bow grounded, and he is looking at the scar too, with an expression of mild proprietary interest, like a mason passing a wall he built.`, { eye: 1, wits: 1 }] },
  { t: 'Shout with the rest',
    out: [`Five thousand men shout. You did not know you had a voice that size. It comes back off the woods on either hand, and for a moment the French line is very still.`, { st: 1 }] }
], { bm: 1, when: () => S.flags.centre });
/* ================= v0.5: the loop as story ================= */
const BETWEEN = [
  { when: () => M.runs >= 1, t: `You are dead. You are quite sure of it, since you were there. It is dark, and then it is not quite dark. There is a low room, and a rushlight, and a smell of wax and wet leather. Two men sit at a bench with their backs to you, working. Neither of them looks round. One reaches behind him without turning and sets a pair of boots on the floor by your feet. They are your boots, and they have been resoled.\n\nThen there is tar, and the crying of gulls.` },
  { when: () => M.runs >= 3 || M.far >= 2, t: `The room again. They are brothers; you can tell from the backs of their necks. The work on the bench is too big for a shoe and you cannot see what it is. The elder holds a seam up to the light, finds something he does not like, and begins to unpick it stitch by stitch. 'Not right yet,' he says, to his brother or to the seam. He has not looked at you, and you do not think he was speaking to you.` },
  { when: () => M.far >= 4, t: `This time the younger one looks round. He has a mild, tired face, and a scar that goes all the way round his neck like a collar. 'You got as far as the day,' he says. 'Good. That's where the fault is.' He turns the work on the bench so that you can see the edge of it. It is not leather, and you could not say what it is. There are men in it, very small, and a ploughed field, and rain.` },
  { when: () => kn('k_centre') || M.lived, t: `'There,' the elder says, and puts his awl on a place near the middle of the work, where the stuff is worn so thin that the rushlight shows through it. 'Under the banner. It was badly made there, the first time. It tears, and then the whole day comes apart at that place.' He looks at you over his shoulder. 'We can't reach it from this side,' he says. 'We have tried.'` },
  { when: () => kn('k_gloucester'), t: `'A king's brother,' the younger says. 'If the boy dies there, the King will not leave the body. He stands over it, and the next blow finds him too. Then there is no King, and after that the day is only a great many men dead in a field for nothing.' He bites off a thread. 'It is our feast, the twenty-fifth. We were cobblers, and nobody has had much cause to remember us. We would like the day to be remembered for something better than that.'` },
  { when: () => M.wins >= 1, t: `They are both facing you when you come in, and the work on the bench is whole. The elder runs his thumb down the seam and can find no fault in it. 'It will hold,' he says. Then he picks up your boots and turns them over, and frowns. 'These, though. You have finished the day and left your own work half done. We don't let a job leave the shop like that.' He sets them on the bench between you, the mended one and the other. 'There were two of us,' the younger says. 'There are two boots. And there were two jobs in this from the start: ours, which was the day, and yours, which you carried over the water with you. You have done ours.' The elder nods. 'There's no hurry,' he says. 'But a cobbler finishes the pair.'` },
  { when: () => M.trueAt, t: `The room is empty. The rushlight is burning, and the bench has been swept. On it are a pair of boots, finished, and an awl laid across them.\n\nNobody in that room ever told you their names, and you have known them since you were first put to the trade. Crispin and Crispinian, the brothers who made shoes, and who are always painted side by side. Everything of theirs comes in twos. Their half of the work was the day, and it is mended under the banner. Your half was your own business, and that is done as well.\n\nYou understand that you may take the boots, and that you must leave the awl.` }
];
const BETWEEN_IDLE = ['The brothers are at their bench. Neither of them looks round.', 'Wax, leather, a rushlight, and the sound of an awl going through something tough.', 'The younger one glances at you and goes back to his seam.'];
const AGAIN = ['You have stood here before.', 'You know this ground.', 'Again.', 'You could say their lines for them.', 'You could say their lines for them.', 'You have lost count of this place.', 'You have lost count of this place.', 'There is a groove worn in this day, and you are in it.'];
const LATE_DEATH = ['You die. You are getting quicker at it.', 'It hurts less than it used to, and that worries you more than the dying does.', 'You have time to think that this one was stupid. Then there is tar, and gulls.'];

scene('x_tell', 'soton', 'Telling Cutler', `You have tried telling Cutler before, in other wakings, and been laughed off the quay. But a man who will not believe a tale may still be shaken by a thing he has told nobody. You find him alone behind the fish sheds, counting sheaves. He does not look up. 'Well, cobbler?'`, [
  { t: 'Three times over the water, and never twenty brought back', know: 'k_tok1',
    out: [`He stops counting. 'Who told you that?' You did, you say. He looks at you for a long time. 'I've told no one that,' he says. 'Not my wife.' He does not believe you. But he does not laugh, and for the rest of the week he keeps you where he can see you, which is where you wanted to be.`, { st: 1, flag: 'cutler_half', say: 'Cutler is listening.' }] },
  { t: 'Give him six names, and point to the six men, alive, across the quay', know: 'k_tok2',
    out: [`'Simkin,' you say. 'The two Johns. Wat. Hobbe. And a lad from Alton whose name you never learn.' They are forty paces off, alive, arguing about a dog. 'You will cut six notches for them at Harfleur, in a trench, on a stick you keep inside your jack on the left.' Cutler's hand goes to his chest before he can stop it. The stick is there. It has no notches on it yet.`, { st: 2, flag: 'cutler_half', say: 'Cutler is listening.' }] },
  { t: 'Tell him about Joan, and the Angel at Alresford, and the hearthstone', know: 'k_tok3',
    out: [`He hits you. It is not hard, for him. Then he stands with his fist still closed and his face gone grey. 'Under the hearth,' he says. You nod. 'I said that. To you.' In the mud, you tell him, with a poleaxe going past your ear. He sits down on a sheaf chest. After a while he says, 'How many times?' You tell him. 'Christ's bones,' says Hob Cutler. 'Right. Then you had best tell me what you need, and where I am to put you.'`, { st: 3, flag: ['cutler_half', 'cutler_knows'], say: 'Cutler believes you. He will put you in the centre.' }] },
  { t: 'Say nothing. Count sheaves with him.',
    out: [`You count sheaves. He lets you. At the end there is one over, and he pushes it across to you with his foot. 'For keeping your mouth shut,' he says. 'It's a rare gift in a cobbler.'`, { ar: 1 }] }
], { thread: 'cutler', first: 1, when: () => M.runs >= 1 && (kn('k_tok1') || kn('k_tok2') || kn('k_tok3')) && !S.flags.cutler_half });

scene('x_talk', 'any', 'What the twenty says', `It has got round. Nobody says it to your face, but the talk stops when you sit down, and a Cheshire man crossed himself this morning when you looked at him. The word is that the cobbler knows things before they happen. Some of the twenty think it lucky. Others have started to count the men who have died standing near you, and they do not like the number they get.`, [
  { t: 'Laugh, and tell them a cobbler reads feet, and all the rest follows', test: ['wits', 6, 'talk'],
    win: [`You tell Hodge he will have a blister on his left heel by Thursday, since his boot is a finger too long. On Thursday he has. After that it is a game, and a game is not witchcraft. Men bring you their feet and their fortunes, and the muttering turns into a kind of pride that the twenty has its own cunning man.`, { sus: -2, st: 1 }],
    lose: [`It comes out wrong, too quick, the laugh of somebody who has been caught. They laugh with you, a beat late. Nobody sits beside you that night.`, { st: -1 }] },
  { t: 'Tell them you dream, and that the dreams are mostly wrong',
    out: [`It is nearly true, and you say it as a tired man would. A dreamer is a thing they understand; every village has one, and she is usually somebody's aunt. 'Dream me a hot dinner, then,' Hodge says, and the talk moves on, though not all the way.`, { sus: -1 }] },
  { t: 'Say nothing, and let them wonder',
    out: [`You let it stand. They fear you a little, and you find they will follow a man they fear, up to a point, and you have some use for that. The Cheshire man has stopped looking at you altogether.`, { wits: 1, sus: 1 }] }
]);
scene('x_chaplain', 'any', "The chaplain's questions", `A chaplain of the King's household sends for you. He is a thin, careful man with ink on his cuffs, and he has a list. Did you foretell the sally from the gate? Did you name the night it would rain? Have you a familiar, or a charm, or a compact? He asks it all in the same level voice. There is a serjeant standing at the tent door. Men have been burned in England for less than is on that list, though not often, and not usually archers.`, [
  { t: 'Tell him you pray to the cobblers\' saints, and that they answer', test: ['wits', 6, 'talk saint'],
    win: [`You tell him about Crispin and Crispinian, and your trade, and the twenty-fifth. He writes for some time. 'The King,' he says at last, 'is fond of saints who take an interest.' He folds the list in half and puts it in his sleeve. 'Go on praying,' he says. 'And should they tell you anything about the French, I am to be found in this tent.'`, { st: 1, sus: -4, flag: 'blessed' }],
    lose: [`He hears you out. 'Every sorcerer I have examined,' he says, 'began by telling me about a saint.' He does not have you arrested. He has you watched, by a serjeant who makes no secret of it, and Cutler is told that he is answerable for you.`, { st: -2, sus: -2 }] },
  { t: 'Tell him the truth, all of it',
    out: [`He stops writing quite early. When you have finished he looks at the list, and at you, and puts down his pen. 'I can do nothing with this,' he says. 'It is not heresy, and it is not sorcery. I do not know what it is. I think it may be only grief.' He rubs his eyes. 'Go away. And for God's sake be wrong about something soon, where men can see you.'`, { grit: 1, st: -1, sus: -3 }] },
  { t: 'Tell him you guess, and are lucky, and that the twenty are fools', test: ['wits', 7, 'talk'],
    win: [`You are a cobbler, you say; you look at how a thing is made and see where it will give. A gate, a sky, a boot. He tests you on the weather and you are wrong, on purpose, twice. He strikes through the list line by line. 'Archers,' he says, to the serjeant. 'They would see the devil in a hot dinner.'`, { sus: -4 }],
    lose: [`'Lucky,' he says. 'Eleven times.' He has counted. He lets you go, since he has a war to attend to, but your name stays on his list, and Cutler hears of it before you are back at the fire.`, { st: -2, sus: -2 }] }
]);

/* ================= v0.6: fast routes through acts already mastered ================= */
const FAST_AFTER = 2;
const knowsAct = a => !(S && (S.oath === 'road' || S.oath === 'plain')) && ((M.done || {})[a] || 0) >= FAST_AFTER;
scene('fast_soton', 'soton', 'Ten days in Southampton', `You do not live these days so much as walk through them. You know which plank on the quay is loose. You know what Cutler will say before he has drawn the breath to say it, and who will win at dice, and which lords will lose their heads outside the Bargate. The days go past you like a road you have walked too often to see. You cannot be everywhere in them, though, and you have to decide what to make sure of.`, [
  { t: 'Perkin. Keep him close and out of trouble.', if: perkinHere,
    out: [`You are at his elbow when he thinks of running, and when he thinks of dicing, and when Reeve looks at him. By the time the fleet sails he has stopped wondering how you always happen to be there. He has decided that you are simply that sort of friend.`, { flag: 'bond', grit: 1, pull: ['perkin', 2], say: 'Perkin will keep close to you.' }] },
  { t: 'Cutler. Be where he looks, every time he looks.',
    out: [`You are stacking when he wants things stacked and silent when he wants silence. You mend his boots before he has noticed they need it. By the tenth day he has stopped checking your work, and you know of no higher praise from him.`, { st: 1, pull: ['cutler', 2] }] },
  { t: 'The bow. The butts, the Welshman and the stringer\'s stall.',
    out: [`Two hundred arrows a day, with Ieuan behind you moving your elbow. You go to the woman who waxes strings on the quay before the price doubles. You sail knowing more about your bow than you ever knew about a last.`, { item: ['ieuan', 'string'], pull: ['ieuan', 2] }] }
]);
scene('fast_harfleur', 'harfleur', 'Five weeks before Harfleur', `The siege is a thing you have by heart: the guns, the mine, the gate on the night with no moon, and the marsh quietly killing more men than the walls do. You have done all of it. You know which trench floods, and which crossbowman sings. Five weeks go by in the time it takes to tell it, and you spend them on one thing.`, [
  { t: 'Staying alive. Boiled beer, the chalk spring, and no mussels.',
    out: [`You drink nothing a brewer has not seen to and eat nothing out of that mud. You are thought a prig, and you are one of the few men in the marsh with a whole gut. When the flux comes through, it has to look hard to find you.`, { item: 'beer', flag: 'clean', heal: 1 }] },
  { t: 'Being seen. The ropes, the gate and the wall.',
    out: [`You are on the gun ropes, and behind the mantlet when the gate opens, and in the ditch under the singing crossbowman. It costs you some skin. Cutler has stopped calling you the cobbler's boy and started calling you the cobbler.`, { st: 2, arm: 1, b: -1 }] },
  { t: 'Your own people.',
    out: [() => `You spend the weeks on the twenty, not on the war. You sit with ${perkinHere() ? 'Perkin after his first man' : 'the ones who cannot sleep'}, and you keep watch with Ieuan and let him talk. Very little of it would show on a muster roll.`, () => ({ flag: perkinHere() && !S.flags.cold ? 'bond' : 'kept', item: 'ieuan', grit: 1 })] }
]);
scene('fast_march', 'march', 'The road to the Somme', `Eleven days of it, and you could walk them asleep: the food gone on the ninth, the ford held against you, the long cast inland with the French keeping pace across the river. You know where the walnuts are. You know which church has its door open. You can see to one thing on this road, and you have to let the rest go by.`, [
  { t: 'Yourself. Eat, and cut your stake before the order comes.',
    out: [`You have ash cut and fire-hardened two days before the King thinks of it, and a slab of pork from a farm you have robbed so often it feels like calling on a relative. You come to the Somme fed and armed, and somewhat ashamed.`, { item: ['stake', 'pork'] }] },
  { t: 'Perkin and the Welshman. Walk between them the whole way.', if: perkinHere,
    out: [`You are standing in the church door when Perkin comes to it, and he does not go in. You have Ieuan's pack on your back before his feet give out. Neither of them knows what you have spared him, so neither of them thanks you for it.`, { flag: ['bond', 'pyxsaved'], item: 'ieuan', say: 'Perkin will keep close to you.' }] },
  { t: 'Cutler. Be useful at every halt.',
    out: [`You count heads for him and find the stragglers, and you tell him about the ford before he has to ask. By the Somme he has given you four men to mind and stopped watching how you mind them.`, { st: 1 }] }
]);

/* ================= v0.7: more incidents (step 2, first batch) ================= */
scene('s_horses', 'soton', 'Loading the horses', `The army is taking ten thousand horses to France, and every one of them has to go up a ramp or over the side in a sling. The destrier in front of you is worth more than your master's shop and has decided against the sea. It has already put one groom in the water. Its owner, a knight with a red face, is offering a groat to any man who will get a hood over its eyes.`, [
  { t: 'Take the hood and go to its head', test: ['grit', 8],
    win: [`You walk up to it as you would walk up to a customer who has not paid: slowly, and talking about something else. It lets you put the hood on. Once it is blind it goes up the ramp like a lamb. The knight pays you the groat, and Cutler, watching, notes that you do not run from large animals.`, { c: 4, st: 1 }],
    lose: [`It waits until you are close and then turns its quarters on you. You wake up on a pile of nets with the print of a horseshoe coming up on your thigh, and the groom from the water looking down at you with fellow feeling.`, { b: -1 }] },
  { t: 'Tell them to lead its stablemate up first', test: ['wits', 7],
    win: [`There is an old grey palfrey it has shared a stall with since it was foaled. You point her out. She goes up the ramp without a glance, and the destrier follows her like a child after its mother. The knight gives the groat to his groom, who thought of nothing, and you learn something about how credit is shared out in an army.`, { eye: 1 }],
    lose: [`The palfrey goes up. The destrier watches her go with interest and stays where it is. The knight asks whether you have any more advice.`, {}] },
  { t: 'Stand well back, with everybody else',
    out: [`It takes them most of the morning and a second groom. You watch from behind a bollard with the rest of the twenty and learn four new oaths, three of them from the knight.`, {}] }
], { pool: 1 });
scene('s_bargate', 'soton', 'Three heads at the Bargate', `The Earl of Cambridge, Lord Scrope and Sir Thomas Grey meant to kill the King before he sailed, and it has ended as such things do. Grey went first and the two lords three days after him, on a block outside the Bargate, and the whole army has found a reason to walk past the place. Scrope was the King's friend, and had shared his bed and his counsel. People say the King wept, and then signed. The straw is still down, and darker than straw should be. They say Scrope's head has gone north in a cask, to sit over a gate at York. A pie-seller has set up beside the block, and is doing well.`, [
  { t: 'Look at the place properly',
    out: [`You make yourself do it. It is a smaller patch of ground than you expected, for three such men. Three weeks ago any one of them could have had you whipped for not getting out of the road. You find that you have less fear of lords than you had this morning, and more of the King.`, { eye: 1 }] },
  { t: 'Watch the crowd, since everyone else is watching the gate', test: ['eye', 7],
    win: [`There is a boy working the press with a small knife, cutting purse strings while their owners gape at the block. You take him by the wrist as his hand goes into Cutler's belt. Cutler looks at the boy, and the knife, and you. He lets the boy go with a kick, and he counts his money, and then for some reason he counts yours.`, { st: 1, c: 3 }],
    lose: [`You watch the crowd so closely that you do not feel the tug at your own belt. He was good, whoever he was. He left you the purse and took only what was in it.`, () => ({ c: -Math.min(S.coin, 3) })] },
  { t: 'Buy a pie, and look at the sea',
    out: [`It is a good pie. You eat it on the quay with your back to the town. It seems to you that a man who can eat under a traitor's head might do well enough in France, and you would rather not be that man just yet.`, { heal: 1 }], cost: 1 }
], { pool: 1 });
scene('h_convoy', 'harfleur', 'Round the back of the town', `The Duke of Clarence is taking a third of the army round to the far side of Harfleur by night, to shut the road to Rouen. It is nine miles through the flooded valley, in the dark, in silence. Cutler has been asked for men who can keep their feet. Word has come that the French are trying to run a convoy into the town by that same road before it closes: guns, powder and crossbow bolts, on carts.`, [
  { t: 'Go with Clarence', test: ['grit', 7, 'march'],
    win: [`You wade for half the night with your bow over your head, and at first light you come up out of the reeds on to the Rouen road just as the carts do. The carters run. There are barrels of powder, and bundles of crossbow bolts, and to your great satisfaction a cask of arrows that somebody stole from an English ship in the spring.`, { ar: 1, st: 1 }],
    lose: [`Somewhere in the fourth mile you go into a drain up to your neck, and the man behind you pulls you out by the bow. You arrive in time to guard the carts that better men have taken, with one boot and a chill that goes into your chest.`, { b: -1 }] },
  { t: 'Stay with the guns',
    out: [`You stay. In the morning the far hill has English banners on it, and the town is shut in on every side. Nobody in Harfleur can be glad of it, and you do not much enjoy it yourself, standing to your knees in a marsh you are not allowed to leave.`, {}] }
], { pool: 1 });
scene('h_parley', 'harfleur', 'Three days of truce', `The town has asked for terms. If no French army comes to relieve it by Sunday, it will open its gates, and until Sunday nobody is to shoot. So for three days the men who have been killing each other for five weeks look at one another across the ditch. A French man-at-arms sits on the broken barbican with his legs hanging over and calls down in bad English to ask whether the archers are as hungry as he is.`, [
  { t: 'Throw him half a loaf', test: ['wits', 6, 'talk'],
    win: [`He catches it, looks at it, and laughs. A while later a wineskin comes down on a cord. You trade through the afternoon: bread up, wine down. He tells you there is no army coming. The Dauphin is at Vernon, he says, and he is fat, and he does not like to ride. You take that to Cutler, who takes it further.`, { heal: 1, st: 1 }],
    lose: [`He catches it and eats it, and makes a gesture that needs no English. You are down half a loaf. The twenty has a good deal to say on the subject of feeding the French.`, {}] },
  { t: 'Use the quiet to look at the breach', test: ['eye', 7],
    win: [`Nobody is shooting, so for the first time you can stand upright and look at it. The breach is wider than it seemed from the ditch, and behind it they have built a second wall out of timber and tubs of earth. You count the tubs. If the King does storm on Sunday, you know now where you would rather not be put.`, { wits: 1 }],
    lose: [`You look until a serjeant asks whether you are thinking of buying it.`, {}] },
  { t: 'Sleep for three days',
    out: [`You sleep like a man paid by the hour for it. Nobody shoots at you. It is the best the war has treated you so far, and you have a Frenchman's hunger to thank for it.`, { heal: 1 }] }
], { pool: 1 });
scene('m_barn', 'march', 'A barn on fire', `The King's ordinances are read to the army once a week: no burning, no robbing of churches, no laying hands on a woman or a priest, on pain of death. Tonight, a furlong off the road, a barn is alight. A Cheshire archer is standing in front of it with a torch, well pleased with himself, and a farmer is running towards him with a hayfork. The provost's men are not in sight yet, but they will not be long.`, [
  { t: 'Put the fire out', test: ['grit', 6, 'labour'],
    win: [`You and the farmer beat at it with wet sacks, side by side, without a word of each other's language. Half the barn is saved. When it is done he stares as if you were an animal he had not known to exist. He gives you a cheese. When the provost comes, there is nothing much left for him to hang anyone for.`, { heal: 1, st: 1 }],
    lose: [`It has too good a hold. You come away with your eyebrows gone and your hands blistered, and the provost's men arrive in time to find you standing nearest to it.`, { b: -1 }] },
  { t: 'Get the Cheshire man away before the provost comes', test: ['wits', 6, 'talk'],
    win: [`You take the torch out of his hand and put a bow into it, and walk him back to the road talking loudly about the price of hemp. He is hanged a week later for something else. But he was not hanged tonight, and his whole twenty knows who saw to it.`, { st: 1 }],
    lose: [`He does not want to be got away. He is still explaining what the French did to his cousin at Fécamp when the provost's serjeant rides up, and you are standing next to him.`, { st: -1 }] },
  { t: 'Keep marching. You saw nothing.',
    out: [`You keep your eyes on the pack in front of you. Behind you there is shouting, and after a time it stops. In the morning there is a Cheshire man hanging from a walnut tree beside the road, and the column goes under him company by company.`, {}] }
], { pool: 1 });
scene('e_cloak', 'eve', 'A man in a plain cloak', `A man comes along the furrows in the rain with one attendant and no light. He wears a plain cloak with the hood up and speaks low. He asks the archers how their strings are, and whether they have eaten, and what they think of the ground. He listens to the answers. When he reaches Cutler's twenty he stops in front of you, for no reason you can see, and asks what you make of tomorrow.`, [
  { t: 'Tell him the truth: that most of the men expect to die', test: ['wits', 6, 'talk'],
    win: [`He is silent for a moment. 'And you?' You say that you have reason to think it will go better than they fear. 'What reason?' The mud, you say, and the woods, and the fact that the French are all gentlemen. He laughs, shortly. 'Keep that reason,' he says, 'and lend it to your neighbours.' He goes on down the line. You never learn who he was. Cutler says it was Erpingham's squire. Ieuan says squires do not have a scar by the nose.`, { st: 1, grit: 1 }],
    lose: [`It comes out as a complaint. He hears it through, says 'God keep you, archer,' and moves on. The attendant looks back at you as he goes, and takes a good look.`, {}] },
  { t: 'Tell him the strings are dry and the men are in good heart',
    out: [`'Are they,' he says. It is what a serjeant would have told him. He nods and goes on, and you feel you have wasted something, though you could not say what it was.`, {}] },
  { t: 'Ask him who he is',
    out: [`'A gentleman of a company,' he says. The attendant makes a small sound. The hooded man asks to see your bow, bends it a little, and hands it back. 'I was shot with one of these once,' he says. 'I have had a respect for them ever since.' Then he is gone into the rain, and Ieuan, three places down, has gone very still.`, { wits: 1 }] }
], { pool: 1 });
scene('e_barefoot', 'eve', 'Bare feet', `Ieuan is taking his boots off. He does it carefully, sets them side by side under the hedge, and begins rolling his hose down to the knee. 'That field is new plough with a week of rain in it,' he says. 'A boot will stay in it and the man will come out. I have seen it at Usk.' All along the line the old soldiers are doing the same. They are doing it in front of a cordwainer, and he is being asked to agree.`, [
  { t: 'Go barefoot',
    out: [`It is against everything you were taught. The mud comes up between your toes, cold as a toad. But you can feel the ground, and when you pull a foot out of it the foot comes. You hang your boots round your neck by the laces, since you made them and you will not leave them under a French hedge.`, { flag: 'barefoot', say: 'Hand-to-hand fighting will go a little better in the mud.' }] },
  { t: 'Keep your boots, and bind them on with cord', if: () => has('boots'),
    out: [`You made these boots, and you know what they will stand. You lash them on at the ankle and the instep with bowstring, as you would truss a fowl. Ieuan watches. 'Stubborn,' he says. 'Well. It's your trade.' In the morning they hold, and you are the only shod man in the twenty.`, { flag: 'barefoot', wits: 1, say: 'Hand-to-hand fighting will go a little better in the mud.' }] },
  { t: 'Keep your boots on. A man fights as he is used to.',
    out: [`You keep them on. Ieuan shrugs. 'You know your own feet,' he says, in the tone of a man who thinks you do not.`, {}] }
], { pool: 1 });

/* ================= v0.8: deeper threads, more incidents and moments (step 2, second batch) ================= */
const reeveMet = () => !!(S.played.s_reeve || S.played.s_reeve_dice || S.played.h_reeve || S.played.h_reeve_deal);
const DOG_ECHO = { at: 'harfleur', t: "Perkin's dog has attached itself to the twenty's cook-fire, and has grown fat on a siege that is starving everybody else." };

/* ---- Perkin ---- */
scene('s_perkin_dog', 'soton', "Perkin's dog", `Perkin has acquired a dog. It is a quay dog, yellow, with one ear and the manners of a tax collector, and it has decided that Perkin is the best thing that has ever happened to it. No beast goes aboard that is not on the King's manifest. The fleet sails tomorrow. Perkin has not asked you anything. He is standing there with the dog under one arm, looking at you.`, [
  { t: 'Smuggle it aboard in an arrow chest', test: ['wits', 8, 'sneak'],
    win: [`You try it that night, with the chest that is to go aboard first. The dog lies between two sheaves under the Tower's seal, and has the sense not to bark while a serjeant sits on the lid to eat his supper. It will do. Perkin says Cutler will never know. Cutler, forty paces off, is looking at the chest.`, { flag: ['bond', 'dog_aboard'], echo: DOG_ECHO, say: 'Perkin will keep close to you.' }],
    lose: [`You try it that night, with the chest that is to go aboard first. It barks. A serjeant opens the lid and the dog comes out of it like a cork. It is last seen going up the High Street with a ship's biscuit. Perkin does not blame you, but Cutler does.`, { st: -1, flag: 'dog_fled' }] },
  { t: 'Pay a shipman to be looking the other way', cost: 3,
    out: [`Threepence buys you a shipman's blind eye and the promise of a place for the dog among the horses, where it will be happier than any of the horses. Perkin tries to pay you back in pennies he does not have. You tell him to owe it you in France.`, { flag: ['bond', 'dog_aboard'], echo: DOG_ECHO, say: 'Perkin will keep close to you.' }] },
  { t: 'Tell him the dog stays in England',
    out: [`He puts it down on the quay. It sits there, on the same bollard as the gull, with every sign of expecting him to change his mind, and it is there again the next morning, and the one after. Perkin stops looking at it. He tells you later that it was the first hard thing he had done in his life.`, { grit: 1, flag: 'dog_left' }] }
], { thread: 'perkin', when: perkinHere });
scene('s_perkin_bow', 'soton', 'Perkin cannot shoot', `Perkin is a baker's son. He has the forearms for a bow, and he looses like a man throwing a loaf. At the butts this morning he put one shaft into the clout, two into the bank and one into a Lancashire man's hat, with the Lancashire man under it. Cutler has started to look at him as he would at a cracked stave. The muster clerks strike off men who cannot shoot, and an archer struck off the roll goes home without his sixpence.`, [
  { t: 'Take him to the butts at first light, every day until you sail', test: ['arm', 7, 'labour'],
    win: [`You make him shoot at ten paces until he cannot miss, and then at twelve. You are not much of an archer yourself, and you find you learn a thing better for having to explain it. By the last morning he is putting four in six into the clout and has stopped shutting his eyes.`, { flag: ['bond', 'perkin_trained'], say: 'Perkin can shoot now, and will keep close to you.' }],
    lose: [`You shout at him and he gets worse, as a horse would. By the last morning neither of you can lift an arm above the shoulder. He passes the muster on Cutler's word alone.`, {}] },
  { t: 'Ask Ieuan to take the boy in hand', if: () => has('ieuan'),
    out: [`Ieuan looks Perkin over as he would a cheese. 'He kneads,' he says. 'Good. That is the same muscle.' He never once raises his voice. Within the week Perkin is shooting like somebody who has been told it is easy and has believed it.`, { flag: 'perkin_trained', pull: ['ieuan', 1], say: 'Perkin can shoot now.' }] },
  { t: 'Tell Cutler the boy should carry sheaves, and not shoot them',
    out: [`Cutler agrees with you, and that is the worst of it. Perkin is put to fetching and carrying for the twenty. He knows who suggested it. He does the work well and does not speak to you while he does it.`, { st: 1, flag: 'cold' }] }
], { thread: 'perkin', when: perkinHere });
scene('h_perkin_letter', 'harfleur', "Perkin's letter", `Perkin wants a letter written to his mother, and you are the nearest thing to a clerk he knows: an apprentice has to keep a tally and sign for leather. He has a scrap of parchment begged from a chaplain, and he dictates walking up and down the trench. He is well. The food is good. He has not been near any fighting. He stops. 'Put that I killed a man,' he says. 'No. Don't put that.'`, [
  { t: 'Write what he says, word for word',
    out: [`You write all of it, the lies and then the stopping. When you read it back to him he nods at each lie as if it were true. He makes his mark at the bottom, a loaf with a cross cut in it, which is how his father marks the bread.`, { flag: 'bond', say: 'Perkin will keep close to you.' }] },
  { t: 'Leave out the Frenchman, and put in the dog', if: () => !!S.flags.dog_aboard, test: ['wits', 7],
    win: [`You write that he has grown, and that he is trusted with the twenty's bread, and you give her one true thing she can hold: the dog, which has grown fat on a siege that is starving everybody else. He listens to it read and is quiet. 'That's better than what I said,' he says. 'Is that what clerks do?'`, { eye: 1, flag: 'bond', say: 'Perkin will keep close to you.' }],
    lose: [`It comes out like a bill of sale. He makes his mark on it all the same, and looks at the letter as if it were about somebody else.`, {}] },
  { t: 'Leave out the Frenchman, and put in something true', if: () => !S.flags.dog_aboard, test: ['wits', 7],
    win: [`You write that he has grown, and that he is trusted with the twenty's bread, and you give her one true thing she can hold, about a joke or the colour of the sea. He listens to it read and is quiet. 'That's better than what I said,' he says. 'Is that what clerks do?'`, { eye: 1, flag: 'bond', say: 'Perkin will keep close to you.' }],
    lose: [`It comes out like a bill of sale. He makes his mark on it all the same, and looks at the letter as if it were about somebody else.`, {}] },
  { t: 'Tell him he can tell her himself, at Christmas',
    out: [`'Christmas,' he says. He folds the blank parchment small and puts it inside his jack. He carries it there for the rest of the campaign, and you never see him take it out.`, { wits: 1 }] }
], { thread: 'perkin', when: perkinHere });
scene('m_perkin_feet', 'march', "Perkin's boots", `Perkin's boots gave out at the Somme. He has been walking since then on rags and a kind of angry cheerfulness, and tonight when he unwinds the rags there is more blood on them than you like to see. A baker stands all day and never walks anywhere. He holds one foot up to the fire and looks at it as if it belonged to somebody who had let him down.`, [
  { t: 'Give him your own', if: () => has('boots'),
    out: [`They are the best boots you ever made, and they fit him better than they fit you. He tries to refuse and you tell him it is a trade matter and none of his business. You walk the rest of the way to the battle in his rags.`, { drop: 'boots', flag: ['bond', 'perkin_shod'], say: 'Perkin will keep close to you.' }] },
  { t: "Cut soles for him out of a dead horse's harness", test: ['wits', 7],
    win: [`There is a dead sumpter by the road with its breeching still on it, good thick neat's leather. You cut two soles by eye and stitch them on by firelight with a waxed end and your awl. They are ugly, and they will hold to Calais. Perkin walks up and down in them like a lord.`, { flag: 'bond', st: 1, say: 'Perkin will keep close to you.' }],
    lose: [`The leather is rotten with rain and comes apart under the awl. You try three times. In the end you bind his feet with the strips, which is all they are good for.`, {}] },
  { t: 'Half the army is barefoot. He will manage.',
    out: [`He manages. He does not complain of it, and you have noticed that he has given up complaining to you of anything.`, {}] }
], { thread: 'perkin', when: perkinHere });
scene('e_perkin_stake', 'eve', "Perkin's stake", `Perkin's stake is hazel, as thick as a broom handle. He cut it in a hurry on the day of the order and has been ashamed of it ever since. He has planted it beside yours in the dark, and now he stands looking from one to the other. Tomorrow the horse will come at both of them.`, [
  { t: 'Give him yours, and take the hazel', if: () => has('stake'),
    out: [`You pull your ash out of the ground and put it into his hands before he can argue. He is sixteen years old and you have been killed more often than you can count. The stake will do more good in front of him.`, { drop: 'stake', flag: ['bond', 'perkin_staked'], say: 'Perkin has your stake, and will keep close to you.' }] },
  { t: 'Cut him a proper one now, in the dark', test: ['arm', 6, 'labour'],
    win: [`There is an ash in the hedge behind the village. You cut it by feel, and you point it with a hatchet by the light of somebody else's fire. He holds the lantern and passes you things like a surgeon's boy. It is a better stake than your own.`, { flag: ['bond', 'perkin_staked'], say: 'Perkin has a proper stake, and will keep close to you.' }],
    lose: [`The hatchet glances off a knot in the dark and finds your knee. You finish the stake sitting down.`, { b: -1, flag: 'perkin_staked' }] },
  { t: 'Tell him to stand behind yours',
    out: [`'Stand behind mine,' you say. He nods. It is against the drill, since every man is to stand in front of his own. He will do it anyway, and Cutler will pretend not to see.`, { flag: 'bond', say: 'Perkin will keep close to you.' }] }
], { thread: 'perkin', when: perkinHere });

/* ---- Ieuan ---- */
scene('s_ieuan_cheshire', 'soton', 'The Cheshire men', `The Cheshire archers were the old King's bodyguard and have not forgotten it. Their best man has challenged Ieuan to shoot at the clout: twelve score paces, six arrows, a sheaf a side. Half the quay has turned out to watch an Englishman put a Welshman in his place. Ieuan is unconcerned. He wants a second, to shoot three of his six, and he is looking at you.`, [
  { t: 'Shoot as his second', test: ['eye', 8, 'shoot'],
    win: [`Ieuan shoots his three into a space you could cover with a hat. Yours are not so close, but two of them are inside the Cheshire man's worst. The sheaf changes hands. Ieuan gives you half of it. 'I'd have won it alone,' he says. 'But then they would say it was witchcraft. This way it is only a cobbler.'`, { arm: 1, ar: 1 }],
    lose: [`Ieuan shoots his three into a space you could cover with a hat, and you put yours into Hampshire. He pays over the sheaf without any change of expression. 'It was my own fault,' he says. 'I picked you.'`, {}] },
  { t: 'Mark the arrows, and call them honestly',
    out: [`You stand by the clout with a peeled wand and call each shaft as it falls. It is close, and you call it for Cheshire by a thumb's breadth. Ieuan pays. Afterwards the Cheshire vintenar seeks you out to say that it was fairly marked, and you find that the word has reached Cutler before you do.`, { st: 1 }] },
  { t: "Mark them Ieuan's way", test: ['wits', 8],
    win: [`It is close, and you are standing nearest. You call it for Ieuan with a clear voice and a clean wand. Ieuan gives you a long look and half the sheaf. 'I did not ask for that,' he says. He did not refuse it either.`, { ar: 1 }],
    lose: [`A Cheshire man has walked up to see for himself. He measures with his own bowstring, in front of everybody. There is not a fight, quite. Cutler hears of it within the hour.`, { st: -1 }] }
], { thread: 'ieuan' });
scene('h_ieuan_boy', 'harfleur', 'The boy on the wall', `There is a boy on the wall with a yoke and two buckets, carrying water to the men at the breach. He is perhaps eleven. He has made the same walk at the same hour for a week, and he has stopped ducking. Cutler has orders that nothing is to move on that wall. He gives the shot to Ieuan, who is the only man who can be sure of it at that range. Ieuan grounds his bow. 'No,' he says.`, [
  { t: 'Take the shot yourself', test: ['arm', 8, 'shoot'],
    win: [`It is the best shot you have made in France. The buckets go over the wall and the yoke after them. Cutler says, 'Good,' and nothing else. Ieuan does not speak to you that day or the next. On the third day he says that you draw well now, and that he is sorry to have taught you.`, { st: 1, pull: ['ieuan', -3] }],
    lose: [`You loose, and the arrow breaks on the stone a yard from his head. The boy drops the yoke and runs. He does not come back to the wall, and you do not have to decide what you think about that.`, {}] },
  { t: 'Loose wide, and curse the wind', test: ['wits', 7],
    win: [`You put it a clear fathom to the left and swear convincingly. The boy runs. Cutler looks at where the arrow went, and at the flag on the tower, which is hanging like washing. He says nothing. Ieuan says nothing either, but that evening he sits down beside you and begins, without being asked, to tell you about wind.`, () => (has('ieuan') ? { grit: 1, eye: 1 } : { eye: 1, item: 'ieuan' })],
    lose: [`'There's no wind,' Cutler says. He does not shout. He takes your bow, unstrings it, and gives it back to you, and you spend the night on the latrine trench.`, { st: -1 }] },
  { t: 'Ground your bow beside his',
    out: [`You set your bow down next to Ieuan's. Cutler looks at the two of you for a long moment. 'Two,' he says. 'I see. Get out of my sight, the pair of you.' A Cheshire man takes the shot and misses. Cutler does not send for you again that week.`, () => (has('ieuan') ? { st: -1, grit: 1 } : { st: -1, item: 'ieuan' })] }
], { thread: 'ieuan' });
scene('m_ieuan_song', 'march', 'What the Welsh sing', `The Welsh archers are singing at their fire, low, in parts, something slow in a minor key. It carries. At your own fire a Cheshire man says that it is what they sang at Bryn Glas, over the English dead, and that he had an uncle there. Somebody else says to leave it. The Cheshire man has stood up. Thirteen years is not long, and both sides in that war are in this army, drawing the same sixpence.`, [
  { t: 'Ask Ieuan, loudly, what the words mean', test: ['wits', 7, 'talk'],
    win: [`Ieuan considers. 'It is about a girl,' he says, 'who works at a mill, and a man who loves her, and he has no money.' He translates a verse. It is exactly that. 'They are all about that,' he says. 'We have only the one song.' The Cheshire man sits down, since he cannot very well fight a miller's daughter.`, { st: 1, grit: 1 }],
    lose: [`Ieuan tells you. Nobody is listening by then. It takes Cutler and two vintenars to part them, and somebody's elbow finds your mouth in the dark.`, { b: -1 }] },
  { t: 'Start an English song over the top of it', test: ['grit', 7],
    win: [`You start the one about the miller, as loud as you can. The twenty takes it up to drown you out. For a moment the two songs fight, and then, by some accident of the tune, they fit. Men on both sides notice it and nobody says so. They go on singing until the fires are low.`, { arm: 1 }],
    lose: [`Your voice gives out on the second line. The Welsh, who are polite people, stop to let you finish.`, {}] },
  { t: 'Go and sit at the Welsh fire',
    out: [`You get up and walk over, and sit down by Ieuan. Nobody says anything about it at either fire. Someone hands you a cup. You do not understand a word of the song. By the end of it you know the tune, and you understand a little better what it is like to be Welsh in this army.`, () => (has('ieuan') ? { eye: 1 } : { item: 'ieuan' })] }
], { thread: 'ieuan' });
scene('e_ieuan_sister', 'eve', 'A name in Gwent', `Ieuan wants you to learn a name. 'Gwenllian,' he says. 'Say it.' You say it. 'No. Again.' She is his sister, at Llantilio, and his pay has gone to her every quarter for eleven years. If he is not there to draw it tomorrow night, somebody must tell the paymaster where it goes. He has asked no one else. 'The English cannot say it,' he says. 'You are at least trying.'`, [
  { t: 'Learn it, and swear to it',
    out: [`You say it until he stops wincing. He nods, and pushes a bundle of shafts across to you, as a fee. 'She will ask if I suffered,' he says. 'Say no. Say I was talking at the time. She will believe that.'`, { wits: 1, ar: 1 }] },
  { t: 'Tell him he can say it to the paymaster himself', test: ['wits', 7, 'talk'],
    win: [`'I intend to,' Ieuan says. 'I intend to be very old. But I intended to be rich as well.' He laughs. Then he shows you, by way of thanks, how he means to stand tomorrow when the horse come, and where he wants you.`, () => (S.flags.horsecraft ? { heal: 1, eye: 1 } : { flag: 'horsecraft', say: 'You know what a charging horse will and will not do. Standing against one will go better.' })],
    lose: [`He waits, with patience. 'I asked you to learn a name,' he says. You learn it.`, {}] },
  { t: 'Ask what she is like',
    out: [`'Like me,' he says, 'but she listens.' He tells you about her for some time. She keeps bees. She has buried two husbands and thinks poorly of a third who is courting her. When he has finished, you know Llantilio better than you know parts of Winchester.`, { wits: 1 }] }
], { thread: 'ieuan', when: () => has('ieuan') });

/* ---- Cutler ---- */
scene('s_cutler_roll', 'soton', 'Cutler cannot read', `The paymaster's clerk has the twenty's first wages counted out on a board, and Cutler is to make his mark for them. He holds the roll as he would hold something he did not want to drop. You have kept a tally for three years. From where you stand you can see that the clerk has written nineteen names and is paying for nineteen, and that Cutler is about to put his mark to it.`, [
  { t: 'Step up beside him and count the names under your breath', test: ['wits', 7],
    win: [`'Nineteen,' you say, as if to yourself. Cutler's hand stops. He looks down the roll, at the shapes of it, and then at the clerk. 'Count it again,' he says. The clerk finds the twentieth name very quickly. Cutler does not thank you. Next pay day he calls you over before he makes his mark, as if he had always done so.`, { st: 2 }],
    lose: [`You say it too loudly. Cutler has been shown up before a clerk by his own newest man. He gets the twentieth wage, and you get the look that goes with it.`, { st: -1, c: 2 }] },
  { t: 'Call the clerk a thief, in front of the whole quay', test: ['grit', 8],
    win: [`The clerk goes white and then red. A serjeant-at-arms comes over to see what the noise is. The twentieth wage appears on the board, and so does a shilling, to make the noise stop. Cutler pockets the shilling for the twenty and gives you sixpence of it later, without a word.`, { c: 6 }],
    lose: [`The clerk has a serjeant-at-arms within call, and clerks are believed before archers. You are walked off the quay by the collar. The twenty is paid for nineteen.`, { b: -1 }] },
  { t: 'Keep out of it. It is not your wage.',
    out: [`Cutler makes his mark. Somebody in the twenty goes short that week, and finds out why on the next pay day, and Cutler finds out with him. You watch him work it out.`, {}] }
], { thread: 'cutler' });
scene('h_cutler_storm', 'harfleur', 'Two names', `The Earl of Huntingdon is to storm the barbican, with bundles of brushwood to fill the ditch and fire arrows to burn the timber. Every vintenar is to send two men to carry. It is the worst duty of the siege. Cutler has his tally stick out and is turning it over. He has seen the look on you and has asked you once before why you look at men as if you had buried them already. 'Two names,' he says. 'Help me.'`, [
  { t: 'Give him your own', test: ['grit', 9, 'melee'],
    win: [`You go in under a hurdle with a bundle of brushwood on your back and men dropping on either side of you. The ditch is filled. The barbican burns all night. You come back with your eyebrows gone and a French gauntlet you do not remember taking. Cutler cuts no notch for the twenty that day.`, { st: 2, arm: 1 }],
    lose: [`You get the bundle to the ditch. Then something comes off the wall, hot, and the next thing you know you are being dragged back by the heels. The barbican burns without your help.`, { b: -2, st: 1 }] },
  { t: 'Give him Reeve', if: reeveMet,
    out: [`Cutler's eyes rest on you for a moment. 'Aye,' he says. 'I'd thought of him.' Reeve goes, and comes back, as his kind always seems to, with a French sword and a burn across his hand. He has been told who named him. He lifts the sword to you across the trench, as if he were drinking a health.`, { flag: 'reeve_enemy', echo: { at: 'march', t: 'Reeve marches behind you now, always behind. He has not forgotten the barbican.' } }] },
  { t: 'Tell him to draw lots, as you would for the last of the bread',
    out: [`'Lots,' Cutler says. 'So God picks, and not me.' He thinks about it. Then he puts the stick away and calls the twenty together, and holds out a fist full of straws. He draws first himself, and draws long.`, { st: 1 }] }
], { thread: 'cutler' });

/* ---- Reeve ---- */
scene('s_reeve_dice', 'soton', "Reeve's game", `Reeve is playing hazard with Perkin on an upturned bucket. Perkin has lost his knife and his spare hose and is now staking Thursday's bread. Reeve is patient with him, and kind. He explains the odds each time, and they come out wrong each time. The dice are bone, yellow with handling, and one of them does not roll so much as settle.`, [
  { t: 'Pick up the dice and call them crooked', test: ['eye', 8],
    win: [`You drop the slow die into a cup of ale. It turns over and floats six-up, like a dead fish. Nobody laughs. Reeve gives Perkin back the knife and the hose with a small bow, and he gives you a long, friendly, attentive look.`, { st: 1, flag: 'reeve_stood' }],
    lose: [`You say it, and then you cannot show it. Reeve has changed the dice with a movement you never saw. He invites the whole twenty to try them. They are perfectly true. Then he invites you behind the fish sheds.`, { b: -1, flag: 'reeve_stood' }] },
  { t: "Offer to throw for Perkin, and bring Cutler's own die", know: 'k_dice',
    out: [`You know where Cutler keeps the bone die with the patient six. You borrow it for the length of one game. Reeve loses everything he has won, and then some. He recognises the die on the third throw and cannot say so, for it is the vintenar's. He pays out like a man swallowing nails.`, { c: 6, flag: 'reeve_stood' }] },
  { t: 'Let the boy lose. It is cheap schooling.',
    out: [`Perkin loses the bread, and Friday's. He learns something from it, but not what you hoped he would. He learns that Reeve is the man to go to when he is short.`, { flag: 'reeve_paid', echo: { at: 'harfleur', t: 'Reeve has been lending to Perkin since Southampton. He does not call it that, and Perkin does not call it anything.' } }] }
], { thread: 'reeve', when: perkinHere });
scene('h_reeve_deal', 'harfleur', "Reeve's trade", () => `You come back from the wall by the short way and find Reeve behind the gabions with a Lancashire vintenar. He has four sheaves of the twenty's arrows across his arm, and coin is changing hands. He sees you. He does not stop. 'Ours are spoiling in the wet,' he says pleasantly. 'This gentleman has dry storage.' ${S.flags.reeve_stood ? `'You've a habit of being where you're not wanted.'` : `'There's one in it for you.'`}`, [
  { t: 'Take the sheaves back', test: ['grit', 7, 'melee'],
