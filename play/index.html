    out: [`You get him by the front of his jack. Left of the banner, you tell him. A long way left. The Earl is twenty-one and has something to prove, and he will be dead before noon, and so will every man who is near enough to see it happen. 'Who told you that?' Dickon says. Nobody told you. He looks at your face for some time. 'Left,' he says at last. 'Christ. You're worse than Mother.'`, { flag: 'dickon_safe', say: 'Dickon will stand clear of the banner.' }] },
  { t: 'Go to the rear, with the baggage guard', if: () => !S.flags.cutler_knows,
    out: [`A man is wanted to go back to Maisoncelle and stand over the carts with the pages and the sick. Cutler is looking along the twenty for somebody he can spare. You step out before his eye has reached you. He says nothing for a moment. 'Aye,' he says then. 'Go on.' Nobody in the twenty looks at you as you go, and that is worse than if they had.`, { flag: 'baggage', say: 'You are posted to the baggage, a mile behind the line.' }] },
  { t: 'Take the Host, and keep to yourself',
    out: [`The priest is an old man with rain running off his nose, and he puts the wafer on your tongue without looking to see who you are. You have taken it on this day before. You do not know what that makes of it, or of you. You stay on your knees until the men either side have got up. Then you get up too, and see to your bow.`, { grit: 1, heal: 1 }] }
], { base: 'b_wait' });
scene('b_dawn_b', 'battle', 'Three hours', () => `The army forms across the wheat between the two woods, and then it stands. It stands for three hours by the church bell at Maisoncelle, in mud that is already over the ankle. The French are a thousand paces off and in no hurry at all. You can see men sitting down over there, and somebody eating. They have the numbers, and the road, and the whole of the day.

${S.flags.centre
    ? `Cutler has walked you along to the wedge of archers beside the King's own battle and left you there, among strangers who have been told that you will stand. 'Don't make a liar of me,' he said. The King's banner is forty paces to your left. The man under it has not once sat down.`
    : `The twenty is on the right of the line, under the Duke of York, with its back to the Tramecourt wood. The King's banner is in the middle, a long bowshot to your left. It looks as if it belonged to some other battle.`}

It is the King who ends the waiting. If they will not come to him, he will go to them. The order runs down the line, and every man kneels, cuts a cross in the earth, and puts a crumb of it into his mouth. Then five thousand archers pull up their stakes and walk forward into long bowshot of the French.`, [
  { t: 'Kneel with the rest and take the earth on your tongue',
    out: [`It is cold, and it grits between your teeth. Five thousand men are doing the same, and for a moment the only sound on the field is the rain. You swallow it. A man who has eaten his own grave, you find, has rather less to be afraid of.`, { flag: 'earth', say: 'For today, tests of Grit will go a little better.' }] },
  { t: 'Use the halt to get your stake in deep and angled true', test: ['arm', 5, 'labour'],
    win: [`The line halts at long bowshot, and you have your stake in before the men on either side have their mallets out: butt deep, point at the height of a horse's breast, and the whole of it leaning towards France. You put your knife to the point again. Then you step out in front of it, as you were taught, so that what the horses see is a man.`, { flag: 'stakeset', say: 'Your stake is set true. Standing against the horse will go a little better.' }],
    lose: [`The ground takes the stake as porridge takes a spoon. It goes in, and then it leans. You tread the mud down round it and tell yourself that a horse will not know the difference.`, {}] },
  { t: 'Ask Cutler to put you in the centre', know: 'k_centre', if: () => !S.flags.centre, test: ['wits', 5, 'talk'],
    win: [`He hears you out. 'The middle,' he says. 'By the King. Where there's no wood to get behind, and every Frenchman on that field is trying to get to.' You say yes. He regards you as he would a horse that had asked to be ridden. Then he walks you along the line himself and speaks to Erpingham's serjeant. 'I'll want that explained,' he says, 'if there's an afterwards.'`, { flag: 'centre', say: "You stand by the King's battle." }],
    lose: [`'I've twenty men to put where they'll do least harm,' Cutler says, 'and you're one of them, and this is where.' He has turned away before you can try again.`, {}] }
], { base: 'b_dawn', enter: () => { if (S.standing >= 6 || S.flags.cutler_knows) S.flags.centre = 1; } });
scene('b_order_b', 'battle', 'What the King says', () => `${S.flags.purse_lost ? `Whatever you sent back on the carts has gone with the carts. ` : ''}${S.flags.hero ? `Somebody of the household has put the King's own cup into your hand, with wine in it, and you are holding it as you would hold a bird. ` : ''}It is over, or it seems to be. Two French battles lie where they stood. The third is at the far end of the field on its horses, neither coming on nor going away. The prisoners have been gathered behind the line with their helmets off, hundreds of them, more than the men who took them.${S.flags.prisoner ? ' Yours is there, the squire whose father has forty crowns, trying not to be noticed.' : ''}

Then a cry comes up from the rear that the French are in the baggage, and in the same moment the third battle begins to move. The King looks at the one, and then at the other, and gives an order. The men-at-arms will not carry it out, since a prisoner is a year's rents to any of them. So it is given to the archers, who have no ransoms to lose. Two hundred are told off for it, and Cutler's twenty is among them.`, [
  { t: 'Do as you are ordered',
    out: [`You do as you are ordered. It does not take long. You keep your eyes on your hands. Afterwards the third battle turns its horses and rides off the field without a blow, so that none of it was needed, and every man there knows it, and nobody says so.`, { unflag: 'prisoner' }] },
  { t: 'Put your knife away and stand aside', test: ['wits', 5, 'talk ransom'],
    win: [`You put the knife back in its sheath, where the esquire can see you do it, and you stand with your hands empty. Cutler sees it as well. He walks across, quite slowly, and stands in front of you with his back to you, and begins to shout at Hodge about something else entirely. Nobody comes for you. Within the hour the order is countermanded, and those who are left are marched to the rear.`, { grit: 1, flag: 'spared' }],
    lose: [`The esquire has seen men refuse before, and he has a way with them. You are on your face in the mud before you have finished shaking your head. By the time you can get up it has been done without you.`, { b: -1 }] },
  { t: "Cut your own man's bonds and point him at the wood", if: () => S.flags.prisoner,
    out: [`You cut the cord at his wrists and turn him to face the trees. He looks at you, and at the knife, and understands. Forty crowns goes off into the Tramecourt wood at a shambling run. Ieuan has watched the whole of it. 'That was a dear morning's work,' he says. Then the esquire comes round, and Ieuan finds that he needs to look very hard at something in the other direction.`, { c: -12, unflag: 'prisoner', flag: 'mercy' }] }
], { base: 'b_order', enter: () => { if (!M.known.k_baggage) { M.known.k_baggage = 1; S.lessons += 1; M.knownAt = M.knownAt || {}; M.knownAt.k_baggage = 'The order'; } if (S.flags.purse_back && !S.flags.purse_lost) { S.flags.purse_lost = 1; S.coin = 0; } } });

/* ================= v0.21: second versions of the reason-for-enlisting scenes ================= */
scene('home_s_debt_b', 'soton', 'The bond', `Master Geoffrey has been cleverer than to send a man. He has lodged the bond with the clerk who pays the retinue, so that a third of your wages may be stopped at the board and sent to Winchester before you have so much as touched them. The clerk reads it out to you, in front of the queue, in the voice of a man reading a recipe. Forty shillings, with your mark at the bottom. You had forgotten how small your mark was.`, [
  { t: 'Let him stop four pence now, and have it written on the bond', cost: 4,
    out: [`The clerk writes it on the back: four pence received. He blows on the ink. It is a flea bite out of forty shillings. All the same, it is in a clerk's hand and under a seal, where Master Geoffrey cannot say it was never paid, and you find you stand a little straighter in the queue.`, { wits: 1, flag: 'paid' }] },
  { t: "Tell him an apprentice's bond has no hold on the King's wages", test: ['wits', 8, 'talk'],
    win: [`You have no notion whether it is true. You say it as if you had read it somewhere. The clerk, who does not know either, looks at the length of the queue and decides that he does not care to find out. He pays you in full. Cutler, three places back, says only, 'Never argue law with a man who is busy,' and sounds as if he approves.`, { st: 1 }],
    lose: [`The clerk does know. He tells you, at some length, and the queue learns with interest that the cobbler's boy owes his master forty shillings. Reeve, at the back, has begun to look at you the way an orchard thief looks at a fruit tree.`, { st: -1, pull: ['reeve', 2] }] },
  { t: 'Ask who brought it down from Winchester',
    out: [`Hamo, the journeyman, who sat across the bench from you for three years. He would not stay to see you. But he left a word with the clerk, who gives it to you without interest: your mother is well, she has taken in washing, and you are to keep your feet dry. You take your pay, short as it is, and go and look at the sea for a while.`, { grit: 1 }] }
]);
scene('home_h_debt_b', 'harfleur', 'The drumhead', `When a man dies of the flux his kit is sold at the drumhead to settle what he owed, and whatever is left goes home to his people. Today it is Wat's. His bow fetches two shillings and his jack eightpence. His boots fetch nothing, since they are past selling. You watch the whole worth of a man cried up and knocked down in the time it takes to say a Paternoster, and it comes to three shillings and fourpence. You owe forty.

At the back of the crowd a sutler is buying archers' arrears for ready silver, at eight pence in the shilling, from men who have just done the same sum.`, [
  { t: 'Sell him a month of your arrears',
    out: [`Ten pence tonight, against fifteen that the King may or may not pay in Calais. He writes your name under a column of others. You notice that some of the names above yours have a line through them, and that he has not troubled to rub them out.`, { c: 10, flag: 'sold' }] },
  { t: "Buy Wat's boots for a farthing, and make them worth something", test: ['wits', 6],
    win: [`Nobody else can see what is wrong with them, and you can: the uppers are sound, and the rest is an afternoon's work. You resole them with a strip off a dead horse's girth and sell them the same week to a man-at-arms for eightpence. It is the first money you have made in France out of your own trade, and it will not be the last.`, { c: 8, eye: 1 }],
    lose: [`The uppers come apart in your hands. Wat got the last of the wear out of them, as he got it out of everything.`, {}] },
  { t: 'Keep your paper, and keep your mouth shut', test: ['grit', 6],
    win: [`You walk away from the sutler with your tally still in your shoe. It buys nothing. But a King who hangs men for robbing churches will pay his archers in the end, or so you tell yourself, and you go on telling yourself until you believe it.`, { arm: 1 }],
    lose: [`You hold out until the meat runs short. Then you go and find him, and the price is seven pence in the shilling by then.`, { c: 6, flag: 'sold' }] }
]);
scene('home_m_debt_b', 'march', 'Rotten harness', `The rain has got into the harness. Girths are parting and pack saddles are coming unstitched, and the master of the King's baggage has sent down the column for any man who can sew leather. He finds three: a saddler's boy from York, a glover, and you. There is a night's work in it, under a cart, by lantern. He is in no position to argue about the price, and for the first time since Winchester somebody needs your trade more than you need his money.`, [
  { t: 'Name a shilling, and take it',
    out: [`You say it as if it were the usual thing. He pays without a word. Waxed thread, a saddler's stitch, every seam double. Twelve pence, for work Master Geoffrey would have charged four for and kept three of. You count it twice in the dark, and for a moment you understand your master very well.`, { c: 12 }] },
  { t: 'Do it for nothing, and let him owe you',
    out: [`He asks your name and your captain's, and writes them on his tablet. Two days on, a serjeant of the household comes to find Cutler, and asks which one is the cobbler, and looks at you, and goes away again. 'You're being collected,' Cutler says. He does not seem to mind.`, { st: 2 }] },
  { t: 'Ask for the offcuts of the good leather', if: () => !has('boots'),
    out: [`There is half a hide of Cordovan left over, cut for the King's own saddles. He gives it to you as he would give away something he had no further use for. You sit up and resole your own boots with it, properly, with a welt. You walk the rest of the way to Calais on leather that was meant to go under a king.`, { item: 'boots' }] }
]);
scene('home_s_girl_b', 'soton', "The carrier's cart", `The Winchester carrier leaves from the Bargate on Thursdays, and this is the last Thursday before the fleet sails. He will take a letter for a penny, if it is written and sealed. He can write, too, after a fashion, and will do it for you on the tail of his cart with half the street listening. He knows her father. He knows everybody's father. Whatever you send will be read aloud in the shop before she is allowed to hold it.`, [
  { t: 'Tell her the truth: that you are afraid', cost: 1,
    out: [`He writes slowly, with his tongue between his teeth. That you do not know what you are going to. That you would sooner be at the bench. That you mean to come back, for all that. The street has gone quiet to listen. When he has sealed it he says, 'I'll put it in her own hand, lad. Never mind the old man.' You had not thought a carrier could be kind.`, { grit: 1, flag: 'wrote' }] },
  { t: 'Have him write to her father instead, with the figures', cost: 1, test: ['wits', 7, 'talk'],
    win: [`Sixpence a day. A third share of plunder. Ransoms, by the King's own ordinance. The carrier whistles as he sets it down, and adds it up at the bottom without being asked. It reads like a bill of sale. You think that is very likely the one kind of letter her father will read twice.`, { grit: 1, flag: 'wrote_father' }],
    lose: [`Said aloud on a cart tail, in front of the street, it sounds like a boy bragging. The carrier writes it down exactly as you say it. You pay your penny and wish that you had it back.`, { flag: 'wrote_father' }] },
  { t: 'Send her nothing. She knows.',
    out: [`You stand by the cart until it goes, with the penny in your fist. If she knows, there is no need of a letter, and if she does not, a carrier's spelling will not mend it. You watch him out of sight up the Winchester road. By the time he has gone you are a good deal less sure.`, {}] }
]);
scene('home_h_girl_b', 'harfleur', 'A man from the Soke', `The ships that bring biscuit have brought a few new archers to fill the gaps, and one of them is from Winchester: a fuller's son from the Soke who knows your street. He gives you the news without being asked, as men from home do. The pewterer in Jewry Street, the widower with the two apprentices, has been seen at her father's door three times. There is talk of Michaelmas. He has it from his sister, who had it at the conduit.

Then he gives you a message from Alys herself, got to him by way of the same sister. The candle was for the dark, and you were to use it.`, [
  { t: 'Give him every penny you have, to send back with the ships', if: () => S.coin > 0,
    out: [`He has a cousin among the sick who is being shipped home. You count it into his hand, all of it, and he looks at the heap and then at you. 'For her?' For her. He ties it into his shirt. It will be in Winchester before Michaelmas. It is not what a pewterer could send. But a pewterer has never yet sent everything he had.`, () => ({ c: -S.coin, grit: 1, flag: 'sent' })] },
  { t: 'Light the candle',
    out: [`You light it in the bottom of the trench, with your hood held round it. It burns for about as long as a Mass, and for that long the trench is a room. Hodge asks what you are at. You tell him you are reading. He does not ask what.`, { heal: 1, flag: 'candle_lit' }] },
  { t: 'Ask him nothing more, and go back to the trench',
    out: [`You thank him. You are civil about it. Then you go up to the forward trench, where the garrison's crossbows can reach, and you dig there for the rest of the day with your whole back, in plain sight of the wall. Ieuan comes and digs beside you for a while and says nothing at all.`, { grit: 1 }] }
]);
scene('home_m_girl_b', 'march', 'The ribbon', () => `Somewhere along the Somme the ribbon has come off your wrist. You find it gone at a halt: a white band of skin under the bracer, where it had been wound since Southampton, and nothing on it. Michaelmas was a fortnight ago, and you spent it wading a marsh. You do not know whether she waited. You had not thought that a strip of faded cloth was all that was keeping the question shut.`, [
  { t: 'Go back along the column and look for it',
    out: [`You walk two miles back down the road, against eight thousand men, looking at the ground. You find it on a thorn by a ford, where you took the bracer off to drink. You walk the two miles forward again at something near a run, and reach the twenty as it is moving off. Ieuan looks at the ribbon and at the sweat on you. 'Ah,' he says. 'She waited, then.' You say you do not know. 'No,' he says. 'But your legs do.'`, { arm: 1 }] },
  { t: 'Tell yourself it was only a ribbon',
    out: [`You say it to yourself until it stops catching. A pewterer, with a shop. Very well. You march that day like somebody with nothing left to be careful for. At the fire Hodge holds something out to you between two fingers. 'This yours? It was on a thorn at the ford.' You take it, and wind it on again, and neither of you says anything about your face.`, { grit: 1 }] },
  { t: 'Tell Perkin', if: () => perkinHere(),
    out: [`Perkin puts his hand inside his jack and brings it out. He found it at the ford. He has had it for a day and a half, waiting to see how long it would take you to notice. 'A day and a half,' he says. 'I'd have known in a minute, if it was mine.' You ask him what that is supposed to mean. 'Means you're surer of her than you let on,' he says. For a baker's boy, he sees a good deal.`, { wits: 1 }] },
  { t: 'Tell Ieuan', if: () => !perkinHere(),
    out: [`'Lost it?' Ieuan says. He feels in his bag and brings it out: he saw it come off at the ford and picked it up, and has been waiting to see whether you would ask. 'A man who was done with her would not have looked so sick,' he says. 'And a girl who was done with you would have asked for the candle back. Wind it on again, and tie it this time.'`, { wits: 1 }] }
]);
scene('home_s_brother_b', 'soton', 'The butts at West Quay', `You do not have to look for Dickon. Suffolk's archers are shooting for ale at the West Quay butts, and he is the one standing on a barrel, calling the odds. He is broader than when he left home, with a scar through one eyebrow. He sees you over forty heads and stops in the middle of a word. Then he gets down.

'Well,' he says, when he has reached you. 'She's sent the cobbler to fetch me home. Tell her I'm busy.'`, [
  { t: "Tell him you have taken the King's sixpence yourself", test: ['grit', 7],
    win: [`He looks at the bow on your back, and at the bracer on your arm, which is his own old one. 'You haven't.' You have. He swears, at length and with real feeling. Then he takes you by the back of the neck, as he did when you were six, and walks you to the ale. 'You stand behind somebody big,' he says. 'Every time. Swear it.'`, { wits: 1 }],
    lose: [`It comes out as something between a boast and an apology, with your voice going up at the end. He laughs, not unkindly. So do the forty.`, {}] },
  { t: 'Put a penny on yourself against him, in front of his company', test: ['arm', 8, 'shoot'],
    win: [`Six arrows each, at ten score. He beats you, as he was always going to. But it is five to four, and your fourth splits the peg, and Suffolk's men make a noise about it that he has to pretend to enjoy. He pays you your penny out of his own purse. 'Who's been teaching you?' A Welshman, you say. 'Then stick to him like a burr.'`, { grit: 1, st: 1 }],
    lose: [`You overdraw, trying to match him, and something gives in your back. Six to one. He will not take the penny. 'Mother would have my hide,' he says, and for a moment the pair of you are ten years old on the green.`, { b: -1 }] },
  { t: 'Get him alone, and make him swear off the water at Harfleur', know: 'k_dickon',
    out: [`You take him round behind the butts. The ditch water, you tell him. The first week of September. Drink beer, or drink nothing. He starts to laugh and then looks at you properly, and stops. 'What's Harfleur?' he says. Nobody on this quay has been told yet where the fleet is bound. You tell him to swear it. He swears, on the bracer, mostly to get away from your face.`, { flag: 'dickon_warned' }] },
  { t: 'Give him her message, and go',
    out: [`You say what your mother told you to say. He says what a man says back to that, in front of his friends. He climbs up on his barrel again. You walk back along the quay with his bracer on your arm, and it fits no better than it did.`, {}] }
]);
scene('home_s_pardon_b', 'soton', 'The muster of the pardoned', `There are a dozen pardoned men in the retinue, felons serving out their crimes, and at the muster the clerk reads the list of them aloud, crime and all, so that no captain can afterwards say he was not told. He comes to you. 'For the death of Walter the tanner, at Winchester.'

Forty paces off, in another company's line, a big man with hands stained brown to the wrist turns his head. He has his brother's jaw. He does not stir from his place. He only watches you, as one watches a job that is to be done properly when there is time.`, [
  { t: 'Go to him when the muster breaks, and tell it as it happened', test: ['grit', 7],
    win: [`You tell Hawkin all of it: the cup, the word, the knife that was in your hand before you knew you had drawn it, the three days. He hears it without moving. 'Wat was always quick with his mouth,' he says at the end. He has not forgiven you. But he walks away slowly, and he looks back once.`, { wits: 1, flag: 'hawkin_heard' }],
    lose: [`Your voice shakes, and what should have been a plain account comes out as begging. He hears it to the end. Then he spits by your foot. 'Tell the priest,' he says. 'He's paid to listen.'`, {}] },
  { t: 'Send four pence across by a boy, for Masses', cost: 4,
    out: [`You watch the boy cross the heath and put the coins into the brown hand. Hawkin looks at them for some time. Then he closes his fist. The boy comes back with a message: that will do for the nails. You cannot tell whether you have paid something or only insulted him, and you doubt that he can tell either.`, { flag: 'hawkin_paid' }] },
  { t: 'Learn his company, his billet and his walk, and keep clear of all three', test: ['wits', 7, 'sneak'],
    win: [`By the end of the week you know where his vintenar musters, and when, and you are never there. You can pick out his walk at a furlong. It is no way to live. All the same, it teaches you to look at a quay full of men as a hare looks at a field.`, { eye: 1 }],
    lose: [`He is slow, and he is patient. One evening he is simply there, behind the fish sheds, when you come round them. He does not use a knife. He wants you fit to march.`, { b: -1 }] }
]);
scene('home_h_pardon_b', 'harfleur', 'The trench on the left', () => `Word comes along the lines that the flux is in the company on your left, and that they are leaving their sick where they fall, for want of men to carry them. You go and look. You do not ask yourself why.

Hawkin is at the bottom of their trench with his back against a gabion and his hose round his ankles, too weak to shift himself out of the wet. ${S.flags.hawkin_heard ? `He looks up. 'You,' he says. 'The one who told it straight.'` : `He looks up. His hand goes to his knife, and has not the strength to draw it.`}`, [
  { t: 'Get him out of the wet, and nurse him yourself', test: ['grit', 7, 'flux'],
    win: [`You get him on to a dry board and bring him boiled water twice a day for a week, and you clean him, since there is nobody else to. Neither of you speaks. On the seventh day he stands up by himself. 'I'll not thank you for it,' he says. 'But I'll not come looking for you, neither. That's all you get.' It is a great deal more than you had.`, { flag: 'hawkin', arm: 1 }],
    lose: [`You nurse him, and he lives. By the time he can stand you have the first cold gripe of it in your own gut, and he sees you bend. 'There,' he says, without malice. 'Now it's cost us both.'`, { flag: ['hawkin', 'exposed'] }] },
  { t: 'Give him your tormentil root', if: () => has('root'),
    out: [`You put it into his hand and tell him to chew it. He looks at the root, and then at you, for a long time before he puts it in his mouth. He is on his feet within the week. He does not come near you. But now and then you catch him watching you across the lines, and he has stopped looking as if he were measuring you for something.`, { drop: 'root', flag: 'hawkin' }] },
  { t: 'Fetch a priest to him, and kneel while he is shriven',
    out: [`You find a chaplain and bring him. You kneel in the mud at the far end of the trench, where Hawkin can see you, and you say the responses. His brother's name is in it. They ship him home on the Thursday with the rest of the sick, and you never learn whether he got there.`, { grit: 1 }] },
  { t: 'Leave him where he is',
    out: [`You go back to your own trench. He dies two days later, among men who did not know his name. Nobody will come for you now. You had thought that would feel like a pardon, and it feels like nothing of the kind.`, {}] }
]);
scene('home_m_pardon_b', 'march', 'A chest in the river', `The Chancery clerk who keeps the roll of pardoned men lost a chest of his papers at the crossing of the Somme. He is making the roll up again at the halts, from memory and from what men tell him, and he trusts neither. Every man on it must be sworn for afresh by his captain, or pay for a new entry, or go without. He reaches the twenty with his board on a cart tail and his temper in rags. Your name, he says, was in the chest.`, [
  { t: 'Ask Cutler to swear to you', test: ['wits', () => 9 - Math.min(4, S.standing), 'talk'],
    win: [`Cutler comes over and looks at a page he cannot read. 'What's he want? That one? He's served since Southampton. He's serving now. He mends my boots. Put him down.' The clerk puts you down. Cutler stays until the ink is dry. Walking back he says, 'I don't want to hear what it was.' And then, ten paces on: 'Did the man have a knife of his own?'`, { flag: 'pardon_roll' }],
    lose: [`Cutler listens to the end. 'I'll swear to a man when I know what I'm swearing to,' he says. 'I don't know that yet, with you.' The clerk has already turned to the next.`, {}] },
  { t: 'Pay for a fresh entry', cost: 6,
    out: [`Sixpence. He writes your name, and 'served', and the date, and sands it. He spells it a fourth way. You do not correct him. It is on the roll, and the roll is in a dry chest this time, and that will have to do.`, { flag: 'pardon_roll' }] },
  { t: 'Let your name stay in the river',
    out: [`You stand in his queue for a time, and then you step out of it. A pardon is for a man who has a life to take up again. You look at your hands, and at the road, and find that you are not sure any longer what sort of a life you have.`, { grit: 1 }] }
]);
scene('home_s_vow_b', 'soton', "The shoemakers' Mass", () => `The cordwainers of Southampton keep a Mass for their saints at the side altar by the West Gate, and you have come to it, as you promised you would. You stand at the back among men of your own trade who do not know you. The two painted brothers hold their lasts and look at nothing.${M.runs >= 1 ? ' You have stood under this paint before. It is not a good likeness.' : ''} When it is over, the warden of the guild comes round with a box for the lights. He looks at the awl in your belt, and then at you.`, [
  { t: 'Put four pence in the box', cost: 4,
    out: [`It is more than the masters have given, and the warden's eyebrows say so. He lights a taper with it and sets it between the two saints. It burns straight up, in a church that is all draughts.`, { flag: 'vow_altar', grit: 1 }] },
  { t: "Offer the warden a day at his bench, in place of silver",
    out: [`He takes you at your word, being short of a journeyman. You sit in his shop on the High Street and close uppers until the light fails. He looks over your stitching and finds nothing to say against it, which seems to annoy him. 'They'd sooner have that than a candle,' he says, as he lets you out. 'They were working men.'`, { flag: 'vow_altar' }] },
  { t: 'Stay behind when the others have gone, and ask them what they want',
    out: [() => M.runs >= 1 ? `You have asked it before, in other churches, and in a low room that smells of wax. The paint says nothing. But you know by now that you are heard, and that whatever the answer is, it is waiting for you in France.` : `You ask it aloud, to the paint, in an empty church. Nothing answers. You had not really thought that anything would. You are only at the beginning of learning what kind of creditors you have.`, { wits: 1 }] }
]);
scene('home_h_vow_b', 'harfleur', "Mall's shoes", `A parcel comes for you with the biscuit ships: a pair of child's shoes, worn through at the toe, and a line in the parish priest's hand. Mall is walking. She has worn these out since Lammas. Your mother asks whether you will mend them, since she says that nobody else's work will do. And she asks, through the priest, what it was that you promised: for the child says that on the worst night of the fever you sat by her bed until morning, talking to somebody who was not in the room.`, [
  { t: 'Send home all you have, for the physician', if: () => S.coin > 0,
    out: [`You put every penny into the toe of one shoe and send the pair back as they came, by a sick man bound for Southampton. It was not a physician who mended her, as you have good reason to know. But his fee will let your mother sleep, and that is worth the silver.`, () => ({ c: -S.coin, grit: 1 })] },
  { t: 'Mend the shoes, and send word that you promised nothing', test: ['wits', 6],
    win: [`You resole them in the trench, small close work, and have a chaplain write the rest: that you were praying, as anybody would, and that the child was dreaming. It reads very well. You have now lied to your mother through two priests, and nothing has fallen on you. The saints are in no hurry. You are beginning to understand that about them.`, { eye: 1 }],
    lose: [`The chaplain writes it down, and reads it back to you, and then looks at you over the top of the page. 'Nothing?' he says. 'You are quite sure it was nothing?'`, { sus: 1 }] },
  { t: 'Mend the shoes, and tell the saints the account is square',
    out: [`You sew the last stitch and say it aloud, to the trench: she is walking, and I am here, and we are quits. Nothing answers you. That night you dream of a bench, and two backs bent over it, and one of them shakes his head without turning round.`, { wits: 1 }] }
]);
scene('home_m_vow_b', 'march', 'How they died', `There is a cobbler following the army with his tools on his back, mending for his bread, and he is from Soissons. That is the saints' own city, where the two of them were put to death. A year ago the King of France's men stormed it and sacked it for three days, the churches with the rest, and hanged the English archers of the garrison from the walls. He tells it without heat, as he would tell you the price of leather. In Soissons, he says, they think the saints will want that answered for. Their feast is on the twenty-fifth of this month.`, [
  { t: 'Hire him for the day, and listen while he works', cost: 3,
    out: [`You put him to the twenty's boots and sit beside him with your own awl. He has a way of locking a welt that you have never seen, and he shows it to you without being asked, one tradesman to another. By the end of the day the twenty has dry feet, and you have learned a stitch from the saints' own town.`, { flag: 'vow_soissons', st: 1 }] },
  { t: 'Ask him how the saints died',
    out: [`'Slowly,' he says. 'They hung millstones on them and threw them in the Aisne, and they floated. They boiled them, and they would not boil. In the end it was the sword.' He bites off a thread. 'In Soissons we say they were hard to finish, since their work was not yet done.' He looks up at you. 'You have gone a strange colour, friend.'`, { flag: 'vow_soissons', wits: 1 }] },
  { t: 'Walk on. Soissons is no business of yours.',
    out: [`'No,' he says. 'Hired men, those archers. Like you.' He shoulders his tools. 'So were the saints, come to that. They worked for their bread.' He falls back along the column, and you do not see him again.`, {}] }
]);
