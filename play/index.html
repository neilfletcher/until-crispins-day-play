    out: [`You take the rag and put it inside your jack, over your heart. You tell him you will put it in her hand yourself. It is an odd thing to feel, in the rain, with all the chivalry of France over the hedge, that you have something you must not die before doing.`, { grit: 1 }] },
  { t: 'Tell him to carry it to her himself', test: ['wits', 8, 'talk perkin'],
    win: [`'Take it to her yourself,' you say, 'and tell her the cobbler's boy says her loaves are heavy.' He laughs, properly, for the first time since Harfleur, and ties the rag back on his belt. He stands straighter after that.`, { flag: 'bond', say: 'Perkin will keep close to you.' }],
    lose: [`It comes out harder than you meant. He nods, and puts the rag away, and goes to find someone kinder.`, {}] },
  { t: 'Tell him the truth: you have watched him die', if: () => M.runs >= 2,
    out: [`You tell him. All of it: the quay, the awl, every way you have seen this night end. He listens with his mouth open. 'So I die,' he says at last. Sometimes, you say. 'And you?' Every time. He thinks about that. 'Then you've had the worst of it,' he says, and gives you half his last walnut, and the pair of you sit in the rain and wait for the day.`, { grit: 1, flag: 'bond' }] }
], { thread: 'perkin', when: perkinHere });

scene('e_erp', 'eve', 'The old knight', `Sir Thomas Erpingham has the ordering of the archers. He is close on sixty, white-haired and bareheaded in the rain, and he is walking the lines himself with a serjeant holding a lantern. He is choosing men for the centre, by the King's own battle, where there will be no wood to fall back on and the horse will come first. He stops in front of the twenty and looks along it.`, [
  { t: 'Stand straight and meet his eye', test: ['grit', 9],
    win: [`He is silent for as long as it takes to say a creed. You do not look away, though you would like to. 'That one,' he says to the serjeant, and moves on. Cutler breathes out through his nose. 'God help him,' he says. 'And you.'`, { st: 1 }],
    lose: [`His eye passes over you as it would over a fence post. There is no shame in it. You tell yourself so several times.`, {}] },
  { t: 'Let him see the bow', if: () => has('yew'),
    out: [`The lantern catches the pale back of the Venetian yew and the old man stops. He holds out a hand for it, tries the draw to his chin, and gives it back with something like respect. 'You can bend that?' Most days, you say. 'Tomorrow,' he says, 'will want to be one of them.'`, { st: 2 }] },
  { t: 'Study your boots until he has gone by',
    out: [`They are good boots. You know every stitch. When you look up he has gone, and taken six better men with him.`, {}] }
], { thread: 'cutler' });

scene('night', 'eve', 'Rain', `It rains from dusk and does not stop. No one has a tent. The King's army lies down in a ploughed field in its harness and lets the water run in at the neck. A bowstring is hemp and glue, and a wet one stretches like wool: tomorrow it will throw an arrow half the distance and with half the weight. All along the lines men are unstringing and stowing the coils wherever they hope to stay dry.`, [
  { t: 'Your waxed spare is already under your cap. Sleep.', if: () => has('string'),
    out: [`You sleep with a hank of hemp between your scalp and your cap and your bow unstrung under your body. When Cutler kicks the twenty awake the string is dry as a sermon. Half the men around you are wringing theirs out and swearing.`, { flag: 'dry', heal: 1, learn: 'k_rain' }] },
  { t: 'You knew it would rain. Your string has been waxed and capped since Péronne.', know: 'k_rain', if: () => !has('string'),
    out: [`You saw to it days ago, while the sky was still clear and the others laughed. The string comes out from under your cap bone dry. Ieuan looks at it, then at you. 'There's a word,' he says, 'for a man who knows when it will rain. They burned the last one in Carmarthen.'`, { flag: 'dry' }] },
  { t: 'Sit up over your bow all night with the string against your skin', test: ['grit', 8], if: () => !has('string'),
    win: [`You do not sleep. You sit hunched like a hen on an egg with the coil in your armpit, and count the hours by the French trumpets. You are grey when the light comes and stupid with cold, but the string is dry.`, { flag: 'dry', learn: 'k_rain' }],
    lose: [`You nod off in the small hours and wake with your face in the furrow and the string in a puddle. You wring it, and wax it, and pray over it, and it is still as slack as a drunkard's promise.`, { flag: 'wet', learn: 'k_rain', say: 'Your string is wet. Shooting will be harder.' }] },
  { t: 'Sleep. A rested man with a damp string beats a ruin with a dry one.', if: () => !has('string'),
    out: [`You sleep, after a fashion, in three inches of water. It is a kind of rest. When you wake your string is as soft as a wet bootlace, and you try not to think what it will do to your cast.`, { flag: 'wet', heal: 1, learn: 'k_rain', say: 'Your string is wet. Shooting will be harder.' }] }
], { place: 'Maisoncelle, the night of 24 October' });

/* ---- the battle ---- */
scene('b_dawn', 'battle', 'The line', () => `They stand you to arms in the dark and you are still standing hours later. Nine hundred men-at-arms on foot in the middle, in three small battles; five thousand archers on the wings and in wedges between; the woods on either hand. Across a thousand paces of wet plough the French fill the whole space between the trees, rank behind rank, and their armour makes the field look as if it has been paved. Nobody moves. A man near you is sick, quietly, down his own front.

${S.flags.centre
    ? `Cutler walks the twenty to its place. Then he takes you by the sleeve and walks you on, to the wedge of archers hard by the King's own battle, where Erpingham has put the men he thinks will stand. 'Asked for by name,' Cutler says. 'I told them they'd regret it.' You can see the King's banner from here, and under it a man in a crowned helm.`
    : `Cutler walks the twenty to its place on the right, under the Duke of York's banner, with the Tramecourt wood at your shoulder. The King's banner is a long bowshot off to your left, in the centre. It looks very far away.`}

At last the King has had enough of waiting. The word comes down the line: 'Banners advance, in the name of Jesus, Mary and St George.' Every man kneels, makes a cross in the mud, and takes a crumb of earth on his tongue. Then they pull up their stakes and walk towards the French.`, [
  { t: 'Kneel with the rest and take the earth on your tongue',
    out: [`It tastes of rain and iron and somebody's wheat. You have eaten worse this month. It is a strange comfort to have your burial in your mouth already, and to find that it can be swallowed.`, { flag: 'earth', say: 'For today, tests of Grit will go a little better.' }] },
  { t: 'Use the halt to get your stake in deep and angled true', test: ['arm', 5, 'labour'],
    win: [`Two hundred paces on, at long bowshot from the French, the line halts and the mallets come out. You drive your stake to the angle Ieuan showed you, breast high to a horse, and work the point sharp again with your knife. Then you step in front of it, as the drill has it, so that the horses see a man and not a hedge.`, { flag: 'stakeset', say: 'Your stake is set true. Standing against the horse will go a little better.' }],
    lose: [`The mud lets the stake in and then lets it lean. You prop it with your foot and hope the horse aimed at you is short-sighted.`, {}] },
  { t: 'Ask Cutler to put you in the centre', know: 'k_centre', if: () => !S.flags.centre, test: ['wits', 5, 'talk'],
    win: [`'The centre,' Cutler says. 'Where the horse come first and there's no wood to run to. You want that.' You say you do. He studies you as he might a die he does not trust. Then he walks you over himself and has a word with Erpingham's serjeant. 'If you live,' he says, 'I'll want to know what that was about.'`, { flag: 'centre', say: "You stand by the King's battle." }],
    lose: [`'You'll stand where you're put,' Cutler says, 'and you're put here.' He has his own twenty to keep alive and no time for a cobbler's fancies.`, {}] }
], { enter: () => { if (S.standing >= 6 || S.flags.cutler_knows) S.flags.centre = 1; } });

scene('b_horse', 'battle', 'The horse', `Erpingham throws his white baton in the air and shouts something that might be 'Now strike', and five thousand bows come up together. The first flight goes over with a sound like a great cloth tearing, and it stings the French into moving. Their horse come first, off both wings, fewer than they ought to be: the plough is so deep the destriers are throwing mud over their own cruppers. But a few hundred armoured horses still shake the ground, and they are riding at the stakes, and at you.`, [
  { t: 'Shoot for the horses, not the men', arrows: 1, test: ['arm', 9, 'shoot cav'],
    win: [`A horse's armour covers its head and chest and nothing behind. You drop your shafts over the first rank on to the rumps of the second, as Ieuan said, and the charge turns into a riot of screaming animals that want only to be somewhere else. They go back through their own foot at a gallop, and the French line that was dressed so prettily is all at once in pieces.`, { st: 1, learn: 'k_cav' }],
    lose: [`Your arrow goes somewhere. The horse does not seem to notice. It balks at the stakes at the last stride and its rider comes on without it, over its head, eighty pounds of plate and a man inside, and lands mostly on you.`, { b: -1, learn: 'k_cav' }] },
  { t: 'Stand behind your stake and hold', test: ['grit', 9, 'cav'],
    win: [`You do the one thing asked of you, which is to stand still while a horse the size of a cottage tries to make up its mind. It sees the point. It turns. Its rider goes on into the stakes alone, and three of the twenty are on him with mallets before he has worked out which way is up.`, { learn: 'k_cav' }],
    lose: [`Your stake goes over like a rotten tooth. The horse comes through the gap sideways, half down already, and its hindquarters knock you into the next file.`, { b: -2, learn: 'k_cav' }] },
  { t: 'You know which horse gets through. Step left and put a shaft in its chest at ten paces.', know: 'k_cav', arrows: 1,
    out: [`It is the grey with the split chanfron, three from the end, as it has always been. You are standing where it will be before it knows that itself. At ten paces a bodkin will go through horse armour like a nail through cheese. It comes down on its knees and slides, and stops with its nose against your stake.`, { st: 1 }] }
]);

scene('b_advance', 'battle', 'Eight thousand men on foot', `Now the first French battle comes, dismounted, in full plate: eight thousand men walking through plough their own horses have just churned to soup. They sink to the calf at every stride. They have their heads down and their visors shut against the arrows, so they can see nothing but their own feet, and the woods are squeezing them in from both sides until they are thirty deep and cannot lift their arms. It is three hundred paces and it is taking them a long time.`, [
  { t: 'Loose as fast as you can draw', arrows: 1, test: ['arm', 9, 'shoot'],
    win: [`Ten shafts a minute, twelve. You stop seeing men and see only a moving wall with soft places in it. The arrows do not all go through, but a man struck six times in a minute does not walk straight, and they are herding inward, away from the wings, away from you, piling on to their own centre.`, { st: 1 }],
    lose: [`Your arm is done. The draw comes to your chin and no further, and your shafts rattle off the plate like hail on a church roof. You are spending arrows and getting nothing for them.`, {}] },
  { t: 'Pick your marks: visors, armpits, the backs of knees', arrows: 1, test: ['eye', 10, 'shoot'],
    win: [`You shoot slow and you shoot at men, not at the mass. One who lifts his visor to breathe. One with a banner. One who seems to be giving orders, until he is not. There is a small disorder in the French line wherever you have been looking, and Erpingham's serjeant has noticed where it starts.`, { st: 2 }],
    lose: [`At this range, at moving steel, with your heart going like a smith's hammer, you could not hit the wood. You hit the mud twice. It was coming to them anyway.`, {}] },
  { t: 'Run out and gather spent shafts before they close', test: ['grit', 9],
    win: [`The ground in front of the stakes is feathered like a goose. You go out bent double, with other men doing the same, and pull arrows out of the plough by the handful while the French come on at a walk. You are back behind your stake with a full bag before they are in range of anything but insults.`, { ar: 1 }],
    lose: [`There are still a few crossbows on the French side, and one of them has been waiting for somebody to do exactly this.`, { b: -1 }] }
]);

scene('b_close', 'battle', 'Thirty paces', `They reach the English line and it goes back a spear's length under the weight of them, and holds. And now they are thirty paces from your stake, side on to you, packed so tight the dead cannot fall down. At this distance a war bow will put a bodkin through plate, if the bow is heavy enough and the string is dry.`, [
  { t: 'Bodkins into the flank of them', arrows: 1, test: ['arm', 10, 'shoot close'],
    win: [`You cannot miss, so all that matters is how hard. You feel each shaft go home through the bow hand, a kind of knock. Men in the outer files start trying to turn and face you, and they cannot turn, and the ones behind push them on to their knees and walk over them.`, { st: 1 }],
    lose: [`The arrows strike and skid. One man-at-arms, feathered like a hedgehog and furious, breaks out of the press and comes for you through the stakes with a poleaxe, and you learn how fast a man in sixty pounds of steel can move when he is angry enough.`, { b: -1 }] },
  { t: 'Shoot the men about the banners', arrows: 1, test: ['eye', 10, 'shoot close'],
    win: [`Where a banner goes down, the men under it look round, and a man who looks round in that press is finished. You take the bearer of one and the knight who snatches it up after him. The whole corner of the French battle nearest you folds inward on itself.`, { st: 2 }],
    lose: [`There are too many banners and too much smoke of breath and rain. Your shafts go in and you cannot tell what they do. Perhaps nothing.`, {}] },
  { t: 'Throw down the bow and take up the mallet now, before the others think of it',
    out: [`The bow goes over your shoulder and the stake-mallet comes into your hands, five pounds of lead on an ash handle. You are among the first archers out through the stakes. The men you find are on their hands and knees in the mud, trying to stand, and you are a tradesman again, with a hammer and a row of work in front of you.`, { flag: 'early', item: 'maul' }] }
]);

scene('b_melee', 'battle', 'Mallets', () => `The arrows are spent, or near enough. All down the line the archers are out among the French with whatever they have: hatchets, falchions, the lead mauls from the stakes. They wear no harness and they do not sink. The men-at-arms have walked three hundred paces through a bog with a blacksmith's shop on their backs, and those who go down cannot rise, and the heap in front of the English line is growing as high as a man's chest.${perkinHere() ? ' Perkin is off to your right with a billhook he has found, bawling like a calf, in further than he should be.' : ''}`, [
  { t: 'Go in where the fallen are thickest', test: ['arm', 10, 'melee'],
    win: [`It is not fighting. It is a kind of work, and you do it, and you will see it for the rest of your life, however long that turns out to be. You come out of it with a gilded sword-belt round your neck and a French squire by the collar who swears his father is good for forty crowns.`, { c: 12, st: 1, flag: 'prisoner' }],
    lose: [`A man you took for dead rolls and drives a misericord up under your jack. You kill him. It does not help the hole.`, { b: -2 }] },
  { t: 'Get to Perkin', if: perkinHere, test: ['grit', 9, 'melee'],
    win: [`You go through to him like a dog through a hedge. He is on his back with a man-at-arms kneeling on his chest, feeling for the gap at his throat, and you hit the Frenchman so hard the mallet head comes off. Perkin gets up. He looks at the mallet handle, and at you. 'You've broken it,' he says, and then he starts to laugh, and cannot stop.`, { flag: 'perkin_lived' }],
    lose: [`You are six paces from him when he goes down, and you are still six paces away when the man on top of him finds the gap. You get there in time to kill the Frenchman, but it does Perkin no good.`, { b: -1, perkin: 'dead' }] },
  { t: "Fight your way towards the King's banner", if: () => !S.flags.centre, test: ['grit', 11, 'melee'],
    win: [`You go left along the back of the line, over the heap, through gaps that close behind you. Nobody stops an archer with blood to the elbows. The royal banner grows from a rag to a wall of colour, and then you are under it, in the worst of the press.`, { flag: 'centre' }],
    lose: [`The heap shifts under you and you go into it to the waist, among men who are not all dead. By the time you have fought free, the banner is no nearer and you have left a good deal of blood behind.`, { b: -2 }] },
  { t: 'Keep by Cutler and guard his back', test: ['grit', 9, 'melee'],
    win: [`He fights as he does everything else, with economy and bad language. You keep the left side of him clear and he keeps the right side of you, and neither of you speaks of it. At one point he steps over a duke without noticing. Once, when a poleaxe misses him by a hand's breadth, he says without turning his head, 'If I go down: Joan, at the Angel in Alresford. The money's under the hearthstone.' Then he goes on fighting, and does not go down.`, { st: 1, learn: 'k_tok3' }],
    lose: [`A falchion meant for Cutler finds your arm instead. He deals with its owner, looks at the cut, and says, 'That'll want stitching. You'll know a man.'`, { b: -1 }] }
], { after: () => {
  let t = '';
  if (S.flags.reeve_enemy && !S.flags.reeve_settled) { S.blood -= 1; t = 'Something hits you low in the back, hard, from behind, where there are no Frenchmen. When you get your head round, Reeve is three paces off with his face turned the other way, busy with a man on the ground.'; }
  if (!perkinHere() || S.flags.perkin_lived) return t;
  if (bonded()) { S.flags.perkin_lived = 1; return (t ? t + '\n\n' : '') + 'Perkin has fought his way back to your shoulder, as he said he would, and he stays there.'; }
  if (S.flags.perkin_trained || S.flags.perkin_staked) { S.flags.perkin_lived = 1; return (t ? t + '\n\n' : '') + (S.flags.perkin_staked ? 'Off to your right Perkin is still on his feet, behind a stake that held. He has blood to the elbows, none of it his, and he is looking about for you.' : 'Off to your right Perkin is still on his feet. He ran out of arrows an hour ago and every one of them went where he meant it to. He has a dead man\'s falchion now and seems to know what it is for.'); }
  if (S.flags.reeve_guard) { S.flags.perkin_lived = 1; return (t ? t + '\n\n' : '') + 'Off to your right Perkin goes down, and a man is over him before you can move. It is Reeve. He kills the Frenchman without hurry and hauls the boy up by his collar, and looks across the heap at you, and holds up one finger, to show that he is keeping count.'; }
  S.perkin = 'dead'; return (t ? t + '\n\n' : '') + 'When you look for Perkin again, he is not where he was. You find the billhook first.';
} });

scene('b_wing', 'battle', 'The right of the line', `On the right the Duke of York's battle has taken the worst of it. The Duke himself is somewhere under the heap in front of you; they will find him later without a mark on him, pressed to death in his own armour. The fight here is won. But there is a roar from the centre that is not like the rest, and for a moment through the press you see the King's banner dip, and men running towards it. Whatever is happening, it is happening there, and you are here.`, [
  { t: 'Dig for the Duke', test: ['arm', 10],
    win: [`You haul dead men off a heap until you find a surcoat with the royal arms on it. He has no wound anywhere. A herald takes charge of the body and gives you a mark for your trouble, and writes your name down wrong.`, { c: 10, st: 1, learn: 'k_centre' }],
    lose: [`The heap is not all dead, and one of the living has a knife. You leave the Duke to the heralds.`, { b: -1, learn: 'k_centre' }] },
  { t: 'Run for the centre',
    out: [`You run, over ground that is more men than mud. By the time you reach the banner it is upright again and the roar has gone out of it. A knight with his visor up is being helped away by two squires, bleeding down one leg, and the King is wiping his sword. You have missed something, and you do not yet know what.`, { learn: 'k_centre' }] }
]);

scene('b_brother', 'battle', 'Under the banner', () => `Here in the centre the French have sent their best at the King himself. Eighteen esquires have sworn together to strike the crown from his head or die, and most of them have already kept the second half of the oath. The King's young brother, Humphrey of Gloucester, is fighting three paces ahead of the banner, and as you watch a sword goes in below his fauld and he drops. The King steps astride him. The Duke of Alençon is hacking at the King's helm. A piece of the crown goes spinning away, and every eye in England is on those two men.${kn('k_gloucester') ? '\n\nEvery eye but yours. You know about the third man.' : ''}`, [
  { t: 'Watch the King, like everyone else', if: () => !kn('k_gloucester'),
    out: [`Alençon goes down under the King's household men. And while every head is turned that way, a man-at-arms nobody has marked comes out of the press on the left with a poleaxe raised over the fallen Duke. A Welsh squire throws himself across the body and takes the blow. Gloucester is dragged clear, alive. The squire is not. You saw the poleaxe lift. You were looking the wrong way until it was too late to matter.`, { learn: 'k_gloucester' }] },
  { t: 'Something is wrong on the left. Look there.', if: () => !kn('k_gloucester'), test: ['eye', 11],
    win: [`You could not say what makes you turn. A movement against the grain of the fight: a man coming out of the press on the left, alone, with a poleaxe going up over the fallen Duke, and nobody to stop him because nobody is looking. You have no arrow nocked and no time. You go into him with your shoulder as you once went into the door of your master's shop when it stuck. The axe comes down in the mud beside the Duke's head. Then the household men are on him, and somebody is hauling you upright by your jack.`, { hero: 1, learn: 'k_gloucester' }],
    lose: [`You look, and a French knight on his knees takes that moment to put a dagger in your calf. By the time you have dealt with him it is over: a man with a poleaxe, the fallen Duke, a Welsh squire dead across the body. Gloucester lives. It was no thanks to you, and you saw exactly how it was done.`, { b: -1, learn: 'k_gloucester' }] },
  { t: 'Shaft on the string. Loose when the poleaxe lifts.', know: 'k_gloucester', arrows: 1, test: ['arm', 11, 'shoot close'],
    win: [`You have a bodkin nocked and half drawn before he has come out of the press. Left side. Alone. The poleaxe goes up over the Duke, and you put the shaft in under the raised arm, where the plates do not meet, at seven paces. He stands for a moment longer, looking puzzled, and then falls across his own weapon. The King's head turns. For one breath he is looking straight at a cobbler's boy with an empty bow.`, { hero: 1 }],
    lose: [`You loose a heartbeat early and the shaft takes a man who steps across at the wrong moment. By the time you have another on the string the Welsh squire has done what you came to do, and paid for it. The Duke lives. The saints, you suspect, are not satisfied.`, { b: -1 }] },
  { t: 'Be standing where he means to step', know: 'k_gloucester', test: ['grit', 11, 'melee'],
    win: [`You go to the place before he does and wait there, over the Duke, as you would wait for a cart you knew the hour of. He comes out of the press with the poleaxe up and finds an archer in the way with a lead maul. He is stronger than you and far better armoured, but he has lost the surprise he was counting on. The maul takes him on the side of the helm. You are still hitting him when the King's men pull you off.`, { hero: 1 }],
    lose: [`He comes exactly where you knew he would, and he is very good. The haft takes you across the face and you go down over the Duke's legs. The Welsh squire steps over both of you and takes the next blow himself. You hear it land.`, { b: -2 }] }
]);

scene('b_order', 'battle', 'The order', () => `${S.flags.purse_lost ? `Your purse went back on the baggage carts, and it has gone wherever the carts' other contents have gone. ` : ''}${S.flags.hero ? `A squire of the household has put a cup of the King's own wine into your hand, and you have not yet dared to drink it. ` : ''}It is won. The first two French battles are a wall of dead and the third is sitting its horses at the far end of the field, thinking. Behind the line the prisoners stand in hundreds with their helmets off, more prisoners than there are Englishmen to guard them.${S.flags.prisoner ? ' Yours is among them, the squire with the forty-crown father, looking seasick.' : ''} Then there is shouting from the rear: the baggage is being plundered, and the third battle is stirring, and the King gives an order that makes the men-at-arms look at their feet. They will not do it, since a prisoner is a ransom and a ransom is a fortune. So two hundred archers are told off to kill the prisoners, and Cutler's twenty is among them.`, [
  { t: 'Do as you are ordered',
    out: [`You do it. It is quickly done, and you do not look at faces. Afterwards the third battle rides away without fighting, so it was all for nothing, and nobody says so aloud.`, { unflag: 'prisoner' }] },
  { t: 'Put your knife away and stand aside', test: ['wits', 5, 'talk ransom'],
    win: [`You stand with your arms folded and wait to be struck down. Cutler looks at you. Then he puts himself between you and the esquire who is giving the order, and finds something urgent to shout at a man further along. Nobody hangs you. In an hour the order is called off, and the ones still alive are marched away.`, { grit: 1, flag: 'spared' }],
    lose: [`The esquire in charge has the flat of his sword for men who stand with their arms folded. You go down, and when you get up again it is over, and they have managed without you.`, { b: -1 }] },
  { t: "Cut your own man's bonds and point him at the wood", if: () => S.flags.prisoner,
    out: [`Forty crowns goes off through the trees at a stumbling run with its hands still tied in front. He does not thank you, having no breath for it. Ieuan saw you do it. 'Expensive,' he says. He is looking the other way when the esquire comes round, and he keeps looking that way.`, { c: -12, unflag: 'prisoner', flag: 'mercy' }] }
], { enter: () => { if (!M.known.k_baggage) { M.known.k_baggage = 1; S.lessons += 1; M.knownAt = M.knownAt || {}; M.knownAt.k_baggage = 'The order'; } if (S.flags.purse_back && !S.flags.purse_lost) { S.flags.purse_lost = 1; S.coin = 0; } } });

scene('origin', 'soton', 'Before the quay', `Nobody takes the King's sixpence because things are going well at home. You are a cordwainer's apprentice from Winchester, three years into your time, and until this summer the furthest you had been from your master's bench was the fish market. Something sent you to the wars. Put a name on the roll, and say what it was.`, [
  { t: 'A debt', sub: `You ruined forty shillings' worth of Spanish cordovan in one afternoon with a dull knife. Master Geoffrey holds your mother's bond for it. Eighty days at sixpence, and she keeps her house.`,
    out: [`Forty shillings. You have done the sum so often that you see it when you close your eyes: eighty days, if you spend nothing, and if you live for all eighty of them. You have learned what things cost. You know the price of leather, and of bread, and you know to the penny what a mistake costs.`, { want: 'debt' }] },
  { t: 'A girl', sub: `Alys, the chandler's daughter, three doors down. Her father has told you what a journeyman cobbler is worth, in round numbers. Men come back from France with ransoms.`,
    out: [`She gave you a ribbon off her sleeve and a candle-end from the shop, 'for the dark', and she did not cry, which you have decided to take as a compliment. Her father shook your hand like a man seeing off a rival. You mean to come back with a French knight's ransom or not at all, and you try not to think which is likelier.`, { want: 'girl' }] },
  { t: 'A brother', sub: `Dickon went to the wars at Easter with the Earl of Suffolk's archers and has sent no word since. Your mother put his old bracer in your hand and made you swear on it.`,
    out: [`Dickon is three years older and has been better than you at everything since you could walk, and it was Dickon who taught you to draw a bow, mostly by laughing. Your mother does not want his wages. She wants him home. 'Bring him home,' she said, 'or don't come back yourself,' and then she cried and took the second part back.`, { want: 'brother' }] }
], { place: 'Winchester, before any of it', input: 1 });

/* ---- home: Southampton ---- */
scene('home_s_debt', 'soton', "Master Geoffrey's man", `Hamo, your master's journeyman, has walked down from Winchester to see the bond is not forgotten. He finds you on the quay and stands too close. Master Geoffrey, he says, would take it kindly if your first pay were made over now, to him, Hamo, for safe carrying. He has a paper. He has also, you notice, new boots that he did not make himself.`, [
  { t: 'Pay him four pence on account, and get his mark for it', cost: 4,
    out: [`He makes his mark on the back of the bond, sourly, with your charcoal. Four pence off forty shillings. It is hardly anything, but it is a beginning, and it is written down where Master Geoffrey cannot unwrite it.`, { wits: 1, flag: 'paid' }] },
  { t: 'Tell him the master gets it from your own hand in the autumn, or not at all', test: ['wits', 8, 'talk'],
    win: [`You say it civilly and you do not step back. Hamo looks round at the archers who have stopped to listen, most of whom owe somebody something, and finds he has no friends on this quay. He goes home with his paper. Cutler, who heard it all, says only, 'Never pay a man in new boots.'`, { st: 1 }],
    lose: [`Hamo raises his voice, which is what he came to do. By the time he has finished, the whole twenty knows you are a debtor, and Reeve is looking at you with a new and friendly interest.`, { st: -1, pull: ['reeve', 2] }] },
  { t: 'Ask after your mother',
    out: [`For a moment he is only Hamo, who sat across the bench from you for three years. She is well, he says. She has taken in washing. She asked him to say you are to keep your feet dry. Then he remembers what he came for, but he asks for the money with less heart than before, and leaves without it.`, { grit: 1 }] }
]);
scene('home_s_girl', 'soton', 'A penny letter', `A clerk with ink to his elbows has set up a board by the customs house and is writing letters home at a penny the piece, sealing included. The queue is all archers. Most of them are dictating the same letter, about being well and the food being bad. You know her father will read yours before she does, and that he will read it aloud.`, [
  { t: 'Tell her the truth: that you are afraid', cost: 1,
    out: [`The clerk raises an eyebrow but writes it. That you do not know what France is. That you would rather be at the bench. That you will come back anyway. Said aloud to a stranger it sounds like something a man could stand on, and you walk away from the board lighter by more than a penny.`, { grit: 1, flag: 'wrote' }] },
  { t: 'Write to her father, and tell him exactly what an archer earns', cost: 1, test: ['wits', 7, 'talk'],
    win: [`Sixpence a day, a third of all plunder, and ransoms by the King's own ordinance. You have the clerk set it out as a reckoning, with the sum at the bottom. It is the first letter you have ever sent and it reads like a bill. You suspect it is the only kind that man will respect.`, { grit: 1, flag: 'wrote_father' }],
    lose: [`It comes out as boasting. You can hear it in the clerk's voice when he reads it back, and you send it anyway, because the penny is spent.`, { flag: 'wrote_father' }] },
  { t: 'Keep the penny. She knows.',
    out: [`You wind her ribbon round your bow hand under the bracer and say nothing to anybody. If she knows, there is no need to tell her, and if she does not, you are not the man to explain it in a letter. You are less sure of that by nightfall.`, {}] }
]);
scene('home_s_brother', 'soton', "Suffolk's lines", `The Earl of Suffolk's men are camped by the West Quay, and you find Dickon there within the hour, because he is the loudest. He has filled out. He has a scar through one eyebrow and a good bow and friends who laugh when he does. When he sees you his face does several things. 'Mother sent you,' he says. 'God's teeth. She sent the cobbler.'`, [
  { t: 'Tell him you came to fight, the same as him', test: ['grit', 7],
    win: [`He looks you up and down, and you make yourself stand still for it. 'Did you, though,' he says, but more quietly. He walks you to the edge of the camp, and at the last moment he grips your arm above the bracer, his old one, and says, 'Keep your head down, little brother. I mean it.'`, { wits: 1 }],
    lose: [`Your voice goes up at the end, as it always has with him. His friends are kind about it, and you would rather they had laughed.`, {}] },
  { t: 'Shoot against him at the butts, for the bracer', test: ['arm', 8, 'shoot'],
    win: [`Six arrows each at ten score. He beats you, of course. But it is five to four, and the fourth of yours splits the peg, and Suffolk's men make a noise about it. Dickon hands the bracer back as if it had been a real wager. 'Who taught you that?' A Welshman, you say. 'Well, keep him.'`, { grit: 1, st: 1 }],
    lose: [`You overdraw trying to match him and something in your back goes. He wins six to one, and he will not take the bracer. 'Mother would skin me,' he says, and for a moment you are both ten years old.`, { b: -1 }] },
  { t: 'Tell him not to drink the water at Harfleur, and make him swear it', know: 'k_dickon',
    out: [`He laughs, and then he sees your face and stops. You tell him: the ditch water, the first week of September, the sick lines. You cannot tell him how you know. 'You always were a strange little sod,' he says, but he swears it, on the bracer, to shut you up.`, { flag: 'dickon_warned' }] },
  { t: 'Leave him to his friends',
    out: [`You say what your mother told you to say and he says what he would be expected to say back. He does not ask you to stay and eat. You walk back along the quay with his bracer on your arm, and you find it still does not fit.`, {}] }
]);

/* ---- home: Harfleur ---- */
scene('home_h_debt', 'harfleur', 'Arrears', `The King's paymasters have not been seen since the fleet landed. The second quarter's wages are owed and will be paid, the clerks say, when Harfleur falls, or in Calais, or in England. A sutler with a strongbox is going round the trenches buying archers' arrears for ready silver, at eight pence in the shilling. You do the sum without wanting to. At that rate the bond is not eighty days. It is a hundred and twenty.`, [
  { t: 'Sell him a month of your arrears',
    out: [`Ten pence in your hand tonight, against fifteen you may never see. The sutler writes your name in his book. It is the first time you have been in debt to two men at once.`, { c: 10, flag: 'sold' }] },
  { t: 'Hold your paper and trust the King', test: ['grit', 6],
    win: [`You keep your tally and go hungry on it. A King who hangs men for robbing churches will likely pay his archers in the end, you tell yourself. It is thin reasoning, and you hold to it.`, { arm: 1 }],
    lose: [`You hold out for a week, and then you sell at seven pence in the shilling, since the price has dropped.`, { c: 6, flag: 'sold' }] },
  { t: 'Ask the sutler what he would pay to have his boots mended', test: ['wits', 6],
    win: [`He looks at his own feet before he can stop himself. By the end of the week you have resoled the sutler, his boy and both his carters, and you have been paid in silver and at your own price. Your trade is in short supply here, and you are slowly learning to charge for it.`, { c: 8, eye: 1 }],
    lose: [`He has a cobbler, he says, in Rouen. He intends to live to see him.`, {}] }
]);
scene('home_h_girl', 'harfleur', 'Word from Winchester', `A ship from Southampton brings biscuit, arrows and a sack of letters, and one of them is for you. It is in the parish priest's hand, since Alys cannot write, and it is short. Her father has had an offer for her from a pewterer in Jewry Street, a widower with a shop and two apprentices. She has asked him to wait until Christmas. He has agreed to wait until Michaelmas. She says the candle was for the dark, and to use it.`, [
  { t: 'Send every penny you have home with the ship', if: () => S.coin > 0,
    out: [() => S.coin === 1 ? `Every penny you have turns out to be one penny. You tie it in a rag, which makes it look like more, and give it to a wounded man-at-arms who is being shipped home and seems honest. It will reach her before Michaelmas. A pewterer can send a great deal more than a penny, but he cannot send his last one.` : S.coin < 6 ? `You tie the pennies in a rag and give them to a wounded man-at-arms who is being shipped home and seems honest. It is not much. Still, it is everything, and it will reach her before Michaelmas, and that is more than the pewterer can say of anything he has sent.` : `You tie it in a rag and give it to a wounded man-at-arms who is being shipped home and seems honest. It is a fair weight of silver for an archer, and it will reach her before Michaelmas, and all of it is yours, which is more than the pewterer can say of anything he has sent.`, () => ({ c: -S.coin, grit: 1, flag: 'sent' })] },
  { t: 'Light the candle',
    out: [`You light it in the trench, behind your hand. It burns for about as long as a Mass. Somebody asks what you are doing and you say you are reading, and he very decently does not point out that you have no book.`, { heal: 1, flag: 'candle_lit' }] },
  { t: 'Burn the letter',
    out: [`Michaelmas is the twenty-ninth of September, and you are in a ditch in Normandy. You put the letter in the fire, and Ieuan watches you do it. 'Ah,' he says. 'One of those.' There is nothing to do with what you feel except carry it up to the walls, and you do that.`, { grit: 1 }] }
]);
scene('home_h_brother', 'harfleur', 'The Earl is dying', () => `The Earl of Suffolk has the flux, and so does half his retinue. You go along the lines to their camp with your heart in your mouth and find Dickon ${S.flags.dickon_warned ? `on his feet, one of the few who is. He has drunk nothing but beer since the landing, and he regards you as he would something from under a church. 'How did you know?' he says.` : `on a hurdle under a wagon. His eyes are sunk and his hose are off, and he does not know you at first. When he does, he tries to make a joke of it and cannot finish the joke.`}`, [
  { t: 'Tell him a cobbler hears things', if: () => S.flags.dickon_warned,
    out: [`He does not believe you, and he does not press it. He is busy: with the Earl dying, Suffolk's archers need every man who can stand. He will march with the army when it marches. Before you go he puts his hand on the back of your neck, as he did when you were small. 'Strange little sod,' he says, and he says it kindly.`, { wits: 1, st: 1, flag: 'dickon_lives' }] },
  { t: 'Tell him the truth', if: () => S.flags.dickon_warned && M.runs >= 2,
    out: [`You tell him about the quay, and the awl, and the Thursday he died under a wagon. He listens to all of it with his arms folded. 'Then stop dying, you fool,' he says at the end. It is so exactly what he would say that you laugh until he has to hold you up.`, { grit: 1, heal: 1, flag: 'dickon_lives' }] },
  { t: 'Carry him to the ships yourself', if: () => !S.flags.dickon_warned, test: ['grit', 7, 'flux'],
    win: [`He weighs nothing. You carry him a mile on your back to the boats and talk the whole way about the bench and your mother's washing, and you lie to a ship's master about whose retinue you belong to. He goes home among the five thousand, and he will live. You stand on the shingle until the ship is hull down. You have done what you swore to do, and it turns out not to end anything.`, { flag: 'dickon_home', lessons: 1, learn: 'k_dickon' }],
    lose: [`You get him to the boats. It takes all day, and by the end his filth is down your back and in your hair. The ship takes him. That night there is a cold coil in your own gut, and you know what it is, and you find you do not grudge it.`, { flag: ['dickon_home', 'exposed'], learn: 'k_dickon' }] },
  { t: 'Give him your tormentil root', if: () => !S.flags.dickon_warned && has('root'),
    out: [`It is like getting a horse to take a ball. He chews, and gags, and chews. By the third day he can sit, and by the sixth he is cursing you for the taste. He will march with Suffolk's men when the army marches. You have nothing now for your own gut, and you find you are easy about that.`, { drop: 'root', flag: 'dickon_lives', learn: 'k_dickon' }] },
  { t: 'Sit with him', if: () => !S.flags.dickon_warned,
    out: [`You sit under the wagon for two days. He talks about the orchard behind your mother's house and calls you by your father's name. He dies on the Thursday, a little before the Earl. You take his bow, since he would want it used, and you unbuckle his old bracer from your own arm and put it on his.`, { flag: 'dickon_dead', item: 'dbow', grit: 1, learn: 'k_dickon' }] }
]);

/* ---- Ieuan ---- */
scene('s_ieuan', 'soton', "The Welshman's bow", `Ieuan's bow is as tall as he is and thicker at the grip than your wrist. The Cheshire men say no cobbler's boy can get it past his chin, and have put pennies on it. Ieuan says nothing. He unstrings it, strings it again with one easy step-through, and holds it out to you across both palms, the way a priest holds out something you are not sure you are fit to take.`, [
  { t: 'Draw it', test: ['arm', 9, 'labour'],
    win: [`It is like trying to open a barn door with your shoulder blades. Somewhere past your chin you stop pulling with your arms and lean your whole body into the bow, as he does, and the string comes back to your ear. You hold it there for one breath. The Cheshire men pay up. Ieuan takes the bow back and inspects it for damage.`, { arm: 1, c: 4 }],
    lose: [`It gets to your chin and stops there, and then something in your back gives. The Cheshire men collect. Ieuan takes his bow from your hands gently, as one takes a child back from a drunk.`, { b: -1 }] },
  { t: 'Ask him how a man of fifty draws that', test: ['wits', 7, 'talk'],
    win: [`'You don't draw a bow,' he says. 'You get inside it and stand up.' He shows you: the lean, the back, the breath let half out. He was put to it at seven with a bow of his own height, and every year a heavier one. 'Your bones grow round it. Mine did. Look.' His left arm is thicker than his right, and his spine has a set to it like a wind-blown thorn.`, () => (has('ieuan') ? { arm: 1 } : { item: 'ieuan' })],
    lose: [`He tells you. It takes most of an hour and goes by way of his grandfather, a disputed heifer and the siege of Harlech. You are fairly sure the answer was in there.`, {}] },
  { t: 'Hand it back. You know what you can lift.',
    out: [`'Sensible,' Ieuan says. The Cheshire men call it something else. You notice that he does not offer it to any of them.`, {}] }
], { thread: 'ieuan' });
scene('h_ieuan', 'harfleur', 'What Ieuan was', `You share a watch with Ieuan in the forward trench, close enough to the walls to hear the French sentries cough. He has been quiet a long while, for him. Then he says, as if remarking on the weather, that he has shot at this King before. At Shrewsbury, twelve years back, when the King was a prince of sixteen and Ieuan stood with Hotspur's archers on the other side. 'He took an arrow in the face that day. Here, by the nose. Six inches in.' He looks at his hands. 'Somebody loosed it.'`, [
  { t: 'Ask why he serves him now',
    out: [`'Because he pulled it out,' Ieuan says. 'Well, a surgeon did. It took him weeks. And the boy never left the field till the day was won. I thought then: that one I would sooner stand behind than in front of.' He spits. 'Also Glyndŵr stopped paying. It is not all poetry.'`, { wits: 1 }] },
  { t: 'Tell him it goes no further',
    out: [`He nods, and nothing more is said. But after that night he begins to tell you the other things, the ones he keeps back when he talks to the twenty: where a horse will not go, and what a man in plate cannot see. He tells you how long you can hold a full draw before your aim goes, which is not long.`, () => (has('ieuan') ? { eye: 1 } : { item: 'ieuan' })] },
  { t: 'Take it to Cutler',
    out: [`Cutler hears you out. 'I know,' he says. 'Half the Welsh were. Who d'you think taught them to shoot like that? We did, by standing in front of them.' There is something close to disappointment in his face. 'He told you that in a trench, on a night watch. Think about what that makes you.'`, { st: -1, pull: ['ieuan', -3] }] }
], { thread: 'ieuan' });

/* ---- Reeve ---- */
scene('s_reeve', 'soton', "Reeve's footing", () => `Jankin Reeve has been a soldier since the Welsh wars and has learned all the wrong things from it. He is the oldest man in the twenty after Ieuan, and the only one Cutler never turns his back on. Tonight he is sitting on your blanket with your second-best shirt across his knees. 'New men pay a footing,' he says pleasantly. 'Threepence, or the shirt. It's the custom.' It is not the custom.${perkinHere() ? ' Perkin has gone very quiet.' : ''}`, [
  { t: 'Pay him the threepence', cost: 3,
    out: [`He takes it and gives you back your shirt and even a kind of nod. It is cheap, as these things go. But you have told him what you will fetch, and he is a man who remembers a price.`, () => ({ flag: 'reeve_paid', echo: perkinHere() ? { at: 'harfleur', t: 'Reeve has been borrowing from Perkin since Southampton. He does not call it that, and Perkin does not call it anything.' } : null })] },
  { t: 'Take your blanket back', test: ['grit', 8, 'melee'],
    win: [`You take hold of the blanket and pull, with him on it. It is undignified and it turns into a fight, and he is stronger than you but he was not expecting it. Cutler lets it run exactly as long as it takes you to bloody Reeve's nose, and then stops it with one word. Reeve gets up smiling, and you know from the smile that he has not finished with you.`, { st: 1, flag: 'reeve_stood' }],
    lose: [`He was hoping you would. It is over quickly and you do not get the blanket. But you got up twice, and the twenty saw you do it, and Reeve now has to wonder whether the threepence is worth the trouble.`, { b: -1, flag: 'reeve_stood' }] },
  { t: 'Go and fetch Cutler',
    out: [`Cutler comes, and looks, and Reeve hands over the shirt with a face of perfect innocence. 'Lad seemed to think I was robbing him, vintenar.' Cutler says nothing to Reeve. To you, later, he says, 'I can't be at your blanket every night. Sort it or pay it.'`, { st: -1, flag: 'reeve_told' }] }
], { thread: 'reeve' });
scene('h_reeve', 'harfleur', 'What Reeve carries', () => `Old Simkin of the twenty is dying in the sick lines, and you have been sent down with his share of the bread. Reeve is there before you, kneeling by the hurdle with one hand inside the old man's jack. He has the purse out before he sees you. Simkin's eyes are open. 'He'll not need it,' Reeve says reasonably. ${S.flags.reeve_stood ? `'And you'll not want to try me twice.'` : S.flags.reeve_paid ? `'There's threepence in it for you. Call it your footing back.'` : `'Halves, if you've sense.'`}`, [
  { t: "Put the purse back in Simkin's hand", test: ['grit', 7, 'melee'],
    win: [`You do not hit him. You take hold of his wrist and you look at him, and whatever he sees in a face that has died as often as yours, he lets go. Simkin dies with his purse on his chest. Cutler sends it to the widow, and asks no questions about who saw to that.`, { st: 1, flag: 'reeve_shamed' }],
    lose: [`He has a knife out before you have finished speaking, the short kind, held low. It is only your forearm. He walks off with the purse, whistling, and you are left to explain to the surgeon's boy how you cut yourself on bread.`, { b: -1 }] },
  { t: 'Take the halves',
    out: [`Six pence, warm from a dying man's chest. Reeve claps you on the shoulder. 'There, now. We understand each other.' That is the worst of it, because you do understand each other.`, { c: 6, flag: 'reeve_share' }] },
  { t: 'Tell Cutler what you saw',
    out: [`Cutler has him flogged in front of the twenty: twelve strokes, by his own arm. Reeve takes it without a sound and looks at you the whole time. When it is over he puts his shirt back on carefully and says, to nobody, 'Long way to Calais.'`, { st: 1, flag: 'reeve_enemy', echo: { at: 'march', t: 'Reeve has not spoken to you since the flogging. He marches behind you now, always behind, and you have learned to sleep with your back against something.' } }] }
], { thread: 'reeve' });
scene('h_reeve2', 'harfleur', 'Reeve asks', `The flux has found Reeve. He lies in the corner of the trench where the twenty has put him, in his own filth, and nobody will go near, for reasons that are not all to do with the smell. As you pass he says your name. It is the first time he has used it. 'Water,' he says. 'Clean. I know you know where.' He does not say please. He seems not to remember that he could.`, [
  { t: 'Fetch it', test: ['grit', 6, 'flux'],
    win: [`You bring him a skin from the chalk spring, and then another, and you hold his head. He does not thank you. On the fourth day he can stand, and he studies you for a long moment, the way one studies a bill one did not expect. 'Well,' he says. 'Now I owe a cobbler.'`, { arm: 1, flag: 'reeve_owes', echo: { at: 'battle', t: 'Reeve has placed himself in the file beside yours. He has not said why, and you do not ask him.' } }],
    lose: [`You fetch it, and hold his head, and clean him, since nobody else will. By the time he can stand there is a cold coil in your own gut. He sees it in your face. 'Ah,' he says. 'There. That's what kindness gets you.'`, { flag: ['reeve_owes', 'exposed'], echo: { at: 'battle', t: 'Reeve has placed himself in the file beside yours. He has not said why, and you do not ask him.' } }] },
  { t: 'Walk on',
    out: [`You walk on. He does not call after you. Somebody else must have done it, or nobody did, for he is on his feet again in a week, thinner and no better. He never mentions it. You think of it more often than he does.`, {}] },
  { t: 'Take back what he has taken', if: () => S.flags.reeve_paid || S.flags.reeve_share,
    out: [`His purse is under his head. You lift it out with two fingers while he watches, too weak to stop you, and count out what he has had from the twenty since Southampton, and put the rest back. 'Custom,' you tell him. He laughs at that until it hurts him.`, { c: 6 }] }
], { thread: 'reeve', when: () => reeveMet() });

/* ---- landing and the fires ---- */
scene('landing', 'harfleur', 'The shingle', `The fleet anchors off the chalk headland of the Chef-de-Caux, three miles from Harfleur, and nobody is allowed ashore before the King on pain of death. When he lands he goes down on his knees on the shingle. Then it takes three days to get the army off the ships: horses slung over the side screaming, guns on rafts, thousands of men wading in with their bows held over their heads. There is not a Frenchman in sight. Cutler finds this more worrying than the alternative.`, [
  { t: 'Carry stores up the beach until you drop', test: ['arm', 6, 'labour'],
    win: [`Arrow chests, biscuit, a barrel of something that sloshes. By the third day your hands are raw and Cutler has stopped checking whether you are where he left you, which you decide to count as trust.`, { st: 1 }],
    lose: [`A chest of sheaves comes down the gangplank faster than you can get out from under it. You spend your first night in France with your foot in a bucket of seawater.`, { b: -1 }] },
  { t: 'Walk up the headland and look at what you have come to', test: ['eye', 6],
    win: [`From the top you can see it all: the town in its walls with the river run out round it in a moat, the marsh, the one road, and a ditch across the landing place that would have cost a thousand men if anyone had been in it. You stand there a long time. You wanted to look at the place while there was still nobody in it trying to kill you.`, { wits: 1 }],
    lose: [`There is a town. It has walls. It is further away than it looked from the ship and you cannot make out much else. You have looked at France, though, and you go back down.`, {}] },
  { t: 'Find a dry hollow and guard the bows',
    out: [`Somebody has to. You sit on forty bow-bags with a staff across your knees and watch the army come ashore, and nobody steals a bow, and you get the first full night's sleep you have had since the Solent.`, { heal: 1 }] },
  { t: 'You know this siege by heart. Walk through it.', if: () => knowsAct('harfleur'), out: [`You come ashore as a man comes home to a house he dislikes. You know where everything is kept.`, { fast: 'harfleur' }] }
], { place: 'Chef-de-Caux, 14 August 1415' });

const ALONE_S = {
  debt: `You go over the sum again. Forty shillings, sixpence a day, eighty days. Somewhere in the doing of it you see that the sum only works if you are alive on the eightieth day, and that for the first time in your life somebody would be worse off if you were not.`,
  girl: `You unwind her ribbon and wind it on again. The candle-end is in your purse. You do not light it. You are saving it for a darker night than this one, and you expect France to supply one.`,
  brother: `You sit and work Dickon's bracer with tallow until the leather is soft. His teeth marks are in the strap, from when he was nine and used his mouth to buckle it. Somewhere down the quay, among Suffolk's fires, you can hear him laughing.`
};
const ALONE_H = {
  debt: () => `You count your pennies by feel in the dark, and then count the days, and neither count comes out. You sleep anyway. You have found that the sum will keep until daylight.`,
  girl: () => `You think about Jewry Street, and a pewterer with two apprentices, and Michaelmas. Then you make yourself think about the wall instead, since the wall is something you can do something about, and after a while you sleep.`,
  brother: () => S.flags.dickon_dead ? `You have Dickon's bow across your knees. You have not strung it yet. You sit with it until the fire is out.` : `You look along the lines for Suffolk's fires out of habit. Then you sleep, with one arm through the strap of your bow as you would mind your purse in a crowd.`
};
scene('fire_s', 'soton', 'The last night in England', () => `The fleet sails on tomorrow's tide. The twenty has a fire going behind the fish sheds and the last cask of English ale it will see this year, and for once nobody is shouting.${!perkinHere() ? '' : S.flags.dog_aboard ? ' Perkin is feeding the dog, which has no business going to France and is going.' : S.flags.dog_left ? ' Perkin has stopped feeding the dog, which has not stopped following him.' : S.flags.dog_fled ? ' Perkin keeps looking up the High Street.' : ' Perkin is feeding a quay dog he will not be allowed to bring.'} Ieuan is mending a fletching and humming. Cutler sits a little apart with his back to a bollard, counting something on his fingers. There is room at the fire, and you will not have many more evenings to choose where you sit.`, [
  { t: 'Sit with Perkin', if: () => perkinHere() && !S.flags.cold,
    out: [() => `He wants to know if you are frightened. You say no. He says he is not either.${S.flags.dog_fled ? '' : ' The dog looks from one of you to the other.'} After a while he says, '${N()}. If it goes bad over there, you'll not leave me, will you?' and you tell him not to be soft, and neither of you takes that for an answer.`, { flag: 'bond', pull: ['perkin', 2], say: 'Perkin will keep close to you.' }] },
  { t: 'Sit with Ieuan',
    out: [`He hands you a shaft and a pot of glue without asking, and you fletch beside him till the fire burns down. He tells you that an arrow is a letter you send to a stranger, so you had better write it clearly. Cock-feather out, three fingers under the nock, and for God's sake never count them aloud.`, { ar: 1, pull: ['ieuan', 2] }] },
  { t: 'Sit near Cutler',
    out: [() => S.standing >= 1 ? `He lets you sit. After a long while he says, 'Twenty,' and holds up his hands. 'I've taken twenty over the water three times. I've never brought twenty back.' He looks at the fire. 'Don't make friends of all of them, cobbler. Pick two.'` : `He looks at you until you go away again. From him that is nearly an invitation. He would not trouble to do it to a man he had not noticed.`, () => (S.standing >= 1 ? { st: 1, pull: ['cutler', 2], learn: 'k_tok1' } : { pull: ['cutler', 1] })] },
  { t: 'Sit alone, with what you brought from home',
    out: [() => ALONE_S[M.want] || ALONE_S.debt, { grit: 1 }] }
]);
scene('fire_h', 'harfleur', 'A fire in the trench', () => `The trench has a fire in the bottom of it now, since the nights have turned. The twenty is fourteen. Nobody says the number. The town's guns have gone quiet, which may mean powder is short in there or may mean nothing, and the talk is that the King will storm the walls on Sunday if they have not yielded.${perkinHere() ? ' Perkin has made room for you without looking up.' : ''}${S.flags.reeve_enemy ? ' Reeve sits across the fire with his shirt off, letting the stripes dry, and watches you through the flames.' : ''}`, [
  { t: 'Sit with Perkin', if: () => perkinHere() && !S.flags.cold,
    out: [`He has stopped talking about bread. He asks you instead what you will do after, and you say you will finish your time and take a shop, and he says you should have a baker next door because the two trades wake at the same hour. You plan the street between you, house by house, until he falls asleep in the middle of the saddler.`, { flag: 'bond', pull: ['perkin', 2], say: 'Perkin will keep close to you.' }] },
  { t: 'Sit with Ieuan',
    out: [`He is naming the stars in Welsh, wrongly, to annoy a Cheshire man. When that palls he shows you how to judge a distance by the width of your thumb at arm's length against a standing man. 'Twelve score, his whole body. Six score, the half. When your thumb covers only his face,' he says, 'you may stop measuring.'`, { eye: 1, pull: ['ieuan', 2] }] },
  { t: 'Sit near Cutler',
    out: [() => S.standing >= 2 ? `He is cutting notches in a tally stick: six of them, close together. 'Simkin. The two Johns. Wat. Hobbe. The lad from Alton, I never did learn his name.' He runs his thumb along it. 'Clerks write them down. I can't write. So.' He puts the stick inside his jack, on the left.` : `'Not tonight, cobbler,' he says, not unkindly, and goes back to his stick and his knife.`, () => (S.standing >= 2 ? { st: 1, pull: ['cutler', 2], learn: 'k_tok2' } : {})] },
  { t: 'Sit alone',
    out: [() => (ALONE_H[M.want] || ALONE_H.debt)(), { heal: 1 }] }
]);

/* ================= v0.3: the march, the eve and the battle, joined up ================= */

scene('s_muster', 'soton', 'The muster on the heath', `The King's clerks take the muster on the heath outside the town, company by company, with a roll in one hand and a tally in the other. Every archer must show a bow, a sheaf, a sword and a sound body, or his captain forfeits the wage. The clerk who reaches Cutler's twenty is young, cold and very thorough. He has already struck off a man in the next company for having one eye, and the man is arguing that he only needs the one.`, [
  { t: 'Stand up straight and show him your kit', test: ['grit', 7],
    win: [`He tries your string with his thumb, counts your shafts and looks at your teeth as if you were for sale. Then he makes a mark. Your name is on the King's roll, in ink, between a ploughman's and a poacher's. It is the first time anyone has written it down for a good reason.`, { st: 1 }],
    lose: [`He looks at your borrowed bow for a long time. 'This is a boy's bow,' he says to Cutler. Cutler says the boy will grow into France. You pass, by the breadth of Cutler's word, and Cutler does not let you forget whose word it was.`, {}] },
  { t: "Lend your spare shafts along the line, so the twenty passes whole", 
    out: [`Three men behind you are short of a full sheaf. Your shafts go down the back of the rank from hand to hand, are counted, and come back up it while the clerk is looking at teeth. The twenty musters twenty. Cutler does not look round, but the shafts come back with two extra among them.`, { ar: 1, st: 1 }] },
  { t: "Watch how the clerk counts, and what he misses", test: ['eye', 7],
    win: [`He counts bows and never draws one. He counts men and never asks their trade. You understand something about armies that will be useful: what is written on the roll and what stands in the field are separate things, and only the first of them is ever checked.`, { wits: 1 }],
    lose: [`You watch him so hard that he notices, and counts your arrows twice.`, {}] }
], { pool: 1 });

scene('m_open', 'march', 'Out of Harfleur', () => `The King leaves a garrison in Harfleur and marches for Calais with what is left: nine hundred men-at-arms and five thousand archers, and food for eight days. The twenty is ${perkinHere() ? 'fourteen' : 'thirteen'}, counting you. ${has('flux') ? 'You march bent over like an old man, with your hose unlaced for speed.' : 'You are one of the few with a whole gut, and men have taken to standing near you as if it might be catching.'} Everything you own must go on your back for a hundred and fifty miles. Cutler is walking down the line lifting packs and dropping them. 'If you can't run with it,' he says, 'the French will have it off you.'`, [
  { t: 'Carry a second sheaf, and let your belly go short',
    out: [`Twenty-four more arrows weigh about what a loaf does, and you know which you would rather have when the horse come. You know equally well which you would rather have on the ninth day. You pack the arrows, and tell yourself the argument is settled.`, { ar: 1 }] },
  { t: 'Carry food, and trust the Tower for arrows',
    out: [`You trade a shirt for a slab of salt pork and wrap it in the other shirt. It is the heaviest thing you own and you would not put it down to save your soul. Cutler lifts your pack, sniffs, and says nothing, from which you gather he has done the same.`, { item: 'pork' }] },
  { t: 'Carry as little as a man can',
    out: [`Bow, sheaf, knife, cup. You leave the rest on the quay at Harfleur for whoever wants it. For the first three days you are the freshest man in the twenty, and you try not to think about the other fourteen.`, { heal: 1, flag: 'light' }] },
  { t: 'You know this road by heart. Walk it.', if: () => knowsAct('march'), out: [`You shoulder what you always shoulder and fall in where you always fall in. The road has nothing new to show you before the river.`, { fast: 'march' }] }
], { place: 'Harfleur, 8 October 1415' });

scene('m_perkin_ask', 'march', 'What Perkin saw', () => `Perkin has walked beside you in silence since the church, which is not like him. At the halt he comes out with it. 'You knew. About the pyx. You told me how the rope sounds.' He is not accusing you. He is working it out slowly, the way he works out his change. 'And it's not only that. You're never surprised. Everybody else here is surprised all the time.' He looks at you. '${N()}, what are you?'`, [
  { t: 'Tell him you had a cousin who was hanged', test: ['wits', 6, 'talk'],
    win: [`It is a good lie, with a town and a year in it. He takes it, mostly. But for the rest of the march you catch him watching you when something happens, to see whether you flinch before it does.`, {}],
    lose: [`'You haven't got a cousin,' Perkin says. 'I've known you since you were six.' He does not ask again, and he does not walk beside you the next day.`, { flag: 'cold' }] },
  { t: 'Tell him all of it',
    out: [`You tell him: the quay, the awl, the dying. He listens with his mouth a little open. When you have finished he is quiet for some time. 'So you've seen me dead,' he says. You have. 'Was I brave?' You tell him the truth, which is that he was frightened and did it anyway. He nods slowly. 'That'll have to do, then,' he says, and offers you a walnut.`, { flag: ['bond', 'perkin_knows'], grit: 1, say: 'Perkin knows. He will keep close to you.' }] },
  { t: 'Tell him to ask you again in Calais',
    out: [`'Calais,' he says. 'Right.' He turns it over. 'So we get to Calais.' You have not said so, and you do not correct him. He marches better that afternoon than he has all week.`, { flag: 'bond' }] }
], { thread: 'perkin', when: () => perkinHere() && S.flags.pyxsaved });

scene('m_ieuan2', 'march', 'Where a horse will not go', `At a halt above the river Ieuan takes you out in front of the line with a hazel wand, and makes you look at a carthorse as a locksmith might show an apprentice a lock. 'There,' he says, touching the wand to its chest, 'is steel, on a destrier. And there, on the face. But a horse is mostly arse, and nobody armours that.' He paces out the distance at which a galloping horse can no longer turn aside. Then he has a carter mount the beast, and tells you to stand on the mark.`, [
  { t: 'Stand on the mark', test: ['grit', 6],
    win: [`It comes at you like a barn in a gale. You stand. At the last stride it sees that you are not going to move and goes round you, and the wind of it takes your cap off. 'There,' says Ieuan. 'A horse is not a brave animal. It only has a brave man on it, and he is not the one who decides.'`, { eye: 1, flag: 'horsecraft', say: 'You know what a charging horse will and will not do. Standing against one will go better.' }],
    lose: [`You stand until the last stride but one. The carter pulls up, laughing. Ieuan does not laugh. 'Again,' he says, and you do it again, and again, until your legs have learned what the rest of you has not.`, { b: -1, flag: 'horsecraft', say: 'You know what a charging horse will and will not do. Standing against one will go better.' }] },
  { t: 'Ask him to stand on it first',
    out: [`He shrugs and does it, with his back to the horse, cleaning his nails. It goes round him. 'I'm fifty,' he says. 'I've stood in front of English horse at Shrewsbury and Welsh horse at Usk and it is always the same horse.' You believe him. You notice he did not make you do it.`, { flag: 'horsecraft', say: 'You know what a charging horse will and will not do. Standing against one will go better.' }] },
  { t: 'Tell him you will learn it on the day',
    out: [`'Everyone does,' Ieuan says. 'That's the trouble with the day.' He gives the wand to a Cheshire man instead.`, {}] }
], { thread: 'ieuan', when: () => has('ieuan') || S.pull.ieuan >= 2 });

scene('m_cutler', 'march', 'Four men', `Cutler lost his second to the flux at Harfleur, a Kentish man he had soldiered with for ten years, and has not named another. Tonight he calls you over. 'Four men,' he says. 'The two Suffolk boys, old Hodge and the one who talks to himself. They're yours on the march. See they eat, see they've each a stake, see they're there when I count.' He looks at you. 'It's not a favour, cobbler. Men who mind other men stop minding themselves, and I'm short of fools.'`, [
  { t: 'Take the four', test: ['wits', 6],
    win: [`You find that you know how. You know which of them will drop out at a hill and which will pick a fight at a halt, since you have seen them do both. All four answer every count from there to the Somme. Cutler says nothing about it, and stops counting your end of the line himself.`, { st: 2 }],
    lose: [`Old Hodge sits down under a hedge on the third day and will not get up, and you cannot make him. Cutler strikes the name off without a word to you. You would rather he had shouted.`, { st: 1, flag: 'hodge_gone' }] },
  { t: 'Ask him why you',
    out: [`He thinks about it. 'You look at them like you've buried them already,' he says. 'I've known serjeants like that. They're careful with men, as you'd be careful with a thing you've broken once.' He does not ask how you came by the look, and you take the four.`, { st: 1, wits: 1 }] },
  { t: 'Tell him you are not the man for it',
    out: [`'No,' he says. 'Likely not.' He gives the four to a Lancashire man who shouts at them. You tell yourself you have enough to carry. You are right, and you go on feeling that you were wrong.`, {}] }
], { thread: 'cutler', when: () => S.standing >= 2 });

scene('m_reeve_enemy', 'march', 'Long way to Calais', `You wake at a halt with a weight on your chest and a hand over your mouth. It is Reeve. His knife is not out, though you need a moment to be sure of it. 'Twelve strokes,' he says, close to your ear and quite calmly. 'I counted. I've been thinking how to pay it back, and I find I'm too tired and too hungry to do it properly.' He takes his hand away. 'So I'll sell it to you. What's it worth, cobbler?'`, [
  { t: 'Give him your purse', if: () => S.coin > 0,
    out: [`He weighs it and seems neither pleased nor disappointed. 'That's the stripes paid,' he says, getting off you. 'I'll not say we're friends.' He is as good as his word on both counts. You sleep the rest of the night, which you had not expected to do.`, () => ({ c: -S.coin, flag: 'reeve_settled' })] },
  { t: 'Tell him to do it now, or never', test: ['grit', 7],
    win: [`You say it flatly, in the voice of someone who has been killed by better. He is quiet for a long moment in the dark. Then he laughs under his breath and rolls off. 'God's bones,' he says. 'What happened to you?' He does not trouble you again, and now and then you catch him studying you.`, { wits: 1, flag: 'reeve_settled' }],
    lose: [`He does a little of it now. Not much: a short blade, drawn once down your ribs, as a clerk might underline a sum. 'On account,' he says, and goes back to his blanket.`, { b: -1 }] },
  { t: 'Bite his hand and shout for Cutler',
    out: [`Cutler comes with a brand from the fire. Reeve is already sitting three paces off, yawning. 'Bad dream, vintenar,' he says. 'The lad cried out.' Cutler looks at the pair of you and believes neither. He moves his own blanket between yours and says nothing at all.`, { st: -1 }] }
], { thread: 'reeve', when: () => S.flags.reeve_enemy && !S.flags.reeve_settled });

scene('m_reeve_owes', 'march', 'What Reeve pays in', `Reeve falls in beside you on the march, which he has never done. For a mile he says nothing. Then he hands you something wrapped in a rag: a heel of bread and a strip of dried beef. 'I don't like owing,' he says. 'It sits wrong.' You have not seen bread in four days. You also know where he got it, which is from somebody who needed it as much as you do.`, [
  { t: 'Eat it',
    out: [`You eat it walking, in four bites, and it is the best thing you have ever tasted. Reeve watches you finish. 'There,' he says, comfortably. 'Quits.' He drops back to his own file, and you understand that you have been paid off cheap.`, { heal: 1, unflag: 'reeve_owes' }] },
  { t: 'Break it up among the twenty',
    out: [`It comes to a mouthful a man. Reeve watches his payment go down fourteen throats with an expression you cannot read. 'That's not how it's done,' he says. 'I owed you, not them.' He goes off shaking his head, and he seems to think he still owes you.`, { st: 1 }] },
  { t: 'Tell him a debt is not paid in stolen bread',
    out: [`'All bread's stolen,' Reeve says, 'if you go back far enough.' But he takes it away again. That night a Cheshire man finds his rations returned to his pack, short by one bite. You suspect Reeve, and then doubt it, and in the end you are fairly sure.`, { wits: 1 }] }
], { thread: 'reeve', when: () => S.flags.reeve_owes });

scene('m_reeve_fire', 'march', "Reeve's fire", `It has rained for three days and there is not a dry stick in Picardy, except that Reeve has some. Nobody knows how. He has a fire going under a wagon and is letting men sit at it for a penny each, with the air of an innkeeper. Half the twenty is steaming round it already. The other half is watching from the wet with murder in its eyes.`, [
  { t: 'Pay the penny', cost: 1,
    out: [`It is a good fire. You dry your string and your hose and the inside of your head. Reeve takes your penny with a small bow. 'Always a pleasure,' he says, 'to deal with a man of business.'`, { heal: 1 }] },
  { t: 'Kick it apart and share out the wood', test: ['grit', 6, 'melee'],
    win: [`You put your boot through it and hand the brands round. By the time Reeve is on his feet there are six small fires where there was one, and thirty men who think well of you. He looks at the six fires and does the sum. 'Bad for trade,' he says, 'that.'`, { st: 1 }],
    lose: [`Reeve has been waiting all night for somebody to try. He is up before your boot lands, and he fights exactly as you would expect of him.`, { b: -1 }] },
  { t: 'Sleep wet',
    out: [`You sleep wet, with your back to the wagon wheel, near enough to hear men's teeth stop chattering as they pay. You are a penny richer than they are, and very cold.`, {}] }
], { thread: 'reeve', when: () => reeveMet() && !S.flags.reeve_owes && !S.flags.reeve_enemy });

scene('m_wine', 'march', 'The wine at Boves', `The castle at Boves buys itself off with bread and wine, and the wine is good, and there is a great deal of it. Within the hour archers are filling their leather bottles at the vats. The King hears of it and forbids it. Somebody tells him it is hard on the men, who only want to fill their bottles. 'Their bottles?' the King is reported to say. 'They are making bottles of their bellies.' Ieuan thinks this the best thing a king has said in his lifetime. The vats are still open, though, and nobody has yet come to shut them.`, [
  { t: 'Drink while it lasts',
    out: [`You drink until France seems a reasonable country. It is the first evening since Harfleur that anybody has sung. You pay for it on the march next day, every step of nine miles, and consider it cheap.`, { heal: 1 }] },
  { t: 'Fill your bottle quietly, for a worse night', test: ['wits', 6, 'sneak'],
    win: [`You fill it at the back of the press while the provost is shouting at the front. A bottle of good wine will buy things on this march that money will not, and before the week is out you have turned it into fourpence and a favour.`, { c: 4, st: 1 }],
    lose: [`The provost's man catches you with the bottle at the vat. He empties it over your boots, slowly, while you watch.`, { st: -1 }] },
  { t: 'Stand guard on the vats, as ordered',
    out: [`Cutler has been told to find two sober men and you are one of them. You stand over a lake of wine all evening with your tongue like a board. A knight of the household rides by and notes the twenty that kept its feet. It is a thin sort of glory, and you would have preferred the wine.`, { st: 1 }] }
], { pool: 1 });

scene('m_hang', 'march', 'The man with the pyx', `The King has halted the whole army in a field beside a roadside church. An archer of somebody else's twenty has been found with the pyx from the altar in his sleeve. It is copper-gilt and worth pennies, and he took it for gold. He is to hang, and every man is to watch. The King has sworn that he will hang any man who robs a church, and he is a King who keeps his oaths. They have chosen an elm. The man under it is a boy, and he keeps saying that he did not know.`, [
  { t: 'Watch, as you are ordered',
    out: [`It takes longer than you expect. The column does not move until it is finished. Then it moves, and by the next halt men are saying that he should have known better, since that is easier to carry than what they saw.`, { eye: 1 }] },
  { t: 'Watch the King and not the elm', test: ['eye', 6],
    win: [`He sits his horse fifty paces off and does not look away once, though he does not seem to enjoy it either. You learn from his face what you would not have learned from the hanging. He is a man who does what he says he will do, whatever it costs him or you, and tomorrow or the day after you are going to need that to be true.`, { wits: 1 }],
    lose: [`He is too far off and his face is in shadow. You look back at the elm in spite of yourself, at the worst moment.`, {}] },
  { t: 'Say the prayer for the dying, aloud',
    out: [`You begin it alone. By the third line there are forty voices, and the provost looks round and cannot pick out the first. The boy on the elm hears it, and it is still a hanging. You have done the only thing that could be done about it.`, { grit: 1, st: -1 }] }
], { pool: 1, when: () => !perkinHere() });

scene('home_m_debt', 'march', "A knight's boot", `A squire comes down the column asking for the cobbler. His master is a knight of the King's household whose riding boot has split from toe to instep, and a gentleman cannot go into battle with a sock showing. The squire has the boot under his arm like a wounded pet. He offers silver. Then, seeing your face, he offers more silver, and you understand that for the first time since Winchester somebody needs you more than you need them.`, [
  { t: 'Mend it for a shilling',
    out: [`You name the price without blinking and he pays it without argument. Waxed end, close stitch, a welt that will outlast the knight. Twelve pence, for an hour's work by firelight. You think of Master Geoffrey, who would have charged four, and for a moment you forgive him the bond.`, { c: 12 }] },
  { t: 'Mend it, and ask only that his master remembers the name',
    out: [`The squire looks at you differently. He writes your name on his cuff. Two days later a serjeant of the household finds Cutler and asks which is the cobbler, and looks you over, and goes away again. Cutler says, 'You're collecting gentlemen now,' and he does not seem to mind it.`, { st: 2 }] },
  { t: "Mend it, and ask for the knight's old pair", if: () => !has('boots'),
    out: [`They come down the column that night: Cordovan leather, the real thing, cut by somebody who knew his trade. They are too big. You pack the toes with wool and resole them for marching, and you walk the rest of the way to Calais in forty shillings' worth of leather.`, { item: 'boots' }] }
]);
scene('home_m_girl', 'march', 'Michaelmas', `Michaelmas came and went somewhere behind you, on a day you spent wading a marsh. You do not know whether she waited. You will not know until Winchester, if then. The candle-end is down to the width of a thumb. You notice that you have begun to march like a man who is late for something, and the twenty has noticed too, and has started to call you the Bridegroom.`, [
  { t: 'Decide that she waited',
    out: [`You decide it, as you would decide to get up in the dark. There is no evidence for it. But a man marches better towards something than away, and you can feel the difference in your legs by the afternoon.`, { grit: 1 }] },
  { t: 'Decide that she did not, and that it changes nothing',
