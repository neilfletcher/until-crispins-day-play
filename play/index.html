/* ================= v0.22: third versions of the landing, the road out and the river; more of the battle ================= */
scene('landing_c', 'harfleur', 'Ashore', `The boats ground a bowshot from the beach, and the twenty goes over the side into water to the chest, each man with his bow held over his head and his sheaf on his shoulder like a child. You come ashore in France with your hose full of sea.

Behind the shingle there is a bank and a ditch, new dug, long enough to hold a thousand men, and there is nobody in it. Cutler stands on the edge and looks down into it for some time. 'Somebody was paid to hold that,' he says. 'I'd like to know who he was, and why he didn't.'`, [
  { t: 'Go back into the surf, and help to land the horses', test: ['arm', 6, 'labour'],
    win: [`They come over the side in slings, screaming, and have to be caught and led up the beach before they find their feet and run. You are on a halter for two days. By the end the grooms are calling you by name, and Cutler has stopped looking round to see whether you are still where he left you.`, { st: 1 }],
    lose: [`A destrier finds its feet sooner than you expected, and puts one of them on yours. You spend your first night in France sitting on the shingle with your leg in the sea.`, { b: -1 }] },
  { t: 'Walk the empty ditch from end to end', test: ['eye', 6],
    win: [`You walk it as Cutler walked it, and you see what he saw. The ditch commands the whole beach. Fifty crossbows in it would have turned the landing into a butcher's stall. Somebody dug it very well, and then somebody else forgot to fill it with men. You have learned a thing about the French, and you are not yet sure whether it is comforting.`, { wits: 1 }],
    lose: [`It is a ditch. It is quite a long one. You walk to the end of it and back, and cannot see what there was in it to keep Cutler standing there so long.`, {}] },
  { t: 'Wring out your hose, and get a fire going for the twenty',
    out: [`There is driftwood enough. By the time the twenty has finished hauling, you have a fire, and a line of wet hose steaming beside it, and something hot in a pot. Nobody thanks you. But they sit down round it without being asked, and you get your first full sleep since the Solent.`, { heal: 1 }] },
  FAST_H
], { place: 'Chef-de-Caux, 14 August 1415' });
scene('m_open_c', 'march', 'What to leave', () => `Harfleur is to be an English town, and the King has turned the French out of it with whatever they could carry. Now the army is doing the same to itself. What a man cannot march with goes to the garrison or into the ditch, and the quay is heaped with things that archers thought at Southampton they could not live without. ${has('flux') ? 'You go through your own pack bent double, with one hand on your belly.' : 'You are one of the few who can stand up straight to do it.'}

The twenty has an hour. Cutler has already thrown away his own second blanket, and is watching to see who has noticed.`, [
  { t: 'Keep the arrows, and give up the food',
    out: [`You have seen what a sheaf does and what it is like to reach for one that is not there. You strap a second sheaf across the top of your pack, and leave your share of the biscuit on the quay for the garrison. Your belly will have a good deal to say about it by the Somme. You do not expect to be listening.`, { ar: 1 }] },
  { t: 'Keep the food, and give up everything else',
    out: [`A man of the garrison has a flitch of salt pork and no use for it, since he will be eating the King's bread behind a wall. He takes your second shirt and your blanket for it. You wrap the pork in your hood. Cutler hefts your pack, and smells it, and says nothing, which you take to mean that his own smells the same.`, { item: 'pork' }] },
  { t: 'Keep nothing that will not shoot or cut',
    out: [`Bow, sheaf, knife, cup. The rest goes on the heap. You feel like a man who has paid off a debt. For three days you are the lightest thing in the column, and you pass the time trying not to think about what the others are carrying, and why.`, { heal: 1, flag: 'light' }] },
  FAST_M
], { place: 'Harfleur, 8 October 1415' });
scene('somme_c', 'march', 'The far bank', `The causeway is mended, and the army has been crossing it since noon: a thin dark line a mile long over the marsh, one horse at a time. The far bank is a bare slope with a few hundred archers on it and nothing else. If the French come now, with half the army on each side of the river and the King in the middle of it, the thing is finished. Every man on both banks knows it.

The twenty is still on the south side, waiting its turn, when a rider comes back over the causeway shouting for more bows on the far bank, at once, and never mind the order of march.`, [
  { t: 'Go over at the run, past the column', test: ['grit', 9, 'march'],
    win: [`There is no room on the straw road, so you go beside it, through the marsh itself, in water to the ribs with your bow on your head. You come up the far bank among the first hundred of the reinforcement, and plant yourself, and string. French horse show on the skyline, and look, and go away again. When the King comes over he sees who is standing on that slope. So does Cutler, arriving a quarter of an hour behind you, out of breath and trying to look as if he had sent you.`, { st: 2 }],
    lose: [`The marsh has holes in it that the straw road was built to go round. You find one. You come up downstream with a mouthful of the Somme and no cap, and cross the rest of the way hanging on to a baggage horse's tail.`, { b: -1 }] },
  { t: 'Stay, and keep the horses moving on to the causeway', test: ['arm', 8, 'labour'],
    win: [`A horse will not step on to a road that moves under it, and every third one has to be argued with. You are on a halter until dusk, leading them on and handing them off. The last across is the King's own grey. A groom tells you your name will be remembered. You doubt it, but Cutler has seen what you did.`, { st: 1 }],
    lose: [`A sumpter mule decides against the causeway and for you. It gets you above the knee. The surgeon's boy says it is not broken, and then says it again, as if he were trying to persuade one of you.`, { b: -1 }] },
  { t: "Wait for the twenty's turn", test: ['grit', 5, 'march'],
    win: [`You cross when you are told, in the middle of the column, with wet feet and your heart in your mouth. Nothing happens. It is the best kind of crossing, and nobody will ever ask you about it.`, {}],
    lose: [`You are halfway over when a length of the straw road slides sideways into the marsh, with you on it. They get you out with a boathook. Nobody will ever ask you about that, either, if you are lucky.`, { b: -1 }] }
], { place: 'The Somme, 19 October 1415' });
scene('night_c', 'eve', 'The silence', `The King has ordered silence in the English lines, and the army keeps it. Across the fields the French do not. There is singing over there, and shouting for grooms, and men say that their lords are dicing for the prisoners they mean to take tomorrow. On this side there is only the rain.

It has rained since dusk, and nobody has a tent. A bowstring is hemp and glue, and a wet one stretches like wool. By first light a slack string will throw an arrow half as far and half as hard. All along the furrows men are unstringing their bows in the dark and feeling about for somewhere dry to put the coil.`, [
  { t: 'The waxed spare is under your cap already. Lie down and keep the silence.', if: () => has('string'),
    out: [`You lie in the furrow with the coil against your scalp and listen to the French enjoying themselves. Some time before dawn their noise stops too, and the rain has the field to itself. When the twenty is roused, without a word, by a hand on each shoulder, your string comes out as dry as it went in.`, { flag: 'dry', heal: 1, learn: 'k_rain' }] },
  { t: 'You knew about this rain. Your string has been waxed and under your cap for a week.', know: 'k_rain', if: () => !has('string'),
    out: [`Men around you are feeling about in the dark for somewhere dry, and whispering curses, which the order does not seem to cover. You have nothing to look for. Ieuan, next to you, puts out a hand and feels the coil under your cap. He says nothing, since nobody may. He keeps his hand there a moment longer than he needs to.`, { flag: 'dry' }] },
  { t: 'Stay awake, with the coil inside your shirt', test: ['grit', 8], if: () => !has('string'),
    win: [`You sit with your knees up and the string against your belly, which is the last warm place you own, and you listen. A horse, over there. A man laughing. A provost's serjeant goes down the English line on his toes, looking for anybody who has made a sound. He finds you awake and wet and silent, and goes on. The string is dry in the morning.`, { flag: 'dry', learn: 'k_rain' }],
    lose: [`The silence is what does it. With nothing to listen to on your own side you go under like a stone, and wake with rain running in at your collar and out past the string. It has the feel of boiled leek.`, { flag: 'wet', learn: 'k_rain', say: 'Your string is wet. Shooting will be harder.' }] },
  { t: 'Sleep, and let the string take its chance', if: () => !has('string'),
    out: [`You wind the coil in a rag, put it under you and sleep, in a quiet so complete that you can hear the rain strike each separate furrow. You are the better for it in the morning. The string is not.`, { flag: 'wet', heal: 1, learn: 'k_rain', say: 'Your string is wet. Shooting will be harder.' }] }
], { base: 'night', place: 'Maisoncelle, the night of 24 October' });
scene('b_wing_b', 'battle', 'The end of the line', `It is over on the right. The stakes are standing in a drift of the dead, and the men who are left have sat down where they stood, since there is nobody to tell them not to. Hodge is laughing quietly at nothing.

Then from the middle of the field there comes a sound, a kind of groan out of thousands of throats, and you look left along the line in time to see the King's banner go down out of sight and come up again. Men round you are getting to their feet to look. Something has happened under that banner. It is a long bowshot from the place where Cutler put you.`, [
  { t: 'Go through the heap for the living', test: ['arm', 10],
    win: [`Not all of them are dead, and not all of the living are French. Three men down in the heap there is an English knight with the breath pressed out of him, and you get him out by the arms and sit him up. He is somebody. His squires come running. One of them puts a purse into your hand without looking at you. Further along they have found the Duke of York the same way, and too late.`, { c: 10, st: 1, learn: 'k_centre' }],
    lose: [`Not all of them are dead. One who is not has a dagger in his fist, and has been lying there for an hour waiting for somebody to bend over him.`, { b: -1, learn: 'k_centre' }] },
  { t: 'Go and see what happened under the banner',
    out: [`You walk it, since you have not the legs left to run. By the time you get there it is finished. A young lord with a fair beard is being carried off on a door, alive, with blood down his thigh. A squire lies dead across the place where he fell. The household men are all talking at once about a poleaxe. You stand and listen, a long bowshot too late.`, { learn: 'k_centre' }] }
]);
scene('bm_left', 'battle', 'The man on your left', `The man on your left makes a small surprised noise and sits down. He is one of the Cheshire archers who filled in beside the twenty, and you do not know his name. There is a crossbow quarrel through his thigh, high up, and the blood is coming in pulses.`, [
  { t: 'Tie it off above the wound', test: ['wits', 7],
    win: [`You have a bowstring round his thigh and twisted tight with an arrow shaft before you have thought about it. The pulsing stops. He looks at it, and at you, with great interest. 'Is that right?' he says. You tell him that it is. Two boys drag him back to the priests, and he goes off still asking them whether it was right.`, { st: 1, grit: 1 }],
    lose: [`You cannot get it tight. Your hands are slipping, and there is a great deal of it. He watches you try. 'Leave it, lad,' he says, quite gently, and after a little while it does not matter.`, {}] },
  { t: 'Take his arrows. He will not be needing them.',
    out: [`He sees you do it, and nods, and pushes the bag towards you with his good leg. There are fourteen in it. You use every one of them before the day is out, and you never learn what became of him.`, { ar: 1 }] },
  { t: 'Drag him back behind the stakes', test: ['arm', 7],
    win: [`You get him under the arms and go backwards with him, twenty paces, to where the boys with the sheaves can take him on. It costs you your place in the line for the space of a Paternoster. Cutler sees you go and sees you come back, and does not shout either time.`, { st: 1 }],
    lose: [`He is a big man, and the plough will not let go of his heels. You are still hauling when something comes over the stakes and takes you in the back.`, { b: -1 }] }
], { bm: 1, when: () => !S.flags.baggage });
scene('bm_mud', 'battle', 'The plough', `You go to step back, and your foot stays where it was. The plough has you to the calf. All along the line it is the same: men standing as if they had been planted, and the French in their plate sinking deeper than any of you. The difference is that you can still get out of your boots.`, [
  { t: 'Leave the boots where they are',
    out: [`You get your knife under the laces and step out of them, one and then the other. The mud is cold enough to hurt. But you can move, and nobody in sixty pounds of harness can say as much. You are a cordwainer's apprentice, barefoot in a field in Picardy. You hope that Master Geoffrey never hears of it.`, { flag: 'barefoot', say: 'Hand-to-hand fighting will go a little better in the mud.' }] },
  { t: 'Pull free, boots and all', test: ['arm', 7],
    win: [`It lets you go with a noise like a kiss. You have your boots. You made them yourself, on your master's last, and you would sooner lose a finger. You find a furrow that has been trodden hard, and you keep to it.`, { grit: 1 }],
    lose: [`You are still on one leg, hauling at the other, when a French man-at-arms who has had the same trouble and solved it comes at you on his knees with a dagger.`, { b: -1 }] },
  { t: 'Stand where you are stuck, and shoot from there', arrows: 1, test: ['eye', 7, 'shoot'],
    win: [`A man who cannot move his feet has nothing to think about but his aim. You shoot as you would at the butts, slowly, picking your man, and you do not miss. Ieuan, two places along, looks across at you with something that is nearly approval.`, { st: 1 }],
    lose: [`Without your feet under you the bow has no root. Shaft after shaft goes high. You are a mark that cannot move, and somebody over there has noticed it.`, { b: -1 }] }
], { bm: 1, when: () => !S.flags.barefoot && !S.flags.baggage });
scene('bm_third', 'battle', 'The third battle', `At the far end of the field the third French battle is still on its horses. There are thousands of them, fresh, and they have not struck a blow. They are looking at what has become of the first two. Now and then a few ride forward, and stop, and ride back again.`, [
  { t: 'Shoot at the nearest of them, to help them decide', arrows: 1, test: ['eye', 8, 'shoot'],
    win: [`It is a very long shot, and you take it as Ieuan taught you, high, and let the weight of the shaft do the rest. A horse rears in the front rank. Its rider goes off over the tail. A hundred others see it, and the whole front of them seems to lean backwards.`, { st: 1 }],
    lose: [`It falls a clear hundred paces short. A French knight rides forward, looks down at it where it stands in the plough, and rides back, shaking his head.`, {}] },
  { t: 'Shout. Everybody else is.',
    out: [`The whole line is jeering them: five thousand hoarse men, bloody to the elbows, calling the chivalry of France to come and be killed. You hear your own voice in it, saying things your mother never taught you. It is not a noble sound. It does you a great deal of good.`, { grit: 1 }] },
  { t: 'Count them', test: ['wits', 6],
    win: [`You count banners, as you would count hides in a stack, and multiply. There are more men sitting on those horses than there are Englishmen left standing. If they come, it is all to do again, and with empty bags. You say nothing about it to anybody. You do go and find more arrows.`, { eye: 1, ar: 1 }],
    lose: [`You lose your place in the count twice. There are a great many. That is as far as you get.`, {}] }
], { bm: 1, when: () => !S.flags.baggage && !!(S.played.b_close || S.played.b_close_b || S.played.b_close_c || S.played.bc_press || S.played.bc_press_b) });
/* ================= v0.23: second versions of the reason scenes on the eve ================= */
scene('home_e_debt_b', 'eve', 'Who it falls on', `Hodge is making his will, aloud, since he cannot write it: his bow to his sister's boy, his boots to whoever they fit, and fourpence that he owes a brewer in Alton to be paid out of his wages. Half the twenty is doing the same. It comes to you, listening, that if you die tomorrow the bond does not die with you. Master Geoffrey will go to your mother for the forty shillings, and she takes in washing.`, [
  { t: 'Ask the old soldiers how a man takes a prisoner', test: ['wits', 7, 'talk'],
    win: [`Hodge tells you, and Reeve puts him right. You go for a man who is down and has a good surcoat. You get his right gauntlet off him and you say your name and your captain's, loud, so that there are witnesses. Then you get him out of it before somebody cuts his throat for his rings. 'And you keep by him after,' Reeve says. 'A prisoner's worth nothing dead. Ask any man who's lost one.'`, { grit: 1, flag: 'ransomwise', say: 'Taking a prisoner, and keeping him alive, will go better.' }],
    lose: [`They laugh at you, all of them, quite kindly. 'Cobbler's going to take a lord,' Hodge says. 'Mind he doesn't take you.' You do not ask again.`, {}] },
  { t: 'Have a chaplain write that your wages go to your mother',
    out: [`He writes it on a scrap, by the light of somebody else's fire: whatever the King owes you is to go to her, and not to your master. It may not hold. A chaplain's scrap against a sealed bond is not much. But it is written down, and you find that you can lie in the mud a good deal easier for it.`, { heal: 1 }] },
  { t: 'Decide not to die, since you cannot afford it',
    out: [`You do the sum once more, and it comes out as it always does. A dead apprentice is worth his arrears. A live one with a French squire on a rope is worth forty crowns. It is the plainest piece of reckoning that you have done since Winchester, and you turn over on it and sleep.`, { wits: 1 }] }
]);
scene('home_e_girl_b', 'eve', 'The pewterer', () => `You have been thinking about the pewterer. He is forty. He has a shop in Jewry Street with glass in the window, two apprentices, and a pew in St Maurice's. You have a bow that you cannot yet properly draw, three months of the King's wages owing, and a ribbon. ${S.flags.sent ? 'You have sent her everything else you had.' : 'You have not even sent her what you had.'} It is not a comparison that gets any better for being gone over in the rain.`, [
  { t: 'Think about her instead of him',
    out: [`She did not cry on the quay. You had taken it as a compliment. Lying here, you see that it was something else: she was looking at you as she looks at a seam, to see whether it will hold. You find that you would very much like to show her. It gives your eye something to rest on that is not the French fires.`, { eye: 1 }] },
  { t: 'Tell Perkin about her', if: () => perkinHere(),
    out: [`You have never said her name aloud in France. You say it now. Perkin listens to the whole of it: the shop, the father, the pewterer, the candle. 'He's forty,' he says, when you have done. 'He'll be dead in ten years, and then she'll have the shop and you both.' He says it to cheer you. Oddly, it does. He makes you promise that he can stand up with you in the church.`, { flag: 'bond', pull: ['perkin', 1], say: 'Perkin will keep close to you.' }] },
  { t: 'Burn what is left of the candle',
    out: [`There is a stub the size of a thumbnail. You light it under your hood, and it gives you as long as it takes to say her name a few times over. Then it is a smell of hot wax, which is the smell of her father's shop. You go to sleep in it.`, { heal: 1 }] }
]);
scene('home_e_pardon_b', 'eve', "The clerk's round", () => `The Chancery clerk is going from fire to fire with his roll under his cloak, checking it against the living while there are living to check. ${S.flags.pardon_roll ? 'He finds your name, and makes a small mark beside it.' : 'He runs his finger down the page twice and does not find you. He does not seem surprised.'} ${S.flags.hawkin ? "Forty paces off, at his own company's fire, Hawkin is watching the clerk as well. He is alive, and you are the reason, and neither of you has yet found the words for it." : "There is nobody at any fire tonight who has a claim on you. You had expected that to weigh less than it does."}`, [
  { t: 'Take Hawkin a share of your fire', if: () => !!S.flags.hawkin, test: ['grit', 8],
    win: [`You carry a burning brand across to them in your bare hand, since theirs has gone out in the rain. His company stops talking. Hawkin gets up, and takes it from you, and sets it under their wood, and blows on it. When it has caught he says, 'Sit,' without turning round. You sit. That is all there is to it. You walk back afterwards as if you had put down a pack.`, { arm: 1, heal: 1 }],
    lose: [`You get half the distance. He sees what you are carrying and stands up, and shakes his head once. You stand there with the brand burning down towards your fingers. Then you go back. It was fair of him.`, {}] },
  { t: 'Ask the clerk what a pardon is worth to a dead man',
    out: [`He answers as if it were a question about the weather. 'To him, nothing. To his people, a good deal. His goods are not forfeit. He may lie in the churchyard and not at the crossroads. His mother may hold up her head.' He rolls up his roll. 'That is why men ask to be put on it the night before,' he says, 'and not the night after.'`, { grit: 1 }] },
  { t: 'Take out the note, and hold it',
    out: [`It has been in your shoe since Southampton and has taken the shape of your foot. You cannot read a word of it. But you know where the seal is, and you put your thumb on that and keep it there, as another man might keep his thumb on a saint.`, { heal: 1 }] }
]);
scene('home_e_vow_b', 'eve', 'The eve of the feast', () => `The chaplains are hearing confessions by the hundred, in the rain, and one of them is telling every man who kneels to him what tomorrow is. It is the feast of Crispin and Crispinian, he says, and a good day to die on, if a man must. He means it for a comfort. ${S.flags.vow_altar ? 'You left your offering at their altar in Southampton.' : 'You have left them no offering.'} ${S.flags.vow_soissons ? 'You have heard what was done in their own city by the men across the field.' : ''} The lead token on its thong has worn a mark on your breastbone the shape of two small men.`, [
  { t: 'Ask a chaplain to say their Mass at first light, and serve it for him', test: ['grit', 7, 'saint'],
    win: [`You might have asked him for the moon. Then he says yes. You are up before anybody, in the dark, holding a soaked book for a priest who knows the office by heart and does not need it. He says it over a cart tail, for the two of you and the rain. At the end your hands are quite steady. You could not say when they stopped shaking.`, { arm: 1, flag: 'vigil', say: 'For tomorrow, tests of Grit will go a little better.' }],
    lose: [`He has four hundred men still to shrive and no time for a cobbler's saints. 'They will hear you from where you are, my son,' he says. You hope that he is right. You have reason to think they are a little deaf.`, {}] },
  { t: "Go round the twenty's boots with your awl",
    out: [`It is their trade, and it is yours, and there are fourteen pairs of boots here that will be asked to stand in a ploughed field all day. You go from man to man in the dark. A stitch here, a thong there. Nobody thinks it strange. Cutler holds out his own without a word. It is the nearest thing to a prayer that you have ever been any good at.`, { st: 1, wits: 1 }] },
  { t: 'Hang the token on your bowstave, and sleep',
    out: [`You loop the thong round the upper limb, where it will swing in front of your face when you draw. If they want to see what you do tomorrow, they will have the best place on the field. You tell them so. Then you pull your hood down and, somewhat to your surprise, you sleep.`, { heal: 1 }] }
]);

function pickThread(act) {

    if (!id) return;
    const fresh = M.runs >= 1 && !Object.keys(TH[t]).some(a => [].concat(...TH[t][a].map(x => [].concat(x))).some(x => M.seen[x]));

}
function pickIncident(act) {
