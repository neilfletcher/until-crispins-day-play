<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Until Crispin's Day</title>
<meta name="description" content="August 1415. You are a cordwainer's apprentice with a borrowed bow, the twentieth man of twenty archers, and the King is taking an army to France. A choice-led story game of the Agincourt campaign.">
<meta property="og:title" content="Until Crispin's Day">
<meta property="og:description" content="A choice-led story game of the Agincourt campaign. One archer, from Southampton quay to St Crispin's Day.">
<meta property="og:type" content="website">
<script async src="https://www.googletagmanager.com/gtag/js?id=G-JF54HQGVLT"></script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alegreya:ital,wght@0,400;0,500;0,700;1,400&family=Alegreya+Sans+SC:wght@500;700&family=IM+Fell+English:ital@0;1&display=swap" rel="stylesheet">
<style>
:root{
  /* Layout: one reading column for the story, a narrow kit-and-wounds sheet beside it.
     One visual world: wet plough, tallow light, dried blood. Single theme by choice. */
  --peat:#181613;
  --mud:#23201b;
  --clay:#39332a;
  --bone:#e8e0d0;
  --ash:#a59c8a;
  --blood:#c2412a;
  --tallow:#dab65c;
  --display:'IM Fell English','Iowan Old Style','Palatino Linotype',Georgia,serif;
  --body:'Alegreya','Iowan Old Style',Georgia,serif;
  --label:'Alegreya Sans SC','Gill Sans','Trebuchet MS',sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{background:var(--peat)}
html,body{margin:0}
body{background:var(--peat);color:var(--bone);font-family:var(--body);font-size:19px;line-height:1.55;
  background-image:radial-gradient(1200px 500px at 20% -10%,rgba(218,182,92,.07),transparent 70%)}
button{font-family:inherit;color:inherit}
.wrap{max-width:1080px;margin:0 auto;padding:20px 18px 48px}

.top{display:flex;align-items:baseline;justify-content:space-between;gap:8px 20px;flex-wrap:wrap;border-bottom:1px solid var(--clay);padding-bottom:10px}
.top h1{font-family:var(--display);font-weight:400;font-size:clamp(30px,5vw,44px);line-height:1;margin:0;letter-spacing:.01em}
.top p{margin:0;font-family:var(--label);font-size:15px;letter-spacing:.08em;color:var(--ash)}
.topr{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;justify-content:flex-end}
.topr #runlabel{margin-right:6px}
.menubtn.new{border-color:var(--tallow);color:var(--tallow)}
.menubtn{font-family:var(--label);font-weight:700;font-size:14px;letter-spacing:.09em;padding:5px 12px;background:transparent;border:1px solid var(--ash);border-radius:3px;cursor:pointer}
.menubtn:hover{border-color:var(--tallow);color:var(--tallow)}
body[data-view="title"] .top{display:none}
body:not([data-view="game"]) .track,body:not([data-view="game"]) #runlabel{display:none}
body[data-view="menu"] .menubtn,body[data-view="saves"] .menubtn,body[data-view="help"] .menubtn,body[data-view="codex"] .menubtn{display:none}
.story p.who{margin:6px 0 10px}
.story p.who .mem{color:var(--tallow);font-size:15.5px}
.bigtitle{font-family:var(--display);font-weight:400;font-size:clamp(46px,9vw,84px);line-height:.95;margin:6px 0 20px;text-wrap:balance}
.menu{display:flex;flex-direction:column;gap:9px;max-width:440px;margin-top:22px}
.menu .go{margin-top:0;text-align:left}
.story p.ver a{color:var(--tallow)}
.story p.ver + p.ver{margin-top:6px}
.story p.ver{font-family:var(--label);font-size:13.5px;letter-spacing:.06em;color:var(--ash);margin-top:26px}
.story p.sub{margin:22px 0 6px}
.slotbtns{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.slotbtns button,.textbtn{font-family:var(--label);font-weight:700;font-size:14px;letter-spacing:.06em;padding:7px 12px;border:1px solid var(--ash);border-radius:3px;background:transparent;cursor:pointer}
.slotbtns button:hover,.textbtn:hover{border-color:var(--tallow);color:var(--tallow)}
.slotbtns button.sure{border-color:var(--blood);color:var(--blood)}
.slot{background:var(--mud);border:1px solid var(--clay);border-radius:3px;padding:11px 14px}
.slot.on{border-color:var(--tallow)}
.slot small{display:block;color:var(--ash);font-size:15.5px;line-height:1.35}
.savetext{width:100%;min-height:92px;margin-top:8px;font:13px/1.3 ui-monospace,Menlo,Consolas,monospace;background:var(--mud);color:var(--bone);border:1px solid var(--clay);border-radius:3px;padding:8px;word-break:break-all}
.track{list-style:none;margin:12px 0 0;padding:0;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px}
.track li{font-family:var(--label);font-size:13px;letter-spacing:.07em;color:#7d7566;border-top:3px solid var(--clay);padding-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.track li.done{color:var(--ash);border-top-color:#6b6253}
.track li.now{color:var(--bone);border-top-color:var(--blood)}

.main{display:grid;grid-template-columns:minmax(0,1fr) 270px;gap:34px;margin-top:26px;align-items:start}
.story{min-width:0;max-width:66ch;animation:rise .28s ease-out}
@keyframes rise{from{opacity:.6;transform:translateY(4px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.story{animation:none}}
.eyebrow{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;font-family:var(--label);font-size:14px;letter-spacing:.09em;color:var(--ash);margin:0 0 6px}
.pips{letter-spacing:3px;color:var(--blood);font-size:15px;white-space:nowrap}
.pips i{font-style:normal;color:#5a5245}
.pips b{font-family:var(--label);font-weight:500;letter-spacing:.09em;color:var(--ash);font-size:14px;margin-right:4px}
.story h2{font-family:var(--display);font-weight:400;font-size:clamp(30px,4.6vw,42px);line-height:1.05;margin:0 0 16px;text-wrap:balance}
.story p{margin:0 0 14px}
.story p.bridge{font-style:italic;color:var(--ash);border-left:2px solid var(--clay);padding-left:12px}
.story p.again{font-style:italic;color:var(--tallow);font-size:16.5px}

.choices{display:flex;flex-direction:column;gap:9px;margin-top:22px}
.choice{text-align:left;background:var(--mud);border:1px solid var(--clay);border-left:3px solid var(--ash);border-radius:3px;padding:11px 14px 10px;font-size:18.5px;line-height:1.3;cursor:pointer}
.choice:hover:not(:disabled),.choice:focus-visible{border-color:var(--tallow);border-left-color:var(--tallow);background:#2a2620}
.choice:disabled{opacity:.42;cursor:default}
.sub2{display:block;font-size:16px;color:var(--ash);margin-top:4px;line-height:1.4}
.namein{display:flex;flex-direction:column;gap:5px;font-family:var(--label);font-size:14px;letter-spacing:.09em;color:var(--ash);margin:18px 0 0;max-width:280px}
.namein input{font:500 20px var(--body);padding:8px 10px;background:var(--mud);color:var(--bone);border:1px solid var(--ash);border-radius:3px}
.road,.journal ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;font-size:14.5px;line-height:1.3}
.road b,.journal b{font-family:var(--label);font-weight:500;letter-spacing:.05em;color:var(--ash);font-size:12.5px;display:block}
.road small,.journal small{display:block;color:var(--ash)}
.journal{margin-top:16px;font-size:16px}
.journal summary{cursor:pointer;font-family:var(--label);letter-spacing:.08em;font-size:14px;color:var(--tallow);margin-bottom:8px}
.tags{display:flex;gap:6px 12px;flex-wrap:wrap;margin-top:5px;font-family:var(--label);font-size:13.5px;letter-spacing:.06em;color:var(--ash)}
.tags .mem{color:var(--tallow)}
.tags .dead{color:#e2735c}
body[data-size="1"] .wrap{zoom:1.15}
body[data-size="2"] .wrap{zoom:1.3}

.outcome{border-left:3px solid var(--tallow);padding-left:16px;margin-top:6px}
.outcome.fatal{border-left-color:var(--blood)}
.fx{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 0;padding:0;list-style:none}
.fx li{font-family:var(--label);font-size:14px;letter-spacing:.05em;padding:2px 8px;border:1px solid var(--clay);border-radius:2px;color:var(--bone)}
.fx li.bad{color:var(--blood);border-color:#5d2a1e}
.fx li.mem{color:var(--tallow);border-color:#5f5026}
.note{font-style:italic;color:var(--tallow)}
.go{margin-top:20px;font-family:var(--label);font-weight:700;font-size:17px;letter-spacing:.09em;padding:11px 22px;background:var(--bone);color:var(--peat);border:0;border-radius:3px;cursor:pointer}
.go:hover{background:#fff}
.go.grim{background:var(--blood);color:#fff}
.go.grim:hover{background:#d6513a}
.quiet{background:none;border:0;padding:4px 0;margin-top:14px;font-family:var(--label);font-size:14px;letter-spacing:.06em;color:var(--ash);text-decoration:underline;cursor:pointer;display:block}

.sheet{border:1px solid var(--clay);border-radius:4px;background:var(--mud);padding:14px 16px 16px;font-size:16px;line-height:1.35;display:flex;flex-direction:column;gap:12px}
.sheet[hidden]{display:none}
.sheet h3{font-family:var(--label);font-weight:700;font-size:13px;letter-spacing:.11em;color:var(--ash);margin:0 0 5px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:4px 14px;margin:0}
.stats div{display:flex;justify-content:space-between;gap:8px;border-bottom:1px dotted var(--clay);padding-bottom:2px}
.stats dt{color:var(--ash)}
.stats dd{margin:0;font-variant-numeric:tabular-nums}
.kit{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:5px}
.kit li small{display:block;color:var(--ash);font-size:14px}
.kit li.ill{color:var(--blood)}
.sheet p{margin:0;color:var(--ash)}

.shop{display:flex;flex-direction:column;gap:7px;margin:14px 0}
.up{display:grid;grid-template-columns:1fr auto;gap:2px 12px;align-items:center;background:var(--mud);border:1px solid var(--clay);border-radius:3px;padding:9px 12px}
.up b{font-weight:700}
.up.sworn{border-color:var(--tallow)}
.up small{display:block;color:var(--ash);font-size:15px}
.up .rank{color:var(--tallow);letter-spacing:2px;font-size:13px}
.up button{font-family:var(--label);font-weight:700;font-size:14.5px;letter-spacing:.06em;padding:7px 12px;border:1px solid var(--tallow);border-radius:3px;background:transparent;color:var(--tallow);cursor:pointer;white-space:nowrap}
.up button:hover:not(:disabled){background:var(--tallow);color:var(--peat)}
.up button:disabled{border-color:var(--clay);color:#746c5d;cursor:default}
.known .src{display:block;color:var(--ash);font-size:14px;font-style:italic}
.others li{margin-bottom:6px}
.others .mem{color:var(--tallow)}
.how li{color:var(--bone);font-size:18px;margin-bottom:4px}
.how li.new{color:var(--tallow)}
.how li.new b{font-family:var(--label);font-size:13px;letter-spacing:.09em;text-transform:uppercase;border:1px solid var(--tallow);border-radius:3px;padding:1px 6px;margin-right:6px;vertical-align:2px}
.known{margin:0;padding:0 0 0 18px;color:var(--ash);font-size:16.5px;display:flex;flex-direction:column;gap:3px}
.purse{font-family:var(--label);font-size:16px;letter-spacing:.07em;color:var(--tallow);margin:0}
.sub{font-family:var(--label);font-weight:700;font-size:14px;letter-spacing:.11em;color:var(--ash);margin:20px 0 4px}

.chapter{border:1px solid #6b6253;outline:1px solid var(--clay);outline-offset:5px;background:rgba(218,182,92,.035);padding:30px 30px 26px;margin:8px 6px 6px;text-align:center}
.chapter .chapn{font-family:var(--label);font-weight:700;font-size:14px;letter-spacing:.2em;color:var(--tallow);margin:0 0 10px}
.chapter h2{margin-bottom:6px}
.chapter .sub{margin:0}
.chapter .chaprule{width:90px;height:0;border-top:1px solid var(--tallow);margin:18px auto 20px;opacity:.7}
.chapter p:not(.chapn):not(.sub){text-align:left}
.chapter .go{margin-top:8px}
html.framed{height:100%;overflow:hidden}
html.framed body{height:100%;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
:focus-visible{outline:2px solid var(--tallow);outline-offset:2px}

@media (max-width:820px){
  body{font-size:18px}
  .main{grid-template-columns:1fr;gap:26px}
  .track li{font-size:11.5px}
}
@media (max-width:520px){
  .wrap{padding:14px 16px 40px}
  .top h1{font-size:27px}
  .topr{width:100%;justify-content:flex-start;align-items:center;gap:8px}
  .topr #runlabel:empty{display:none}
  .menubtn{min-height:40px;padding:6px 12px}
  .track li{font-size:0;overflow:visible}
  .track li.now{font-size:12px}
  .track li.now:nth-child(n+4){direction:rtl}
  .chapter{padding:22px 18px 20px;margin:8px 5px 6px}
}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>Until Crispin's Day</h1>
    <div class="topr"><p id="runlabel"></p><button class="menubtn" id="howbtn" type="button" data-act="help">How it works</button><button class="menubtn" type="button" data-act="menu">Menu</button></div>
  </header>
  <nav aria-label="How far you have come"><ol class="track" id="track"></ol></nav>
  <main class="main">
    <article class="story" id="story" aria-live="polite"></article>
    <aside class="sheet" id="sheet" aria-label="What you carry"></aside>
  </main>
</div>

<script>
(() => {
'use strict';

/* ================= engine data ================= */
const KEY = 'until-crispins-day-v1';
const ACTS = ['soton', 'harfleur', 'march', 'eve', 'battle'];
const ACT_NAME = { soton: 'Southampton', harfleur: 'Harfleur', march: 'The march', eve: 'The eve', battle: "Crispin's Day" };
const ACT_LOC = { soton: 'Southampton', harfleur: 'Before Harfleur', march: 'The road to Calais', eve: 'Maisoncelle', battle: "Agincourt, St Crispin's Day" };
const ACT_PLACE = { soton: 'Southampton, August 1415', harfleur: 'Before Harfleur', march: 'The road to Calais, October', eve: 'Maisoncelle, 24 October', battle: "Agincourt, St Crispin's Day" };
const DIED_WHERE = { soton: 'at Southampton, which takes some doing', harfleur: 'before the walls of Harfleur', march: 'on the road to Calais', eve: 'the night before the battle', battle: 'in the mud at Agincourt' };
const DEATH_LINE = {
  soton: 'You die in Southampton, before you have so much as seen France. The clerk strikes your name through and uses the line again.',
  harfleur: 'They put you in the long trench with the others, and a priest says one set of words over forty men to save time.',
  march: 'The column does not stop for you. A column never stops for anyone.',
  eve: 'You are dead before the battle, which the others will later agree was the clever way to go about it.',
  battle: 'The mud takes you in as though it has been waiting, and it has.'
};
const HARD = { soton: 0, harfleur: 2, march: 2, eve: 2, battle: 7 };
const STAT = { arm: 'Arm', eye: 'Eye', wits: 'Wits', grit: 'Grit' };
const ITEM = {
  string:  { n: 'Dry string',         d: 'Waxed hemp, coiled under your cap.' },
  yew:     { n: 'Venetian yew bow',   d: 'Shoots harder than you deserve.', b: { shoot: 1 } },
  bodkins: { n: 'Bodkin heads',       d: 'For plate, at close range.', b: { close: 2 } },
  maul:    { n: 'Lead maul',          d: 'Five pounds of argument.', b: { melee: 2 } },
  dagger:  { n: 'Rondel dagger',      d: 'Taken underground.', b: { melee: 1 } },
  boots:   { n: 'Sound boots',        d: 'Your own work. They will last.', b: { march: 1 } },
  badge:   { n: "The cobblers' badge", d: 'Crispin and Crispinian. Once, when you fail at something that would cost you blood, or at anything in the battle, it gives you a second try. Then it cracks.' },
  beer:    { n: 'Small-beer habit',   d: 'Nothing a brewer has not boiled.', b: { flux: 3 } },
  root:    { n: 'Tormentil root',     d: 'Binds what wants loosing.' },
  pork:    { n: 'Salt pork',          d: 'Three days of not being hungry.', b: { march: 1 } },
  jack:    { n: 'Padded jack',        d: 'Twenty layers of linen. One more wound in you.', hp: 1 },
  hat:     { n: 'Kettle hat',         d: 'Somebody else\'s. One more wound in you.', hp: 1 },
  stake:   { n: 'Ash stake',          d: 'Six feet, both ends, fire-hardened.', b: { cav: 2 } },
  peacock: { n: "Ieuan's peacock shafts", d: 'For when you can see the rivets.', b: { close: 2 } },
  ibow:    { n: "Ieuan's bow",        d: 'Like drawing a church door.', b: { shoot: 2 } },
  dbow:    { n: "Dickon's bow",       d: 'Better than yours. He would want it used.', b: { shoot: 1 } },
  ieuan:   { n: "Ieuan's teaching",   d: 'Feet, elbow, back. And cheese.', b: { shoot: 1 } },
  flux:    { n: 'The flux',           d: 'Weak as water. Everything is harder.', b: { march: -1, shoot: -1, melee: -1, labour: -1 }, ill: 1 }
};
const KNOW = {
  k_dice: "Cutler's bone die has a six that comes up as if it were paid to.",
  k_plot: 'Cambridge, Scrope and Grey mean to kill the King before the fleet sails. The Earl of March goes to the King with it, and they lose their heads outside the Bargate.',
  k_shell: 'The mussels off the Harfleur mud carry the flux.',
  k_sortie: 'The garrison of Harfleur sallies from the Leure gate by night.',
  k_pyx: 'The King hangs the man who takes the pyx from the church. He was your friend.',
  k_ford: 'Blanchetaque is staked and held. There is no crossing there.',
  k_desert: 'Men who leave the column are found by the country people. It is not quick.',
  k_dickon: 'Your brother Dickon takes the flux at Harfleur in the first week of September.',
  k_suffolk: "The young Earl of Suffolk's banner goes down on the right, and every man near it with him. Dickon stands under it.",
  k_tok1: 'Cutler has taken twenty men over the water three times and never brought twenty back. He has told nobody.',
  k_tok2: "The names Cutler will cut on his tally at Harfleur: Simkin, the two Johns, Wat, Hobbe, and a lad from Alton.",
  k_tok3: "Cutler's wife is Joan, at the Angel in Alresford, and his money is under the hearthstone.",
  k_home: 'Going home does not end it. You fall asleep in Winchester and wake on the quay.',
  k_baggage: 'While the battle is being fought, the baggage at Maisoncelle is plundered.',
  k_rain: 'It rains the whole night before the battle, and a wet string will not throw an arrow.',
  k_cav: 'One horse gets through the stakes where you stand. You would know it again.',
  k_centre: "Whatever decides the day happens in the centre, under the King's banner.",
  k_gloucester: "The King's brother goes down before the banner, and a man with a poleaxe comes for him from the left while everyone watches the King."
};
const UP = [
  { id: 'arm',    n: 'Bow arm',                 d: 'Your back remembers the work. You start every waking with +1 Arm.', cost: [4, 6, 9, 12] },
  { id: 'eye',    n: "Marksman's eye",          d: 'You have seen where the arrows go. You start every waking with +1 Eye.', cost: [4, 6, 9, 12] },
  { id: 'wits',   n: 'A quick tongue',          d: 'You know what they will say next. You start every waking with +1 Wits.', cost: [4, 6, 9, 12] },
  { id: 'grit',   n: 'Seen worse',              d: 'It is hard to frighten a man with his own death. You start every waking with +1 Grit.', cost: [4, 6, 9, 12] },
  { id: 'blood',  n: 'Hard to kill',            d: 'You start every waking able to take one more wound.', cost: [4, 7, 10] },
  { id: 'purse',  n: 'Where the pennies are',   d: 'You know who drops his purse on the quay. You start every waking with 6d more.', cost: [2, 4] },
  { id: 'name',   n: 'A face Cutler half knows', d: 'He cannot say why he trusts you. You start every waking with +1 Standing.', cost: [5, 8] },
  { id: 'string', n: 'The stringer by the quay', d: 'Wake with a waxed string already under your cap.', cost: [3] },
  { id: 'badge',  n: "The cobblers' badge",     d: 'Wake with the pewter saints pinned over your heart. Once in each waking, a failure that would wound you is tried again.', cost: [6] },
  { id: 'notyet', n: 'Not yet',                 d: 'Once each waking, the blow that should kill you does not.', cost: [9] }
];

const $ = id => document.getElementById(id);
const rnd = Math.random;
const pick = a => a[Math.floor(rnd() * a.length)];
const d6 = () => 1 + Math.floor(rnd() * 6);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const P2D6 = [1, 1, 1, 35 / 36, 33 / 36, 30 / 36, 26 / 36, 21 / 36, 15 / 36, 10 / 36, 6 / 36, 3 / 36, 1 / 36];
const pNeed = n => n <= 2 ? 1 : n > 12 ? 0 : P2D6[n];
const ordinal = n => { const w = ['first', 'second', 'third', 'fourth', 'fifth', 'sixth', 'seventh', 'eighth', 'ninth', 'tenth', 'eleventh', 'twelfth']; if (n <= 12) return w[n - 1]; const s = n % 100, e = (s > 10 && s < 14) ? 'th' : ['th', 'st', 'nd', 'rd'][n % 10] || 'th'; return n + e; };
const money = d => d >= 12 ? Math.floor(d / 12) + 's' + (d % 12 ? ' ' + d % 12 + 'd' : '') : d + 'd';

let M = null, S = null, sure = false;
const has = i => S.items.includes(i);
let BLIND = false;
const kn = k => !BLIND && !!M.known[k];
const bonded = () => S.flags.bond && !S.flags.cold;
const perkinHere = () => S.perkin === 'here';

/* ================= scenes ================= */
const SC = {};
function scene(id, act, title, text, choices, extra) { SC[id] = Object.assign({ id, act, title, text, choices }, extra || {}); }

/* ---- waking ---- */
scene('wake', 'soton', 'The quay', () => M.runs === 0
  ? `The quay stinks of tar and horse and the breath of twelve thousand men waiting on a wind. You have a borrowed bow, a blister where the string bites, and no idea where you are meant to stand.

Vintenar Hob Cutler finds you before you find him. He looks you over the way a fishmonger looks at a herring he has been asked to take back. 'Name on the roll, stand where I can see you, and try not to die before we sail,' he says. 'It upsets the clerks.'

Down the line the rest of the twenty are sizing you up, or not troubling to. Perkin, the baker's boy from your street, has signed on as well. You cannot see him, but you can hear him, somewhere along the quay, telling a stranger his business.`
  : `Tar. Gulls. The quay at Southampton under your boots, and Cutler saying the same words in the same order to the same twenty men. You died ${M.last || 'in France'}. You remember all of it. In your fist is a cobbler's awl you do not remember picking up, and your boots, which were rotten through, are sound.

${[
    'Nobody else knows. Somewhere along the quay Perkin is telling a stranger his business, in exactly the words he used the last time.',
    'You have now been buried more often than most parishes manage in a year. The awl is warm.',
    'You try, briefly, to work out what you did to deserve this. The list is long, but nothing on it seems worth a saint\'s attention.',
    'Crispin and Crispinian, the cobblers\' saints, were drowned, boiled and beheaded before they consented to stay dead. You begin to see what kind of patrons they are.',
    'Cutler gets to \'it upsets the clerks\' and you find you have said it along with him. He gives you a look that could curdle ale.',
    'The feast of the two saints falls on the twenty-fifth of October. You have started to think of it as an appointment.',
    'A gull lands on the same bollard, as it always does, and regards you as a creditor would.',
    'You have started to feel sorry for the gull.',
    'It comes to you that you are now the oldest man in this army by some distance, and the only one of your age who cannot grow a beard.',
    'You know the knots in the planking. You know which bollard the dog will choose.',
    'Cutler says his piece. You have heard it so often that it has begun to sound like kindness.',
    'You are tired in a place that sleep does not reach.',
    'You did not even die this time. You came through the whole of it and lay down among the living, and it was not enough. Something more is wanted than your skin.',
    'You did what was asked on the day, and here you are all the same. Something is still owing, to somebody.'
  ][M.lastHow && M.lastHow !== 'dead' ? 12 + (M.lastHow === 'won' ? 1 : 0) : (M.runs - 1) % 12]}${M.want ? '\n\n' + WAKE_WANT[M.want] : ''}`, [
  { t: 'Find Perkin before he finds trouble', out: [`You fall in beside him. He has already lost his whetstone and made three friends. 'They say France is all wine and widows,' he tells you. You say you have heard different. He is sixteen and has decided to enjoy the war, and it is hard to stand next to that and not feel better about things.`, { flag: 'bond', pull: ['perkin', 2], say: 'Perkin will keep close to you.' }] },
  { t: "Get to the Tower's arrow carts before they are picked over", out: [`The King's fletchers have sent sheaves down from the Tower by the wagonload, and the clerks hand them out with the air of men giving away their daughters. You have your own sheaf already. You talk your way to another by signing for a man who has not arrived yet. If he ever does arrive, that is a problem for France.`, { ar: 1 }] },
  { t: 'Stand where Cutler can see you being useful', out: [`You carry, you stack, you hold a horse that does not want holding. Cutler says nothing, which you will learn is the top of his range. Later he tells another vintenar that the cobbler's boy 'might be worth the ship's biscuit', and it gets back to you.`, { st: 1, pull: ['cutler', 2] }] },
  { t: 'You know these ten days by heart. Walk through them.', hint: 'quicker, but you gain less on the way', if: () => knowsAct('soton'), out: [`You make your mark and let the days come. There is nothing in them that you have not met before, and you find you can go through them almost without looking.`, { fast: 'soton' }] }
]);

/* ---- Southampton pool ---- */
scene('s_butts', 'soton', 'The butts outside the Bargate', `Every archer in the army is shooting at the marks outside the town wall, and from the sound of it most of them are missing. Your bow draws a little under what a war bow should, and your back knows it. Along the line a grey Welshman called Ieuan is putting shafts into a hand-sized clout at twelve score paces without appearing to look, and talking the whole time about the price of cheese.`, [
  { t: 'Shoot until your fingers bleed', test: ['arm', 7, 'labour'],
    win: [`Somewhere past the two hundredth arrow your shoulders stop arguing and start to learn. The draw comes back to your ear in one piece. Your fingers look like a butcher's apron, but the bow has started to feel like part of you, and a bad-tempered part at that.`, { arm: 1 }],
    lose: [`Something in your shoulder lets go with a sound like a wet stick. The surgeon's boy binds it, tells you to rest it for a month, and laughs at his own joke.`, { b: -1 }] },
  { t: 'Watch the Welshman and copy what he does', test: ['eye', 7],
    win: [`He never aims. He looks at the mark, and the bow comes up, and the arrow is simply where he was looking. You stop trying to steer and start trying to see, and the clout begins to collect your shafts as well as his.`, { eye: 1 }],
    lose: [`You copy his stance, his breathing and, by mistake, his limp. The clout is in no danger. Ieuan tells you kindly that the French will be bigger than that, and closer, and coming towards you, which should help.`, {}] },
  { t: 'Ask Ieuan to teach you', test: ['wits', 8, 'talk'],
    win: [`'Teach you?' He looks at your hands. 'Cobbler. Good. You know about waxed thread and you know about patience.' He moves your feet, then your elbow, then your whole idea of what your back is for. He wants nothing for it but an audience for the cheese.`, { item: 'ieuan' }],
    lose: [`He says something in Welsh. The men who understand it laugh for some time. You have the feeling it will follow you to France.`, {}] }
], { thread: 'ieuan' });

scene('s_dice', 'soton', "Cutler's dice", `The company is waiting on the wind and the wind is in no hurry, so Cutler has a blanket down behind the fish sheds and a pair of bone dice going. He wins more than a man should and loses just often enough to keep the blanket full. 'Cobbler,' he says, without looking up. 'You've been paid. It'd be a sin to let you keep it.'`, [
  { t: 'Play him', test: ['wits', 8], cost: 2, keep: 1,
    win: [`You notice that he only bets heavy on his own throw, so you only bet heavy on yours. It is not clever but it is enough. You come away up, and Cutler watches you go with more interest than affection.`, { c: 8 }],
    lose: [`The six comes up for him as if it were paid to. You lose steadily and politely, and it takes you until the last penny to wonder whether both of those dice have ever been on the same side of an honest table.`, { c: -4, learn: 'k_dice' }] },
  { t: 'Pick up his die, weigh it in your palm, and say nothing', know: 'k_dice',
    out: [`You roll it across your knuckles the way he does and set it down six-up without throwing it. Nobody else sees. Cutler takes a long breath, then slides a stack of pennies over as if settling a debt. 'Sharp eyes,' he says quietly. 'Keep them pointed at the French.' From him that is close to affection.`, { c: 10, st: 1 }] },
  { t: 'Watch the game and keep your purse shut', test: ['eye', 8],
    win: [`You count throws. In forty casts Cutler's own die shows six nineteen times. It could be the favour of God, but God does not usually shave bone.`, { learn: 'k_dice' }],
    lose: [`You watch for an hour and learn only that Perkin should not be allowed near a wager. He has lost his spare hose and seems cheerful about it.`, {}] }
], { thread: 'cutler' });

scene('s_plot', 'soton', 'Something heard at the Bargate', `You are sent up to the town for lamp oil and come back by the wrong alley. Through a shutter you hear well-fed voices not bothering to whisper: the Earl of March on the throne, the King and his brothers dead before the fleet sails, and Lord Scrope's name, and Cambridge's, and Sir Thomas Grey's. Then a chair scrapes and you remember that you are a cobbler's boy standing under a window with an oil jar.`, [
  { t: 'Take it to Cutler', test: ['wits', 8, 'talk'],
    win: [`He hears you out, then walks you to a serjeant-at-arms, who walks you to a clerk, who writes for a long time. Two days later the three lords are taken. By then the Earl of March, whom they meant to make king, has gone to the King himself and told him all of it. They lose their heads outside the Bargate before the fleet sails. Nobody thanks you, exactly, but Cutler has started using your name.`, { st: 2, learn: 'k_plot', echo: { at: 'harfleur', t: "A serjeant-at-arms of the King's household nods to you in the trenches. You last saw him writing down three names at Southampton." } }],
    lose: [`'You heard lords plotting,' Cutler says, 'through a wall. With an oil jar.' He gives you latrine duty for spreading alarm. Two days later the Earl of March goes to the King with the whole of it, and three men lose their heads outside the Bargate. Cutler does not apologise, but he does take you off the latrines.`, { st: -1, learn: 'k_plot' }] },
  { t: "Forget you heard it. Lords' business gets cobblers hanged.",
    out: [`You carry the oil back and keep your mouth shut. Two days later the plot comes out anyway: the Earl of March himself went to the King with it, and Cambridge, Scrope and Grey lose their heads outside the Bargate. You watch from the crowd, and feel sick for more than one reason.`, { learn: 'k_plot' }] },
  { t: 'Give Cutler the three names, and tell him March will confess it all to the King by Wednesday', know: 'k_plot',
    out: [`You give him three names, the day, and the man who will turn. He stares at you. On Wednesday the Earl of March goes to the King, exactly as you said, and Cutler comes to find you. 'I don't want to know how,' he says, and presses silver into your hand as though it might bite him. 'I want to know if you hear anything else.'`, { st: 2, c: 6 }] }
], { thread: 'cutler' });

scene('s_merchant', 'soton', 'Quayside prices', `Every chandler, fletcher and thief in Hampshire has a stall on the quay this week. The prices have doubled since the army arrived and the quality has gone the other way. You have what is left of your first pay and a strong sense that France will not have shops.`, [
  { t: 'A hank of waxed hemp strings', cost: 3, out: [`The stringer waxes them in front of you and coils one small enough to sit under a cap. 'Keep it on your head and off your bow till you need it,' she says. 'Wet string, dead archer. I don't do refunds for either.'`, { item: 'string' }] },
  { t: "A sheaf's worth of bodkin heads", cost: 6, out: [`Long, square and nasty: needle points made to go through mail and whatever is behind it. The smith says they are Tower pattern. They are not, but they are sharp, and you spend an evening heading your best shafts with them.`, { item: 'bodkins' }] },
  { t: 'A padded jack with one careful owner', cost: 10, out: [`Twenty layers of linen, quilted, with a brown stain at the collar that the seller describes as rust. It smells of someone else's fear. It will turn a cut that would open you to the bone, and you find you can live with the smell.`, { item: 'jack' }] },
  { t: 'Keep your pennies', out: [`You walk the length of the quay with your hand on your purse and buy nothing. It is the only time in your life you will feel rich.`, {}] }
], { pool: 1 });

scene('s_boots', 'soton', 'A trade is a trade', `Word has got round that the twentieth man was bound to a cordwainer. By nightfall there is a heap of boots outside your billet that would shame a midden: split welts, soles like wet bread, one pair held together with what you hope is tar. An army walks, and this one is proposing to walk across France.`, [
  { t: 'Do your own first, and do them properly', out: [`Double sole, waxed thread, hobnails set close. You have made worse boots for richer men. Whatever else happens to you in France, it will not start at the feet.`, { item: 'boots' }] },
  { t: "Do the vintenar's, and make sure he knows who did", out: [`Cutler tries them, stamps twice, and walks off without a word. The next morning you are not on the latrine detail, and the morning after that you are still not on it. In this company that counts as a knighthood.`, { st: 1, echo: { at: 'harfleur', t: 'Cutler came ashore in the boots you mended. He has walked a good many miles in them since, and he has not once looked at them while you were watching.' } }] },
  { t: 'Do them all, at a penny a pair', out: [`You work through the night by a stolen lamp. Eight pairs, eight pence, and a company that will reach Harfleur without leaving its soles on the road. Your fingers smell of pitch for a week and you are oddly content.`, { c: 8 }] }
], { pool: 1 });

scene('s_perkin', 'soton', 'Perkin wants to go home', `You find Perkin behind the horse lines with his bundle already tied. The joke has gone out of him. A man in the next company died today, of nothing, of a fever and a bad tooth, and it has come to Perkin all at once that the King's sixpence does not buy you out of anything. 'I could be in Winchester by morning,' he says. 'Who'd even look?'`, [
  { t: 'Talk him round', test: ['wits', 7, 'talk perkin'],
    win: [`You tell him what the provost does to runners, and then, because that only makes him greyer, you tell him the truth, which is that you would rather not do this without him. He unties the bundle. Neither of you mentions it again.`, { flag: 'bond', grit: 1 }],
    lose: [`You say all the right things in the wrong order. He stays, because he is more afraid of the road alone than of France in company, but he does not thank you for it and he is quiet for days.`, {}] },
  { t: 'Help him past the pickets', test: ['wits', 8, 'sneak'],
    win: [`You walk him out through the tanners' yards, where the stink keeps the sentries shy, and give him your bread. He goes up the Winchester road at a trot without looking back. Cutler curses the pair of you for a week, but Perkin will be a baker, and get fat, and bore his grandchildren.`, { perkin: 'home', st: -1, lessons: 3 }],
    lose: [`The picket has you both before the town ditch. Perkin gets the lash for running and you get it for helping, and the provost lays on as if he were paid by the stroke. Perkin stays, since he can no longer walk as far as Winchester.`, { b: -1, st: -1 }] },
  { t: 'Tell Cutler, before the boy gets himself hanged',
    out: [`Cutler deals with it his own way: no provost, no lash, a night on the latrines and a talking-to that you can hear from the quay. Perkin knows who told. He marches to France three files away from you and does not grin.`, { st: 1, flag: 'cold' }] }
], { thread: 'perkin', when: perkinHere });

scene('s_friar', 'soton', 'A friar with a tray', `A Franciscan is working the quay with a tray of pewter badges, a saint for every trade and terror: Christopher for travellers, Sebastian for arrows, Barbara for a sudden death. At the back, between the cheap ones, are two little cobblers with their lasts and awls. 'Crispin and Crispinian,' he says, following your eye. 'Martyrs. Very patient men. They had to be, the time it took.'`, [
  { t: "Buy the cobblers' badge", cost: 4, if: () => !has('badge'), out: [`You pin it inside your jack, over the heart. It is cheap pewter, and it is warmer than it has any right to be.`, { item: 'badge', say: 'The badge will give you one second try, when a failure would cost you blood.' }] },
  { t: 'Palm it while he blesses someone else', test: ['wits', 8, 'sneak'], if: () => !has('badge'),
    win: [`He turns to sign the cross over a seasick knight and the badge is in your sleeve. You feel bad about robbing a friar for about as long as it takes to remember what the saints have been doing to you.`, { item: 'badge', say: 'The badge will give you one second try, when a failure would cost you blood.' }],
    lose: [`For a man of God he has a grip like a farrier. He holds your wrist up for the whole quay to see, and Cutler, who cannot have a thief in the twenty, attends to you himself behind the sheds.`, { b: -1, st: -1 }] },
  { t: 'Tell him what is happening to you', if: () => M.runs >= 1,
    out: [`You tell him all of it: the dying, the quay, the awl. He listens with his head on one side. 'My son,' he says at last, 'I have heard the confessions of this army for a week. Yours is the first I have enjoyed.' He will not take a penny, and he will not say he believes you, but he blesses you twice, the second time slowly, as though making sure it takes.`, { grit: 1 }] },
  { t: 'Ask for a blessing, since it is free', if: () => M.runs < 1,
    out: [`He blesses you briskly, with half an eye on a man fingering his St Sebastians. It probably counts.`, {}] }
], { pool: 1 });

scene('sail', 'soton', 'The crossing', `Fifteen hundred ships go out past the Wight on a Sunday tide, and it takes the whole afternoon for the fleet to clear the Solent. A ship catches fire at her moorings before you have even weighed, and the fire spreads to two more, which the old hands call a bad sign. Then a flight of swans comes down among the King's ships, which the same old hands call a good one. You are packed below with nineteen men, forty sheaves of arrows and a horse that has been sick since the tide turned.`, [
  { t: 'Sleep while there is somewhere dry to do it', out: [`You wedge yourself between two arrow chests and sleep like the dead, which you are in a position to judge. When you wake the coast of Normandy is a grey line and you feel almost like a man again.`, { heal: 1 }] },
  { t: 'Go up and learn the ropes from the shipmen', test: ['grit', 7],
    win: [`They put you on a halyard and laugh at you until you stop being sick. By the second day you can stand on a wet deck with a load in your arms. A shipman tells you an army is only a slower kind of shipwreck, and you find it steadies you to hear it said aloud.`, { arm: 1 }],
    lose: [`You are sick over the rail, then over the deck, then over a serjeant. Two days of it leaves you hollow and shaking, and the horse, which has stopped, watches you with what looks like sympathy.`, { b: -1 }] },
  { t: 'Listen to the old soldiers talk', test: ['wits', 7],
    win: [`They were at Shrewsbury and in Wales and one swears he was at Najera, which would make him seventy. Under the lies there is good sense: where to stand, when to eat, which orders to hear and which to have not quite caught. You file it away.`, { wits: 1 }],
    lose: [`They were at Shrewsbury and in Wales and they will tell you about it all the way to Normandy. You learn four songs and nothing else.`, {}] }
], { place: 'The Solent, 11 August' });

/* ---- Harfleur pool ---- */
scene('h_water', 'harfleur', 'Brown water', `The King has put his own camp on the hillside by Graville, and yours is in the salt marsh below it, where the Lézarde spreads itself out and thinks about being the sea. The French have opened the sluices. The water in the ditches is the colour of small beer and smells of everything upstream, and it is the hottest August anyone can remember.`, [
  { t: 'Drink what is in the ditch. Everyone else does.', out: [`It tastes of mud and iron. You are too thirsty to care, and for a day or two nothing happens, which is how it gets you.`, { flag: 'drank' }] },
  { t: 'Spend your pay on small beer', cost: 4, out: [`The sutler's beer is thin and sour and brewed with water that has at least been boiled. You make it your rule: nothing passes your lips that has not been through a brewer first. The others call you the Duke of Clarence. Some of them will stop laughing quite soon.`, { item: 'beer' }] },
  { t: 'Walk upstream past the sluices to fill your skins', test: ['grit', 8, 'march'],
    win: [`A mile of marsh in the heat, under the eye of the walls, and at the end of it a spring coming clear out of the chalk. You drink until your teeth hurt and bring back four full skins. You do it every other day and tell nobody where.`, { flag: 'clean' }],
    lose: [`The spring is where the shepherd said. So is a crossbowman on the town wall with nothing better to do. The quarrel goes through your water skin and a fair piece of your forearm, and you come home dry.`, { b: -1, flag: 'drank' }] }
], { pool: 1 });

scene('h_shell', 'harfleur', 'Mussels', () => `The tide goes out a long way here, and leaves the mud paved with mussels and oysters. The rations are salt beef that fights back. Half the company is down on the flats with their helmets full, and ${perkinHere() ? 'Perkin' : 'somebody'} has got a fire going and is roasting them on a shield. With the smell of it you forget for a moment that you are in Normandy to kill people.`, [
  { t: 'Eat your fill', out: [`They are fat and sweet and taste of home, or of somewhere better than home. You eat until you cannot bend. It is the best meal of the campaign and you will have a good deal of time to think about it later.`, { heal: 1, flag: 'shell' }] },
  { t: 'Stick to the salt beef', test: ['grit', 7],
    win: [`You chew leather and watch them feast, and feel like a prig. Still, you held to it, and holding to things is a habit like any other.`, { arm: 1 }],
    lose: [`You hold out till nearly dark and then eat six, standing up, as though that made it different.`, { flag: 'shell' }] },
  { t: 'Kick the fire out and tell them the mud is poison', know: 'k_shell', test: ['wits', 7, 'talk'],
    win: [`You tell them the town's privies drain on to these flats, which is true, and that the Bishop of Norwich's cook fed him these on Tuesday, which may be. Enough of them believe you. When the flux goes through the marsh like a scythe, your twenty are thinned less than most, and Cutler notices.`, { st: 1 }],
    lose: [`'The cobbler says the mussels are cursed,' somebody announces, and a helmetful is eaten in front of you to settle the point. You go hungry, and feel smug about it for a few days. After that nobody feels anything of the kind.`, {}] }
], { thread: 'perkin', when: perkinHere });

scene('h_guns', 'harfleur', "The King's Daughter", `The King has brought twelve great guns and given them names: London, the Messenger, and the one in front of you, the King's Daughter, which throws a stone the size of a millwheel and needs forty men to shift her. The master gunner is a Dutchman with one eyebrow. He wants her moved thirty paces closer to the barbican tonight, through the mud, under the walls, and he wants archers on the ropes because archers have backs.`, [
  { t: 'Take a rope', test: ['arm', 8, 'labour'],
    win: [`Thirty paces takes until first light. At some point in it you stop being a boy who pulls a bow and become a set of shoulders with opinions. The Dutchman gives every man on the ropes a mouthful of his own spirits, and the next day the King's Daughter knocks a hole in the barbican you could drive a cart through.`, { grit: 1, st: 1 }],
    lose: [`A wheel drops off the timber road and the trail kicks sideways. It only clips you. The man beside you it does not clip, and they bring a hurdle for him and a rag for your ribs.`, { b: -1 }] },
  { t: 'Carry powder instead', test: ['grit', 8],
    win: [`Nobody wants the powder kegs, so the gunners pay for them: a penny a keg, across open ground, with the town's own guns awake and looking. You make six trips at a walk, since running with powder is how the last man came to leave the job.`, { c: 6 }],
    lose: [`A stone from the walls lands twenty paces short and comes on by bounds, as they do. You are fast. The keg is not, and the splinters of it find you.`, { b: -1 }] },
  { t: 'Be somewhere else when the Dutchman counts heads', test: ['wits', 8, 'sneak'],
    win: [`You have a pressing errand to the horse lines that lasts all night. You sleep in the hay and feel bad about it for the length of time it takes to fall asleep.`, { heal: 1 }],
    lose: [`Cutler finds you in the hay. He does not shout, which is worse. You haul on the rope after all, at the front, where the mud is deepest.`, { st: -1 }] }
], { thread: 'cutler' });

scene('h_mine', 'harfleur', 'Under the wall', `The King's miners are Forest of Dean men, small and silent, driving a gallery towards the wall behind a screen of hurdles. The French are digging to meet them. Tonight the picks on the other side have stopped, which the miners do not like, and their master wants a few men down there who know how to use a knife. The gallery is as high as a table and smells like a grave that has been opened too soon.`, [
  { t: 'Go down', test: ['grit', 9, 'melee'],
    win: [`The wall of the gallery falls in and there is a lantern and a face behind it as surprised as yours. It is the worst fight of your life and it takes about as long as a paternoster. You come up the ladder with someone else's rondel dagger and a strong wish never to be buried.`, { arm: 1, st: 1, item: 'dagger' }],
    lose: [`It is all elbows and breath and the lantern going over. Somebody's blade finds your thigh in the dark, and it may well have been an English one. They haul you out by the collar and the miners fire the props to drop the lot.`, { b: -2 }] },
  { t: 'Hold the rope at the top and listen', test: ['eye', 8],
    win: [`You lie with your ear to the planking as the miners showed you and you hear it before they do, a scratching off to the left where no English pick should be. They break through on their own terms because of it. The master miner nods to you, and you understand that from a Dean man that is a speech.`, { wits: 1 }],
    lose: [`You hear picks, water, rats, your own heart. When the fight comes it is over before you have decided which noise it was.`, {}] }
], { pool: 1 });

scene('h_sortie', 'harfleur', 'The Leure gate', `The trumpets wake you. There is no moon. The gate on the Leure side has opened and the garrison is out among the siege works with torches, firing the hurdles and the gun-shields and anything that will take a flame, and the watch that should have stopped them is running the wrong way. Everything is lit orange from below. Cutler is bawling for the twenty and there are perhaps nine of you with boots on.`, [
  { t: 'Shoot at whatever the fire shows you', test: ['eye', 9, 'shoot'],
    win: [`Men with torches make their own marks. You put down two before they understand where it is coming from, and after that the rest find the gate more interesting than the guns. Cutler counts the fallen at first light and eyes you as though you have been keeping something from him.`, { arm: 1, st: 1, learn: 'k_sortie' }],
    lose: [`You are staring into the fire when the man comes out of the dark beside it. He has a falchion and you have a bow, and at that distance a bow is only a stick.`, { b: -1, learn: 'k_sortie' }] },
  { t: 'Get the fire off the gun-shields', test: ['grit', 8, 'labour'],
    win: [`You drag burning hurdles clear with your bare hands and stamp out the rest. The gun behind them is saved. In the morning the Dutch gunner seeks you out and gives you a cheese, solemnly, as though he were handing over a daughter.`, { st: 1, learn: 'k_sortie' }],
    lose: [`Pitch sticks to what it burns. You save the hurdle and lose most of the skin on one arm, and the surgeon's boy tells you cheerfully that it will stop hurting when it starts itching.`, { b: -1, learn: 'k_sortie' }] },
  { t: 'You have been awake and strung behind the mantlet since the moon went down', know: 'k_sortie',
    out: [`When the gate opens you are already looking down the shaft at it. The first man out carries the torch for the rest, and you see to him. You call the alarm before the watch has found its own feet. By the time it is over you have picked up a sheaf of someone else's arrows, and Cutler has a new notion of your worth, which he does not seem to trust.`, { st: 2, ar: 1 }] }
], { thread: 'cutler' });

scene('h_bishop', 'harfleur', 'The sick lines', `Richard Courtenay, Bishop of Norwich and the King's own friend, has died of the flux in the King's own tent, and if it will take a bishop it will take anyone. The sick lie in rows down by the ships with their hose off. There are two thousand of them already, and the carts bring more each morning. A physician's servant is moving along the edge of it selling a brown root from a sack, a penny the piece to gentlemen and five to you.`, [
  { t: 'Buy the root', cost: 5, out: [`Tormentil, he says, bloodroot: chew it when the gripes start and it binds what wants loosing. It tastes like a tanner's yard. You wrap it in a rag and put it in the bottom of your purse, where you will not be tempted to trade it for anything.`, { item: 'root' }] },
  { t: 'Help carry the sick down to the ships', test: ['grit', 8, 'flux'],
    win: [`It is the worst work you have ever done and somebody has to do it. You carry forty men to the boats, and a knight's steward gives you threepence for being gentle with his master. Cutler sees you come back and for once finds nothing to say.`, { st: 1, c: 3 }],
    lose: [`You carry them all day with their filth down your arms and nowhere clean to wash it off. By nightfall there is a cold coil in your own gut, and you know what it is.`, { st: 1, flag: 'exposed' }] },
  { t: 'See what the dead have left behind',
    out: [`A dead man does not need a kettle hat or the eight pence sewn in his collar. You tell yourself that it is only sense. You are right, too, and that is what troubles you: each time is a little easier than the last, and you would rather it were not. Somebody in the twenty saw you at it.`, { c: 8, item: 'hat', st: -1 }] }
], { pool: 1 });

scene('h_wall', 'harfleur', 'The man on the wall', `There is a crossbowman on the south-west tower who has killed four of the company this week. He shoots from behind a painted pavise, takes his time about it, and has been heard to sing. The company has taken it personally. Cutler has a shilling for the man who silences him, and the range is long: a good eleven score, and uphill.`, [
  { t: 'Wait for him to lean out, and take him', test: ['eye', 9, 'shoot'],
    win: [`You lie in a ditch for half a day with a shaft on the string. When he leans out to span, you have already loosed. The singing stops. Cutler pays the shilling in pennies, slowly, to make the moment last.`, { arm: 1, c: 12 }],
    lose: [`You see him lean out. What you do not see is the second crossbowman, and the first one sings a verse for you while they carry you back.`, { b: -2 }] },
  { t: 'Loose in volley with the rest and trust to numbers', test: ['arm', 8, 'shoot'],
    win: [`Twenty of you loose together on Cutler's word, again and again, until the pavise looks like a hedgehog. Nobody can say whose arrow did it. You shoot better in a line than you ever did alone, and you suspect that is the point of a line.`, { grit: 1 }],
    lose: [`Your shafts clear the tower, the town and, for all you can tell, Normandy. The crossbowman waves.`, {}] },
  { t: 'Leave heroics to men with shillings to spare',
    out: [`You keep your head below the lip of the trench, where God intended it. The crossbowman gets a fifth man that afternoon, a stranger, and you are ashamed of how little you mind.`, {}] }
], { thread: 'ieuan' });

scene('h_bow', 'harfleur', 'A bow too good for you', `A man-at-arms has died of the flux and his servant is selling up before the heirs arrive. Among the gear is a bow that makes yours look like a hedge stake: Venetian yew, the sapwood pale as cream on the back and the heart red on the belly, horn nocks, a hundred and thirty pounds if it is an ounce. The servant wants a shilling. Half the archers at Harfleur are standing round it with their tongues out.`, [
  { t: 'Pay the shilling', cost: 12, out: [`You count it out before anyone can outbid you. You can barely bend it. But a bow like this is something to grow into, and when you do get it back to your ear the arrow goes away as if it has been sent for.`, { item: 'yew' }] },
  { t: 'Offer to shoot for it: your arrows against his price', test: ['arm', 9, 'shoot'],
    win: [`'Three shafts in a helmet at eight score,' you say, 'and I take it for nothing. Miss, and you keep my bow as well.' The crowd likes it, so the servant has to. You put the third one through the eye-slit, and nobody is more surprised than you are.`, { item: 'yew' }],
    lose: [`Two in the helmet, one in Normandy. He lets you keep your own bow out of pity, takes fourpence for his trouble, and sells the yew to a Cheshire man who does not deserve it.`, { c: -4 }] },
  { t: 'Walk away', out: [`You go back to your hedge stake. It has not killed you yet, which is more than you can say for most things here.`, {}] }
], { pool: 1, when: () => !has('yew') });

scene('h_perkin', 'harfleur', "Perkin's first", `Perkin killed a man in the trenches yesterday, a Frenchman no older than himself who came over the hurdles with a spear. Since then he has not stopped talking, about bread mostly, the right heat for a manchet loaf and how his father slashes the crust. His hands shake when he thinks no one is watching. Tonight he has not touched his food.`, [
  { t: 'Sit with him and let him talk about bread',
    out: [`You sit. He tells you about ovens until the fire burns down, and somewhere in it he tells you about the Frenchman's face as well, just once and quickly. In the morning he eats. He does not thank you and you would think less of him if he did.`, { flag: 'bond', say: 'Perkin will keep close to you.' }] },
  { t: 'Tell him the one about the bishop and the flux', test: ['wits', 8, 'talk'],
    win: [`It is a terrible joke, and worse for being true. He stares at you, and then he laughs until he has to lie down, and half the twenty laugh with him, and the worst of it goes out of him and takes some of yours with it.`, { grit: 1, flag: 'bond' }],
    lose: [`It is a terrible joke. You might have spat in the font, by his face. Ieuan laughs, at least, though he laughs at most things.`, {}] },
  { t: 'Leave him to it. Everyone has a first.',
    out: [`You had your own, in one life or another, and nobody sat with you. He gets through it on his own, as most do. But something that was easy between you has gone stiff.`, { grit: 1, flag: 'cold' }] }
], { thread: 'perkin', when: perkinHere });

scene('flux', 'harfleur', 'The bloody flux', () => `It comes for the whole army in the third week. Men who were hauling guns on Monday are in the sick lines by Thursday and in the long trench by Sunday. Men say two thousand die of it, and the clerks count five thousand more sent home in the ships, the Duke of Clarence and the Earl Marshal among them. An earl goes exactly as a ploughman goes, and loses as much of his dignity on the way.${S.flags.shell ? ' You think about the mussels.' : ''}${S.flags.fruit ? ' You think about the apples.' : ''}${S.flags.drank ? ' You think about the ditch water.' : ''}

On the twenty-second of September Harfleur gives up its keys. By then the gripes have found you too.`, [
  { t: 'Sweat it out on your feet', test: ['grit', () => fluxDc(), 'flux'],
    win: [`Three days of cramp and cold sweat and then, for no reason you can name, it lets you go. You are a stone lighter and you have learned to respect a latrine, but you can still draw a bow, and at Harfleur that puts you among the lucky.`, () => fluxFx(true)],
    lose: [`It empties you. For a week you are nothing but a gut with a man wrapped round it. You do not die, quite, and they do not ship you home, quite, and when the army marches you march with it, bent over, on legs you have had to borrow.`, () => fluxFx(false)] },
  { t: 'Chew the tormentil root', if: () => has('root'),
    out: [`It is like eating a saddle. But the gripes ease by nightfall and are gone in two days, and you walk out of the marsh on your own legs while better men are carried. You would kiss the physician's servant if you could find him. They say he died on Tuesday.`, () => Object.assign({ drop: 'root' }, fluxFx(true))] },
  { t: 'Buy a place in the dry tents, and nothing to drink but boiled beer', cost: 6, test: ['grit', () => fluxDc() - 3, 'flux'],
    win: [`Sixpence buys you canvas, straw and a boy who brings beer that has seen a fire. It is the difference between being ill and dying. On the fourth day you get up.`, () => fluxFx(true)],
    lose: [`The tent is dry and the beer is boiled and it takes you all the same, only more comfortably. When the army marches you march with it, a week out of your sickbed and looking like your own grandfather.`, () => fluxFx(false)] }
], { place: 'Harfleur, September' });
function fluxDc() { return 8 + (S.flags.drank ? 2 : 0) + (S.flags.shell ? 3 : 0) + (S.flags.fruit ? 2 : 0) + (S.flags.exposed ? 2 : 0); }
function fluxFx(ok) { const f = ok ? {} : { b: -2, item: 'flux' }; if (S.flags.shell) f.learn = 'k_shell'; return f; }

/* ---- the march pool ---- */
scene('m_rations', 'march', 'Eight days of food', `The King gave out food for eight days, since Calais is eight days away if nobody objects, and the French have objected. This is the eleventh day. The bread is gone and the beef is a memory. The King has forbidden plunder on pain of hanging, and means it. The men are eating walnuts and blackberries off the hedges, and making the kind of jokes that have teeth in them.`, [
  { t: 'Slip off to a farm after dark', test: ['wits', 8, 'sneak'],
    win: [`The farmer has hidden his pig in the bread oven, which is where you would have hidden it. You leave him two pence, since the King's order says to pay, and since he is standing there with a billhook looking as if he means it. The twenty eat salt pork for three days and ask no questions.`, { item: 'pork', heal: 1 }],
    lose: [`The farm has a dog, and the dog has a view on Englishmen. You come back over the hedge with your hose in ribbons and nothing in your sack, and Ieuan asks whether the dog was at least well fed.`, { b: -1 }] },
  { t: 'Work the hedges with the rest', test: ['eye', 7],
    win: [`Walnuts, sloes, a hatful of blackberries and a hedgehog that Ieuan bakes in clay. It keeps you on your feet, which is as much as it claims to do.`, {}],
    lose: [`You find six walnuts and a great deal of bramble. By the third day of it your belt has two new holes and your bow has grown heavier.`, { b: -1 }] },
  { t: "Pay a sutler's price for what he swears is mutton", cost: 6,
    out: [`It is not mutton. You do not ask what it is. It is hot and there is a lot of it, and for one evening you are a man again and not a stomach on legs.`, { heal: 1 }] }
], { pool: 1 });

scene('m_pyx', 'march', 'The church at the roadside', `The column halts by a village church with its door standing open. The priest has fled. Perkin comes out with something under his jack and the look of a boy who has found a shilling in the road: a pyx, the little box for the host, bright as a sovereign. 'Gold,' he whispers. 'Nobody saw.' It is copper-gilt, worth pennies. The King has sworn to hang any man who robs a church, and the King's provost is riding down the column.`, [
  { t: 'Tell him to put it back', test: ['wits', 9, 'talk perkin'],
    win: [`You do not argue. You tell him what it is worth, which is nothing, and what it costs, which is everything. He goes back in, white to the lips, and sets it on the altar. The provost rides past without turning his head. Perkin does not speak for a mile, then asks you what copper-gilt is.`, { flag: 'pyxsaved' }],
    lose: [`He says he will, and he means to, and then the provost's men are in the churchyard and it is still under his jack. The King has the whole army halted to watch. They hang him from an elm beside the road with the pyx on a string round his neck, and the column does not move on until he has stopped moving.`, { perkin: 'dead', learn: 'k_pyx' }] },
  { t: 'It is his neck. Look the other way.',
    out: [`You tell yourself the provost will not search a boy. The provost searches everyone. The King halts the whole army to see it done, and they hang Perkin from an elm by the road with the pyx on a string round his neck. He looks for you in the crowd at the end. You were not hard to find.`, { perkin: 'dead', learn: 'k_pyx' }] },
  { t: 'Take him by the collar and tell him exactly how the rope sounds', know: 'k_pyx',
    out: [`You have him against the church wall before he has finished saying 'gold'. You tell him about the elm, and the string, and how long it takes, and you tell it like someone who has stood there and watched, because you have. He puts the pyx back with both hands. Afterwards he treats you as people treat a dog that has started talking.`, { flag: ['bond', 'pyxsaved'], grit: 1 }] }
], { thread: 'perkin', when: perkinHere });

scene('m_ford', 'march', 'Blanchetaque', `The plan was the ford at Blanchetaque, where the Somme can be waded at low water, as the King's great-grandfather waded it before Crécy. Two miles short of it a Gascon prisoner is brought in who swears the ford is staked and that Marshal Boucicaut is sitting on the far bank with six thousand men. He could be lying. Cutler has been asked for two men with good eyes to go forward and see.`, [
  { t: 'Go and look', test: ['eye', 9, 'sneak'],
    win: [`You lie in the reeds for an hour and count pennons. The Gascon was telling the truth, more or less: stakes in the ford and horsemen behind it. You bring the count back to a knight who writes it down, and the army turns inland along the river, with its food gone and no bridge within fifty miles.`, { st: 2, learn: 'k_ford' }],
    lose: [`You get close enough to see the stakes, and so close enough for the picket to see you. They chase you a mile on horseback for the sport of it, and one of them marks your shoulder with a lance point as a keepsake.`, { b: -1, learn: 'k_ford' }] },
  { t: 'Let men with something to prove do the looking',
    out: [`Two Lancashire men go. One comes back. The ford is held, the army turns inland, and you walk upriver with everyone else, a little further from Calais at every step.`, { learn: 'k_ford' }] },
  { t: 'Tell Cutler now: the ford is staked and held, and there is no use sending anyone', know: 'k_ford',
    out: [`He asks how you know. You say a cobbler hears things. 'Cobblers hear too bloody much,' he says, but he takes it up the column. When the scouts come back with the same tale an hour later, and one man fewer, he keeps you in the corner of his eye for the rest of the day.`, { st: 1 }] }
], { thread: 'cutler' });

scene('m_stakes', 'march', 'Six feet, both ends', `A prisoner has let slip how the French mean to do it: squadrons of horse, armoured to the hocks, to ride down the archers before a bow is bent. So the King's order goes down the column that every archer is to cut himself a stake six feet long, sharpened at both ends, and carry it. Your day's load is already a bow, a sheaf, a sword you cannot use and your own hunger. The woods here are mostly hazel and bad temper.`, [
  { t: 'Find ash, cut it true, and harden the points in the fire', test: ['arm', 8, 'labour'],
    win: [`It takes most of the halt. The stake is as thick as your wrist and dead straight, with points you could shave with. It weighs like sin on the march. You notice that the old soldiers have all cut theirs the same way, and that the young ones have cut theirs light.`, { item: 'stake' }],
    lose: [`The hatchet turns on a knot and opens your shin. You finish the stake anyhow, badly, and what you carry in the morning is a bandage and a crooked pole.`, { b: -1 }] },
  { t: 'Buy a good one from a man who has cut two', cost: 3,
    out: [`There is always someone. This one is a Kentish forester who has been cutting stakes all night and selling them by firelight. It is the best threepence you will ever spend, though you will not find that out for a week.`, { item: 'stake' }] },
  { t: 'Cut a hazel wand. An order is an order, but your back is your own.',
    out: [`It is six feet long and sharp at both ends, which is all the King asked for. A sheep could push it over. You sleep while the others chop, and feel clever, and try not to picture the horses.`, { heal: 1 }] }
], { pool: 1 });

scene('m_riders', 'march', 'Riders at Corbie', `Outside Corbie the garrison comes out at you, horse and foot together, straight into the flank of the column while it is strung along a causeway. There is no time to form. A standard goes down in the press, the banner of Guienne, and men are running both ways. Cutler has the twenty by the scruff, facing outward, shouting to nock.`, [
  { t: 'Stand and loose', test: ['arm', 9, 'shoot'],
    win: [`The first horse is so close you can see the rust on its bit. You loose, and nock, and loose, and do not think, and the twenty do the same on either side of you, and suddenly there are no more horses, only a great deal of noise going away. A Lancashire squire wins the standard back. You find you have bitten through your lip.`, { grit: 1, st: 1 }],
    lose: [`Your hands will not do it. The arrow is on the wrong side of the bow and then the horse is on you, shoulder first, and you go into the ditch with a sound like a dropped sack.`, { b: -2 }] },
  { t: 'Get behind the wagons',
    out: [`There is space under a baggage cart and you fill it. From there you watch your company do what you ought to be doing. Cutler finds you afterwards. He does not say anything. His eyes go to you, then to the cart, and he walks away, and that is all the report he makes.`, { st: -1 }] },
  { t: "A rider is down, and his harness is worth a year's pay", test: ['wits', 9, 'sneak'],
    win: [`While the fight goes the other way you are kneeling on a dead man's chest, unbuckling. A kettle hat with a good liner and a purse he had not got round to spending. It is not noble work. Still, the hat fits.`, { c: 8, item: 'hat' }],
    lose: [`He is not as dead as he looked. He gets a hand on your throat and a knee in your ribs before Ieuan arrives and settles the question with a hatchet. 'Always check,' Ieuan says. 'They're terrible liars, the dead.'`, { b: -1 }] }
], { pool: 1 });

scene('m_ieuan', 'march', "The Welshman's feet", `Ieuan is falling behind. He is fifty if he is a day and his feet have gone: the soles of his boots have parted company with the rest, and he is leaving blood in the ruts. He makes no complaint. He has merely stopped talking, which in Ieuan is like a church bell stopping. Stragglers do not last a night out here.`, [
  { t: 'Take his pack and his stake and give him your shoulder', test: ['grit', 8, 'march'],
    win: [`Two packs, two stakes, and an old man who weighs more than he looks. You get him to the halt. That night you sew his soles back on with a waxed end and your own awl, and he watches you work as intently as you once watched him shoot. From then on he corrects your draw at every halt, whether you ask or not.`, { item: 'ieuan', st: 1 }],
    lose: [`You get him to the halt, and then you fall down. Something in your back has gone that will not come right this side of Calais. He mends, though, and he is a man who pays what he owes: he takes your shooting in hand as though it were a family shame.`, { b: -1, item: 'ieuan' }] },
  { t: 'Mend his boots at the halt, if he reaches it', test: ['wits', 8],
    win: [`He reaches it, grey in the face. You resole him by firelight, and three others besides, for the trade has its own pride. 'A cobbler,' Ieuan says, trying them. 'Better than a priest, on the whole. Priests only see to your soul.'`, { st: 1 }],
    lose: [`He does not reach the halt. In the morning Cutler strikes a name from the roll with his thumbnail and says nothing, and the twenty march as nineteen and do not talk about cheese.`, {}] },
  { t: 'Keep your eyes front',
    out: [`You march. Everybody marches. By nightfall he is nowhere to be seen, and you find that you can carry that too. You could have done without the knowledge.`, { eye: 1 }] }
], { thread: 'ieuan' });

scene('m_desert', 'march', 'Men who mean to leave', `The French heralds have come and gone. They were civil about it: the Constable and the Dukes will give battle before Calais, at the King's convenience. The King gave them a hundred crowns and said he would take the straight road. That night four men of the next twenty talk low by a dead fire about the coast, and a fishing boat, and how sixpence a day is poor pay to stand under what is coming. One of them looks up and catches your eye.`, [
  { t: 'Go with them',
    out: [`You get nine miles. The peasants of Picardy have been robbed by two armies this autumn and they do not ask which one you belong to. They find the five of you asleep in a barn. They have flails, and they are in no hurry.`, { die: 1, learn: 'k_desert' }] },
  { t: 'Tell them what the country people do to stragglers', test: ['wits', 8, 'talk'],
    win: [`You tell them plainly. You know a little about dying, you say, and the French knights at least will do it quickly. Three of the four stay. The fourth is found in a ditch two days on, by the smell.`, { st: 1 }],
    lose: [`They hear you out and go anyway. Nobody sees them again. Cutler, counting heads next door, remarks that the French will have to make do with killing the rest of you.`, {}] },
  { t: 'Report it',
    out: [`The provost has them before they have laced their boots. Two are flogged and two are hanged, since the King needs every bow and so he only hangs half. Your own twenty are careful what they say around you after that.`, { st: 1 }] }
], { thread: 'cutler' });

scene('m_road', 'march', 'The road at Péronne', `Past Péronne the army comes down on to the Calais road and stops dead. The road has been trodden to porridge from hedge to hedge by a host going the same way: hoofprints laid over hoofprints, wheel ruts a foot deep, and the dung still steaming in places. The French are in front of you, tens of thousands of them. The priests begin to pray aloud. Cutler looks at the road for a while and then says, 'Well. At least we'll not get lost.'`, [
  { t: 'Get down and read the tracks properly', test: ['eye', 8],
    win: [`Mostly horse, and heavy horse at that, shod for war. Few foot, fewer carts. You tell Cutler they are short of archers and long on gentlemen. He grunts. 'Then they'll want to do it on horseback, and they'll want to do it first.' It is the nearest thing to good news all week.`, { wits: 1 }],
    lose: [`You count hoofprints until the numbers stop meaning anything. All you are sure of at the end is that there are a great many of them, and you knew that before you knelt down.`, {}] },
  { t: 'Start a song before the silence takes hold', test: ['grit', 8],
    win: [`It is a filthy song about a miller, and you have no voice. That is why it works. The twenty take it up, then the hundred, and the column moves off down that ruined road bawling the chorus at the place where the French must be. The chaplain pretends not to know the words.`, { arm: 1, st: 1 }],
    lose: [`Your voice cracks on the second line and nobody takes it up. Ieuan pats your shoulder. 'It's the thought,' he says. 'A terrible thought, mind.'`, {}] },
  { t: 'Say nothing. See to your bow.',
    out: [`You sit on the bank, unstring, and go over the bow inch by inch with tallow, and then you wax your spare string and coil it into your cap. It is a small thing to have in order. But it is a thing in order, and you have not many of those.`, { item: 'string' }] }
], { pool: 1 });

scene('somme', 'march', 'The causeway at Voyennes', `A villager has shown the scouts two fords the French forgot, at Béthencourt and Voyennes, each reached by a causeway through a mile of marsh. The French have broken both causeways. So the army tears down the village for its timber, doors and shutters and the stairs out of the houses, and throws the lot into the gaps with straw and fascines on top. Two hundred archers are to go over first on foot and hold the far bank while eight thousand men file across behind them, one horse at a time.`, [
  { t: 'Be one of the two hundred', test: ['grit', 9, 'march'],
    win: [`The water comes to your chest and your bow goes over on your head like a holy relic. For an hour two hundred wet men are all of England that stands north of the Somme. French horsemen come to look and think better of it. When the King's own banner comes over the causeway you are standing where he can see you, and so is Cutler, and one of you is nearly smiling.`, { st: 2 }],
    lose: [`Halfway over, the bottom drops away. You go under with your bow, your sheaf and your sins, and come up a long way downstream, coughing river. You have crossed the Somme, at any rate.`, { b: -1 }] },
  { t: 'Carry timber for the causeway', test: ['arm', 8, 'labour'],
    win: [`You carry a church door on your back for a mile, and then a staircase. The causeway holds. The whole army goes over it before dark, and the last man across is the King, who has stood at the far end all day keeping the press in order with his own voice.`, { st: 1 }],
    lose: [`A beam rolls in the mud and takes your foot with it. Nothing is broken, the surgeon's boy says, and then asks if you can wiggle it, and looks thoughtful.`, { b: -1 }] },
  { t: 'Cross when you are told, where you are told', test: ['grit', 5, 'march'],
    win: [`You cross in the middle of the column, and nobody will ever sing about it. Your feet are wet, and you are on the same side of the river as the French.`, {}],
    lose: [`In the middle of the column, in the middle of the causeway, a baggage horse panics and takes a length of the straw road with it, and you with the straw. They fish you out with a boathook. Nobody will ever sing about that either.`, { b: -1 }] }
], { place: 'The Somme, 19 October 1415' });

/* ---- the eve pool ---- */
scene('e_silence', 'eve', 'An ear for a word', `The French are camped across the fields, close enough that you can hear them calling for their servants. They have fires, and wine, and by the sound of it they are dicing for which of them gets the King. On your side the order is silence: a gentleman who speaks above a whisper forfeits horse and harness, and a common man forfeits his right ear. Ten paces from you a Cheshire archer has started to pray, and he is getting louder.`, [
  { t: 'Get a hand over his mouth', test: ['arm', 8],
    win: [`He bites you. You hold on. After a while the shaking stops and he nods, and you let go, and he finishes the prayer inside his head where the provost cannot hear it. Cutler, passing, taps two fingers on your shoulder and moves on.`, { st: 1 }],
    lose: [`He is stronger than he looks and he does not go quietly. The provost's men arrive to find two archers rolling in the mud. They are short of time, so they take it out of both of you with a stave and leave your ears where they are.`, { b: -1 }] },
  { t: 'Kneel by him and pray too, under your breath',
    out: [`You give him the words in a whisper and he comes down to meet you. You say it together, a dozen times over, very small, in the rain. You are not sure who you are saying it to any longer. You have reason to think somebody is listening.`, { grit: 1 }] },
  { t: 'Move away from him before the provost comes',
    out: [`You find another patch of mud. Behind you there is a scuffle, and a sound, and then the quiet the King ordered. In the morning the Cheshire man has a rag round his head and will not look at anyone.`, {}] }
], { pool: 1 });

scene('e_confess', 'eve', 'The queue for the priest', `Every chaplain in the army is hearing confession, and the queues go round the village. The men mean to be shriven before the day. They are also restringing bows and whetting arrowheads, since a man may look to his soul and to his bow on the same night. Ieuan is in the queue for the third time. He says he keeps remembering things.`, [
  { t: 'Confess, and leave nothing out',
    out: [`You tell the priest about the dying and the waking. He is very tired. He says despair is a sin and so is cider, gives you three Aves, and absolves you of everything, including several things you have not done yet. You feel lighter than you have since the quay.`, { grit: 1 }] },
  { t: 'Sleep. You will need it more than absolution.',
    out: [`You find the dry corner of a barn among forty other men and sleep sitting up. You do not dream of the quay, which is a mercy.`, { heal: 1 }] },
  { t: 'Spend the night on your arrows',
    out: [`You go through your shafts one by one: straighten, re-wax, whet. Then you go round the men who are too frightened to see to theirs and do those too, and by the end there is a sheaf nobody will own to, so it is yours.`, { ar: 1 }] }
], { pool: 1 });

scene('e_scout', 'eve', 'How the ground lies', `Cutler wants to know what is between the two armies, and he does not want to learn it tomorrow with everyone else. He needs a man to go forward on his belly as far as the French pickets and come back able to draw it in the dirt. It is new-sown wheat out there, ploughed deep for the winter, and it has been raining for a week.`, [
  { t: 'Go', test: ['eye', 9, 'sneak'],
    win: [`It is a funnel. There are woods on either hand, Agincourt on the left and Tramecourt on the right, and the field narrows between them, and the plough is so soft you sink to the shin lying down. You crawl back and draw it for Cutler with a stick. He looks at it a long time. 'They'll come down that like beer down a drain,' he says, 'and about as fast.'`, { flag: 'ground', st: 1, say: 'You know the ground the horse must cross. Standing against one will go better.' }],
    lose: [`You crawl straight on to a French picket warming his hands over a pot. He is as startled as you are. You leave him your hood and some of your scalp and come back knowing nothing except that the mud is very deep, which you could have told Cutler from here.`, { b: -1 }] },
  { t: "Tell him a cobbler's knees were not made for crawling",
    out: [`He sends a poacher from the next twenty, who comes back with it all in his head and a French capon under his arm. Cutler does not mention it again. You notice he does not ask you for anything else either.`, { st: -1 }] }
], { thread: 'cutler' });

scene('e_perkin', 'eve', 'What Perkin asks', `Perkin finds you in the dark. He has his pay in a knotted rag, every penny since Southampton, and he wants you to have it. 'For my mother,' he says. 'If. You know.' He is trying to say it lightly and it is not coming out light. The rain is running off his nose.`, [
  { t: 'Take it and promise',
