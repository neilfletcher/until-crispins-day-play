    out: [`Forty shillings is a great weight in Winchester. Here, with the French fires spread across half the sky, it is hard to keep hold of. You let it go for one night, and you sleep the better for it.`, { heal: 1 }] },
  { t: 'Cut a tally for it, as you would at the bench',
    out: [`You cut forty notches in a hazel stick and split it down the middle, the way a debt is kept. You put one half in your shoe. The other half is your master's, and you find yourself wondering what he will do with it if you do not come back. You push the thought into your arms, where it will be of use.`, { wits: 1 }] }
]);
scene('home_e_girl', 'eve', 'The ribbon', () => `${S.flags.sent ? 'Your silver has gone home, and by now it has either reached her or reached somebody else.' : 'You have sent her nothing. You have had nothing to send.'} ${S.flags.wrote ? 'She has had one letter from you, telling her the truth.' : 'She has had no word from you since the quay.'} What you have left of her is a ribbon, which has been wound round your bow hand for three months and is the colour of the road, and a candle-end no longer than a thumb joint. Perkin has seen you looking at them. He has the sense, for once, to say nothing.`, [
  { t: 'Tie the ribbon to your bow, where you will see it',
    out: [`You tie it below the grip, where it will not foul the string. It is not much to look at. All the same, you know now what you will be looking at tomorrow when you would otherwise be looking at the French, and it steadies your hands.`, { eye: 1 }] },
  { t: 'Give it to Perkin, to take home if you do not', if: () => perkinHere(),
    out: [`He takes it as if it were hot. 'You tell her yourself,' he says. You say that you mean to. He puts it inside his shirt, and after a while he says that if it is the other way about, there is a girl at the bakehouse in Kingsgate Street, and you are to say he was brave. You promise it.`, { flag: 'bond', pull: ['perkin', 1], say: 'Perkin will keep close to you.' }] },
  { t: 'Light the candle-end, and let it burn out',
    out: [`She said it was for the dark, and there will be no darker. It burns for the length of a few prayers, under your hood, out of the rain. When it gutters you find that you are not afraid, or not more than is useful. You sleep.`, { heal: 1 }] }
]);
scene('home_e_brother', 'eve', () => S.flags.dickon_dead ? 'The bracer' : S.flags.dickon_home ? 'One of us' : "Suffolk's lines, again", () => S.flags.dickon_dead
  ? `Dickon has been in the ground at Harfleur for six weeks. You came to France to keep him alive, and you are here without him, wearing his bracer, the night before the thing you came to keep him out of. The young Earl of Suffolk's men are camped on the right, where Dickon would have been. You can see their fire from here. You know some of their names.`
  : S.flags.dickon_home
    ? `Dickon is in England. Whatever happens tomorrow, your mother will have one son home, and that was the bargain you made with yourself on the quay. It ought to make you easy. But you are still here, and you find that the bargain had more of your own neck in it than you had reckoned on.`
    : `Dickon is with the young Earl of Suffolk's men on the right of the line, two hundred paces off, and you find him without trying. He is thinner, and his beard has come in, and he has two sheaves and a mallet and the look of a man who has stopped expecting anything. 'They've put us on the end,' he says. 'Next the wood. It'll be all right.' He has never been able to lie to you.`, [
  { t: 'Tell him where you will be, and to look for you', if: () => !S.flags.dickon_dead && !S.flags.dickon_home,
    out: [`You tell him. He tells you to stay where you are put and not be a fool. Then he takes his old bracer by the strap, where it sits on your arm, and settles it a hole tighter, as he did when you were nine. 'It's never fitted you,' he says. Neither of you says anything more, there being nothing useful left to say.`, { grit: 1, flag: 'dickon_told', say: 'If Dickon goes down on the day, you will know where to look.' }] },
  { t: 'Ask his vintenar to put him further in', if: () => !S.flags.dickon_dead && !S.flags.dickon_home && !S.flags.dickon_safe && !!M.known.k_suffolk, test: ['wits', 8, 'talk'],
    win: [`Suffolk's vintenar is a tired man with a boil on his neck, and you do not ask him a favour. You tell him that Dickon's eyes are good and are wasted on the flank, where he will be shooting into the wood. It happens to be true. He grunts. When you look back Dickon is being moved six files in, and is glaring at you across the camp.`, { flag: 'dickon_safe', grit: 1 }],
    lose: [`He hears you out. Then he says that every man in his company has a brother or a mother, and asks which of them you would like put on the end in his place. You have no answer to that.`, {}] },
  { t: 'Sit with his bow across your knees', if: () => !!S.flags.dickon_dead,
    out: [`You have carried it since Harfleur. You run your thumb along the grip, which is worn to the shape of his hand. Tomorrow it will shoot at the men he came to shoot at. That is not what you came for. It is what is left, and you find it is enough to be going on with.`, { arm: 1 }] },
  { t: 'Think of the bench, and your mother, and him at her table', if: () => !!S.flags.dickon_home,
    out: [`You let yourself have it for a while: the kitchen, the smell of the dubbin, Dickon with his feet on the fender telling it all wrong. You are not in the picture. You look at that squarely, and then you put yourself into it, by the door, and decide that you will see to it tomorrow that the picture is a true one.`, { heal: 1, grit: 1 }] },
  { t: 'Sleep, if you can',
    out: [`You lie down in the wet with your hood over your face. Sleep comes in pieces, with the French trumpets in between. It is still worth having.`, { heal: 1 }] }
]);
scene('home_e_pardon', 'eve', "The King's word", () => `The note is still in your shoe: the King's pardon for the killing of Wat the tanner, to be had at the end of the campaign by any man who has served it out. ${S.flags.pardon_roll ? 'Your name is on the roll. You saw the clerk write it.' : 'Your name is not on the roll yet. A promise from a clerk is not the same as ink.'} ${S.flags.hawkin ? "Hawkin, the dead man's brother, is forty paces off at his own company's fire. He is alive because of you, and neither of you has found a way to say anything about that." : "Hawkin, the dead man's brother, is under the ground at Harfleur, and you are not sure that it makes you any safer."} All of it depends on being alive tomorrow night, and tonight that looks a long way off.`, [
  { t: 'Go and stand at his fire', if: () => !!S.flags.hawkin, test: ['grit', 8],
    win: [`You walk the forty paces. His company goes quiet. Hawkin looks up at you for a long while, with his brother's face, and then he shifts along the log. You sit. Nobody speaks. After a time he passes you the pot, and you drink and pass it back. That is all it is. You walk back to the twenty lighter than you have been since Winchester.`, { arm: 1, heal: 1 }],
    lose: [`You get halfway. He sees you coming and stands up, and you stop, and the two of you look at each other across twenty paces of mud. Then he sits down again with his back to you. It is fair. You go back to your own fire.`, {}] },
  { t: 'Confess it to a priest, whatever the King says',
    out: [`The King can pardon the hanging. The killing itself is another matter, and you have known that all along. You wait your turn in the rain behind two hundred other men, and you say it plainly, as it happened. The priest is too tired to be shocked. He gives you the words, and for a wonder you feel them take.`, { grit: 1 }] },
  { t: 'Read the note again, and put it back in your shoe',
    out: [`You cannot read. But you know what it says, and where the seal is, and you look at it for a while under your hood as another man might look at a picture of a saint. Then you fold it along the same folds and put it back where the wet will not reach it.`, { heal: 1 }] }
]);
scene('home_e_vow', 'eve', 'The vigil', () => `Tomorrow is the feast of Crispin and Crispinian, the shoemakers' saints, to whom you made a promise in Winchester when your sister lay sick. ${S.flags.vow_altar ? 'You left your offering at their altar in Southampton.' : 'You have left them no offering yet.'} ${S.flags.vow_soissons ? "And you have heard from the man of Soissons what was done in their own town, to their own people, by the same French who are across the field." : ''} Every shoemaker in England will hear Mass for them in the morning. You will be standing in a ploughed field in the rain. It comes to you that a saint's day is a hard day on which to be in his debt.`, [
  { t: 'Keep the vigil, as a guildsman would', test: ['grit', 7, 'saint'],
    win: [`You do not sleep. You kneel in the mud with the lead token in your fist and say what you can remember of the office, and where you cannot remember it you say the names of the tools of the trade, which you think they will understand. Towards the end of it you are not cold. You could not tell anyone why.`, { arm: 1, flag: 'vigil', say: 'For tomorrow, tests of Grit will go a little better.' }],
    lose: [`You mean to keep it. You wake with your face in the mud and the token gone out of your hand, and you spend a bad quarter of an hour finding it by feel. You hope that the intention counts with them.`, {}] },
  { t: 'Mend a boot for somebody. It is their work, after all.',
    out: [`Hodge's sole is hanging off. You have the awl, and thread, and wax. You sit under a cart and mend it properly, with a welt, as if he would be wearing it for years. It is the only prayer you have ever been any good at. Hodge says it is the best boot in France. The twenty lines up with its own.`, { st: 1, wits: 1 }] },
  { t: 'Tell them plainly that you have done what you can',
    out: [`You say it aloud, into the rain, as you would say it to a master: you have kept your side as far as a man could, and tomorrow is theirs. Nothing answers. All the same, you feel better for having put it on the record.`, { heal: 1 }] }
]);
const DAYS = {
  soton: ['Drill at the butts, roll call, and the wind still in the wrong quarter. The ale gets dearer every day the fleet does not sail.', 'More companies march in every day, and the town has run out of bread twice. A Cornishman is selling his place in a barn by the hour.', 'There is a rumour that the King means Gascony, and another that he means Paris. The men who know are not saying, and the men who are saying do not know.', 'It rains for two days. The twenty sits under an upturned boat and learns each other\'s stories, most of which are lies.', 'The ships fill up. Every tide there are more masts in the Solent and fewer horses on the common.'],
  harfleur: ['The trenches creep forward a few yards with every dark, and the guns do not stop. You have learned to sleep through the London and wake for the Messenger.', 'The marsh steams when the sun is on it, and the flies are worse than the French. Two more of the twenty have gone to the sick lines.', 'The salt meat has turned, and the ale is gone. Men are drinking from the ditch and saying it has done them no harm yet.', 'The wall by the Leure gate has a hole in it you could drive a cart through, and it is mended again by the next dawn.', 'Nobody says a week any more. The men who said it are mostly in the pit.'],
  march: ['Fifteen miles, and then seventeen, and then fifteen again. The country is empty before you get to it, and the bridges are down.', 'Rain. The road is a ditch and the ditch is a stream. Nobody has been dry since the Bresle.', 'The French are on the far bank of the river, riding level with you. You can see their pennons when the mist lifts.', 'The talk in the column has stopped. Men walk with their heads down and watch the heels of the man in front.', 'Somebody has counted the days since Harfleur and somebody else has told him to keep it to himself.']
};

/* ================= v0.15: a proper first day ================= */
scene('s_billet', 'soton', 'The sail loft', `By the end of that first day the twenty has been found a billet: a sail loft over a chandler's in French Street, with a ladder for a door and the smell of tarred hemp in everything. Cutler takes the place by the hatch, where nobody can come or go without stepping over him. The rest sort themselves out as men do.

Ieuan, a grey Welshman who is the oldest of the twenty and by every account the best shot in it, has the corner under the window, and is asleep or wishes to be thought so. Jankin Reeve, who has been a soldier since the Welsh wars, has the driest boards and a clear space round him that nobody seems anxious to fill. Old Simkin and Hodge are arguing about a blanket, as they have apparently argued about it on three campaigns. Perkin has kept you a place by lying across two.

There is room in four places. Where a new man puts his blanket down is noticed, and it is remembered.`, [
  { t: 'Next to Perkin, who kept it for you',
    out: [`He rolls over to make room and goes on talking as if you had been there all along. Within the hour you have heard what he thinks of the ships, the Welshman, the price of ale and a girl in Kingsgate Street. It is like lying down next to a brook. You find, somewhat to your surprise, that you sleep.`, { flag: 'bond', pull: ['perkin', 2], heal: 1, say: 'Perkin will keep close to you.' }] },
  { t: 'Under the window, by the Welshman',
    out: [`Ieuan opens one eye. 'Do you snore?' You say you do not know. 'You will know tomorrow,' he says. 'I'll tell you.' Some time later, into the dark, he asks what weight of bow you draw, and you have to say that you do not know that either. There is a silence. 'Well, that's honest,' he says. 'We'll find out.'`, { pull: ['ieuan', 2] }] },
  { t: 'By the hatch, in the draught, near Cutler',
    out: [`Cutler looks at the blanket and then at you. 'Draught,' he says, and that is all. But later, without turning over, he says, 'First man up fetches the water. That's you, now.' It takes you a moment to see that you have been given a job, and that in this company a job is a kind of place.`, { st: 1, pull: ['cutler', 1] }] },
  { t: 'In the space by Reeve, since nobody else wants it',
    out: [`'Brave lad,' Reeve says, pleasantly, and shifts his pack an inch. He is very easy to talk to. By the time you sleep he knows your name, your street, your master's trade and roughly what the shop is worth. You know that he once served under Lord Grey, and nothing else whatever. You work this out some time after he has started to snore.`, { wits: 1, pull: ['reeve', 2] }] }
], { when: () => M.runs < 1 });
scene('s_drill', 'soton', "Cutler's line", `Cutler has the twenty out on the common beyond the Bargate, in one line, with bows strung, and he walks along it as a farmer walks a fence, looking for the rotten post. He is not interested, today, in whether anyone can hit anything. He wants to see twenty men nock, draw and loose together on a word, and go on doing it until he says stop.

'A man shooting on his own is a poacher,' he says. 'Twenty shooting on a word is a reason for a Frenchman to stay at home.' Ieuan is on your left, and does it as he breathes. Perkin is on your right, and has already dropped an arrow. Reeve, further down, is doing exactly as much as will not be noticed. The word is given.`, [
  { t: 'Keep time with Ieuan, whatever it costs your arms', test: ['arm', 7, 'labour'],
    win: [`By the fortieth shaft your shoulders are shaking and there is blood on the string. But you are still on the word when Cutler calls the halt. He stops in front of you, looks at your fingers and then at your face, and moves on down the line. Ieuan says that is the most anybody has had out of him since Lent.`, { st: 1, grit: 1 }],
    lose: [`Your arms go at the thirtieth. You loose half a beat late, and Cutler hears it without turning his head. 'Cobbler. Again. On your own.' You do it on your own, in front of the twenty, until he is tired of watching. Nobody laughs, which is worse.`, { st: -1 }] },
  { t: 'Loose every second word, and watch how it is done', test: ['eye', 7],
    win: [`Nobody notices, since you are careful about it, and for a whole sheaf you watch: where Ieuan puts his feet, when he breathes, how the old hands let the bow do the drawing. By the second sheaf you have the trick of it, or the start of the trick. You are on the word with the rest, and it costs you half of what it costs Perkin.`, { wits: 1 }],
    lose: [`Cutler notices. Cutler has been noticing that particular dodge for twenty years. He stands behind you for the whole of the next sheaf and says 'loose' into your ear, by yourself, a moment before he says it to anybody else.`, { st: -1 }] },
  { t: "Get your foot on Perkin's arrow before Cutler sees it",
    out: [`You have it under your boot and then in your hand, and it is back in his belt before Cutler turns at the end of the line. It costs you your place in the count and one late shot. Perkin looks at you as if you had pulled him out of a river. You tell him to keep his eyes to the front.`, { flag: 'bond', pull: ['perkin', 1], say: 'Perkin will keep close to you.' }] }
], { when: () => M.runs < 1 });
const LINK = {
  soton: {
    perkin: ['Perkin has not stopped talking since. You have learned the names of all his sisters.', 'Perkin is somewhere behind you, whistling something he cannot get right.', 'You can still hear Perkin two streets off. Everybody can.'],
    ieuan: ['Ieuan has gone back to his corner and his fletching, and has not said whether he thinks better or worse of you.', 'The Welshman is humming again. It is the same four notes, and he does not seem to know that he does it.', 'Ieuan has said nothing more about it. He seldom says a thing twice.'],
    cutler: ['Cutler has gone back to counting whatever it is he counts on his fingers.', "You can feel Cutler's eye on your back for the rest of that day. It is not unfriendly. It is not friendly either.", 'Cutler has said nothing since. The twenty tells you that is how a man knows where he stands, if he knows how to read it.'],
    reeve: ['Reeve nods to you across the loft afterwards, the nod one gives to something put by for later.', 'You find that you have checked your purse twice since talking to Reeve, and that he has seen you do it both times.', 'Reeve is being pleasant to somebody else now. You watch how he does it.'] },
  harfleur: {
    perkin: ["Perkin has been put to carrying for the cooks, and comes back smelling of smoke and somebody else's dinner.", 'Perkin has stopped whistling. You notice it, as you would notice a mill stopping.', 'Perkin is asleep sitting up against the trench wall, with his mouth open.'],
    ieuan: ['Ieuan is sitting on an upturned basket, sorting shafts by weight, as if the guns were weather.', 'The Welshman has found the one dry place in the trench. He always does.', 'Ieuan watches the wall for an hour at a time without moving, as a heron watches water.'],
    cutler: ['Cutler walks the length of the trench twice a day and touches each man on the shoulder as he passes, counting.', 'Cutler has a tally stick inside his jack now. He does not show it to anyone.', 'Cutler is thinner. He has stopped shouting, and that worries the twenty more than the shouting ever did.'],
    reeve: ['Reeve has a dry blanket, a full flask and a whole skin. Nobody has seen him do anything to deserve them.', 'Reeve is doing a favour for a serjeant of another company. He does a great many favours.', 'Reeve has gone off down the lines with a sack. He will come back with something in it.'] },
  march: {
    perkin: ['Perkin is limping, and pretending not to.', 'Perkin has gone quiet again, and is walking with his eyes on the heels in front.', 'Perkin asks how far it is to Calais. Nobody answers him, so he asks again.'],
    ieuan: ['Ieuan walks at the same pace up hills and down them, and never seems to arrive tired.', 'The Welshman has cut himself a staff. He says a man with a staff has three legs, and the French have only two.', 'Ieuan is singing under his breath, in Welsh, to the time of his feet.'],
    cutler: ['Cutler is walking at the rear of the twenty now, where he can see who is falling behind.', 'Cutler counts the twenty at every halt. He does not need to. He does it all the same.', 'Cutler has given his own cloak to somebody. He will not say whom.'],
    reeve: ['Reeve is chewing something. Nobody else in the twenty has anything to chew.', 'Reeve walks on the outside of the column, where he can see into the ditches.', 'Reeve has a second pair of boots. They are tied round his neck by the laces.'] }
};

/* ================= v0.16: a proper start to the siege and to the march ================= */
scene('h_camp', 'harfleur', 'The lines', () => `It takes four days to bring the army round Harfleur and shut it in. The King sits on the hill to the west. His brother Clarence has gone round by a long march to close the east. Between them lies the town: grey walls, a wet ditch, and before the Leure gate a great bulwark of tree trunks and earth that the garrison has thrown up to keep the guns off the gate itself.

The twenty has been given sixty yards of the western lines to dig and to hold, between the gun pits and the marsh. Cutler walks the ground once, from end to end, and then divides it. There are three sorts of work here: digging the trench forward towards the wall, carrying for the gunners, and standing picket at the marsh end, where the ground is too wet to dig and a man can only lie in the reeds and watch.`, [
  { t: 'Take a spade, next to Ieuan',
    out: [`Ieuan digs slowly and never stops, and by the end of the day he has shifted twice what the young men have. 'Dig it as if you meant to live in it,' he says. 'You will be.' He shows you how to cut a step to stand on and a shelf to keep a bow off the wet. It is the first thing anyone has taught you in France.`, { pull: ['ieuan', 1], arm: 1 }] },
  { t: 'Carry for the gunners, with Perkin', if: () => perkinHere(),
    out: [`The gunners are Dutchmen and Germans, paid more in a week than the twenty is in a quarter, and they treat the guns as other men treat horses. Perkin is frightened of the powder and delighted by everything else. By the end of the day he can swear in Dutch, and you have learned to open your mouth and stop your ears when the master gunner lifts his hand.`, { pull: ['perkin', 1], wits: 1 }] },
  { t: 'Take the picket at the marsh end, with Reeve', if: () => !S.flags.reeve_enemy,
    out: [`Reeve has stood picket before a good many towns. He shows you where to lie so that the reeds break your outline, and how to watch a wall by looking to one side of it. He also shows you where a man on picket can sleep without being found. He seems to think the two lessons are of equal worth.`, { pull: ['reeve', 1], eye: 1 }] },
  { t: 'Ask Cutler where he wants you',
    out: [`He hesitates, as if the question were a trick. Then he puts you at the join between the twenty and the Cheshire company on its left. 'That's where it goes wrong,' he says. 'Where one lot ends and the next begins. Keep your eyes open and tell me what you see.' It is a compliment, of the kind he gives.`, { st: 1, pull: ['cutler', 1] }] }
]);
scene('h_first', 'harfleur', 'The first stone', () => `The King's guns open on the third day, and the town answers. Nobody in the twenty has been shot at by a gun before, save Ieuan and Reeve, who are lying flat a full breath before anyone else has heard anything.

The stone comes over the trench with a noise like a cart crossing a bridge, and strikes the spoil bank twenty yards along. When the earth has finished falling, one of the two Johns is not there. There is his spade, and a shoe. An hour ago he was four places from you in the line, and you had not yet learned which of the two Johns he was.${perkinHere() ? ' Perkin has gone the colour of tallow.' : ''}`, [
  { t: 'Go and dig for him, with the others', test: ['grit', 7, 'labour'],
    win: [`You dig with your hands, since a spade would be worse. You are the one who finds him. He is the first dead man you have ever handled, and he is still warm, which you had not expected. Hodge says the words. Cutler takes a stick from inside his jack and cuts a notch in it, and looks to see who is standing there with earth to the elbows.`, { st: 1 }],
    lose: [`You get as far as the edge of the fall, and there your legs stop. Hodge moves you to one side, not unkindly, as he would shift a stool. You stand and watch them dig. It is as much as you can do, and you find that you despise it.`, {}] },
  { t: 'Stay flat, and learn the sound', test: ['wits', 7],
    win: [`You make yourself listen to the next one, and the one after. First the cough of the gun, then a count of four, then the cart on the bridge. By the fifth stone you can tell one that is coming to you from one that is going to somebody else. It will not stop a stone. It will, however, tell you when there is no use in lying down.`, { eye: 1 }],
    lose: [`Every one of them sounds as if it is coming for you by name. You are still lying flat, with your face in the clay, some time after the others have got up and gone back to work.`, {}] },
  { t: 'Pick up his spade, and go on with the trench',
    out: [`Somebody has to, and the spade is there. You dig in his place until the light goes. Nobody says anything about it. Cutler, coming along the trench, stops and looks at the spade and at you. 'That's the way of it,' he says, to nobody, and goes on.`, { grit: 1 }] }
]);
scene('m_day', 'march', 'The order of march', () => `On the road the army goes in three battles. Sir John Cornwall and Sir Gilbert Umfraville have the van, the King has the main body, and the Duke of York and the Earl of Oxford bring up the rear. The twenty marches with the main battle, in a column four abreast that takes the better part of an hour to pass any given tree.

You walk where Cutler puts you until the first halt. After that men sort themselves out, as they did in the loft at Southampton. Who you walk beside for a hundred and fifty miles is no small thing.`, [
  { t: 'Fall in beside Ieuan',
    out: [`Ieuan walks at one pace, up hill and down, and does not talk while he is walking. At the halts he does not sit. He drinks, eases his pack, looks at his feet and is ready before the trumpet. You copy him, having no better idea, and at the end of the day you are less tired than men twice your size.`, { pull: ['ieuan', 1], heal: 1 }] },
  { t: 'Fall in beside Perkin', if: () => perkinHere(),
    out: [`He has been waiting for you to. He talks for the first five miles, and then, for the first time since you have known him, he stops. After a while he says that he would like to see the bakehouse again. You say that he will. Neither of you looks at the other, and you both walk a little faster.`, { flag: 'bond', pull: ['perkin', 1], say: 'Perkin will keep close to you.' }] },
  { t: 'Walk at the head of the twenty, behind Cutler',
    out: [`From here you can see what he sees: who is lame, who is carrying too much, who has not spoken since the gate. He says nothing to you all day. At the last halt he hands you his water skin without looking round, and you take it to be filled.`, { st: 1, pull: ['cutler', 1] }] },
  { t: 'Drop back to the rear, with Reeve', if: () => !S.flags.reeve_enemy,
    out: [`'This is where a wise man walks,' Reeve says. 'Things fall off carts, and men throw away what they will want tomorrow.' By the last halt he has a cooking pot, a good cloak and a ham bone, and you have threepence that somebody dropped and a much clearer idea of how he has lived through twenty years of this.`, { c: 3, pull: ['reeve', 1] }] },
  { t: 'Walk by yourself, and keep your own counsel',
    out: [`You find a place in the column where nobody expects you to talk, and you give your mind to the road: the weight of the pack, the heel of the man in front, the count of your own steps. It is dull. All the same, by the end of it you know what your legs will do, and that is worth knowing early.`, { grit: 1 }] }
]);
scene('m_eighth', 'march', 'The eighth day', () => `The King told the army to carry food for eight days, and this is the eighth. By the reckoning made at Harfleur you should be within sight of Calais. You are, in fact, further from Calais than you were four days ago, and marching the wrong way up a river that you cannot cross.

Cutler shares out what is left in the company sack. It comes to a strip of dried beef and half a biscuit for each man. Then he turns the sack inside out and shakes it, so that everybody can see.`, [
  { t: 'Eat it now, all of it',
    out: [`You eat it standing up, slowly, and you lick your fingers after. Tomorrow will have to see to itself. It is the best strip of beef you have ever tasted, and you say so, and for a wonder it gets a laugh.`, { heal: 1 }] },
  { t: 'Put the biscuit by for tomorrow',
    out: [`You eat the beef and fold the biscuit into your hood. Tomorrow, when the twenty has nothing at all, you have half a biscuit, and you learn exactly what half a biscuit is worth to a man who has none. It is not a comfortable thing to learn, but it stays learned.`, { wits: 1 }] },
  { t: 'Give yours to Perkin, who is still growing', if: () => perkinHere(),
    out: [`He says no, and then he takes it, and eats it with his back turned. He is sixteen and has been hungry since the Bresle. The twenty sees you do it. Nobody says anything, though Hodge moves over at the fire to give you the warm side.`, { st: 1, flag: 'bond', pull: ['perkin', 1], say: 'Perkin will keep close to you.' }] },
  { t: 'Ask Cutler what happens on the ninth day', test: ['wits', 7, 'talk'],
    win: [`'We walk,' he says. Then, since you asked it quietly, he tells you the rest. He has been hungry in France before. Men last longer without food than they expect to. It is the feet that go first, and after the feet, the temper. 'Keep both,' he says, 'and I'll get you there.' You notice that he does not say where.`, { grit: 1, pull: ['cutler', 1] }],
    lose: [`'On the ninth day, cobbler,' Cutler says, 'I stop answering questions.' He has had a great many of them since the sack came out.`, {}] }
]);

/* ================= v0.17: builds. Three people each teach one thing, from a few on offer ================= */
Object.assign(ITEM, {
  bn_draw:    { n: 'The Welsh draw',          d: 'You bend the bow with your back, as Ieuan does. Shooting and heavy work go a little better.', b: { shoot: 1, labour: 1 } },
  bn_gap:     { n: 'Shooting for the joints', d: 'Throat, armpit and eye slit, at thirty paces and nearer. Shooting at close range goes better.', b: { close: 2 } },
  bn_horse:   { n: 'Shoot the horse',         d: 'A knight is a small thing on top of a large thing. Standing against the horse goes better.', b: { cav: 2 } },
  bn_maul:    { n: 'Mallet work',             d: 'Do not swing it. Drop it. Hand-to-hand fighting goes better.', b: { melee: 2 } },
  bn_stand:   { n: 'Where to stand',          d: 'Behind the stake, and never beside it. Standing against the horse and fighting hand to hand go a little better.', b: { cav: 1, melee: 1 } },
  bn_camp:    { n: "An old soldier's habits", d: 'Boil it, dry your feet, sleep off the ground. You resist the flux better, and march a little better.', b: { flux: 2, march: 1 } },
  bn_talk:    { n: 'A soft answer',           d: 'Ask for less than they feared, and thank them first. Talking people round goes better.', b: { talk: 2 } },
  bn_shriven: { n: 'Shriven',                 d: 'Your account is settled. One more wound in you.', hp: 1 },
  bn_walk:    { n: "The friar's way of walking", d: 'Bound feet, short steps, and no noise. Marching goes better, and going unseen a little better.', b: { march: 2, sneak: 1 } }
});
function offer(who, n, all) {
  S.offer = S.offer || {};
  if (!S.offer[who]) { const ix = [...Array(n).keys()].map(k => [k, rnd()]).sort((a, b) => a[1] - b[1]).map(x => x[0]); S.offer[who] = all ? ix : ix.slice(0, 3); }
  note('boon');
}
const offered = (who, k) => !S.offer || !S.offer[who] || S.offer[who].includes(k);
scene('boon_ieuan', 'soton', 'What the Welshman knows', `Ieuan has been watching you shoot for days and has said nothing about it, which you had taken for contempt. Now he puts down his fletching and comes over.

'You'll not be an archer by the time we sail,' he says. 'Nobody is made one in a week. It takes from seven years old. But there is one thing I can put into you before the ships, if you choose it well and work at nothing else. So choose.'`, [
  { t: 'How to draw', if: () => offered('ieuan', 0),
    out: [`'You draw with your arm. Stop it.' He puts his hand flat between your shoulder blades and pushes. 'There. That is where the bow lives.' For three days he has you bending it by stepping into it, the way you would lean on a door. On the fourth your shafts are flying ten paces further than they did, and you are not out of breath.`, { item: 'bn_draw', pull: ['ieuan', 1] }] },
  { t: 'How to shoot a man in plate', if: () => offered('ieuan', 1),
    out: [`He scratches a helmet in the dirt with an arrow. 'Not at him. A man in harness is a wall. You shoot at where the wall is jointed.' Throat. Armpit, when the arm goes up. The eye slit, if you are near and God is kind. 'Thirty paces and nearer,' he says. 'Further off than that, shoot his horse, and save your good heads.'`, { item: 'bn_gap', pull: ['ieuan', 1] }] },
  { t: 'How to stop a horse', if: () => offered('ieuan', 2),
    out: [`'A knight is a small thing on top of a large thing,' Ieuan says. 'Shoot the large thing.' Not the head, which is armoured and does not care. The chest as it comes on, and the flank as it turns. A horse that is hurt will not go forward for any spur, and it will take the man with it. He has you shoot at a hurdle with a blanket over it until you stop aiming at where the rider would be.`, { item: 'bn_horse', pull: ['ieuan', 1] }] },
  { t: 'How to keep a string', if: () => offered('ieuan', 3) && !has('string'),
    out: [`He gives you a string of his own twisting, waxed until it shines, and shows you how to coil it and where to keep it: under the cap, against the hair, where a man is driest. 'A wet string is a dead archer,' he says. 'Every fool carries a bow. The ones who go home are carrying two strings.' He adds a sheaf of his own shafts, as an afterthought.`, { item: 'string', ar: 1, pull: ['ieuan', 1] }] }
], { enter: () => offer('ieuan', 4, S.pull.ieuan >= 3) });
scene('boon_cutler', 'harfleur', 'What Cutler knows', `Cutler comes along the trench after the count and sits down on the fire step beside you, which he has not done before. He has lost men this week, and he has the look of somebody working a sum.

'I can't make soldiers of the lot of you,' he says. 'There isn't the time. I can make each of you good at one thing. So what do you want to be good at, cobbler, when it comes to it?'`, [
  { t: 'Close work', if: () => offered('cutler', 0),
    out: [`'The bow is for when they are over there,' he says. 'Sooner or later they are over here.' He puts a lead maul into your hands, the kind used for driving stakes. 'Don't swing it like an axe. You'll never get it back. Drop it. Knees first, and the helm when he is down.' He has you drop it on a post for an hour a day until the post is a stump.`, { item: 'bn_maul', pull: ['cutler', 1] }] },
  { t: 'Standing when the horse comes', if: () => offered('cutler', 1),
    out: [`He drives a stake and makes you stand behind it, and then walks at you, quite slowly, with a spade held like a lance. Every time, you step sideways. Every time, he hits you with the spade. 'Behind it,' he says. 'Never beside it. The stake is the only friend you have on that field and you keep leaving him.' By the end of the week you have stopped stepping.`, { item: 'bn_stand', pull: ['cutler', 1] }] },
  { t: 'Staying alive between the fights', if: () => offered('cutler', 2),
    out: [`'More of mine have died of the ditch than of the French,' Cutler says. It is the longest speech you have had from him, and it is all rules. Boil what you drink. Dry your feet whenever you stop. Sleep off the ground if it is only on two bundles of brushwood. Eat what you are given when you are given it. He makes you say them back. Then he watches, for a week, to see whether you do them.`, { item: 'bn_camp', pull: ['cutler', 1] }] },
  { t: 'Being a man you can use', if: () => offered('cutler', 3),
    out: [`He looks at you for some time. 'Then do what I say the first time I say it,' he says, 'and be where I look when I look.' He takes you for his runner for a week. You carry his messages and his tally and once, memorably, his boots. By the end of it he has stopped calling you cobbler in front of the others, and started using your name.`, { st: 2, pull: ['cutler', 1] }] }
], { enter: () => offer('cutler', 4, S.standing >= 4) });
scene('boon_friar', 'march', 'What the friar knows', `The Franciscan from the quay at Southampton has come to France after all, with a chaplain's licence and the same tray, and has walked every mile of it in sandals. He falls in beside you on the road as if by accident.

'I have been watching you, my son,' he says. 'You have the look of a man who expects the worst and means to be present when it comes. I have very little to give anybody. Still, a friar learns one or two things that a soldier does not.'`, [
  { t: 'How to talk to anybody', if: () => offered('friar', 0),
    out: [`'It is a beggar's trade, and I am a beggar by profession,' he says. Ask for less than they feared. Thank them before they have agreed. Never let a man feel he has lost, and he will give you his cloak. He has you practise on a provost's serjeant, who parts with half a loaf and seems pleased to have done it. You watch the friar bless him, and understand that you have been taught by a master.`, { item: 'bn_talk' }] },
  { t: 'How to be ready', if: () => offered('friar', 1),
    out: [`He hears your confession on the march, walking, with his hood up, and he does not let you hurry it. It takes four miles. At the end he gives you the words, and you find, to your surprise, that something has been put down which you had been carrying. 'A man whose account is settled stands straighter,' he says. 'I have seen it turn a blade. I do not say how.'`, { item: 'bn_shriven' }] },
  { t: 'How to walk', if: () => offered('friar', 2),
    out: [`He has walked from Assisi to Compostela and back, he says, and from there to Southampton, on these same feet. He shows you how to bind yours with a strip of linen and a smear of tallow, how to shorten your step on the stones, and how to go so quietly that a sentry yawns as you pass. 'Francis preached to the birds,' he says. 'One has to get close to a bird.'`, { item: 'bn_walk' }] },
  { t: 'Whether he has any money', if: () => offered('friar', 3),
    out: [`He laughs so that the men in front turn round. Then he counts sixpence into your hand from the purse under his habit. 'An archer gave me that at Harfleur, to pray for him,' he says. 'He no longer needs the prayers, and you need the sixpence. I shall tell the saints it was the same thing.'`, { c: 6 }] }
], { enter: () => offer('friar', 4, has('badge')) });

/* ================= v0.18: the battle as a set piece. Wing, centre and baggage each have their own sequence ================= */
scene('bg_carts', 'battle', 'The carts', `Maisoncelle is a church, a dozen houses and a great park of carts, with the army's horses picketed behind it in thousands, since every man who can fight today is fighting on foot. The guard is thirty pages, a few priests, the sick, and you.

From the churchyard wall you can see the back of the English line a mile off: a thin dark thread across the plough. Beyond it you can see nothing, since the French fill everything beyond it. For a long time nothing happens. Then, quite small with distance, comes a shout taken up by thousands of men, and the thread begins to move away from you.

The King's own baggage is here: his beds, his plate, the chests under the royal seal. So is the twenty's sack, and in it the purse of every man you know.`, [
  { t: 'Climb the church tower, and watch', test: ['eye', 6],
    win: [`From up here you see what nobody in it will ever see: the wedges of archers, the horse breaking on the wings, the whole French host pressed between the two woods like corn in a funnel. You see where it narrows. You see that whatever is decided today will be decided in the middle, under the one banner that has not moved. It is a thing worth knowing, and you are a mile from being able to use it.`, { learn: 'k_centre', wits: 1 }],
    lose: [`There is a mist coming off the plough, or smoke, or the breath of thirty thousand men. You can make out that something very large is happening. You cannot make out what.`, {}] },
  { t: 'Walk the carts, and see what there is to guard',
    out: [`It takes you a quarter of an hour, and at the end of it you know three things. The pages are children. The priests have never held anything heavier than a chalice. And the lane that comes in from the north, out of the trees, has nobody watching it at all. You move a cart across it. That is all one man can do.`, { eye: 1 }] },
  { t: 'Sit down with the sick, out of the wind',
    out: [`There is a fire, of a kind, in the lee of the church. You sit by it among men who are too ill to care who wins. A page of about nine asks whether you are a real archer. You tell him that you were one yesterday.`, { heal: 1 }] }
]);
scene('bg_raid', 'battle', 'The lord of the place', `They come out of the trees on the north side while every eye in the village is on the battle: some hundreds of the country people, with flails and billhooks, and at their head three men in harness on good horses. One of the pages says it is the lord of Agincourt himself, come to see what the English have left in his village.

They are not here to fight. They are here to rob, and they go at the carts as starlings go at a threshing floor. The priests run for the church. The pages run in every direction at once.`, [
  { t: "Stand on the King's cart with your bow", arrows: 1, test: ['eye', 9, 'shoot'],
    win: [`You put a shaft into the first man who lays a hand on the sealed chest, and another into the second. They are robbers and not soldiers, and there are easier carts. They go round you. A crown in its case goes off on somebody's shoulder, and a sword of state, and the King's beds. But the chest you are standing on is still there when they have gone, and a chamberlain with a cut head is writing down your name.`, { st: 2, c: 6, learn: 'k_baggage' }],
    lose: [`A flail takes the bow out of your hands and a second one takes your feet from under you. You lie beneath the cart and watch through the wheel as they carry off the King's crown in its case, as carefully as eggs.`, { b: -1, learn: 'k_baggage' }] },
  { t: "Get the twenty's sack and the pages into the church", test: ['wits', 7],
    win: [`You have the sack over your shoulder and six small boys in front of you, and you get all of it through the church door, and the door barred, before the first of them reaches the porch. They try it once with a billhook and go off after softer things. Every penny the twenty owns is under your feet. You sit down on it.`, { st: 2, flag: 'bag_sack', learn: 'k_baggage' }],
    lose: [`You get the boys in. The sack is another matter: a man with a flail has it before you do, and he is twice your weight and in a hurry. You watch the twenty's pay go up the north lane on a Picard's back.`, { st: 1, learn: 'k_baggage' }] },
  { t: 'Take a horse, and ride for the line with the news', test: ['grit', 8],
    win: [`You have not sat a horse since you were ten, and this one knows it. But it runs the right way, which is all you ask of it. You come up behind the King's battle shouting that they are in the baggage. A knight turns his head. Then the word is going forward through the ranks faster than you could carry it.`, { flag: 'bag_ran', learn: 'k_baggage' }],
    lose: [`The horse puts you off in the plough half a mile short. You run the rest, in mud to the shins, and arrive behind the line with no breath to say what you came to say. Somebody else is already saying it.`, { b: -1, flag: 'bag_ran', learn: 'k_baggage' }] }
]);
scene('bg_word', 'battle', () => S.flags.bag_ran ? 'Behind the banner' : 'What it cost', () => S.flags.bag_ran
  ? `You are standing behind the King's battle with your hands on your knees when the day ends. The field in front is a wall of dead. A third French battle is sitting its horses at the far end, and it has begun to stir. Round the King there are men shouting about the baggage, and he is not looking at any of them. He is looking at the prisoners.

You brought that news. You brought it as fast as you could, and you have a feeling, as he turns to give an order, that you are about to see what it was worth.`
  : `The lord of Agincourt and his people are gone, and half the carts with them. From the churchyard you hear a new sound from the field: not the roar of before, but something thinner, which goes on for some time and then stops.

Men will tell you afterwards what it was. The King heard that his baggage was taken and saw the last French battle stirring, and he ordered the prisoners killed. You sit among the broken chests and understand that what happened here, with flails and three men on horses, was the reason for what happened there.`, [
  { t: 'Find Cutler and the twenty', if: () => !!S.flags.bag_ran,
    out: [`They are forty paces off, most of them, black to the eyes. Cutler looks at you, and at the mud on you, and at the direction you have come from. 'You were sent to the carts,' he says. You tell him about the carts. He shuts his eyes for a moment. Then he tells you to fall in.`, {}] },
  { t: 'Stay where you are, and watch the banner', if: () => !!S.flags.bag_ran,
    out: [`From here you can see how close it came. The ground before the King's banner is the worst on the field. The King's brother is being carried back from it on a door, alive, and a squire lies dead where he fell. Whatever was wanted of this day was wanted there, an hour ago, and you were a mile off, holding a horse.`, { learn: 'k_centre' }] },
  { t: 'Help the priests with the hurt pages', if: () => !S.flags.bag_ran,
    out: [`There are four of them, and one is very bad. You do what the priest tells you. You hold a basin, and then you hold a hand. It is not what you came to France to do. It is, as it turns out, the only thing you have done in France that you would do again without being asked.`, { grit: 1 }] },
  { t: "Go through what is left, for the twenty's things", if: () => !S.flags.bag_ran,
    out: [() => S.flags.bag_sack ? `The sack is where you left it, under the font, with the priest sitting on it. Every knot is as Cutler tied it. You carry it down to the field yourself, and you put it into his hands, and for once he has nothing to say at all.` : `You find Ieuan's spare bowstave snapped across a wheel, and Hodge's blanket, and a boot. Under a tilted cart there is a purse that the robbers missed, with nobody's mark on it. You tell yourself that you will ask whose it is.`, () => (S.flags.bag_sack ? { st: 1 } : { c: 5 })] },
  { t: 'Walk down to the field', if: () => !S.flags.bag_ran,
    out: [`You get there as it is ending. Nobody stops you. The heap before the King's banner is as high as your chest, and the household men are still pulling the living out of it. You stand where the fighting was and look back at Maisoncelle, a mile off, and think about how a man might have got from there to here.`, { learn: 'k_centre' }] }
]);
scene('bc_horse', 'battle', 'The horse go by', `Erpingham throws his white baton in the air and shouts something that might be 'Now strike', and five thousand bows come up together. The first flight goes over with a sound like a great cloth tearing.

The French horse come off both wings, and from the wedge beside the King's battle you watch them go for the flanks, where the stakes are. They are fewer than they ought to be, and the plough is up to their hocks. For the space of a few breaths you have what no archer on the wings will have today: the whole side of a charge going past at a hundred paces, and nothing whatever coming at you.`, [
  { t: 'Shoot into the flank of them as they pass', arrows: 1, test: ['eye', 8, 'shoot cav'],
    win: [`A horse seen from the side is a barn door. You put four shafts into the same grey, and it swerves across the three behind it, and they go down together in a tangle of legs. What reaches the stakes on the right is no longer a charge. The hurt horses turn, and bolt back through their own men on foot, and you can hear the French line come apart from here.`, { st: 1 }],
    lose: [`You shoot over them, and then behind them. Then a destrier with no rider and an arrow in its neck comes back along the front of the King's battle, mad with it, and goes through the wedge like a cart through a hedge. You are under it for a moment.`, { b: -1 }] },
  { t: 'Hold your arrows for the men on foot',
    out: [`Everybody round you is loosing. You stand with a shaft on the string and do not. Erpingham's serjeant looks at you hard. Then the first French battle starts forward on foot, eight thousand men in plate, and you have a full bag, and the men on either side of you are already feeling for the bottom of theirs.`, { ar: 1 }] },
  { t: 'Watch the King', test: ['wits', 6],
    win: [`He has his visor up. He is not looking at the horse at all. He is looking past them, at the men on foot, and you can see his lips move as he counts. On his left is a big fair man who keeps stepping forward of the line and being called back: his brother Gloucester, somebody says. You mark where each of them stands, and how far it is from you.`, { eye: 1 }],
    lose: [`There is too much going on, and you have never seen a king before. You stare at the crown on the helm like a ploughboy at a fair, and learn nothing from it.`, {}] }
]);
scene('bc_press', 'battle', "The King's battle goes back", `The first French battle reaches the English men-at-arms, and the line gives a spear's length all at once, like a door taking a shoulder. You are ten paces from the join.

The French are packed so close that the men in front cannot lift their arms, and the men behind are pushing them on to the English points. The wedge is ordered to shoot into the side of that press, at a distance across which you could throw a stone.`, [
  { t: 'Shoot into the press, as ordered', arrows: 1, test: ['arm', 8, 'shoot close'],
    win: [`At this range a bodkin goes through a breastplate as an awl goes through cowhide. You do not aim. There is nothing to aim at, only steel, and you put a shaft into it and take another. The side of the French column curls in on itself, away from the wedge, and the men in it who are trying to turn cannot turn.`, { st: 1, grit: 1 }],
    lose: [`Your hands are shaking so that two shafts in three go into the mud. A French man-at-arms sees it. He comes out of the side of the press at the wedge with a shortened lance, and it is you he has chosen.`, { b: -1 }] },
  { t: 'Drop the bow, and go in at the join', test: ['grit', 9, 'melee'],
    win: [`Where the two lines meet a man is down, and the gap is exactly as wide as he was. You step into it with the mallet. For the length of a few blows you are standing in the King's battle, among men in plate, in a padded jack. Then a household squire shoulders in beside you and fills the place. 'Good lad,' he says, without looking, and you get out from under his feet.`, { st: 2 }],
    lose: [`The gap closes on you. You are caught between an English shoulder and a French one, with your arms pinned, and something comes down on your head that was not meant for you in particular.`, { b: -2 }] },
  { t: 'Pull a fallen man clear by his heels',
    out: [`An English squire is down in the second rank, and men are standing on him. You get him by the ankles and haul him out backwards through the wedge, like a calf out of a ditch. He is alive, and he is somebody's son. When he can speak, he gives you a ring off his finger and tells you to bring it to him at Calais and name your price.`, { c: 6, wits: 1 }] }
]);
scene('bm_perkin', 'battle', "Perkin's bag", `Perkin is shooting much too fast. He has loosed a whole sheaf while you have loosed half of one, and most of it has gone into the mud forty paces short of anybody. His eyes are quite round. In another minute he will be standing in the middle of a battle with an empty bag.`, [
  { t: 'Take him by the belt, and make him wait for the word', test: ['wits', 7, 'talk perkin'],
    win: [`You get a hand on him and say his name, twice, as you would to a horse. He stops. He breathes. His next shaft takes a man-at-arms in the visor at thirty paces, and he looks down at the bow as if it had spoken to him.`, { grit: 1 }],
    lose: [`He shakes you off without knowing who you are. He goes on until his fingers find the bottom of the bag, and then he stands there with his hand in it.`, {}] },
  { t: 'Give him half of yours', if: () => S.arrows >= 1,
    out: [`You push a fistful of shafts into his belt. He nods, and goes on shooting, a little slower for having been noticed. It will run you short. You find that you do not grudge it.`, { ar: -1, flag: 'bond', say: 'Perkin will keep close to you.' }] },
  { t: 'Let him be. It is his own bag.',
    out: [`You have your own work. When you next look round he has thrown the bow down and is holding a stake mallet in both hands, with his back against yours.`, {}] }
], { bm: 1, when: () => perkinHere() });
scene('bm_wood', 'battle', 'The Tramecourt wood', `There is movement in the Tramecourt wood, at your right shoulder. They are French, on foot, working round the end of the line through the trees, where the stakes do not reach. There are not many of them. There are enough.`, [
  { t: 'Go into the trees after them, with whoever will come', test: ['grit', 8, 'melee sneak'],
    win: [`Four of you go. It is a different kind of fighting under the trees: close, and quiet, and done with knives. They had not expected to be met. When you come out again there are three of you, and nothing is coming round the end of the line.`, { st: 2 }],
    lose: [`They are men-at-arms, and you are four archers in a wood. You come out of the trees faster than you went in, and one of you does not come out.`, { b: -1 }] },
  { t: 'Shout it to Cutler, and keep your place',
    out: [`Cutler looks where you point, and swears, and turns the end file to face the trees. It is enough. The men in the wood see a dozen bows come round on them and decide that there are better ways into the battle.`, { st: 1 }] },
  { t: 'Shoot at the movement', arrows: 1, test: ['eye', 8, 'shoot'],
    win: [`You cannot see men. You can see where the hazel moves, and you shoot at that, low. Somebody cries out. The movement stops, and after a while it goes back the way it came.`, { wits: 1 }],
    lose: [`You put a sheaf into a wood. The wood does not appear to mind.`, {}] }
], { bm: 1, when: () => !S.flags.centre });
scene('bm_crown', 'battle', 'The banner', `The man who carries the King's banner takes a quarrel through the throat and goes down on his knees, and for the space of a breath the banner leans like a felled tree. Every man in the wedge sees it. So does every Frenchman within a hundred paces, and a shout goes up from them.`, [
  { t: 'Shoot at whoever comes for it', arrows: 1, test: ['eye', 9, 'shoot close'],
    win: [`Three of them break out of the press and go for the staff. The first has his arm up to seize it, and the armpit of a harness is mail and nothing more. You put the shaft there. The second trips on the first. By then a household knight has the banner upright again, and is roaring.`, { st: 2 }],
    lose: [`There are too many backs between you and it, and all of them English. You hold the shaft on the string until your arm shakes, and never get the shot.`, {}] },
  { t: 'Run in, and get your shoulder under the staff', test: ['arm', 7],
    win: [`It is heavier than a church door, and the dying man has not let go of it. You get under it and heave, and it comes up. For the length of ten heartbeats a cobbler's apprentice is holding up the banner of England. Then a knight takes it from you, quite courteously, and somebody presses a gold noble into your hand.`, { c: 8, st: 1 }],
    lose: [`You get there as it falls. It comes down across your shoulders, staff and silk and all, and you are under it in the mud while better men fight over the top of you.`, { b: -1 }] },
  { t: 'Close up towards it, with the rest',
    out: [`The wedge shuffles left without a word from anybody, every man of it, towards the place where the banner dipped. Nobody gave the order. You find that you are nearer to it than you were, with a mallet in your hand, and less frightened than you were a moment ago.`, { grit: 1 }] }
], { bm: 1, when: () => !!S.flags.centre && !!(S.played.bc_press || S.played.bc_press_b) });
scene('bm_second', 'battle', 'The second battle', `The first French battle is a rampart of dead and dying, in places as high as a man's chest. The second is coming on behind it, and has to climb over the first to get at you. For a little while there is nobody to fight. Your arms are trembling. Somebody is passing a helmet full of water along the line.`, [
  { t: 'Drink, and breathe',
    out: [`It is ditch water in a dead man's helmet, and it is the best thing you have ever tasted. You breathe until your hands have stopped. The man next to you says, 'Is that it?' and somebody further down tells him, quite kindly, that it is not.`, { heal: 1 }] },
  { t: 'Go forward, and pull arrows out of the dead', test: ['grit', 7],
    win: [`You go out in front of the stakes, bent double, and pull. Some come out clean. Some you have to put your foot on. You come back with a sheaf and a half and a clear idea of what an arrow does, which you had managed until now not to have.`, { ar: 1 }],
    lose: [`One of them is not dead. He has a dagger, and no particular reason to lie still while a cobbler puts a foot on his chest.`, { b: -1 }] },
  { t: 'Find something heavier on the heap', if: () => !has('maul'), test: ['eye', 6],
    win: [`There is a lead maul lying by a broken stake, with the owner's hand still round the haft. You take it out of the hand. It is five pounds of dull metal on a yard of ash, and nobody in plate has yet found an answer to it.`, { item: 'maul' }],
    lose: [`Everything on the heap is either broken or still held. You come back with a dead knight's dagger that turns out to have no point.`, {}] }
], { bm: 1, when: () => !S.flags.baggage && !!(S.played.b_close || S.played.b_close_b || S.played.b_close_c || S.played.bc_press || S.played.bc_press_b) });

/* ================= v0.19: a second version of the flux ================= */
scene('flux_b', 'harfleur', 'The sick lines', () => `By the third week the army has two camps: one before the walls, and one behind it by the ships, where the sick lie in rows under sailcloth and the priests go up and down like men sowing a field. The Bishop of Norwich is dead of it. The Earl of Suffolk is dead of it, and his son is an earl at twenty-one. The Duke of Clarence has been carried aboard a ship. When Harfleur gives up its keys, on the twenty-second of September, half the army is too weak to cheer.${S.flags.shell ? ' You think about the mussels.' : ''}${S.flags.fruit ? ' You think about the apples.' : ''}${S.flags.drank ? ' You think about the ditch water.' : ''}

You know the first gripe when it comes. You have watched it come to everybody else.`, [
  { t: 'Stay in the trench, and tell nobody', test: ['grit', () => fluxDc(), 'flux'],
    win: [`You tell nobody, and for three days you do your work with your teeth shut. On the fourth it is gone, as if it had only wanted to see what you would do. You have lost flesh you could not spare. But you walked through it, and the men who lay down are still lying.`, () => fluxFx(true)],
    lose: [`You tell nobody until you fall off the fire step, and then there is no need to tell. They carry you to the lines on a hurdle. You do not die there, though you are not far off it for a week, and you march out of Harfleur looking like something a priest should have been sent for.`, () => fluxFx(false)] },
  { t: 'Chew the tormentil root', if: () => has('root'),
    out: [`It tastes of bark and old boots, and you chew it until your jaw aches. By the second day the gripes have slackened. By the fourth you are carrying other men to the lines, when you had looked to be carried there yourself. Tuppence, it cost you. You have never spent tuppence so well.`, () => Object.assign({ drop: 'root' }, fluxFx(true))] },
  { t: 'Pay a shipman for a berth in the dry, and boiled water', cost: 6, test: ['grit', () => fluxDc() - 3, 'flux'],
    win: [`Sixpence buys you a plank in the forecastle of a cog, out of the marsh air, and a kettle the cook keeps on the boil. You lie there four days, listening to the water under the hull. On the fifth you climb back down to France on your own legs.`, () => fluxFx(true)],
    lose: [`The berth is dry and the water is boiled, and it runs its course in you all the same. You come ashore in time to march, a week out of your bed, and the shipman does not offer you your sixpence back.`, () => fluxFx(false)] }
], { place: 'Harfleur, September' });

/* ================= v0.20: second versions of scenes every waking passes through ================= */
scene('fire_s_b', 'soton', 'The last cask', () => `The fleet sails tomorrow. In the loft the twenty has packed what it owns, which took no time at all, and is sitting about among the bundles with nothing left to do but finish the chandler's ale.${perkinHere() ? ' Perkin is trying to get a loaf into a pack that is already full.' : ''} Ieuan is going over his shafts one at a time, rolling each across his palm to see whether it runs true. Cutler is by the hatch, where he always is, with his back to the wall and his eyes on nothing. There is room to sit. After tonight there will be a ship, and after the ship, France.`, [
  { t: 'Sit with Perkin', if: () => perkinHere() && !S.flags.cold,
    out: [`He has been down to look at the ships three times since supper. He tells you which one is yours, and gets it wrong, and Hodge puts him right. 'What's it like?' he says. 'France.' You say that you have never been. 'No, but what do you think it's like?' You say that you think it is like Hampshire, with worse beer, and people in it who want to kill you. He considers this. 'Hampshire's got those,' he says.`, { flag: 'bond', pull: ['perkin', 2], say: 'Perkin will keep close to you.' }] },
  { t: 'Sit with Ieuan',
    out: [`He gives you a shaft to roll. It wobbles. He takes it back, snaps it across his knee and hands you another. 'That one would have gone left at eight score, into a friend,' he says. You roll forty shafts, and he breaks three and keeps the heads. By the end you can feel a bad one before it has turned twice. He makes up a sheaf of the true ones and sets it down by your pack.`, { ar: 1, pull: ['ieuan', 2] }] },
  { t: 'Sit near Cutler',
    out: [() => S.standing >= 1 ? `'Sit, if you're sitting,' he says, without looking up. After a time he goes on. 'Three times I've done this. Twenty men over the water, each time.' He turns his hand over, and it is empty. 'I've never yet brought twenty back. Not once. I don't tell them that.' Then he does look at you. 'And nor will you.'` : `He looks at the place where you had thought of sitting until you think of sitting somewhere else. Hodge tells you afterwards that it is a good sign. He does not waste that look on men he expects to lose.`, () => (S.standing >= 1 ? { st: 1, pull: ['cutler', 2], learn: 'k_tok1' } : { pull: ['cutler', 1] })] },
  { t: 'Sit alone, with what you brought from home',
    out: [() => ALONE_S[M.want] || ALONE_S.debt, { grit: 1 }] }
]);
scene('fire_h_b', 'harfleur', 'The gun pit', () => `The Dutch gunners have gone to their supper, and the twenty has taken the pit of the great gun for the evening, since it is dry, and the iron keeps its warmth for hours after the last stone has gone. The twenty is fourteen. Nobody says the number. The talk is that the town has asked for terms, and that the King has given it until Sunday.${perkinHere() ? ' Perkin has his back against the gun, as near to it as he can get.' : ''}${S.flags.reeve_enemy ? ' Reeve is on the far side of the pit with his shirt off, letting the stripes dry, and he has not taken his eyes off you.' : ''}`, [
  { t: 'Sit with Perkin', if: () => perkinHere() && !S.flags.cold,
    out: [`He says the gun is like the wall of the oven at home. Then he tells you, at length and in order, how his father makes a loaf: the sponge set overnight, the kneading, the proving, the peel going in. He leaves nothing out. Somewhere about the proving you understand that he is not talking about bread, and you let him go on to the end.`, { flag: 'bond', pull: ['perkin', 2], say: 'Perkin will keep close to you.' }] },
  { t: 'Sit with Ieuan',
    out: [`He has a crossbow quarrel that he dug out of a gabion, and he is turning it over in his fingers. 'Short and heavy, and it does not care about the wind,' he says. 'But count.' He counts aloud, slowly, to twelve. 'That is how long the man takes to span his bow. You have sent six in that time. So when you see him step back from the wall, you know that you have until twelve.' He gives you the quarrel to keep.`, { eye: 1, pull: ['ieuan', 2] }] },
  { t: 'Sit near Cutler',
    out: [() => S.standing >= 2 ? `He has a stick and a knife. 'Simkin,' he says, and cuts. 'John. The other John. Wat. Hobbe.' He stops. 'There was a lad from Alton, carried water for us at the landing. I never asked his name, and now there's nobody to ask.' He cuts the sixth notch all the same. 'I can't write them,' he says. 'So I do this.' The stick goes inside his jack, on the left side.` : `'Go and sit with the others,' Cutler says. He has a stick and a knife in his hands, and he does not want to be watched using them.`, () => (S.standing >= 2 ? { st: 1, pull: ['cutler', 2], learn: 'k_tok2' } : {})] },
  { t: 'Sit alone',
    out: [() => (ALONE_H[M.want] || ALONE_H.debt)(), { heal: 1 }] }
]);
scene('fire_m_b', 'march', 'Under a cart', () => `It has rained since noon, and the twenty has got itself under a baggage cart with a fire the size of a hat. Three days ago the French lords sent heralds to say that they would fight before Calais. The King told them that he was going by the straight road, and that they might find him on it. Every man here knows what that means. Under the cart the talk has shrunk to small things: a boot, a blister, whose turn it is with the cup.${S.flags.reeve_owes ? ' Reeve has sat down nearer to you than there was any need for.' : ''} There will not be many more fires.`, [
  { t: 'Sit with Perkin', if: () => perkinHere() && !S.flags.cold,
    out: [`He has taken his boots off and is looking at his feet as if they belonged to somebody else. 'I've been thinking what I'd have,' he says. 'If I could have anything.' You expect a girl, or a horse. 'The heel of a loaf, out of the oven. With dripping.' He is quite serious. You say that when you are home you will buy him the whole loaf. 'You can't buy it,' he says. 'It's my father's. I'll give you half.' He holds out his hand on it, and you shake.`, { flag: 'bond', pull: ['perkin', 2], say: 'Perkin will keep close to you.' }] },
  { t: 'Sit with Ieuan',
    out: [`He is drawing in the mud with an arrow, by what light there is. A row of stakes. A horse. 'He will not jump what he cannot see over. He will not go on to a point. So he turns, and when he turns he shows you his side, and there is a great deal of it.' He rubs it out with his heel. 'They will tell you to shoot at the knights. Shoot at what the knight is sitting on. A knight on foot in that plough is a man in a kettle.'`, () => (S.flags.horsecraft ? { eye: 1, pull: ['ieuan', 2] } : { flag: 'horsecraft', pull: ['ieuan', 2], say: 'You know what a charging horse will and will not do. Standing against one will go better.' })] },
  { t: 'Sit near Cutler',
    out: [() => S.standing >= 3 ? `He shifts to let you in under the cart. 'Old Erpingham wants names,' he says. 'Steady men, to stand by the King's battle in the middle. There's no wood to get behind there, and it's where they'll come hardest.' He is quiet for a while. 'I gave him two. He wants three. I said I'd sleep on the third.' He does not look at you while he says it, and that is how you know.` : `'Tomorrow, or the day after,' he says. 'Stand where I put you. Loose on the word, and not before. If I'm down, Hodge has the twenty.' He says it to you in the same words he has used to each of them. It is still more than he has said to you all week.`, () => (S.standing >= 3 ? { st: 1, pull: ['cutler', 2] } : { eye: 1 })] },
  { t: 'Sit alone',
    out: [() => SC.fire_m.choices[3].out[0](), { grit: 1, heal: 1 }] }
]);
scene('boon_ieuan_b', 'soton', "The Welshman's price", `Ieuan finds you at the butts, where you have been putting shafts into the bank beside the mark for most of an hour. He watches three more go the same way.

'I am too old to watch that,' he says. 'I will mend one thing about you before the ships. One only, mind. A man who is taught four things in a week has learned none of them. Which is it to be?'`, [
  { t: 'The draw', if: () => offered('ieuan', 0),
    out: [`He takes the bow out of your hands and gives you a hazel stick. For two days you draw a stick. 'Your arm is a string,' he says. 'It holds, it does not pull. The pull is in your back, where you carry lasts and hides and whatever else a cobbler carries.' On the third day he gives you the bow again. It comes back to your ear as if somebody had oiled it.`, { item: 'bn_draw', pull: ['ieuan', 1] }] },
  { t: 'Where to put a shaft into a man in harness', if: () => offered('ieuan', 1),
    out: [`He borrows a rusted breastplate from a man-at-arms's page, hangs it on a post and walks you round it. 'Here it will turn you. Here also. Here.' He puts a finger under the arm, at the lacing. 'And the face, when he lifts his visor to breathe, which he will, for no man can walk a furlong shut in one of those.' You shoot at the lacing until the page wants his breastplate back.`, { item: 'bn_gap', pull: ['ieuan', 1] }] },
  { t: 'The horses', if: () => offered('ieuan', 2),
    out: [`He takes you to the horse lines and stands you beside a destrier. 'Look at him. Steel on his face, steel on his chest. Now walk round.' Behind the saddle there is only horse. 'You do not shoot at the front of a charge,' Ieuan says. 'You drop your shafts into the back of it, and let the beasts do the rest. I learned it at Shrewsbury, from the wrong side.'`, { item: 'bn_horse', pull: ['ieuan', 1] }] },
  { t: 'The string', if: () => offered('ieuan', 3) && !has('string'),
    out: [`'Then you have more sense than you shoot with,' he says. He sits you down with hemp and a lump of wax and has you twist a string yourself, and unpicks it, twice. The third he lets stand. He waxes it for you until it squeaks and shows you where it lives: coiled, under the cap. He gives you a sheaf of his own shafts to go with it, since a good string deserves them.`, { item: 'string', ar: 1, pull: ['ieuan', 1] }] }
], { base: 'boon_ieuan', enter: () => offer('ieuan', 4, S.pull.ieuan >= 3) });
scene('boon_cutler_b', 'harfleur', 'A word from Cutler', `Cutler has the twenty's bows laid out along the fire step, and is going down the row, flexing each one and saying nothing. When he comes to yours he stops. He looks at it for some time, and then at you.

'You'll not be an archer in time to matter,' he says. 'Not this year. So what else are you? Tell me the one thing you want to be able to do when they come over that wall, and I'll see to it that you can.'`, [
  { t: 'To kill a man in harness, close to', if: () => offered('cutler', 0),
    out: [`'With a bow that size you'll not do it from far off,' he says, and fetches a stake-mallet. He stands a billet of oak on end. 'That's his knee.' Then he sets another across two more. 'That's his helm, when he's down. Knee, then helm. Let the weight do it. You're a cobbler, you know what a hammer is.' You do. It is the first thing in France that you have been good at.`, { item: 'bn_maul', pull: ['cutler', 1] }] },
  { t: 'To stand when I want to run', if: () => offered('cutler', 1),
    out: [`He says nothing, and you think you have shamed yourself. Then he has Reeve fetch a carthorse from the gun lines. For a week Reeve rides it at you at a trot while you stand behind a stake, and Cutler stands behind you with a hand in your belt. On the fifth day he takes the hand away and does not tell you. 'Every man wants to run,' he says. 'The stake is so that you needn't.'`, { item: 'bn_stand', pull: ['cutler', 1] }] },
  { t: 'To be alive by then', if: () => offered('cutler', 2),
    out: [`'That's the first sensible thing I've heard in this trench,' Cutler says. He goes through your pack and throws out half of it. He shows you where he sleeps, on two hurdles off the wet, and what he drinks, which is small beer or water that has seen a fire. He looks at your feet every morning for a week, like a man buying a horse. By the end of it you have stopped scratching.`, { item: 'bn_camp', pull: ['cutler', 1] }] },
  { t: 'To be some use to you', if: () => offered('cutler', 3),
    out: [`He almost smiles, which on Cutler is a kind of flinch. 'Then you can count,' he says, and hands you the tally sticks. For a week you keep the twenty's reckoning: arrows, rations, who is sick and who is shamming. You are right every day. On the last of them he gives the sticks to the Earl's clerk and tells him whose work it is.`, { st: 2, pull: ['cutler', 1] }] }
], { base: 'boon_cutler', enter: () => offer('cutler', 4, S.standing >= 4) });
scene('boon_friar_b', 'march', 'The friar on the road', `You hear the friar before you see him. He is singing a psalm, out of tune, to the time of his own feet. He has given his mule to a man with the flux and is walking behind it.

When he draws level with you he leaves off singing. 'The young archer from the quay,' he says. 'And still alive. I had money on it, in a manner of speaking. Walk with me a mile. I owe the saints a good turn this week, and you are the nearest.'`, [
  { t: 'Ask how he gets what he asks for', if: () => offered('friar', 0),
    out: [`'Ah. The one art I have,' he says. He stops a carter and asks him, most humbly, for the cart. The carter refuses with an oath. The friar begs his pardon and asks whether a sick man might ride on the tailboard for a mile, and the carter, who has just said no to a friar, cannot say it twice. 'Ask for the cart,' the friar tells you, walking on. 'Then the tailboard looks like a bargain. You try the next one.'`, { item: 'bn_talk' }] },
  { t: 'Ask him to hear your confession', if: () => offered('friar', 1),
    out: [`He puts up his hood and slows his pace, and you tell him all of it, walking, with the army going by on either side. He asks two questions, both of them the ones you had hoped he would not. Then he gives you the words, and for a penance bids you carry another man's pack until dark. You do. It is lighter than what you put down.`, { item: 'bn_shriven' }] },
  { t: 'Ask how he has walked so far in sandals', if: () => offered('friar', 2),
    out: [`'By not hurrying, and by looking where I put them,' he says. He shows you the binding, linen under the arch and round the heel, and a way of setting the foot down flat that he says he had from a Savoyard pedlar. He walks you a mile over flints and you do not hear your own steps. 'A friar comes on people unawares,' he says. 'It is half of the work.'`, { item: 'bn_walk' }] },
  { t: 'Ask him for the loan of a few pence', if: () => offered('friar', 3),
    out: [`He stops singing altogether. 'A soldier, begging of a mendicant,' he says. 'I have waited thirty years for that.' He finds sixpence in the lining of his sleeve and counts it out. 'It was given me for candles. The saints can see well enough in the dark, and you, I think, cannot. Pay it back to the next friar you meet. He will not be me, but he will not know that.'`, { c: 6 }] }
], { base: 'boon_friar', enter: () => offer('friar', 4, has('badge')) });
scene('b_wait_b', 'battle', 'The furrow', () => `Nobody has slept. The twenty gets up out of the furrow it lay down in, as stiff as so many boards, with the rain still coming down. Bows are strung by feel${S.flags.wet ? ', and yours goes on with a slack, dead sound that you do not like' : ''}. There is nothing to eat, and nobody mentions it. A priest is working his way along the line with the Host, and the men take it where they stand, bow in hand.

Cutler is counting heads. It will be some little while before the line is formed: time enough to find one person, and say whatever there is to say.`, [
  { t: 'Find Perkin', if: perkinHere,
    out: [() => `He is standing by himself, stringing his bow and unstringing it and stringing it again. When he sees you he stops. ${S.flags.perkin_knows ? `'You'll tell me,' he says. 'When it's coming. You'll know.' You tell him that you have never once got as far as this knowing anything, and that today you are as blind as he is. He thinks about that. 'Good,' he says. 'I'd sooner we were both guessing.'` : `'I can't feel my hands,' he says. You take them between yours and rub them, as your mother used to, until the colour comes back. He lets you. 'Stand on my left,' you tell him. 'I shoot better with somebody on my left.' It is not true, and he is grateful for it.`}`, { flag: 'bond', say: 'Perkin will keep close to you.' }] },
  { t: 'Find Ieuan',
    out: [() => has('ieuan') ? `He has his shafts stuck in the ground before him in a row, heads down, like a joiner's tools. He pulls up a dozen and holds them out. 'Take them. You loose like a boy throwing stones at a cat, and you'll be out before the horse have turned.' He stays a moment longer. 'Whatever it is that you have been carrying all this while, put it down today, or use it. One or the other.'` : `He nods to you civilly, as he would to anybody. 'Watch the flight of your first, and mend your second by it,' he says. 'That is the whole of archery. The rest is arms.' It is good advice, and it is what he would give a stranger. You wish that you had made yourself something more to him while there was time.`, () => (has('ieuan') ? { ar: 1 } : { eye: 1 })] },
  { t: "Find Dickon among Suffolk's men", if: () => S.flags.dickon_lives && !kn('k_suffolk'),
    out: [`Suffolk's company is drawing up on the right, against the Tramecourt wood, and the young Earl is walking along the front of it in his father's armour. Dickon is in the second rank. He does not make a joke, which frightens you more than anything else this morning. 'I'll be under that banner,' he says, and nods at it. 'If you want me after. One way or the other.'`, { eye: 1, flag: 'dickon_near' }] },
  { t: "Find Dickon, and make him swear to stand well left of the Earl's banner", know: 'k_suffolk', if: () => S.flags.dickon_lives,
