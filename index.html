  return '<p class="eyebrow"><span>Maisoncelle, 26 October 1415</span></p><h2>' + (S.tier === 'true' ? 'The pair finished' : 'The day after') + '</h2>' + paras(`The Duke of Gloucester is carried off the field alive, and he will live to be an old and quarrelsome man. The King asks who the archer was. Someone finds Cutler, and Cutler, with the face of a man swallowing a wasp, gives your name and adds that you are a cobbler. 'Then God has been mending us today,' the King says, and he gives you the gilt spurs off a dead French count, though you have no horse to wear them on.

${p}

${wantEnd()}

You lie down that night in the barn at Maisoncelle and you are afraid to close your eyes. When you open them, there is straw. There is frost on the dead in the field, and somebody is frying bacon, and it is the twenty-sixth of October. ${S.tier === 'true' ? 'You look in your fist for the awl and it is gone. Your boots are whole, and they are your own work.' : 'Your boots have a hole in them. You look in your fist for the awl and it is gone.'}`) +
    (S.tier === 'true' ? '<p class="note">It took you ' + M.runs + ' wakings to finish the pair. There is nothing left undone.</p>' : '<p class="note">It took you ' + M.wonAt + ' ' + (M.wonAt === 1 ? 'waking' : 'wakings') + ' to reach the day after St Crispin\'s. The day holds. Your own work is not finished.</p>' + wantedHtml()) +
    '<button class="go" type="button" data-act="camp">Wake on the quay once more, knowing what you know</button>' +
    '<button class="quiet" type="button" data-act="reset">' + (sure ? 'Sure? This forgets every waking.' : 'Forget everything and start as a stranger') + '</button>';
}
function renderSheet() {
  const s = S.stats;
  let h = '<div><h3>' + (M.want ? esc(N()) + ', cordwainer\'s apprentice' : 'The man') + '</h3>' + (M.want ? '<p style="margin-bottom:8px">' + esc(WANT[M.want].keep) + '</p>' : '') + '<dl class="stats">' + ['arm', 'eye', 'wits', 'grit'].map(k => '<div><dt>' + STAT[k] + '</dt><dd>' + s[k] + '</dd></div>').join('') +
    '<div><dt>Coin</dt><dd>' + money(S.coin) + '</dd></div><div><dt>Sheaves</dt><dd>' + S.arrows + '</dd></div></dl></div>' +
    '<div><h3>Standing</h3><p>' + standingWord(S.standing) + (S.flags.centre ? ', placed in the centre' : '') + '</p></div>' +
    '<div><h3>Kit and company</h3><ul class="kit">';
  if (!S.items.length) h += '<li><small>A borrowed bow and what you stand up in.</small></li>';
  S.items.forEach(i => { h += '<li class="' + (ITEM[i].ill ? 'ill' : '') + '">' + esc(ITEM[i].n) + '<small>' + esc(ITEM[i].d) + '</small></li>'; });
  h += '<li>Perkin<small>' + (S.perkin === 'dead' ? 'Dead.' : S.perkin === 'home' ? 'Gone home to Winchester.' : S.flags.cold ? 'With the company. Not speaking to you.' : bonded() ? 'At your shoulder.' : 'With the company.') + '</small></li></ul></div>' +
    (M.runs < 1 || (M.runs === 1 && S.phase === 'dead') ? '' : '<div><h3>This waking</h3><p>' + S.lessons + (S.lessons === 1 ? ' lesson' : ' lessons') + ' so far</p></div>') +
    ((S.journal || []).length ? '<div><h3>The road so far</h3>' + journalHtml(false) + '</div>' : '');
  $('sheet').innerHTML = h;
  $('sheet').hidden = S.phase === 'camp' || S.phase === 'won';
}
function renderTop() {
  const n = M.runs + (S.banked ? 0 : 1);
  $('runlabel').textContent = M.runs < 1 || (M.runs === 1 && S.phase === 'dead') ? '' : 'The ' + ordinal(Math.max(1, n)) + ' waking';
  const fresh = howFresh().length, hb = $('howbtn');
  hb.textContent = 'How it works' + (fresh ? ' · ' + fresh + ' new' : ''); hb.classList.toggle('new', fresh > 0);
  const a = ACTS.indexOf(S.act), camp = S.phase === 'camp';
  $('track').innerHTML = ACTS.map((k, i) => '<li class="' + (camp ? '' : i < a ? 'done' : i === a ? 'now' : '') + '"' + (!camp && i === a ? ' aria-current="step"' : '') + '>' + ACT_NAME[k] + '</li>').join('');
}
function note(k, L) { if (!M) return; M.how = M.how || {}; if (M.how[k]) return; M.how[k] = 1; if (L) L.push(['Noted under How it works', 'mem']); }
const HOW = [
  [() => true, 'Each scene gives you a few choices. Some cost you something, some risk something, and some only show what kind of man you are.'],
  [m => m.how.odds, 'A risky choice names what it tests in you (Arm, Eye, Wits or Grit) and gives the odds in words, from near certain down to a prayer.'],
  [m => m.how.blood, 'Blood is how many wounds you can still take. Rest, food and a few kindnesses give it back.'],
  [m => m.how.kit, 'What you pick up stays with you, and quietly betters your chances at the things it is good for.'],
  [m => m.how.standing, 'Standing is what Vintenar Cutler thinks of you. It decides what he asks of you, and where he puts you.'],
  [m => m.how.fire, 'Who you spend your evenings with decides whose troubles find you next.'],
  [m => m.runs >= 1, 'When you die, you wake on the quay at Southampton on the first of August, and nobody else remembers.'],
  [m => m.runs >= 1, 'Each waking earns lessons. You spend them between wakings, and what they buy stays with you.'],
  [m => m.how.memory, 'What you witness, you remember. It opens choices marked "You remember", and those do not fail.'],
  [m => Object.values(m.seen || {}).some(n => n > 1), 'The days are not quite the same each time. Different things happen in them, and the same things happen differently.'],
  [m => m.how.sus, 'People notice a man who is never surprised. Use what you remember too freely and they begin to talk.'],
  [m => (m.between || 0) >= 2, 'Between one death and the next there is a room, and two men at a bench. They say a little more each time you have got a little further.'],
  [m => m.lived || m.known.k_centre || m.known.k_gloucester, 'Living through the battle is not enough. Something is wanted of you on that day. The page between wakings says as much of it as you have found out.'],
  [m => Object.values(m.done || {}).some(n => n >= FAST_AFTER), 'An act you have been through often enough can be walked through in a single choice.'],
  [m => m.known.k_home || m.how.left, 'Going home, or staying behind, does not end it.'],
  [m => m.wins >= 1, 'There is more than one ending, and the first is not the last.']
];
function howM() { return M ? Object.assign({ how: {}, known: {}, seen: {}, done: {} }, M, { how: M.how || {} }) : { how: {}, known: {}, seen: {}, done: {}, runs: 0 }; }
let howNew = {};
function howGot() { const m = howM(); return HOW.map(([f], n) => f(m) ? n : -1).filter(n => n >= 0); }
function howSeen() { if (!M) return {}; if (!M.howSeen) { M.howSeen = {}; if (M.howRead) howGot().slice(0, M.howRead).forEach(n => { M.howSeen[n] = 1; }); } return M.howSeen; }
function howFresh() { const seen = howSeen(); return howGot().filter(n => !seen[n]); }
function howHtml() {
  const m = howM();
  const got = howGot(), left = HOW.length - got.length;
  return '<ol class="known how">' + got.map(n => '<li' + (howNew[n] ? ' class="new"><b>New</b> ' : '>') + esc(HOW[n][1]) + '</li>').join('') + '</ol>' +
    paras('The game saves itself after every choice. The Saved games page keeps three separate games.') +
    (left ? '<p class="note">' + (left === 1 ? 'There is one thing you have not found out yet.' : 'There are ' + left + ' things you have not found out yet.') + '</p>' : '<p class="note">You have found out all there is to know about how this works. What to do with it is another matter.</p>');
}
function sureBtn(act, key, label, extra) { return '<button type="button" class="' + (sureKey === key ? 'sure' : '') + '" data-act="' + act + '"' + (extra || '') + '>' + (sureKey === key ? 'Sure? Press again.' : label) + '</button>'; }
function screenHtml() {
  const sl = STORE.slots[STORE.active], inRun = S && M && M.runs >= 1 && (S.phase === 'choose' || S.phase === 'result' || S.phase === 'chapter');
  if (view === 'title') return '<p class="eyebrow"><span>Southampton to Agincourt, 1415</span></p><h1 class="bigtitle">Until Crispin\'s Day</h1>' +
    paras(sl && sl.M.runs >= 1 ? `You are a cordwainer's apprentice with a borrowed bow, the twentieth man in a company of twenty archers. You have died in France, and woken on the quay at Southampton with all of it still in your head. Something is wanted of you. You do not yet know what it is.` : `It is August 1415. You are a cordwainer's apprentice from Winchester with a borrowed bow, the twentieth man in a company of twenty archers. The King is taking an army to France, and you have taken his sixpence. You know nothing about war, and you are about to learn.`) +
    (sl ? '<p class="note">' + esc(SLOT_NAME[STORE.active] + ': ' + slotLine(sl)) + '</p>' : '') +
    '<div class="menu"><button class="go" type="button" data-act="play">' + (sl ? 'Continue' : 'Begin') + '</button><button class="choice" type="button" data-act="saves">Saved games</button><button class="choice" type="button" data-act="help">How it works</button></div>' +
    '<p class="ver">Version 0.13. The game saves itself in this browser after every choice.</p>' +
    '<p class="ver">© 2026 Neil Fletcher. Found something broken or odd? <a href="https://github.com/neilfletcher/until-crispins-day-play/issues" target="_blank" rel="noopener">Tell me here</a>.</p>';
  if (view === 'menu') return '<p class="eyebrow"><span>' + esc(SLOT_NAME[STORE.active]) + '</span></p><h2>Menu</h2><div class="menu">' +
    '<button class="go" type="button" data-act="resume">Back to the game</button>' +
    '<button class="choice" type="button" data-act="saves">Saved games<div class="tags"><span>save, load, copy or delete a game</span></div></button>' +
    '<button class="choice" type="button" data-act="help">How it works</button>' +
    (inRun ? '<button class="choice" type="button" data-act="giveup">' + (sureKey === 'giveup' ? 'Sure? Press again to give up this waking.' : 'Give up this waking') + '<div class="tags"><span>wake on the quay now, keeping the lessons earned so far</span></div></button>' : '') +
    '<button class="choice" type="button" data-act="wipe">' + (sureKey === 'wipe' ? 'Sure? Press again. This erases the game in play.' : 'Start this game again from nothing') + '<div class="tags"><span class="dead">' + (M && M.runs >= 1 ? 'erases this game: wakings, lessons and memories' : 'erases this game') + '</span></div></button>' +
    '<button class="choice" type="button" data-act="title">Title page</button></div>';
  if (view === 'help') return '<p class="eyebrow"><span>How it works</span></p><h2>What you have found out</h2>' + howHtml() +
    '<button class="go" type="button" data-act="back">Back</button>';
  let h = '<p class="eyebrow"><span>Three games, kept in this browser</span></p><h2>Saved games</h2>' + paras('The game in play saves itself after every choice. You can keep three separate games here, copy one over another, or turn a game into text to carry to another device.') + '<div class="shop">';
  STORE.slots.forEach((g, i) => {
    const on = i === STORE.active && !!M;
    h += '<div class="slot' + (on ? ' on' : '') + '"><b>' + SLOT_NAME[i] + (on ? ' (in play)' : '') + '</b><small>' + (g ? esc(slotLine(g)) : 'Empty.') + '</small><div class="slotbtns">' +
      (g ? (on ? '<button type="button" data-act="resume">Play</button>' : '<button type="button" data-act="slot-play" data-i="' + i + '">Load and play</button>') : '<button type="button" data-act="slot-play" data-i="' + i + '">Begin a new game here</button>') +
      (!on && M && S ? sureBtn('slot-copy', 'copy' + i, g ? 'Overwrite with the game in play' : 'Save the game in play here', ' data-i="' + i + '"') : '') +
      (g ? sureBtn('slot-del', 'del' + i, 'Delete', ' data-i="' + i + '"') : '') + '</div></div>';
  });
  h += '</div><p class="sub">Carry a game to another device</p>';
  if (M && S) h += '<button class="textbtn" type="button" data-act="export">' + (showCode ? 'Hide the save text' : 'Show the save text for the game in play') + '</button>' + (showCode ? '<textarea class="savetext" id="exportTa" readonly aria-label="Save text">' + saveCode() + '</textarea><button class="textbtn" type="button" data-act="copycode">Copy it</button>' : '');
  h += '<p class="sub">Load a game from save text</p><textarea class="savetext" id="importTa" aria-label="Paste save text here" placeholder="Paste save text here">' + esc(importText) + '</textarea><div class="slotbtns">' + [0, 1, 2].map(i => '<button type="button" data-act="import" data-i="' + i + '">Load into ' + SLOT_NAME[i].toLowerCase() + '</button>').join('') + '</div>' + (importMsg ? '<p class="note">' + esc(importMsg) + '</p>' : '') +
    '<button class="go" type="button" data-act="back">Back</button>';
  return h;
}
function render() {
  document.body.dataset.view = view;
  if (view !== 'game') { const el = $('story'); el.innerHTML = screenHtml(); el.style.animation = 'none'; void el.offsetWidth; el.style.animation = ''; $('sheet').hidden = true; return; }
  renderTop(); renderStory(); renderSheet();
}

document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b || b.disabled) return;
  const act = b.dataset.act;
  if (act !== 'reset') sure = false;
  const twice = key => { if (sureKey === key) { sureKey = ''; return true; } sureKey = key; return false; };
  const keep = sureKey; sureKey = '';
  const nav = { saves: 1, help: 1, menu: 1, title: 1, back: 1, resume: 1, play: 1, 'slot-play': 1, 'slot-copy': 1, 'slot-del': 1, export: 1, copycode: 1, import: 1, giveup: 1, wipe: 1 };
  if (nav[act]) {
    const i = Number(b.dataset.i);
    if (act !== 'import') importMsg = '';
    importText = ($('importTa') || {}).value || '';
    if (act === 'play') { if (!M || !S || !STORE.slots[STORE.active]) openSlot(STORE.active); view = 'game'; }
    else if (act === 'resume') view = M && S ? 'game' : 'title';
    else if (act === 'menu') { view = 'menu'; backTo = 'menu'; }
    else if (act === 'title') { view = 'title'; backTo = 'title'; }
    else if (act === 'saves' || act === 'help') { if (view === 'title' || view === 'menu' || view === 'game') backTo = view; view = act; showCode = false; if (act === 'help') { howNew = {}; if (M) { howFresh().forEach(n => { howNew[n] = 1; M.howSeen[n] = 1; }); save(); } } }
    else if (act === 'back') view = backTo === 'game' && M && S ? 'game' : backTo === 'menu' && M && S ? 'menu' : 'title';
    else if (act === 'slot-play') { openSlot(i); view = 'game'; }
    else if (act === 'slot-copy') { sureKey = keep; if (twice('copy' + i) && M && S) { STORE.slots[i] = JSON.parse(JSON.stringify({ M, S, at: Date.now() })); persist(); } }
    else if (act === 'slot-del') { sureKey = keep; if (twice('del' + i)) { STORE.slots[i] = null; if (i === STORE.active) { M = null; S = null; } persist(); } }
    else if (act === 'export') showCode = !showCode;
    else if (act === 'copycode') { try { navigator.clipboard.writeText(saveCode()).then(() => { importMsg = 'Copied.'; render(); }, () => { const t = $('exportTa'); if (t) t.select(); }); } catch (err) { const t = $('exportTa'); if (t) t.select(); } }
    else if (act === 'import') { sureKey = keep; const d = readCode(importText); if (!d) importMsg = 'That is not save text from this game. Nothing was changed.'; else if (STORE.slots[i] && !twice('imp' + i)) importMsg = SLOT_NAME[i] + ' already holds a game. Press the same button again to replace it.'; else { importText = ''; STORE.slots[i] = { M: d.M, S: d.S, at: Date.now() }; persist(); if (i === STORE.active) { M = Object.assign(freshMeta(), d.M); if (validRun(d.S)) S = d.S; else newRun(); save(); } importMsg = 'Loaded into ' + SLOT_NAME[i].toLowerCase() + '.'; } }
    else if (act === 'giveup') { sureKey = keep; if (twice('giveup') && S && (S.phase === 'choose' || S.phase === 'result' || S.phase === 'chapter')) { giveUp(); view = 'game'; } }
    else if (act === 'wipe') { sureKey = keep; if (twice('wipe')) { M = freshMeta(); newRun(); save(); view = 'game'; } }
    render();
    if (act !== 'slot-copy' && act !== 'slot-del' && act !== 'export' && act !== 'copycode' && act !== 'import' && act !== 'giveup' && act !== 'wipe') window.scrollTo(0, 0);
    return;
  }
  if (view !== 'game' || !S) return;
  if (act === 'choose') { const inp = $('nameIn'); if (inp) M.name = inp.value.trim().slice(0, 18) || 'Adam'; choose(Number(b.dataset.i)); }
  else if (act === 'go') goOn();
  else if (act === 'camp') { S.phase = 'camp'; const nx = BETWEEN[M.between || 0]; if (nx && nx.when()) { S.inter = M.between || 0; M.between = (M.between || 0) + 1; M.lessons += 2; } else S.inter = -1; save(); }
  else if (act === 'buy') buy(b.dataset.id);
  else if (act === 'begin') { newRun(); save(); }
  else if (act === 'reset') { if (sure) { sure = false; M = freshMeta(); newRun(); save(); } else sure = true; }
  render();
  if (act !== 'buy' && act !== 'reset') window.scrollTo(0, 0);
});

function start(data) {
  loadStore();
  if (data && data.M && validRun(data.S)) { M = Object.assign(freshMeta(), data.M); S = data.S; view = data.view || 'game'; }
  else { const sl = STORE.slots[STORE.active]; if (sl) { M = Object.assign(freshMeta(), sl.M); if (validRun(sl.S)) S = sl.S; else newRun(); } else { M = null; S = null; } view = 'title'; }
  render();
}
const hot = window.claude && window.claude.hot;
if (hot && hot.snapshot) hot.snapshot(() => ({ M, S, view }));
if (hot && hot.ready) hot.ready(start); else start((hot && hot.data) || {});
})();
