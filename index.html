scene('s_sermon', 'soton', "The King's claim", `A bishop is preaching the King's right to France from a cart, so that the army may know why it is going. The claim comes down through the King's great-great-grandmother, Isabella, who was a daughter of France. The French say no crown can pass through a woman, by a law of the Salian Franks. The bishop says the Salian land is in Germany, between the Elbe and the Saale, and is no part of France at all. He has been at it for an hour. The archers are standing in the sun.`, [
  { t: 'Follow it, as far as a cobbler can', test: ['wits', 7],
    win: [`You get as far as Isabella, and lose the thread a little at Pharamond, and pick it up again at the Elbe. When he finishes you could very nearly repeat it. You find that a thing looks different when you know why you are being asked to do it, even if the reason is somebody's grandmother.`, { wits: 1 }],
    lose: [`You follow it as far as the first Isabella. There turn out to be more.`, {}] },
  { t: 'Ask Ieuan what it means',
    out: [`'It means,' Ieuan says, 'that the King's great-great-grandmother was French, and so France is his. By the same reckoning half of Gwent belongs to my cousin's goat.' He considers. 'It is a good claim. A man with a claim like that and eight thousand archers can get a long way with it.'`, { grit: 1 }] },
  { t: 'Sleep standing up',
    out: [`It is a thing soldiers can do, and this is a good day to learn it. You wake when the men about you say Amen. France still belongs to the King, and you have had an hour's rest.`, { heal: 1 }] }
], { pool: 1 });
scene('h_fruit', 'harfleur', 'Green apples', `Behind the camp there are orchards, and it is September in Normandy. The apples are not ripe. Nobody cares. Men who have eaten salt beef for five weeks are pulling them down by the hatful, and a Kentish company has found a cider press in a barn and is working it day and night. The stuff that comes out is green and cloudy, and it goes through a man like the grace of God.`, [
  { t: 'Eat, and drink, and be thankful',
    out: [`They are sour enough to make your ears move, and you eat nine. The cider tastes like a wet Sunday. For one evening your belly is full of something that was never in a barrel of brine.`, { heal: 1, flag: 'fruit' }] },
  { t: 'Carry your share to the sutlers, and trade it for bread', test: ['wits', 6],
    win: [`A hatful of apples is worth half a loaf this week, to men who have not seen what the cider does. You eat the bread behind a wagon, slowly, and listen to the Kentish men sing.`, { heal: 1 }],
    lose: [`The sutler has more apples than he can sell. He offers to trade you bread for your hat.`, {}] },
  { t: 'Leave them on the tree',
    out: [`You walk through the orchard with your hands at your sides. Three days later the Kentish company cannot muster a watch, and the barn with the press in it has been turned into a sick house.`, {}] }
], { pool: 1 });
scene('h_ships', 'harfleur', 'The ships home', `The sick are being sent back to England, and the ships are loading at the Chef-de-Caux. A clerk at the gangplank looks at each man's eyes and his hose, and waves him aboard or does not. It is not a hard thing to pass. A man in front of you has rubbed his eyelids with onion and is groaning like a door. England is two days away. Your mother's house is one day beyond that.`, [
  { t: 'Sham sick, and go home',
    out: [`You groan, and the clerk waves you through. Two days of sea, and then Southampton again with nobody shouting. You walk to Winchester. Your mother cries, and feeds you, and puts you in your own bed under the eaves, where you can hear the cathedral bell. You lie awake a long time. Then you sleep.\n\nTar. Gulls. The quay under your boots, and Cutler saying the same words in the same order.`, { end: 'home', learn: 'k_home' }] },
  { t: 'Carry a sick man of the twenty up the plank, and come back down', test: ['grit', 6, 'flux'],
    win: [`Old Hodge cannot walk it. You carry him up and lay him on the deck among the others, and he grips your sleeve and says something about his daughter. Then you turn round and walk back down the plank, and the clerk gives you the look he would give a man walking into a fire.`, { st: 1, grit: 1 }],
    lose: [`You carry him up, and lay him down, and walk back. That night there is a cold coil in your own gut. You have earned a place on that ship honestly now, and by then it has sailed.`, { st: 1, flag: 'exposed' }] },
  { t: 'Turn your back on the sea',
    out: [`You do not go down to the shingle at all. From the camp you can see the sails go out, small and white, with five thousand men under them who will be alive at Christmas.`, { grit: 1 }] }
], { pool: 1 });
scene('m_alarm', 'march', 'An alarm in the dark', `Somebody is shouting. Then everybody is. The whole army is on its feet in the pitch dark with the French among the baggage, or across the stream, or in the wood; nobody can say which. Trumpets are sounding three different calls. A knight rides through the twenty's fire in his shirt. Somewhere off to the left a bow is loosed, and something large screams.`, [
  { t: 'Stand to in your place, strung, and wait for Cutler', test: ['grit', 6],
    win: [`You are on your mark with an arrow nocked before Cutler has his boots on. So are four others. He counts the five of you by the embers and remembers who they were. It turns out to have been a cow. In the morning the Duke of York's cook is looking for whoever shot his mule.`, { st: 1 }],
    lose: [`You cannot find your bow, and then you cannot find your string. By the time you are standing to, it is over, and it was a cow.`, {}] },
  { t: 'Loose at the noise',
    out: [`You loose at where the screaming is, and it stops. So does a good deal of the shouting. In the morning the Duke of York's cook is going round the companies with your arrow in his hand, asking whose fletching it is, and the mule has to be paid for.`, { st: -1, c: -3 }] },
  { t: 'Stay in your blanket until somebody you trust is frightened', test: ['wits', 7],
    win: [`Ieuan has not moved. You watch him, and he does not move, so you do not either. In a quarter of an hour it has all died down into cursing. 'Cow,' Ieuan says, from under his hood. 'You can hear the difference, after a while.'`, { heal: 1 }],
    lose: [`Cutler finds you in your blanket while the whole army is under arms. He does not care in the least that it was a cow.`, { st: -1 }] }
], { pool: 1 });
scene('m_nesle', 'march', 'Red cloth at Nesle', `The villages round Nesle have hung red cloths from their walls and will not sell so much as an egg. The King, who has paid for every loaf from Harfleur to here, loses his temper for the first time on the march. The order comes down that the hamlets are to be burned at daybreak. Torches are being given out by companies, and Cutler has been told to find six men.`, [
  { t: 'Take a torch',
    out: [`You stand all night with a torch you have not lit, looking at a row of thatch with people under it. A little before the hour a peasant is brought in who knows of a ford the French have left unguarded. The King forgets about Nesle. The torches are collected again and counted, and Cutler notes which six men were where he put them.`, { st: 1 }] },
  { t: 'Be at the back when the torches are given out', test: ['wits', 6, 'sneak'],
    win: [`There are things to be done with the baggage that take you until well after the six have been chosen. You sleep. In the morning nothing has been burned after all, and you have had a night's rest for it.`, { heal: 1 }],
    lose: [`Cutler counts from the back.`, { st: -1 }] },
  { t: 'Ask one of them what the red means', test: ['wits', 7, 'talk'],
    win: [`An old woman is watching the army from her door. You point at the cloth. She says one word, and a Gascon behind you laughs. 'It means: come and try,' he says. 'It is what they hung out for the Jacques, sixty years ago, and for the English after.' You look at the old woman with respect, and she looks at you without any.`, { wits: 1 }],
    lose: [`She shuts the door. You could not expect a better answer, with a torch party forming behind you.`, {}] }
], { pool: 1 });
scene('e_wager', 'eve', 'What an archer is worth', `The men-at-arms can at least be ransomed. A knight who yields tomorrow will be given wine and a clean bed and sent home when his family has paid. No one ransoms an archer. The twenty has been working out what it is worth to the French, and has arrived at the figure of three fingers a man. A Lancashire archer is taking bets on who will be alive at this time tomorrow, and nobody has yet asked him how he means to collect.`, [
  { t: 'Put a penny on yourself', cost: 1,
    out: [`He gives you seven to one. You have never been offered such odds on anything. 'Against,' he says, to be clear. You put your penny down. He writes your name on a piece of bark in a hand you cannot read, and you feel a good deal better for having done it.`, { grit: 1 }] },
  { t: 'Take over the book', test: ['wits', 7],
    win: [`He is giving odds by guesswork. You give them by where each man will be standing and what he will have in front of him, since you know it. By the time the provost's men come for the noise you are six pence up, and several men have gone away thinking hard about their stakes in both senses.`, { c: 6, sus: 1 }],
    lose: [`You shorten the odds on the twenty and lengthen them on Cheshire, and are found out. The Cheshire men want to know what you know.`, { c: -3, sus: 1 }] },
  { t: 'Tell them the saints have money on you already',
    out: [`It gets a laugh, of the uneasy kind. 'Which saints?' somebody asks. The cobblers, you say. Tomorrow is their day. There is a silence while men who had not known that count on their fingers, and one or two cross themselves and move a little nearer to you.`, { grit: 1, sus: 1 }] }
], { pool: 1 });

/* ---- battle moments ---- */
scene('bm_horse', 'battle', 'A loose horse', `A destrier comes down the front of the English line with no rider and four arrows in it, mad with pain, kicking at everything. It is armoured to the knees and weighs as much as a cart. It goes through a file of Cheshire men like a bull through washing. Then it turns, and it is coming your way.`, [
  { t: 'Shoot it', arrows: 1, test: ['arm', 3, 'shoot cav'],
    win: [`You put the shaft in behind the elbow, where the peytral ends. It goes on for three strides and then folds up all at once, and lies in front of the twenty's stakes like a wall. Cutler looks at it. 'Leave it there,' he says. 'It'll be some use to us where it is.'`, { st: 1 }],
    lose: [`The arrow glances off the crinet. The horse does not go round you.`, { b: -1 }] },
  { t: 'Stand still behind your stake', test: ['grit', 3, 'cav'],
    win: [`It sees the point and swerves, and takes the next man's stake out of the ground with its shoulder. Then it is past, and gone, back towards the French, who must deal with it as they can.`, {}],
    lose: [`It does not see the point until too late. The stake holds, but you are thrown down.`, { b: -1 }] },
  { t: 'Catch the bridle. There is a saddle on it worth a farm.', test: ['grit', 5],
    win: [`You have held horses all your life for men who came into the shop. You get a hand in the cheekpiece and hang on, talking nonsense, and it stops, shaking, with its nose in your chest. There is a purse on the saddle bow, and a sword with a gilt pommel. Reins in hand, you find you are the owner of a French warhorse for as long as it takes Cutler to notice.`, { c: 12, st: 1 }],
    lose: [`You get a hand in the cheekpiece. It lifts you off the ground and carries you twenty paces, and then it puts you down hard.`, { b: -2 }] }
], { bm: 1 });
scene('bm_cutler', 'battle', 'Cutler is down', `A spent crossbow quarrel takes Cutler on the side of the helm and he sits down in the mud with a look of mild surprise. He is not dead. He is not giving orders either, and the twenty has stopped shooting to look at him. The French are still coming on. Old Hodge is opening and shutting his mouth. Somebody has to say something, and they are looking at you.`, [
  { t: 'Give the order yourself', test: ['wits', 3, 'talk'],
    win: [`'Nock,' you say, in Cutler's voice, or as near as you can get to it. 'Draw. Loose.' They do it. You are more astonished than they are. You keep them at it for as long as it takes Cutler to find his feet, and when he does he listens to two volleys before he takes it back. 'Not bad,' he says. 'You sound like a clerk. But not bad.'`, { st: 2 }],
    lose: [`Your voice comes out thin. Hodge finds his at the same moment, and the two of you give different orders. The volley goes off ragged. Cutler gets up to find his twenty arguing.`, { st: -1 }] },
  { t: 'Stand over him until he can stand', test: ['grit', 4, 'melee'],
    win: [`You plant yourself in front of him with your bow across your body. Nothing comes at you, as it happens. But he has seen from the ground who it was that stood there. He gets up by your belt. 'Joan would have had words with me,' he says, and does not explain.`, { st: 1 }],
    lose: [`Something does come: a man-at-arms on his knees, crawling, with a dagger. You deal with him, and he has dealt with you a little first.`, { b: -1, st: 1 }] },
  { t: 'Drag him back behind the stakes',
    out: [`You get him under the arms and haul. He is heavier than he looks and he swears at you the whole way, which is how you know he will live. By the time you get back to your place the twenty has started shooting again without being told.`, { st: 1 }] }
], { bm: 1, when: () => S.standing >= 3 });
scene('bm_page', 'battle', 'A boy with a banner', `Among the fallen in front of your stake there is a boy, twelve at the most, in a surcoat too big for him, holding up a lord's banner in both hands. The lord is under his feet. Nobody has told the boy what to do if this should happen, so he is standing there holding it, with the arrows going past him on both sides.`, [
  { t: 'Wave him back to his own side',
    out: [`You shout, and point at the French line, and make a shooing motion as you would at a hen. He stares at you. Then he drops the banner and runs, and he is small enough and light enough to go over the top of the mud where the men-at-arms sank. You watch him all the way to the horses.`, { grit: 1 }] },
  { t: 'Go out and take the banner', test: ['grit', 3],
    win: [`The boy lets go of it the moment you put a hand on the staff. He seems relieved. It is a count's banner, gold on blue, and it is worth a year's wages to whoever lays it at the King's feet. You carry it back over your shoulder like a rolled carpet.`, { st: 2, c: 6 }],
    lose: [`The lord under the boy's feet is not dead, and he takes exception.`, { b: -1 }] },
  { t: "Take the boy. Somebody will pay for him.",
    out: [`You go out and fetch him in by the collar. He comes quietly and stands where you put him, behind the stakes, still holding the staff. He tells you his name, and his father's, as he has plainly been taught to do.`, { flag: 'prisoner' }] }
], { bm: 1 });

/* ================= v0.9: two more reasons for enlisting, and more of everything (step 2, third batch) ================= */
Object.assign(WANT, {
  pardon: { stat: 'grit', keep: "A clerk's note of the King's pardon, not yet sealed" },
  vow: { stat: 'eye', keep: "A lead token from the cobblers' altar" }
});
Object.assign(IDLE, {
  pardon: ["Hawkin's company marches two files behind yours. You have learned the sound of it.", "The clerk's note is in your shoe, where it will not get wet. It says the King will pardon you, if you are alive to be pardoned.", "A provost's man walks down the line and you find your hands have gone still, though he is only counting heads.", 'You dream of the tanyard less than you expected, and of the sound more.'],
  vow: ['The lead token is on a thong round your neck. It has started to leave a mark.', 'You find yourself counting the days to the twenty-fifth, as a debtor counts to quarter day.', 'You said the words aloud and in a church, so there is no pretending they were not said.', 'Crispin and Crispinian were shoemakers. You have decided that this ought to count for something, and you have no idea with whom.']
});
Object.assign(WAKE_WANT, {
  pardon: "The tanner's journeyman is three months dead again, and his brother is on this quay.",
  vow: 'The token is cold on its thong. Somewhere in Winchester your sister is alive, as she has been every time.'
});
Object.assign(ALONE_S, {
  pardon: `You take the clerk's note out of your shoe and look at it. You cannot read the Latin. You know what it says: that you are a dead man who has been lent to the King.`,
  vow: `You turn the lead token over in your fingers: two little men with lasts in their hands. You say a paternoster for Mall, and then, since it seems only civil, one for them.`
});
Object.assign(ALONE_H, {
  pardon: () => S.flags.hawkin ? `Hawkin's company has a fire along the lines, and he is sitting at it, thinner than he was. He looks up once and sees you. Neither of you nods. You both go on sitting.` : `Somewhere along the lines Hawkin's company has a fire. You sit where you can see it and cannot be seen from it, and wonder which of you that is harder on.`,
  vow: () => `You count on your fingers. Thirty-eight days to the feast. You do not know why it should be that day. You only know that every time you die, it has not come yet.`
});
const ALONE_M = {
  pardon: () => `You think about a spilled cup at St Giles's fair. You have killed a good many men since, by the King's order, and been paid for each. You cannot make the two sums come out the same.`,
  vow: () => `Tomorrow or the day after is their day. You hold the token until it is warm, and you say: whatever it is, I am here. Nothing answers. You have stopped expecting it to.`
};
SC.origin.choices.push(
  { t: 'A killing', sub: `At St Giles's fair you put a knife into a tanner's journeyman over a spilled cup. He took three days to die. The King will pardon any felony for a man who serves out the campaign.`,
    out: [`You had not meant it, and you know that makes no difference to the law. The sheriff's man told you plainly what the choice was: the King's wars or the King's rope. A clerk wrote your name on a roll and gave you a note that is worth your neck, if you live to hand it in. The dead man had a brother, Hawkin. He has taken the sixpence too, and you do not think he did it for the wages.`, { want: 'pardon' }] },
  { t: 'A vow', sub: `Your sister Mall had the fever at Lammas, and you swore to the cobblers' saints that they could have whatever they asked of you if she lived. She lived. The King's serjeant came recruiting on the next market day.`,
    out: [`You said it on your knees in the cold, with your hand on the altar rail: anything. You had no notion what a cobbler's apprentice could have that two saints would want. Then Mall sat up and asked for bread. A week later a serjeant was reading the King's proclamation at the Butter Cross, and you understood that you had been sent the bill.`, { want: 'vow' }] }
);

/* ---- home: the pardon ---- */
scene('home_s_pardon', 'soton', "The tanner's brother", `Hawkin finds you on the second day. He is a big, slow man with hands stained brown to the wrist, and he has his brother's jaw. He does not come at you. He stands on the quay with the whole army going by and looks at you, like a man with a job he means to do properly when he has the time. 'I know what you were promised,' he says. 'A pardon. That's the King's to give. It isn't mine.'`, [
  { t: 'Tell him how it happened, and leave nothing out', test: ['grit', 7],
    win: [`You tell him: the cup, the word, the knife that was in your hand before you knew you had drawn it. The three days. He hears all of it without moving. 'He was always quick with his mouth,' Hawkin says at last. He has not forgiven you. But he walks away slowly, and he looks back once.`, { grit: 1, flag: 'hawkin_heard' }],
    lose: [`Your voice shakes, and it comes out as pleading. He hears it through and spits by your foot. 'Save it for the priest,' he says.`, {}] },
  { t: 'Put four pence in his hand, on account of the blood', cost: 4,
    out: [`He looks at the pennies on his brown palm for some time. 'That's the nails for the coffin,' he says. He keeps them. You cannot tell whether you have paid something or only insulted him, and you suspect he cannot tell either.`, { flag: 'hawkin_paid' }] },
  { t: 'Keep a company of men between you and him, always', test: ['wits', 7, 'sneak'],
    win: [`You learn where his vintenar musters, and when, and you are never there. You learn to know his walk at a furlong. It is no way to live, but it teaches you to see a quay full of men as a hunted thing sees it.`, { eye: 1 }],
    lose: [`He is slow, and he is patient, and one evening he is simply behind the fish sheds when you come round them. He does not use a knife. He wants you to be able to march.`, { b: -1 }] }
]);
scene('home_h_pardon', 'harfleur', 'Hawkin in the sick lines', () => `The flux has taken Hawkin. He lies in the lines by the ships with his hose off, and nobody from his own company has come near him. He knows you at once. 'Come to watch?' he says. ${S.flags.hawkin_heard ? `Then, after a moment: 'You told it straight, at Southampton. I've thought about that.'` : `His eyes follow you as a dog's eyes follow a stick.`}`, [
  { t: 'Fetch him clean water, and go on fetching it', test: ['grit', 7, 'flux'],
    win: [`You bring a skin from the spring every day for six days, and you hold his head. He does not speak to you, and you do not speak to him. On the seventh day he can stand. 'I'll not thank you,' he says. 'But I'll not come for you either. That's all there is.' It is a great deal more than you had before.`, { flag: 'hawkin', grit: 1 }],
    lose: [`You fetch it, and hold his head, and clean him. He lives. By the time he can stand there is a cold coil in your own gut, and he sees it. 'There,' he says, not unkindly. 'Now we're both paying.'`, { flag: ['hawkin', 'exposed'] }] },
  { t: 'Give him your tormentil root', if: () => has('root'),
    out: [`You put it in his hand and tell him to chew. He looks at the root, and at you, for a long while before he does. He is on his feet in a week. He does not come near you again. Now and then, across the trenches, you find him watching you, and he no longer looks as if he were measuring you for something.`, { drop: 'root', flag: 'hawkin' }] },
  { t: 'Sit with him, and say the prayers for his brother',
    out: [`You kneel by the hurdle and say the office for the dead, as much of it as you know, with the name in it. He shuts his eyes. He is shipped home on the Thursday with the others, and you never learn whether he reached it.`, { grit: 1 }] },
  { t: 'Walk past',
    out: [`You walk past. He dies on the Wednesday, among strangers. You are free of him now. You find that it does not feel at all like being pardoned.`, {}] }
]);
scene('home_m_pardon', 'march', 'The pardon roll', `A clerk of the Chancery rides with the army, and at a halt he sets up his board on a cart-tail. Every man who was promised the King's pardon must have his name entered again, with his captain's word that he has served, or the pardon will not be sealed. Your name is on his roll. It has been spelled three different ways, and against one of them somebody has written 'dead'.`, [
  { t: 'Ask Cutler to speak for you', test: ['wits', () => 9 - Math.min(4, S.standing), 'talk'],
    win: [`Cutler comes, and looks at the roll he cannot read. 'Felony?' he says. 'What felony? He's served. He's serving. He mends my boots. Write it.' The clerk writes it. Cutler waits until the ink is sanded. On the way back he says, 'I don't want to know what you did,' and then, after a few paces, 'Was it a fair fight?'`, { flag: 'pardon_roll' }],
    lose: [`Cutler hears you out. 'I'll give my word for a man when I know what he is,' he says. 'I don't know yet what you are.' The clerk moves on to the next name.`, {}] },
  { t: 'Pay the clerk to find the right spelling', cost: 6,
    out: [`Six pence finds it at once. He strikes out 'dead', writes 'served', and sands the page. 'A common error,' he says. 'I'm glad to say we catch most of them.'`, { flag: 'pardon_roll' }] },
  { t: 'Leave it. You may not need a pardon where you are going.',
    out: [`You stand in the queue for a while and then step out of it. A pardon is for a man with a life to go back to. You are no longer sure what kind of life it is that you have.`, { grit: 1 }] }
]);

/* ---- home: the vow ---- */
scene('home_s_vow', 'soton', "The cobblers' altar", () => `There is a church by the West Gate where the shoemakers' guild keeps a side altar: two painted saints with lasts in their hands, the paint worn off their noses by the thumbs of three generations. You have come to tell them that you are here, as you promised. The friar who keeps the lights says an offering is customary.${M.runs >= 1 ? ' You have stood in front of this paint before. It is a poor likeness.' : ''}`, [
  { t: 'Leave silver', cost: 4,
    out: [`Four pence in the box. The friar lights a candle for it and sets it between the two of them. It burns straight, in a church full of draughts.`, { flag: 'vow_altar', grit: 1 }] },
  { t: "Leave work: resole the sexton's boots at the church door",
    out: [`You sit on the church step with your awl and a strip of the sexton's own leather. He watches you work. 'They were cobblers,' he says, nodding at the altar. 'I daresay they'd sooner have that than a candle.' When you look up at the paint again, you could swear one of them had been watching your stitching.`, { flag: 'vow_altar' }] },
  { t: 'Ask them, plainly, what it is that they want',
    out: [() => M.runs >= 1 ? `You have asked before, in other churches and in a low room that smells of wax. The paint does not answer. But you know now that they hear you, and that the answer is in France.` : `You ask aloud, and the friar looks round. The paint does not answer. You had not expected it to. You have only begun to learn what kind of creditors they are.`, { wits: 1 }] }
]);
scene('home_h_vow', 'harfleur', 'Word of Mall', `A ship brings letters, and one of them is for you, in the priest's hand. Mall is walking. She has been to Mass on her own feet. She asks when you are coming home. And your mother asks, through the priest, what it was you promised: for the girl says that when she had the fever you sat by her bed all one night, talking to somebody who was not in the room.`, [
  { t: 'Send home all you have, for the physician', if: () => S.coin > 0,
    out: [`You send every penny, by a sick man-at-arms bound for Southampton. It is the saints who cured her, as you well know. A physician will do no harm, and your mother will sleep the better for his fee.`, () => ({ c: -S.coin, grit: 1 })] },
  { t: 'Have it written back that you promised nothing', test: ['wits', 6],
    win: [`The chaplain writes it as you say it: that you were praying, as anyone would, and that Mall was dreaming. It reads well. You have lied to your mother by way of two priests, and you find the saints have not struck you down for it. They have had a good deal of practice in waiting.`, { wits: 1 }],
    lose: [`The chaplain writes it, and reads it back, and then looks at you over the page. 'And did you?' he says. 'Promise nothing?'`, { sus: 1 }] },
  { t: 'Tell the saints you consider the debt paid',
    out: [`You say it aloud, in the trench, to nobody: she is well, and I am here, and we are quits. Nothing answers. That night you dream of a bench and two backs bent over it, and one of them shakes his head without turning round.`, { grit: 1 }] }
]);
scene('home_m_vow', 'march', 'A man from Soissons', `Among the followers who trail after the army there is a cobbler with his tools on his back. He is from Soissons. That is the saints' own city, where the two of them were put to death. A year ago the King of France's men took it by storm and sacked it for three days, churches and all, and hanged the English archers of the garrison from the walls. He tells it flatly. He says that in Soissons they believe the saints will want an accounting, and that their feast is on the twenty-fifth of this month.`, [
  { t: "Give him work: the twenty's boots, at your own charge", cost: 3,
    out: [`You sit side by side on a bank and work through the twenty's boots, two awls going. He has a way of locking a welt that you have never seen. He shows it to you without being asked. By the end you have learned something of the trade from Soissons itself, and the twenty will reach the battle with dry feet.`, { flag: 'vow_soissons', st: 1 }] },
  { t: 'Ask him what the saints look like, in his church',
    out: [`'Two brothers at a bench,' he says, 'with their backs turned, working. It is a very old painting. Nobody has ever seen their faces.' He looks at you. 'Why do you ask it like that? As if you were checking.'`, { flag: 'vow_soissons', grit: 1 }] },
  { t: 'Tell him the archers of Soissons were hired men, and no concern of yours',
    out: [`'They were,' he says. 'Hired men, like you.' He shoulders his tools. 'The saints were hired men too, if it comes to that. They worked for their bread.' He drops back along the column and you do not see him again.`, {}] }
]);

/* ---- more beats for the threads ---- */
scene('s_perkin_girl', 'soton', 'Perkin in love', `Perkin has fallen in love with a girl who guts herring on the Town Quay. It has taken him three days. She is called Agnes, or possibly Annis; he is not certain, since he has not yet spoken to her. He means to give her his first pay as a token before the fleet sails. All of it.`, [
  { t: 'Tell him to speak to her first, and go along to see it done', test: ['wits', 7, 'talk'],
    win: [`You walk him down there and stand by while he gets it out, which takes some time. Her name is Annis. She is seventeen and has four brothers at sea, and she tells him to keep his money and bring her something from France. He walks back up the quay a foot taller. 'From France,' he says. 'So I've got to come back, see.'`, { flag: 'bond', wits: 1, say: 'Perkin will keep close to you.' }],
    lose: [`He speaks to her. She laughs, though not unkindly, and so do the six other women at the table. He keeps his pay, and does not mention her again.`, {}] },
  { t: 'Hold his pay for him until France',
    out: [`You take it off him, knotted in a rag, and tell him he can have it back when he can spell her name. He argues, and then he is relieved, and tries to hide it.`, { flag: 'bond', echo: { at: 'march', t: "You are still carrying Perkin's first pay in its rag. He has forgotten the girl's name. He has not forgotten who kept it for him." }, say: 'Perkin will keep close to you.' }] },
  { t: 'Let him. A man should be a fool once.',
    out: [`He gives it to her, all of it, with a speech. She looks at the money and at him, and gives him a herring. He carries the herring about for a day and a half, until Cutler makes him bury it.`, { grit: 1 }] }
], { thread: 'perkin', when: perkinHere });
scene('h_perkin_bread', 'harfleur', "Perkin's oven", `Perkin has found flour: two sacks of it, weevilled, that the King's bakers threw out. He says a baker's son can make bread out of worse. He has dug a hole in the trench wall, lined it with clay from the marsh, and capped it with a gun-stone the French were good enough to send over. He needs it fired all night to bake by first light, and he needs somebody to carry.`, [
  { t: 'Carry clay and wood for him all night', test: ['arm', 7, 'labour'],
    win: [`You carry and he tends it, crooning to the thing as if it were a cow in calf. In the grey before sunrise he draws fourteen loaves, black on the bottom, and the smell goes down the trench like a rumour. The twenty eats hot bread for the first time since England. Cutler eats his standing up, and says nothing, and eats another.`, { heal: 1, st: 1, flag: 'bond', say: 'Perkin will keep close to you.' }],
    lose: [`The clay cracks at some dead hour and the whole thing falls in on itself. Perkin sits and looks at it. Then he begins to dig it out again, and you carry for him again, and you have what a man could call bread by the middle of the day.`, { flag: 'bond', say: 'Perkin will keep close to you.' }] },
  { t: 'Sell the loaves along the trench', test: ['wits', 7],
    win: [`Hot bread fetches a penny a loaf from men who have silver and nothing to spend it on. You keep back four for the twenty and sell ten. Perkin is shocked, and then he counts his half.`, { c: 8 }],
    lose: [`A serjeant of the King's bakers wants to know where the flour came from. The loaves are taken for the King's use, and he eats one in front of you.`, { st: -1 }] },
  { t: 'Tell him that a fire in a trench draws crossbow bolts',
    out: [`He bakes anyway. You sleep at the far end of the trench. Nothing is shot at him. When you wake there is a loaf by your head, a small one, and somewhat burnt.`, {}] }
], { thread: 'perkin', when: perkinHere });
scene('s_ieuan_string', 'soton', 'Waxed thread', `A grey Welshman is sitting on a bollard twisting a bowstring out of hemp, three strands laid against each other and rubbed with a ball of wax. He is talking to nobody about the price of cheese. His name is Ieuan, and he is the oldest man in the twenty. He stops when he sees your hands. 'Cobbler,' he says. 'Good. Then you can tell me why my loops fray, since nobody else in this army knows a thing about thread.'`, [
  { t: "Show him the cobbler's lock for the loop", test: ['wits', 7],
    win: [`You show him how a welt is locked so that the pull tightens it. He does it once, wrong, and once right. Then he makes you a string with his own hands, with your loop on the end of it. 'An arrow is thread too,' he says. 'I'll show you that part.' He starts that same afternoon, and seems in no hurry to finish.`, { item: ['string', 'ieuan'], pull: ['ieuan', 1] }],
    lose: [`You show him, and he cannot get his fingers round it. 'I am too old for a new knot,' he says. He makes you a string in the old way for your trouble.`, { item: 'string' }] },
  { t: 'Trade him a hank of your waxed end for arrows',
    out: [`A cobbler's thread is better hemp than anything the stringers on the quay are selling, and he knows it. He pays in arrows, counting them out one at a time and looking at each as if he might yet change his mind.`, { ar: 1 }] },
  { t: 'Watch, and learn to twist your own', test: ['eye', 7],
    win: [`Three strands, each laid the opposite way to the string. Wax until it squeaks. You have it in an hour, since your hands have done its like a thousand times. He looks at your first string and can find nothing wrong with it, which seems to annoy him.`, { eye: 1, item: 'string' }],
    lose: [`It looks simple, and your first string comes apart in your hands. He tells you, kindly enough, that he was nine before he made one that held.`, {}] }
], { thread: 'ieuan' });
scene('h_ieuan_fever', 'harfleur', 'The marsh ague', `Ieuan has the shaking sickness that comes off the marsh at night. It is an older thing than the flux. Every third day he lies under a hurdle with his teeth going like dice, and on the days between he carries on as if nothing had happened. Tonight he has the watch in the forward trench, and it is a third day.`, [
  { t: 'Stand his watch as well as your own', test: ['grit', 8],
    win: [`You stand both watches back to back, with your eyes propped open and the French sentries coughing forty paces off. Nobody comes over the wall. At first light Ieuan is sitting up, grey and sweating and himself again. He does not thank you. He takes your bow out of your hands, looks along it, and begins without a word to correct how you have been stringing it.`, () => (has('ieuan') ? { st: 1, eye: 1 } : { st: 1, item: 'ieuan' })],
    lose: [`In the second watch you fall asleep on your feet and wake with a serjeant's lantern in your face. He takes your name. Ieuan, shaking under his hurdle, hears every word of it.`, { st: -1 }] },
  { t: 'Sit by him and keep him talking',
    out: [`He talks. Half of it is in Welsh. He is at Harlech, in the last winter of the siege, and somebody called Rhys has died, and they are eating the harness. Towards morning he comes back to the trench and knows you. 'Did I say anything?' he asks. Nothing, you tell him. He nods. 'Good boy,' he says.`, { wits: 1 }] },
  { t: 'Buy him wine from the sutler', cost: 4,
    out: [`Hot wine with whatever the sutler swears is cinnamon. It stops the shaking for an hour, which is long enough for him to sleep. Afterwards he pays you back as he pays every debt, by standing behind you at the butts and sighing.`, () => (has('ieuan') ? { eye: 1 } : { item: 'ieuan' })] }
], { thread: 'ieuan' });
scene('h_reeve_mine', 'harfleur', 'Reeve underground', () => `The miners want two men to carry props, and Cutler sends you and Reeve, having, you think, his reasons. Forty paces in, with one lantern between you, the roof groans. Reeve is ahead. A prop goes, and then the earth, and when the dust settles he is under a beam to the waist, looking up at you. You are the one holding the lantern. 'Well,' he says. 'Here we are.'`, [
  { t: 'Get the beam off him', test: ['grit', 7, 'labour'],
    win: [`You set your back under it and lift with your legs, as you would lift a side of sole leather. It comes up a hand's breadth. He drags himself out by his elbows. Neither of you speaks until you are out in the air. Then he says, 'I'd have left you. I want you to know that. I'd have left you, and now I owe a cobbler.'`, { flag: 'reeve_owes', grit: 1, echo: { at: 'battle', t: 'Reeve has placed himself in the file beside yours. He has not said why, and you do not ask him.' } }],
    lose: [`You get it up a hand's breadth and he drags himself clear, and then your back goes and the beam comes down again where he was. He pulls you out by the collar. 'That's us nearly square,' he says. 'Nearly.'`, { b: -1, flag: 'reeve_owes', echo: { at: 'battle', t: 'Reeve has placed himself in the file beside yours. He has not said why, and you do not ask him.' } }] },
  { t: 'Go back for the miners',
    out: [`You run for the miners, and they come, and they have him out in the time it takes to say a creed. It was the right thing to do. Reeve lay there the while, in the dark, since you took the lantern, and he counted. He tells you the number afterwards.`, {}] },
  { t: 'Ask him what it is worth to him', if: () => S.flags.reeve_paid || S.flags.reeve_share,
    out: [`He laughs, under the beam, until he coughs. 'That's my own trick,' he says. He names a sum. You name a higher one. He pays it, from a purse inside his shirt, and you lift. He is still laughing when you come out into the daylight. 'I knew I'd make something of you,' he says.`, { c: 6, flag: 'reeve_owes' }] }
], { thread: 'reeve', when: () => reeveMet() });

/* ---- the eve ---- */
scene('e_armour', 'eve', "A knight's strap", `A squire comes along the archers' lines asking for anybody who can sew leather. His master's sabaton has lost its strap, and the armourers have six hours of work in front of them and four hours of night. The master is a banneret who will stand tomorrow in the King's own battle. The squire is carrying the iron shoe wrapped in a cloth, like something holy.`, [
  { t: 'Mend it for silver',
    out: [`It is a buckle strap, such as you have sewn a thousand of. You do it by a borrowed lantern in the time he takes to count out eight pence. He looks at the stitching and counts out two more.`, { c: 10 }] },
  { t: 'Mend it, and ask that his master should know your face tomorrow',
    out: [`The squire considers you. 'He'll be busy,' he says. But an hour later a serjeant of the King's battle walks down the line with a lantern and asks Cutler which is the cobbler, and looks at you, and goes away again.`, { st: 1 }] },
  { t: 'Mend it double, with a second strap behind the first', test: ['wits', 6],
    win: [`A strap that has gone once will go again, in the same place, and tomorrow is no day for it. You rivet a second behind the first where it will not show. The squire does not understand what you have done. His master will, at about the middle of the morning.`, { st: 1, c: 4 }],
    lose: [`You have no rivets, and the lantern is going. You sew it single, and sew it well, and are paid for single.`, { c: 4 }] }
], { pool: 1, when: () => M.want !== 'debt' });
scene('e_baggage', 'eve', 'The baggage park', `The King has ordered the horses and the baggage back to the village, under a guard of pages and sick men. The carts are loading. Everything the twenty owns that it will not carry into the line is going on them: blankets, the cook-pot, and each man's purse if he is wise, for a purse is a poor thing to have swinging at your belt in a press.`, [
  { t: 'Send your purse back on the carts',
    out: [`You knot it into your blanket and see it stowed under the cook-pot. It is the sensible thing. Every old soldier in the twenty is doing the same, and telling the young ones why.`, { flag: 'purse_back' }] },
  { t: 'Keep it inside your jack',
    out: [`You push it down inside your jack, against your ribs. Ieuan sees you do it. 'Mistrustful,' he says. He thinks about it. Then he goes to the cart and takes his own purse back off it.`, {}] },
  { t: "Tell Cutler the baggage will be robbed, and to keep the twenty's money on his own body", know: 'k_baggage',
    out: [`Cutler looks at the carts, and at the boys set to guard them, and at you. He asks no questions. He goes down the twenty with his helmet held out, and every purse goes into it, and the helmet goes on his head with the purses still in it. 'If I'm killed,' he says, 'you may fight over it.'`, { st: 1 }] }
], { pool: 1 });
scene('e_hungry', 'eve', 'The last of it', () => `There has been no bread for two days. The twenty pools what it has on a cloak: eleven walnuts, a heel of cheese with a history, a turnip, and a fistful of raw wheat somebody stripped from a field. Cutler divides it with his knife, to the crumb, and takes his own share last.${perkinHere() ? ' Perkin is looking at the turnip as he might at a friend he has to let down.' : ''}`, [
  { t: 'Take your share, and eat it slowly',
    out: [`A walnut, a rind of cheese and a sliver of turnip. You make it last as long as a Mass. It only makes you hungrier. Still, it was food, and you ate it in company, and you feel the better for that.`, { heal: 1 }] },
  { t: 'Put in the salt pork you have been keeping back', if: () => has('pork'),
    out: [`You unwrap it and set it down on the cloak without a word. There is a silence. Then Cutler cuts it into fourteen pieces as exactly as a goldsmith would. No one asks where you had it. Hodge says grace over it, and he is not a praying man.`, { drop: 'pork', st: 2 }] },
  { t: 'Give your share to the man who looks worst',
    out: [() => perkinHere() ? `You push it across to Perkin. He pushes it back. You push it across again, and tell him a baker cannot work on an empty stomach. He eats it. He would die for you now, and you had better see that he does not have to.` : `You push it across to old Hodge, who has not been right since the Somme. He takes it without argument, and that tells you how bad he is.`, () => (perkinHere() ? { flag: 'bond', say: 'Perkin will keep close to you.' } : { grit: 1 })] }
], { pool: 1 });

/* ---- battle moments ---- */
scene('bm_york', 'battle', 'The Duke goes under', `The Duke of York asked the King on his knees for the honour of the vanguard, and he has had it. He is a heavy man in full harness, and when the press on the right closes he is in the middle of it. You see his banner sway and go down. The heap there is breast high already, and men are still falling on to it from both sides.`, [
  { t: 'Help drag men off the heap', test: ['arm', 4],
    win: [`You haul at arms and legs with a dozen others. The men underneath are not all dead; some of them are drowning in mud and in each other. You get three out alive. The Duke is not one of them. A knight of his household sees who was pulling, and remembers it.`, { st: 1 }],
    lose: [`You take hold of an arm and the man it belongs to wakes, and he is French, and he still has his dagger.`, { b: -1 }] },
  { t: 'Keep shooting into the men who are pressing on it', arrows: 1, test: ['eye', 4, 'shoot'],
    win: [`The heap grows because the French keep coming on to it. You shoot at the ones behind, to stop the weight. It is like trying to stop a tide with a bucket. But the press slackens a little where your arrows go, and Cutler shifts the whole twenty to shoot where you are shooting.`, { st: 1 }],
    lose: [`You shoot into the mass of them, and it takes no more notice of your arrows than the sea would.`, {}] },
  { t: 'Look to the centre, where the King is',
    out: [`You look left along the line. The King's banner is a long bowshot away, and there is a knot of fighting under it thicker than anywhere else on the field. Something is happening there. You are on the wrong part of the field to see what.`, { learn: 'k_centre' }] }
], { bm: 1, when: () => !S.flags.centre });
scene('bm_empty', 'battle', 'An empty bag', `Your hand goes to the bag and finds the bottom of it. You look down, as if there might be some mistake. All along the line men are doing the same, and the shooting is going ragged. Thirty paces in front of the stakes the plough is thick with spent shafts, standing up out of the mud like a crop.`, [
  { t: 'Go forward and pull shafts out of the ground', test: ['grit', 4],
    win: [`You go out bent double and pull them like leeks, two and three at a time, wiping the heads on your hose. Half of them have lost their fletchings. The other half will fly. You come back with a sheaf's worth, and with mud to the elbows.`, { ar: 1 }],
    lose: [`You are reaching for a shaft when a man-at-arms you took for a corpse gets hold of your ankle.`, { b: -1 }] },
  { t: "Take what a dead man of the twenty has left",
    out: [`Hodge is lying behind his stake, with nine shafts still in his bag. He told the whole twenty he would never live to shoot them all. You take them, and say what you can remember of the prayer.`, { ar: 1 }] },
  { t: 'Leave the bow, and take up the mallet',
    out: [`You unstring the bow, since you were taught never to leave one strung, and you lay it down behind your stake. The mallet is where you left it. It is a simpler tool, and it never runs out of anything.`, () => (has('maul') ? { flag: 'early' } : { flag: 'early', item: 'maul' })] }
], { bm: 1, when: () => S.arrows < 1 });

/* ================= v0.10: other versions of the scenes every waking passes through ================= */
const ALT = {
  sail: ['sail', 'sail_b', 'sail_c'], landing: ['landing', 'landing_b'], m_open: ['m_open', 'm_open_b'], somme: ['somme', 'somme_b'], night: ['night', 'night_b'],
  b_horse: ['b_horse', 'b_horse_b'], b_advance: ['b_advance', 'b_advance_b'], b_close: ['b_close', 'b_close_b'], b_melee: ['b_melee', 'b_melee_b']
};
const FAST_H = { t: 'You know this siege by heart. Walk through it.', if: () => knowsAct('harfleur'), out: [`You come ashore as a man comes home to a house he dislikes. You know where everything is kept.`, { fast: 'harfleur' }] };
const FAST_M = { t: 'You know this road by heart. Walk it.', if: () => knowsAct('march'), out: [`You shoulder what you always shoulder and fall in where you always fall in. The road has nothing new to show you before the river.`, { fast: 'march' }] };

scene('sail_b', 'soton', 'Fire in the roads', `The fleet is still at anchor when a ship takes fire. Nobody knows how: a cook's brazier, or a lantern in the hold. She burns to the waterline in the time it takes to say a Mass, and the two ships moored beside her catch from her. Yours is the next but one. The shipmaster is shouting to cut the cable, the tide is setting you down on to the fire, and the horses below have smelt it.`, [
  { t: 'Take an axe to the anchor cable', test: ['arm', 7, 'labour'],
    win: [`It is as thick as your thigh and tarred like a road. You go through it in eleven strokes, with a shipman counting. The ship swings clear with the heat on the side of your face. The shipmaster looks at the cut end, and at you, and asks whether you would care for a trade that pays better than soldiering.`, { st: 1, arm: 1 }],
    lose: [`The axe turns on the tar and the cable takes an age to part. By the time she swings clear, the rail where you are standing is too hot to touch, and you have been leaning on it.`, { b: -1 }] },
  { t: 'Join the bucket chain along the rail', test: ['grit', 7],
    win: [`You wet the sails and the side of her for an hour, in smoke, with burning stuff coming down like snow. She does not catch. When it is over you find you were at the hot end of the chain the whole time, and that nobody had to tell you to stay there.`, { grit: 1 }],
    lose: [`A spar comes down across the rail, alight. It is only your arm, and the sea is right there to put it in.`, { b: -1 }] },
  { t: 'Get the arrow chests up on deck, in case she has to be left',
    out: [`Forty chests, up a ladder, with a horse screaming under you the whole time. She does not have to be left. In the muddle of getting the chests below again, one sheaf finds its way into your own bag, and you let it stay there.`, { ar: 1 }] }
], { place: 'The Solent, 11 August' });
scene('sail_c', 'soton', 'Waiting on the King', `The King's ship lies in the roads with her sail yard hoisted half up the mast, which is the signal to the fleet to make ready. Then for two days nothing happens. Fifteen hundred ships ride at anchor with the army packed into them like herring, in August, with the tide slapping at the hulls. Men are fishing over the side with bowstrings. On a ship close by a priest is preaching to a congregation that cannot get off.`, [
  { t: 'Fish', test: ['eye', 7],
    win: [`A bent pin, a bowstring, and a piece of the salt beef nobody will eat. You pull out a mackerel as long as your forearm, and then another. The twenty fries them on a shield. Cutler eats his standing, and remarks that the cobbler has his uses.`, { heal: 1, st: 1 }],
    lose: [`You catch a crab the size of a groat, and a cold.`, {}] },
  { t: 'Dice below decks', test: ['wits', 7],
    win: [`Men who are bored and frightened bet badly. You are frightened too, but you have been bored at an apprentice's bench for three years and it holds no terrors for you. You come up on deck six pence heavier.`, { c: 6 }],
    lose: [`There is a Lancashire man below who does this for a living.`, { c: -3 }] },
  { t: 'Learn the ship from the men who sail her', test: ['grit', 7],
    win: [`They put you to coiling rope, and laugh at you, and tell you things. By the time the King's yard goes all the way up you can keep your feet on a deck and your dinner in your belly, and neither will be true of most of the army.`, { grit: 1 }],
    lose: [`A ship at anchor in a swell is worse than a ship at sea. You learn that, and for two days you have no room in you to learn anything else.`, {}] }
], { place: 'The Solent, 11 August' });

scene('landing_b', 'harfleur', 'The first night ashore', `The King camps the army on the hill above the landing place and has his ordinances read: nobody is to leave the camp, or touch a church, a priest or a woman, on pain of death. The scouts have gone forward towards the town. It is the first night any of you has slept on French ground, and half the twenty is lying awake listening to it. Down the slope a cow is lowing. Three hundred hungry archers are all thinking the same thing.`, [
  { t: 'Go and fetch the cow', test: ['wits', 7, 'sneak'],
    win: [`She comes quietly, for a French cow. You leave four pence on the gatepost, since the King's ordinance says to pay and the King hangs men. The twenty eats beef that has never seen a barrel. Cutler asks where it came from, and you tell him it was bought and paid for. He chews. 'First honest beef I've had in thirty years of soldiering,' he says.`, { heal: 1, st: 1, c: -4 }],
    lose: [`You are halfway up the slope with her when the provost's men come round the hedge with a lantern. The cow goes back. You get four strokes, and the provost tells you how lucky you are that he caught you on your way to pay for her.`, { st: -1, b: -1 }] },
  { t: 'Take the first watch', test: ['grit', 6],
    win: [`You stand it out on the edge of the camp with your bow strung, looking at a darkness that has France in it. Nothing comes. By the time you are relieved, the knot that has sat in your stomach since Southampton has loosened somewhat.`, { st: 1 }],
    lose: [`You challenge a bush, twice. The second time you wake the whole twenty to help you with it.`, {}] },
  { t: 'Sleep. It is only ground.',
    out: [`It is chalk, with short grass on it, much like the downs above Winchester. You tell yourself that and sleep. In the morning you find that somebody else has stolen the cow.`, { heal: 1 }] },
  FAST_H
], { place: 'Chef-de-Caux, 14 August 1415' });

scene('m_open_b', 'march', 'Who stays', `The King is leaving twelve hundred men in Harfleur under his uncle the Earl of Dorset, to hold what five weeks and two thousand lives have bought. Every vintenar has been asked for names. Two of the twenty will stay behind walls, with bread and a roof, while the rest walk a hundred and fifty miles through France on eight days' food. Cutler has not said who. The whole twenty is being very useful this morning.`, [
  { t: 'Ask to stay', test: ['wits', 7, 'talk'],
    win: [`You tell him the garrison will want a cobbler, and it is true. He looks at you a while and then gives your name. You watch the army march out through the Montivilliers gate, and Perkin looks back once. The winter is long, and dull, and nobody dies of it. Christmas comes and goes. One night in January you go to sleep in a dry bed behind a stone wall.\n\nTar. Gulls. The quay under your boots, and Cutler saying the same words in the same order.`, { end: 'stay' }],
    lose: [`'A cobbler,' Cutler says. 'Aye. They'll want one. So will I, on the road.' He gives two other names. He has not thought the better of you for asking.`, { st: -1 }] },
  { t: 'Tell Cutler which two could not stand the march',
    out: [`Old Hodge's chest is bad, and the lad from Alton has not been right since the flux. You say so, privately. Cutler had settled on those two already. He nods. 'I wanted to see whether you'd name them or yourself,' he says.`, { st: 1 }] },
  { t: 'Leave him to it, and see to your own pack',
    out: [`While the twenty hangs about Cutler, you walk down to the Tower's carts, where the clerks are giving out sheaves for the march and nobody is in the queue. You draw your own, and then one for a man you invent on the spot.`, { ar: 1 }] },
  FAST_M
], { place: 'Harfleur, 8 October 1415' });

scene('somme_b', 'march', 'The ford at Béthencourt', `The foot are crossing at Voyennes. The horses and the baggage are to cross a mile off, at Béthencourt, where the causeway is broken in the middle and has been mended with bundled brushwood and the doors of the village. The horses do not care for it. A third of the way over, a sumpter goes through the brushwood to its belly, and the whole column stops behind it on a road one horse wide. There is marsh on either hand. On the far bank French horsemen have begun to gather.`, [
  { t: 'Wade on past it, and stand with the pickets on the far bank', test: ['grit', 9, 'march'],
    win: [`You go in to the armpits with your bow held over your head and come out on the French side among forty other wet men. The horsemen ride up to within a bowshot and look at you. You nock, and look at them. After a while they find that they are wanted elsewhere. The King, when he comes over, asks whose archers held the bank.`, { st: 2 }],
    lose: [`The bottom is soft, and the current has more pull than it showed from the causeway. You come ashore well downstream, without your sheaf, coughing up Somme.`, { b: -1, ar: -1 }] },
  { t: 'Get the sumpter up', test: ['arm', 8, 'labour'],
    win: [`You and a carter get a pole under its belly and a door under its feet. It comes up bellowing, with its load still on. The column moves again. The carter, who has a professional's contempt for archers, allows that you are stronger than you look.`, { st: 1 }],
    lose: [`It comes up all at once, and it kicks.`, { b: -1 }] },
  { t: 'Wait your turn on the causeway', test: ['grit', 5, 'march'],
    win: [`You wait for most of the day on a strip of bundled brushwood, with eight thousand men in front of you and behind. You cross dry-shod before dark. It was not much of a crossing, but you are across.`, {}],
    lose: [`The brushwood has had an army over it. It gives under you an arm's length from the far bank, and you finish the crossing by swimming.`, { b: -1 }] }
], { place: 'The Somme, 19 October 1415' });

scene('night_b', 'eve', 'Picket', `It begins to rain as the light goes, and it rains all night. Cutler's twenty has the picket: a hedge two hundred paces in front of the army, with orders to watch the French fires and to make no sound whatever. There is no shelter. Hemp drinks water like a wick, and a wet string is a dead bow. Every man on the picket is working out which part of him is driest.`, [
  { t: 'Your waxed spare is in your cap. Let the old one drown on the bow.', if: () => has('string'),
    out: [`You leave the bow strung and ready, as a picket should, and let the rain have that string. The other is coiled against your scalp. When the picket is called in, you change them over in the time it takes to say an Ave. The men who unstrung to save their only string had no bow ready all night, and Cutler knows which they were.`, { flag: 'dry', st: 1, learn: 'k_rain' }] },
  { t: 'You knew it would rain. Yours was waxed and capped days ago.', know: 'k_rain', if: () => !has('string'),
    out: [`You made a spare at Péronne, out of cobbler's thread, while the sky was still blue. It comes out of your cap as dry as a sermon. Ieuan looks at it, and then at you. 'There is a word,' he says, very low, 'for a man who knows when it will rain. They burned the last one in Carmarthen.'`, { flag: 'dry' }] },
  { t: 'Unstring, and keep the coil in your armpit until you are called in', if: () => !has('string'), test: ['grit', 8],
    win: [`You crouch under the hedge with the coil clamped under your arm and do not move for six hours. Everything else you own is wet through. When the picket is called in the string is dry, and you are so stiff with cold that Hodge has to string the bow for you.`, { flag: 'dry', learn: 'k_rain' }],
    lose: [`In the dead of the night you have to shift, and the coil slides down inside your jack to where the water has pooled. You can feel it swelling.`, { flag: 'wet', learn: 'k_rain', say: 'Your string is wet. Shooting will be harder.' }] },
  { t: 'Wrap it in your hood, and hope', if: () => !has('string'),
    out: [`The hood is wool, and so it is wet. By the time the picket is called in the string is as soft as a boiled leek. Still, you have had your head out in the rain all night, and you are wide awake.`, { flag: 'wet', heal: 1, learn: 'k_rain', say: 'Your string is wet. Shooting will be harder.' }] }
], { place: 'Maisoncelle, the night of 24 October' });

scene('b_horse_b', 'battle', 'The gap', `Erpingham's baton goes up, and the first flight goes over with a noise like a great cloth tearing. The French horse come off the wings, fewer than there should be, floundering in the plough. They reach the stakes all the same. To your left a destrier takes a stake full in the chest and goes on over it, and brings down the two stakes beyond in its fall. There is a gap in the hedge three men wide, and the riders behind are swinging towards it.`, [
  { t: 'Shoot the riders who are making for the gap', arrows: 1, test: ['arm', 9, 'shoot cav'],
    win: [`You put two shafts into the first horse and one into the second. They go down in the gap itself and stop it up better than any stake. The rest sheer off along the front of the hedge, taking arrows in the flank from every bow they pass.`, { st: 1, learn: 'k_cav' }],
    lose: [`You hit the first horse and it keeps coming. It is through the gap, and into the file behind you, and you are under it for a moment.`, { b: -1, learn: 'k_cav' }] },
  { t: 'Step into the gap with your own stake', test: ['grit', 9, 'cav'],
    win: [`You pull your stake, run six paces, and ground it in the middle of the gap with your foot on the butt. A horse will not run on to a point that it can see, whatever the man on its back intends. It swerves so hard that the rider goes on without it.`, { st: 1, learn: 'k_cav' }],
    lose: [`You are still setting the butt when the horse arrives. The stake goes one way and you go the other.`, { b: -2, learn: 'k_cav' }] },
  { t: 'You know which horse makes the gap. Put it down before it reaches the stakes.', know: 'k_cav', arrows: 1,
    out: [`It is the grey with the split chanfron. You have a shaft into it at forty paces, behind the elbow, and it goes down well short of the hedge. The stake it would have broken is still standing. Nobody in the twenty will ever know there might have been a gap there.`, { st: 1 }] }
]);
scene('b_advance_b', 'battle', 'Crossbows', `Now the first French battle comes on foot, in plate, through the mud their own horses have churned. Their crossbowmen ought to be out in front of them. They are at the back, since no French gentleman would give up his place in the van to a hired Genoese. A few have worked their way round to the flank all the same. You can see them over there, bending to span.`, [
  { t: 'Shoot the crossbowmen before they can loose', arrows: 1, test: ['eye', 10, 'shoot'],
    win: [`A man spanning a crossbow has his foot in the stirrup and his head down. You take two of them like that. The rest decide that the gentlemen can win their own battle, and go back behind the line. Erpingham's serjeant has seen where those shafts came from.`, { st: 2 }],
    lose: [`You are a breath too slow. They loose together, and one of the bolts comes looking for whoever was shooting at them.`, { b: -1 }] },
  { t: 'Keep to the mass. That is the order.', arrows: 1, test: ['arm', 9, 'shoot'],
    win: [`You shoot at the front of the column until your arm burns. It is like shooting into a hedge. But a hedge that has been shot at six times a minute walks slower, and it is drawing in towards its own centre, away from the arrows, and jamming.`, { st: 1 }],
    lose: [`Your draw is short and your shafts skate off the plate. You could not say that you have stopped one man.`, {}] },
  { t: 'Get down behind your stake until they have shot', test: ['grit', 9],
    win: [`You fold yourself up behind six feet of ash and hear the bolts go over. A crossbow takes as long to span as a man takes to say a paternoster. In that time you are up, and you have gathered a fistful of shafts that had fallen short.`, { ar: 1 }],
    lose: [`A stake is not very wide.`, { b: -1 }] }
]);
scene('b_close_b', 'battle', 'Out from the stakes', `They reach the English men-at-arms, and the line bends under them and holds. The archers on the wings have nearly stopped shooting, for want of arrows and of room. Then somebody, and nobody ever learns who, steps out from behind his stake, walks round the end of the French line and looses into the side of it at fifteen paces. In a moment hundreds of men are doing the same.`, [
  { t: 'Go round with them', arrows: 1, test: ['arm', 10, 'shoot close'],
    win: [`At fifteen paces a bodkin goes through a breastplate with a sound like a nail going into an oak door. The men you are shooting cannot turn to face you. You shoot until your bag is light, and nobody so much as lifts a hand against you.`, { st: 1 }],
    lose: [`One of them can turn. He is a big man with a poleaxe, and he has been waiting all morning for something he could reach.`, { b: -1 }] },
  { t: 'Stay by your stake, and shoot the ones who turn to face the archers', arrows: 1, test: ['eye', 10, 'shoot close'],
    win: [`A few men-at-arms have got themselves round to meet the archers, and they are the dangerous ones. You take them as they come clear of the press, one at a time, from behind your stake. The archers out in the open never learn why nobody reached them.`, { st: 2 }],
    lose: [`It is all a churn of steel and mud and you cannot tell one man from another. You hold your shot too long, and then it is too late to matter.`, {}] },
  { t: 'Leave the bow, and take the mallet',
    out: [`You lay the bow behind your stake and pick up the mallet you drove it in with: five pounds of lead on an ash handle. You go round the end of the line with the others. It is carpenter's work that you find there.`, () => (has('maul') ? { flag: 'early' } : { flag: 'early', item: 'maul' })] }
]);
scene('b_melee_b', 'battle', 'The heap', () => `The French in front have gone down, and those behind have fallen over them, and those behind again have been pushed on by the press. There is a wall of armoured men lying in front of the English line, as high as a man's chest, and a good many of those in it are still alive. Archers are climbing on to it with mallets and hatchets. They wear no harness, and they do not sink in the mud.${perkinHere() ? ' Perkin is on it already, off to your right, further forward than he should be.' : ''}`, [
  { t: 'Climb the heap, and strike down from it', test: ['arm', 10, 'melee'],
    win: [`You stand on dead men and hit living ones on the head as they come up. It is dreadful, and your arms know how to do it. When it slackens you find that you are holding a French squire by the gorget, and that he is offering you forty crowns in very fair English.`, { c: 12, st: 1, flag: 'prisoner' }],
    lose: [`The heap shifts under your feet. A hand comes up out of it with a dagger in it, and finds the inside of your leg.`, { b: -2 }] },
  { t: 'Get to Perkin', if: perkinHere, test: ['grit', 9, 'melee'],
    win: [`You go along the top of the heap at a run, which nobody should do. He has slipped down the far side of it among the French. You get him by the back of his jack and haul him up like a sack of his father's flour, and the two of you fall off it together on the English side. He sits up. 'I dropped my billhook,' he says.`, { flag: 'perkin_lived' }],
    lose: [`You see him slip down the far side. You get to the place. You are just too late to do him any good, and you had a clear view of it all the way.`, { b: -1, perkin: 'dead' }] },
  { t: "Go along the heap towards the King's banner", if: () => !S.flags.centre, test: ['grit', 11, 'melee'],
    win: [`The heap runs the whole length of the line, and the top of it is the only clear road on the field. You go along it bent double, over things you do not look at. The King's banner comes nearer. Then you are down off the heap and under it, in the thickest of the fight.`, { flag: 'centre' }],
    lose: [`Twenty paces along, something in the heap gets hold of your foot. By the time you have fought loose from it you have lost the banner, and a good deal of blood.`, { b: -2 }] },
  { t: 'Pull a man of the twenty out from under it', test: ['grit', 9, 'melee'],
    win: [`Hodge is under two Frenchmen with only his arm showing. You know the arm by its bracer, having stitched it. You shift the Frenchmen with your mallet haft and drag him out by the wrist. He is the colour of tallow, and he is swearing, and he will live. Cutler saw you do it.`, { st: 1 }],
    lose: [`You shift one Frenchman. The other was only waiting for somebody to give him room.`, { b: -1 }] }
], { after: i => SC.b_melee.after(i) });

}
function pickIncident(act) {

}

}
function bonus(c) {
