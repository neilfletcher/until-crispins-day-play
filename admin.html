<style>
:root{--ink:#171512;--panel:#221f1a;--line:#3a352c;--bone:#e9e1d0;--ash:#a79f8f;--tallow:#e2c26a;--blood:#c8452f;--display:'IM Fell English',Georgia,serif;--body:'Alegreya',Georgia,serif;--label:'Alegreya Sans SC',system-ui,sans-serif}
*{box-sizing:border-box}
body{margin:0;background:var(--ink);color:var(--bone);font-family:var(--body);font-size:17px;line-height:1.45}
.page{max-width:1180px;margin:0 auto;padding:28px 22px 80px}
h1{font-family:var(--display);font-weight:400;font-size:38px;margin:0 0 4px}
h2{font-family:var(--display);font-weight:400;font-size:27px;margin:38px 0 10px;border-bottom:1px solid var(--line);padding-bottom:6px}
p{margin:6px 0}
.sub,.lab,th{font-family:var(--label);letter-spacing:.07em;color:var(--ash);font-size:14px;font-weight:500}
.note{color:var(--ash);font-style:italic}
button{font-family:var(--label);font-weight:700;letter-spacing:.08em;font-size:15px;padding:9px 16px;background:var(--bone);color:var(--ink);border:0;border-radius:3px;cursor:pointer}
button.quiet{background:transparent;color:var(--ash);border:1px solid var(--line)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:12px 14px}
.tile b{display:block;font-family:var(--display);font-weight:400;font-size:34px;line-height:1.1}
.tile small{display:block;color:var(--ash);font-size:14px}
table{border-collapse:collapse;width:100%;font-size:15.5px}
th,td{text-align:left;padding:6px 10px;border-bottom:1px solid var(--line);vertical-align:top}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
th[data-sort]{cursor:pointer}
th[data-sort]:hover{color:var(--tallow)}
.scroll{overflow-x:auto}
.bar{display:grid;grid-template-columns:170px 1fr 70px;gap:10px;align-items:center;margin:5px 0}
.bar i{display:block;height:14px;background:var(--tallow);border-radius:2px;min-width:2px}
.bar span:last-child{text-align:right;font-variant-numeric:tabular-nums}
.two{display:grid;grid-template-columns:1fr 1fr;gap:26px}
@media (max-width:800px){.two{grid-template-columns:1fr}.bar{grid-template-columns:120px 1fr 56px}}
details{border-bottom:1px solid var(--line);padding:6px 0}
summary{cursor:pointer}
summary small{color:var(--ash)}
.split{margin:6px 0 10px 16px}
.split .bar{grid-template-columns:minmax(160px,420px) 1fr 90px}
.won{color:var(--tallow)}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap}
</style>
</head>

, "Let the boy lose. It is cheap schooling."]}, "h_reeve_deal": {"t": "Reeve's trade", "act": "harfleur", "c": ["Take the sheaves back", "Take the one sheaf, and see nothing", "Go straight to Cutler"]}, "s_brawl": {"t": "Lancashire and Cheshire", "act": "soton", "c": ["Go in with the twenty, on whichever side Cutler picks", "Hold the coats and take the wagers", "Fetch a bucket"]}, "s_sermon": {"t": "The King's claim", "act": "soton", "c": ["Follow it, as far as a cobbler can", "Ask Ieuan what it means", "Sleep standing up"]}, "h_fruit": {"t": "Green apples", "act": "harfleur", "c": ["Eat, and drink, and be thankful", "Carry your share to the sutlers, and trade it for bread", "Leave them on the tree"]}, "h_ships": {"t": "The ships home", "act": "harfleur", "c": ["Sham sick, and go home", "Carry a sick man of the twenty up the plank, and come back down", "Turn your back on the sea"]}, "m_alarm": {"t": "An alarm in the dark", "act": "march", "c": ["Stand to in your place, strung, and wait for Cutler", "Loose at the noise", "Stay in your blanket until somebody you trust is frightened"]}, "m_nesle": {"t": "Red cloth at Nesle", "act": "march", "c": ["Take a torch", "Be at the back when the torches are given out", "Ask one of them what the red means"]}, "e_wager": {"t": "What an archer is worth", "act": "eve", "c": ["Put a penny on yourself", "Take over the book", "Tell them the saints have money on you already"]}, "bm_horse": {"t": "A loose horse", "act": "battle", "c": ["Shoot it", "Stand still behind your stake", "Catch the bridle. There is a saddle on it worth a farm."]}, "bm_cutler": {"t": "Cutler is down", "act": "battle", "c": ["Give the order yourself", "Stand over him until he can stand", "Drag him back behind the stakes"]}, "bm_page": {"t": "A boy with a banner", "act": "battle", "c": ["Wave him back to his own side", "Go out and take the banner", "Take the boy. Somebody will pay for him."]}, "home_s_pardon": {"t": "The tanner's brother", "act": "soton", "c": ["Tell him how it happened, and leave nothing out", "Put four pence in his hand, on account of the blood", "Keep a company of men between you and him, always"]}, "home_h_pardon": {"t": "Hawkin in the sick lines", "act": "harfleur", "c": ["Fetch him clean water, and go on fetching it", "Give him your tormentil root", "Sit with him, and say the prayers for his brother", "Walk past"]}, "home_m_pardon": {"t": "The pardon roll", "act": "march", "c": ["Ask Cutler to speak for you", "Pay the clerk to find the right spelling", "Leave it. You may not need a pardon where you are going."]}, "home_s_vow": {"t": "The cobblers' altar", "act": "soton", "c": ["Leave silver", "Leave work: resole the sexton's boots at the church door", "Ask them, plainly, what it is that they want"]}, "home_h_vow": {"t": "Word of Mall", "act": "harfleur", "c": ["Send home all you have, for the physician", "Have it written back that you promised nothing", "Tell the saints you consider the debt paid"]}, "home_m_vow": {"t": "A man from Soissons", "act": "march", "c": ["Give him work: the twenty's boots, at your own charge", "Ask him what the saints look like, in his church", "Tell him the archers of Soissons were hired men, and no concern of yours"]}, "s_perkin_girl": {"t": "Perkin in love", "act": "soton", "c": ["Tell him to speak to her first, and go along to see it done", "Hold his pay for him until France", "Let him. A man should be a fool once."]}, "h_perkin_bread": {"t": "Perkin's oven", "act": "harfleur", "c": ["Carry clay and wood for him all night", "Sell the loaves along the trench", "Tell him that a fire in a trench draws crossbow bolts"]}, "s_ieuan_string": {"t": "Waxed thread", "act": "soton", "c": ["Show him the cobbler's lock for the loop", "Trade him a hank of your waxed end for arrows", "Watch, and learn to twist your own"]}, "h_ieuan_fever": {"t": "The marsh ague", "act": "harfleur", "c": ["Stand his watch as well as your own", "Sit by him and keep him talking", "Buy him wine from the sutler"]}, "h_reeve_mine": {"t": "Reeve underground", "act": "harfleur", "c": ["Get the beam off him", "Go back for the miners", "Ask him what it is worth to him"]}, "e_armour": {"t": "A knight's strap", "act": "eve", "c": ["Mend it for silver", "Mend it, and ask that his master should know your face tomorrow", "Mend it double, with a second strap behind the first"]}, "e_baggage": {"t": "The baggage park", "act": "eve", "c": ["Send your purse back on the carts", "Keep it inside your jack", "Tell Cutler the baggage will be robbed, and to keep the twenty's money on his own body"]}, "e_hungry": {"t": "The last of it", "act": "eve", "c": ["Take your share, and eat it slowly", "Put in the salt pork you have been keeping back", "Give your share to the man who looks worst"]}, "bm_york": {"t": "The Duke goes under", "act": "battle", "c": ["Help drag men off the heap", "Keep shooting into the men who are pressing on it", "Look to the centre, where the King is"]}, "bm_empty": {"t": "An empty bag", "act": "battle", "c": ["Go forward and pull shafts out of the ground", "Take what a dead man of the twenty has left", "Leave the bow, and take up the mallet"]}, "s_feathers": {"t": "Goose feathers", "act": "soton", "c": ["Sit down and learn to fletch", "Carry sacks for him and ask for nothing", "Leave him to it and find something to eat"]}, "s_cutpurse": {"t": "A hand in your purse", "act": "soton", "c": ["Hold on, and shout for the provost", "Let go, and say nothing", "Keep hold, and ask her who she works for"]}, "s_gunstones": {"t": "Gunstones", "act": "soton", "c": ["Put your back into it", "Work the tally, and let stronger men roll", "Drink his ale and carry as little as you can"]}, "s_surgeon": {"t": "The King's surgeon", "act": "soton", "c": ["Stay and listen to all of it", "Buy a twist of his binding root", "Go away. You would sooner not know."]}, "s_wages": {"t": "The first quarter's wages", "act": "soton", "c": ["Put in your penny without a word", "Ask him who holds the purse, and who counts it", "Keep your penny. You do not mean to need burying."]}, "h_dam": {"t": "The Lézarde", "act": "harfleur", "c": ["Go into the water with the rest", "Cut and carry hurdles on the bank, where it is dry", "Find a reason to be wanted elsewhere"]}, "h_night": {"t": "What they mend in the dark", "act": "harfleur", "c": ["Shoot at the lanterns", "Lie still and mark where the hammering is, for the gunners", "Loose a sheaf at the wall in general, and go back"]}, "h_pit": {"t": "The burying", "act": "harfleur", "c": ["Take the jack off a man who has no more use for it", "Bury them as they came", "Say the names over them, as far as anybody knows the names"]}, "h_townsman": {"t": "A man from the town", "act": "harfleur", "c": ["Take him to Cutler, and let it go upward", "Give him your bread first, and then take him in", "Ask him the questions a cooper could answer"]}, "h_wash": {"t": "Boiled linen", "act": "harfleur", "c": ["Pay her to boil everything you own", "Carry water and wood for her, and listen", "Tell her you have never washed a shirt on campaign and do not mean to start"]}, "m_eu": {"t": "The gate at Eu", "act": "march", "c": ["Shoot at the horses", "Get through the hedge and make them come to you", "Stand where you are and do as the man beside you does"]}, "m_nuts": {"t": "Hazelnuts", "act": "march", "c": ["Go up to the copse", "Stay off your feet. Rest is food too.", "Trade for a share of somebody else's finding"]}, "m_sick": {"t": "A man who cannot walk", "act": "march", "c": ["Get him on your back", "Pay a carter to find room", "Leave him your water, and go on with the rest"]}, "m_horsemeat": {"t": "A dead horse", "act": "march", "c": ["Offer the squire the first cut, and the hide", "Draw your knife and settle it", "Walk on. You are not that hungry yet."]}, "m_guide": {"t": "A boy who knows the marsh", "act": "march", "c": ["Go with him, and watch his eyes", "Give him the penny and send Reeve", "Send him away"]}, "home_e_debt": {"t": "The reckoning", "act": "eve", "c": ["Go over and ask him how a prisoner is taken", "Put the bond out of your head until tomorrow is over", "Cut a tally for it, as you would at the bench"]}, "home_e_girl": {"t": "The ribbon", "act": "eve", "c": ["Tie the ribbon to your bow, where you will see it", "Give it to Perkin, to take home if you do not", "Light the candle-end, and let it burn out"]}, "home_e_brother": {"t": "Suffolk's lines, again", "act": "eve", "c": ["Tell him where you will be, and to look for you", "Ask his vintenar to put him further in", "Sit with his bow across your knees", "Think of the bench, and your mother, and him at her table", "Sleep, if you can"]}, "home_e_pardon": {"t": "The King's word", "act": "eve", "c": ["Go and stand at his fire", "Confess it to a priest, whatever the King says", "Read the note again, and put it back in your shoe"]}, "home_e_vow": {"t": "The vigil", "act": "eve", "c": ["Keep the vigil, as a guildsman would", "Mend a boot for somebody. It is their work, after all.", "Tell them plainly that you have done what you can"]}, "s_billet": {"t": "The sail loft", "act": "soton", "c": ["Next to Perkin, who kept it for you", "Under the window, by the Welshman", "By the hatch, in the draught, near Cutler", "In the space by Reeve, since nobody else wants it"]}, "s_drill": {"t": "Cutler's line", "act": "soton", "c": ["Keep time with Ieuan, whatever it costs your arms", "Loose every second word, and watch how it is done", "Get your foot on Perkin's arrow before Cutler sees it"]}, "h_camp": {"t": "The lines", "act": "harfleur", "c": ["Take a spade, next to Ieuan", "Carry for the gunners, with Perkin", "Take the picket at the marsh end, with Reeve", "Ask Cutler where he wants you"]}, "h_first": {"t": "The first stone", "act": "harfleur", "c": ["Go and dig for him, with the others", "Stay flat, and learn the sound", "Pick up his spade, and go on with the trench"]}, "m_day": {"t": "The order of march", "act": "march", "c": ["Fall in beside Ieuan", "Fall in beside Perkin", "Walk at the head of the twenty, behind Cutler", "Drop back to the rear, with Reeve", "Walk by yourself, and keep your own counsel"]}, "m_eighth": {"t": "The eighth day", "act": "march", "c": ["Eat it now, all of it", "Put the biscuit by for tomorrow", "Give yours to Perkin, who is still growing", "Ask Cutler what happens on the ninth day"]}, "boon_ieuan": {"t": "What the Welshman knows", "act": "soton", "c": ["How to draw", "How to shoot a man in plate", "How to stop a horse", "How to keep a string"]}, "boon_cutler": {"t": "What Cutler knows", "act": "harfleur", "c": ["Close work", "Standing when the horse comes", "Staying alive between the fights", "Being a man you can use"]}, "boon_friar": {"t": "What the friar knows", "act": "march", "c": ["How to talk to anybody", "How to be ready", "How to walk", "Whether he has any money"]}, "bg_carts": {"t": "The carts", "act": "battle", "c": ["Climb the church tower, and watch", "Walk the carts, and see what there is to guard", "Sit down with the sick, out of the wind"]}, "bg_raid": {"t": "The lord of the place", "act": "battle", "c": ["Stand on the King's cart with your bow", "Get the twenty's sack and the pages into the church", "Take a horse, and ride for the line with the news"]}, "bg_word": {"t": "What it cost", "act": "battle", "c": ["Find Cutler and the twenty", "Stay where you are, and watch the banner", "Help the priests with the hurt pages", "Go through what is left, for the twenty's things", "Walk down to the field"]}, "bc_horse": {"t": "The horse go by", "act": "battle", "c": ["Shoot into the flank of them as they pass", "Hold your arrows for the men on foot", "Watch the King"]}, "bc_press": {"t": "The King's battle goes back", "act": "battle", "c": ["Shoot into the press, as ordered", "Drop the bow, and go in at the join", "Pull a fallen man clear by his heels"]}, "bm_perkin": {"t": "Perkin's bag", "act": "battle", "c": ["Take him by the belt, and make him wait for the word", "Give him half of yours", "Let him be. It is his own bag."]}, "bm_wood": {"t": "The Tramecourt wood", "act": "battle", "c": ["Go into the trees after them, with whoever will come", "Shout it to Cutler, and keep your place", "Shoot at the movement"]}, "bm_crown": {"t": "The banner", "act": "battle", "c": ["Shoot at whoever comes for it", "Run in, and get your shoulder under the staff", "Close up towards it, with the rest"]}, "bm_second": {"t": "The second battle", "act": "battle", "c": ["Drink, and breathe", "Go forward, and pull arrows out of the dead", "Find something heavier on the heap"]}, "flux_b": {"t": "The sick lines", "act": "harfleur", "c": ["Stay in the trench, and tell nobody", "Chew the tormentil root", "Pay a shipman for a berth in the dry, and boiled water"]}, "fire_s_b": {"t": "The last cask", "act": "soton", "c": ["Sit with Perkin", "Sit with Ieuan", "Sit near Cutler", "Sit alone, with what you brought from home"]}, "fire_h_b": {"t": "The gun pit", "act": "harfleur", "c": ["Sit with Perkin", "Sit with Ieuan", "Sit near Cutler", "Sit alone"]}, "fire_m_b": {"t": "Under a cart", "act": "march", "c": ["Sit with Perkin", "Sit with Ieuan", "Sit near Cutler", "Sit alone"]}, "boon_ieuan_b": {"t": "The Welshman's price", "act": "soton", "c": ["The draw", "Where to put a shaft into a man in harness", "The horses", "The string"]}, "boon_cutler_b": {"t": "A word from Cutler", "act": "harfleur", "c": ["To kill a man in harness, close to", "To stand when I want to run", "To be alive by then", "To be some use to you"]}, "boon_friar_b": {"t": "The friar on the road", "act": "march", "c": ["Ask how he gets what he asks for", "Ask him to hear your confession", "Ask how he has walked so far in sandals", "Ask him for the loan of a few pence"]}, "b_wait_b": {"t": "The furrow", "act": "battle", "c": ["Find Perkin", "Find Ieuan", "Find Dickon among Suffolk's men", "Find Dickon, and make him swear to stand well left of the Earl's banner", "Go to the rear, with the baggage guard", "Take the Host, and keep to yourself"]}, "b_dawn_b": {"t": "Three hours", "act": "battle", "c": ["Kneel with the rest and take the earth on your tongue", "Use the halt to get your stake in deep and angled true", "Ask Cutler to put you in the centre"]}, "b_order_b": {"t": "What the King says", "act": "battle", "c": ["Do as you are ordered", "Put your knife away and stand aside", "Cut your own man's bonds and point him at the wood"]}, "home_s_debt_b": {"t": "The bond", "act": "soton", "c": ["Let him stop four pence now, and have it written on the bond", "Tell him an apprentice's bond has no hold on the King's wages", "Ask who brought it down from Winchester"]}, "home_h_debt_b": {"t": "The drumhead", "act": "harfleur", "c": ["Sell him a month of your arrears", "Buy Wat's boots for a farthing, and make them worth something", "Keep your paper, and keep your mouth shut"]}, "home_m_debt_b": {"t": "Rotten harness", "act": "march", "c": ["Name a shilling, and take it", "Do it for nothing, and let him owe you", "Ask for the offcuts of the good leather"]}, "home_s_girl_b": {"t": "The carrier's cart", "act": "soton", "c": ["Tell her the truth: that you are afraid", "Have him write to her father instead, with the figures", "Send her nothing. She knows."]}, "home_h_girl_b": {"t": "A man from the Soke", "act": "harfleur", "c": ["Give him every penny you have, to send back with the ships", "Light the candle", "Ask him nothing more, and go back to the trench"]}, "home_m_girl_b": {"t": "The ribbon", "act": "march", "c": ["Go back along the column and look for it", "Tell yourself it was only a ribbon", "Tell Perkin", "Tell Ieuan"]}, "home_s_brother_b": {"t": "The butts at West Quay", "act": "soton", "c": ["Tell him you have taken the King's sixpence yourself", "Put a penny on yourself against him, in front of his company", "Get him alone, and make him swear off the water at Harfleur", "Give him her message, and go"]}, "home_s_pardon_b": {"t": "The muster of the pardoned", "act": "soton", "c"
